备注: |
  本节点为AI起草、人类审核的预审档案，不是某个手套项目实施后失败、停止或转向的验尸记录；当前没有具体验尸对象，不能编造。
  已复活仅指适用一次性手套提供耐水、耐油脂和湿油操作选择的产品与技术条件已经存在，
  不表示所有材质、所有SKU或所有化学品条件都有效，不表示绝对永久防水防油，也不表示新品需求、商业闭环或社会净收益已经证明。
  重启预算“高”针对材料与配方确定、完整生产路线、适用测试、质量控制、合规文件、库存渠道和售后的自建或深度定制制造；
  采用成熟OEM做限定场景的小批量选品验证属于另一预算口径，不能用缩围路线反推完整制造成本较低。
  来源分层使用：OSHA用于一般材料与危害选型，不代替食品接触合规；FoodHandler和INTCO只证明公开产品、规格与厂商主张；
  国家卫健委公告与中国标准化研究院解读用于标准和卫生要求；独立论文用于特定实验结果及产品差异。
  双层研究的接触物为DGBE、对象为四种丁腈手套裁片、实验温度为35℃，不是食用油、PE／TPE或三层佩戴试验；
  其突破时间和渗透速率结果不能直接换算成厨房场景，也不能作为延长污染或破损手套使用时间的依据。
  丁腈完整性研究对象是检查手套，水漏测试不等于食品手套耐食用油试验；其结果只支持产品差异和测试方法边界。
  2024年手套风险综述存在Eagle Protect PBC资助及部分作者公司关联，本节点已披露，仅将其作为风险线索，未据此推导全行业失效率。
