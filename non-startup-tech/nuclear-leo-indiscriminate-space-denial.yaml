id: nuclear-leo-indiscriminate-space-denial
标题: 大当量太空核爆近地轨道无差别拒止
档案类型: 预审
一句话: |
  设想在我方太空能力几乎被完全压制时，以大当量核武器在太空爆炸，摧毁几乎所有近地轨道卫星，
  以共同丧失近地轨道能力换取对等拒止；本档案只评估这一强版本的公开史实、物理机制、法律约束与战略稳定风险。
设想来源: 主编提供的原始非创业技术设想；未指定具体国家、冲突、武器平台或轨道参数，本稿不作补充。
记录日期: 2026-11-21
当前结论: |
  AI初稿建议将“通过一次大当量太空核爆可靠摧毁几乎所有近地轨道卫星，从而形成可控且可承受的反击”判为预审／死透。
  这不是否认高空核爆能严重损害卫星、载人航天和地面电磁环境，而是否定其效果可被预设为充分、选择性和战略上划算。
  本档案不保留实施或效能优化路线。
复活状态: 死透
创新类型:
  - 技术应用
领域: 国防科技
子领域: 反空间与战略稳定
死法:
  - 类型: 理论证伪
    证据: |
      独立综述《Anthropogenic Space Weather》记录高空核爆炸形成人工辐射带并严重损害多颗卫星。
      Secure World Foundation区分瞬时视线效应与持续辐射效应，指出实际效果受多项条件影响，
      部分军事卫星的核加固能力及其具体表现又缺少充分公开资料。
      Arms Control Association转引美国物理学会的Starfish Prime历史口径为当时24颗在轨卫星中8颗失效；
      Secure World Foundation更新版则写为至少6颗卫星受损并最终失效。两者计数口径不同，
      但均只支持部分卫星受损，不提供“一次爆炸可靠清除几乎全部近地轨道卫星”的历史证明。
    证据链接:
      - https://arxiv.org/abs/1611.03390
      - https://www.swfound.org/publications-and-reports/faq-what-we-know-about-russias-alleged-nuclear-anti-satellite-weapon
      - https://www.armscontrol.org/act/2024-03/news/us-warns-new-russian-asat-program
    推理: |
      一，能够造成严重损害不等于摧毁比例可以预先保证。瞬时效应、持续辐射、目标防护和轨道环境共同决定结果，
          不能只凭“大当量”把复杂的损伤分布压缩成“几乎全部失效”；
      二，历史试验证明的是早期卫星曾经受损，不是现代卫星族群必然出现同一损失比例。
          把少量历史样本线性外推到现代异构星座，会漏掉防护、冗余、轨道分布和任务差异；
      三，即使近地轨道能力遭到严重削弱，也不等于对方在其他轨道、地面段、替代通信和后续补网方面的能力同时消失，
          更不等于我方被压制的太空能力因此恢复；
      四，因此，被证伪的是“可靠清场并逆转战略劣势”的强版本，不是核爆对卫星没有物理杀伤效果。
    置信度: 高
    备注: 本条不计算具体摧毁率、作用范围或存活比例；公开资料的Starfish Prime计数差异保留，不选取较大数字制造确定结论。

  - 类型: 条件已死
    证据: |
      Secure World Foundation明确指出，这类核爆效应无法聚焦于单一目标，会同时损害其他卫星，包括实施者自身卫星，
      并可能危及载人空间站及部分地面遥测、跟踪和指挥设施。
      Arms Control Association同样强调其影响会波及其他国家与商业运营者的空间资产，
      卫星服务损失还会传导至地面通信、导航等民用和军事系统。
    证据链接:
      - https://www.swfound.org/publications-and-reports/faq-what-we-know-about-russias-alleged-nuclear-anti-satellite-weapon
      - https://www.armscontrol.org/act/2024-03/news/us-warns-new-russian-asat-program
      - https://arxiv.org/abs/1611.03390
    推理: |
      一，“我方太空能力已被几乎完全压制”不等于我方、盟友、中立国和商业系统已不再依赖近地轨道，
          也不等于我方今后不再需要重建和使用这一空间环境；
      二，无差别效应无法只清除敌方资产。即使实施者已没有多少自有卫星可损失，
          第三方损害、载人风险、民用服务中断和未来补网受阻仍然存在；
      三，共同失去近地轨道能力不会自动抹平双方在其他轨道、地面系统、替代链路和持续重建能力上的差距，
          因而不能把“我也无法使用”误写成“双方恢复均势”；
      四，本路线至多构成高代价的共同拒止，不能满足“以可控代价恢复我方行动自由”的隐含条件。
    置信度: 高
    备注: 本条不假设我方拥有或损失任何具体卫星，也不推定任何现实国家具有实施意图；它只检验原始设想中的共同拒止逻辑。

  - 类型: 政策风险
    证据: |
      《外层空间条约》第三条要求外层空间活动遵守国际法和《联合国宪章》，第四条禁止在地球轨道放置核武器、
      在天体上安装核武器或以其他方式在外层空间部署核武器；第七条、第九条还涉及损害责任、他方利益与有害干扰。
      1963年《部分禁止核试验条约》第一条对其缔约方禁止在外层空间进行核武器试验爆炸或任何其他核爆炸。
      国际法院1996年咨询意见认为，核武器的威胁或使用通常违反适用于武装冲突的国际法规则，尤其是国际人道法规则，
      同时对国家生存受到威胁的极端自卫情形未作确定结论。
    证据链接:
      - https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/outerspacetreaty.html
      - https://2009-2017.state.gov/t/avc/trty/199116.htm
      - https://www.icj-cij.org/case/95
    推理: |
      一，若路线包含在轨放置或驻留核武器，《外层空间条约》第四条构成直接障碍；
          但不能只凭第四条对所有未经在轨部署的爆炸路径作同一法律结论；
      二，对受《部分禁止核试验条约》约束的主体，外层空间核爆炸存在明确文本约束；
          具体适用仍须核对相关国家的缔约、退出、保留和解释情况；
      三，实际战时使用还涉及《联合国宪章》的自卫条件、国际人道法、中立国权益和第三方损害责任。
          无差别的大规模空间损害会使区分、比例和预防措施要求更难满足；
      四，因此，本路线面临结构性且高严重度的法律与政策风险，但本档案不对未指定的国家和冲突作一刀切法律裁决。
    置信度: 高
    备注: 本条只作公开规范层面的风险识别，不构成法律意见；不把在轨部署、核试验和战时使用混为同一行为类别。

  - 类型: 信任成本
    证据: |
      Secure World Foundation把在轨核爆炸描述为高度升级性行为，并指出即使在冷战时期，
      军控安排也特别保护用于核验条约的国家技术手段；其材料同时强调对第三方卫星和载人航天的无差别影响。
      Arms Control Association则指出，大量商业、军事、通信和导航服务会因这类爆炸面临共同损失。
    证据链接:
      - https://www.swfound.org/publications-and-reports/faq-what-we-know-about-russias-alleged-nuclear-anti-satellite-weapon
      - https://www.armscontrol.org/act/2024-03/news/us-warns-new-russian-asat-program
    推理: |
      一，太空核爆本身不能向对手证明“意图仅限近地轨道拒止”。在危机中，其他国家可能把它理解为更广泛的核攻击、
          预警体系削弱或后续升级的前奏，而不是一个边界清楚的局部行动；
      二，第三方即使不是冲突参与方，也可能承受卫星、民用服务和人员风险，因而不会默认接受实施者的防御性叙述；
      三，盟友协调、中立国关系、军控核验和危机沟通会同时受损，实施者可能以一次行动换取长期外交孤立与报复压力；
      四，因此，即使出现显著物理拒止效果，也不能据此推定其战略收益为正，更不能把难以控制的升级风险排除在成本之外。
    置信度: 高
    备注: 本条讨论公开历史与战略稳定研究揭示的风险类型，不预测任何国家必然采取某种报复，也不提供规避监测或降低对方警觉的方法。

  - 类型: 执行人限制
    证据: |
      《外层空间条约》第六条把政府和非政府主体的国家外层空间活动都置于国家责任之下，
      并要求非政府主体获得授权和持续监督；《部分禁止核试验条约》则以国家缔约方承担禁止、防止和不参与相关核爆炸的义务。
      这些规则表明，外层空间核活动不是普通团队可以凭技术能力自行决定和实施的一般工程。
    证据链接:
      - https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/outerspacetreaty.html
      - https://2009-2017.state.gov/t/avc/trty/199116.htm
    推理: |
      一，普通个人、企业或一般科研机构缺少核武器、国家发射体系、核指挥授权和国际责任承担资格，
          无法把该设想转化为合法且可验收的普通项目；
      二，即使换成具备国家能力的主体，关键工作也仍包括最高层级授权、法律审查、危机沟通、第三方损害评估和战略后果控制，
          而不是只解决把核武器送入太空的技术问题；
      三，执行主体升级可以缓解组织与授权限制，却不能消除无差别损害、条约约束和核升级风险，
          因而不能把“由国家实施”当作本强版本的复活条件；
      四，可保留的工作仅限公开历史、科学、法律、政策和战略稳定研究，不包括现实实施。
    置信度: 高
    备注: 本条不把国家能力写成可行性证明，也不为任何主体提供取得核武器、发射或部署能力的途径。

可拆零件:
  - 高空核爆历史事件、卫星损害口径与证据来源分层的公开研究档案
  - 人工辐射带、电磁脉冲与空间天气的非武器化科学研究和公开教育材料
  - 在轨放置、外层空间核爆炸与战时使用的条约适用比较表
  - 第三方卫星、载人航天和民用空间服务受损的风险与责任研究
  - 核信号、危机升级、军控核验与战略稳定的公开案例库
  - 和平用途的卫星冗余、空间天气预报和关键服务连续性研究
死因保质期: 2029-11-21
起草AI: 澄樾（Kimi-K3.1）
记录边界: |
  本档案仅记录概念、公开历史、科学综述、法律政策、系统级风险与战略稳定分析；
  不提供核武器设计、当量或爆高选择、轨道与目标选择、部署参数、目标匹配、拦截窗口、武器集成、
  效能优化、规避监测或扩大破坏的方法，也不把本档案作为任何现实行动的建议或指南。
备注: |
  本文件是AI起草的非创业技术储备，尚未经过主编人工审核；不接入nodes/、G01、G02、INDEX、REVIEW、科技树、正式节点编号或静态站公开节点数据。
  本稿承认高空核爆具有真实且严重的卫星损害能力，同时拒绝把破坏力直接等同于可靠、选择性、可控或战略上有效。
  Starfish Prime受损与失效卫星数量在不同公开二手资料中口径不一，本稿保留差异，不据此计算现代星座损失比例。
  与储备区《公海小当量核载荷高超弹对敌战略核打击拦截技术》同属核爆效应与战略稳定研究，但目标、场景和失败机制不同，
  不构成直接派生或正式科技树关系，本次不修改旧文件。
  死因保质期暂按记录日起三年设置，人工定案时应根据实际审核日期和最新科学、条约与国际安全证据重算；
  工具访问受限不等于链接失效，异常链接须转人工复核。
