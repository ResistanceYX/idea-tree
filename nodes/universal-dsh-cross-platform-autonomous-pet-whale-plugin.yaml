备注: |
  本节点为AI起草、人类审核的预审档案，不是现有通用宠物鲸或作者已经失败、停止或转向的验尸记录。
  原始目标是“一个总插件、一个宠物鲸入口”调度平台子代理，并在缺少适配器时调用插件生成Agent或自行开发。
  本稿把“通用”解释为统一角色、任务与结果协议，不是在一个包内内置所有网站实现，也不是默认持有所有账号和权限。
  已复活仅指统一会话入口、角色化队长、调度已安装平台能力或子代理、回收结构化结果和生成私人汇总等核心编排链已有公开实现与可组装基础；
  不表示现成通用宠物鲸已经覆盖所有平台，不表示动态生成、审核、安装和启用新插件已全自动完成，
  也不表示内容准确率、长期留存、商业闭环或社会净收益已经证明。
  重启预算“中”针对单用户、单进程、少量已安装只读插件、统一结果卡和人工审核的小范围工程集成与测试；
  它不是单次任务价格承诺，也不包含无限平台、跨进程常驻团队、多用户账号托管、公共互动运营或长期兼容保修。
  插件生成、代码审核、权限授予、安装启用和公共账号互动是不同环节；本节点调用A只产生开发请求，不自动改变profile、权限或账号状态。
  官方API、RSS、公开页面、授权浏览器会话与逆向接口不是可随意互换的路线；本节点不将绕过登录、验证码、付费墙、访问控制或平台风控列为能力。
