备注: |
  本节点为AI起草、人类审核的预审档案，不是现有插件或作者已经失败、停止或转向的验尸记录。
  原始清单只给出“开源理论研究路径生成及记录辅助理解Agent插件”，主编随后明确了“论文文档或链接—递归参考资料—回到本科／研究生基础—
  生成链路树—解释目标论文难点和逻辑链条”的目标。本稿保留这两条主线，没有把节点缩写成普通摘要器、相似论文推荐器或单层引用图。
  已复活仅指从论文标识或PDF开始、检索候选文献、审核部分重要关系、生成可扩展代表性研究图、提供核心论文与目标论文的证据化导读、
  保存记录并继续扩展等核心技术链已有公开实现；不表示“全部研究链路”“所有论文细节”“自动达到合适本科／研究生基础终点”或理论正确性已经证明。
  “全部”和“所有”作为主编提出的产品目标保留在未验证范围内，没有用一张生成图冒充完成；无法获取全文、解析失败、数据库缺失、预算截断与人工未复核都必须显式呈现。
  用户所称“树”在本稿中是面向阅读任务的树状投影，底层保存有向关系及合流、分叉和循环检测；不将真实研究史假设为唯一树。
  引用关系、相似关系与理解前提关系分别建模，教材或基础知识停止点由读者背景、学科、目标和预算共同决定，不能由模型统一凭空指定。
  重启预算“中”针对利用现有开源组件完成一个学科或少量论文的小范围工程集成、证据审核、测试与人工复核；
  它不是单次生成价格承诺，也不包含无限制递归、所有学科覆盖、大规模全文采购、多用户托管或长期专家维护。
  math-lineage的350M tokens、约4小时及50页论文订阅额度估计仅为作者对特定实现的自报，正文未外推为其他模型、论文或产品的统一成本；
  其skill采用PolyForm Noncommercial与Apache混合许可，不能笼统写成全部Apache或可自由商用。
  来源按证明力分层使用：项目官方README与开发文档证明公开功能、架构、依赖、成本和作者自报边界；GROBID指标只适用于其列出的评估集合；
  OpenAlex文档证明字段语义，哥廷根大学图书馆团队的比较研究用于证明不同数据库参考覆盖存在差异，不用于给本点子计算一个通用漏引率。
  本稿没有独立安装并复现上述项目的所有版本，也没有把README截图、示例图或功能声明写成第三方基准；实际部署前须重新核对版本、许可、依赖和默认配置。
  本项目未复制第三方PDF、论文全文、网页全文、代表图、仓库快照或访问凭证。个人授权阅读、私有稿件处理与公开再分发必须区分，
  本地优先不等于完全离线，任何云模型、嵌入、搜索、OCR或同步路线都应重新检查数据去向。
  与14号仅建立“后续功能启发”的双向弱关系：本稿由论文发现与摘要进一步想到单篇论文的深度溯源和精读，
  但问题域、图结构、停止规则和验收标准均不同，故不使用下划线派生id，也不因14号与13号、19号相关而自动增加关系。
  由于Agent宿主、模型、学术图谱、全文获取规则与开源实现均变化较快，死因保质期设为一年。
  复核时优先检查：研究图是否仍可从论文文档或链接运行、核心边是否保留证据定位、递归是否有去重循环和预算控制、
  基础停止点是否适配读者、导读是否准确覆盖公式图表与论证难点、全文与私有稿件是否合规、每有效分支全成本、
  用户真实理解与持续使用是否优于目标论文加原有搜索方式，以及“全部链路”和“所有细节”的未验证承诺是否仍被错误宣传为已实现。
