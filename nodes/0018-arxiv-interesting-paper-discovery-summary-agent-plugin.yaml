编号: "0018"
id: arxiv-interesting-paper-discovery-summary-agent-plugin
标题: 开源arXiv有趣论文发现及总结Agent插件
一句话: |
  在DSH或独立脚本中按arXiv分类与工作日获取公开论文元数据，由本地兴趣知识库粗筛和模型排序生成中文推荐理由、摘要与可检索论文库，
  再按反馈调整后续结果；按需调研、外部定时日报和可选全文深读已经可实现，长期推荐质量与阅读价值仍需单独验证
档案类型: 预审
复活状态: 已复活
重启预算: 低
创新类型: [渐进式, 技术应用]
领域: 人工智能
子领域: 预印本发现与个性化科研信息筛选Agent
死法:
  - 类型: 条件已死
    证据: |
      DeepSeek官方DSH仓库确认其采用Cordis插件架构、以MIT许可开源，但仍处于开发者预览阶段；
      Lxion0553/dsh-arxiv-inspiration已经实现arXiv分类与工作日调研、本地兴趣知识库粗筛、并行模型排序、中文推荐理由、反馈闭环、论文库和可选全文深读；
      yang3kc/daily_arxiv_digest独立提供可由cron无人值守运行的兴趣评分、摘要缓存与JSON／Markdown日报，
      AutoLLM/ArxivDigest也早已公开自然语言兴趣配置、模型相关性评分和邮件订阅链
    推理: |
      一，若旧判断是“缺少能持续获取arXiv新论文、按个人兴趣筛选并生成中文摘要的Agent技术链”，这一条件已经翻案。
          现有实现既有DSH内的图形化调研与论文库，也有独立脚本的定时日报和邮件投递，不再只是概念演示；
      二，复活的是一条可拆分链：公开元数据获取、分类与日期筛选、本地兴趣知识库或自然语言主题、模型排序与摘要、
          原文链接、反馈和本地档案。用户可以选择按需运行，也可以用外部cron或CI调度，不要求先发明新的推荐算法；
      三，目标插件的星期设置与按需调研不等于内置无人值守调度，其公开说明还明确“不自动推送”，由用户决定哪些内容进入会话。
          独立日报项目可以补足定时路线，但不能把不同仓库的功能合并成一个已经由单一插件全部兑现的承诺；
      四，公开仓库与官方API文档足以证明有限复活，不证明所有版本均可无故障安装，不证明推荐准确率、深读可靠性、持续阅读、商业收入或社会净收益已经成立。
    案例: DSH个性化论文插件、独立定时日报与早期个性化推荐实现共同支持arXiv发现总结链复活
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness
      - https://github.com/Lxion0553/dsh-arxiv-inspiration
      - https://github.com/yang3kc/daily_arxiv_digest
      - https://github.com/AutoLLM/ArxivDigest
    置信度: 高

  - 类型: 伪需求
    证据: |
      arXiv官方已经提供按分类订阅每日新论文摘要邮件，以及覆盖各活跃学科的RSS与Atom订阅；
      AutoLLM/ArxivDigest以大分类每日论文过多、逐篇阅读标题摘要耗时为问题背景，并提供自然语言兴趣配置、模型相关性评分和推荐理由；
      当前公开材料没有给出可独立核验的持续阅读率、推荐采纳率、节省筛选时间、误漏重要论文比例或长期留存数据
    推理: |
      一，“新论文太多”不等于“需要每天再读一份AI日报”。arXiv原生邮件和RSS已能解决分类跟踪，
          独立插件必须证明它减少了筛选劳动，而不是把同一批标题摘要换一种格式后继续推给用户；
      二，模型评分和流畅推荐理由可能让论文看起来更相关，却不等于用户会打开原文、深读或在研究中使用。
          日报篇数、生成速度、👍数量和论文库累积量都不能替代真实阅读与研究采纳；
      三，兴趣知识库与负反馈也可能不断收窄候选范围，使用户错过跨类目或尚未形成稳定兴趣描述的重要工作。
          反馈循环证明产品能响应操作，不证明它理解长期研究目标，更不证明探索与利用已经达到合适平衡；
      四，可缩围为低频、可退出的个人筛选工具：先限定少数分类和每周一次报告，与原生邮件／RSS对照，
          记录“看过—打开原文—深读—保存—实际使用—误漏”的链路，并保留不按画像排序的随机或全量抽样；
      五，本条不判定整个点子没人要，而是指出“论文过载”与“持续需要个性化AI推荐”之间仍缺少独立需求证据。
    案例: 原生分类订阅与多种个性化日报同时存在，但持续阅读、真实采纳和误漏成本尚未得到公开验证
    证据链接:
      - https://info.arxiv.org/help/subscribe.html
      - https://info.arxiv.org/help/rss.html
      - https://github.com/AutoLLM/ArxivDigest
    置信度: 中

  - 类型: 钱算不平
    证据: |
      dsh-arxiv-inspiration列出候选上限、模型批次、token预算、摘要截断、回捞窗口和估算token用量，可选alphaXiv发现与问答还会消耗用户配额；
      daily_arxiv_digest通过同日重复运行跳过、评分与TL;DR缓存及重新设阈值不重跑来减少重复模型调用，但无人值守管线仍需要模型API密钥；
      daily-arXiv-ai-enhanced作者给出特定配置约每日0.2元人民币的自报成本，同时说明完整任务可能运行约一小时，该数字并非跨模型、跨类目的通用报价
    推理: |
      一，完整成本不是一篇中文摘要的报价，而是“元数据获取＋兴趣粗筛＋模型排序与摘要＋失败重试＋可选向量模型／全文解析＋
          外部深读配额＋定时设备与存储＋宿主升级维护＋用户阅读原文和纠错时间”；
      二，扩大分类、候选上限和回捞窗口，增加每日运行频次、全文深读或重新生成，都会增加调用和上下文。
          缓存与去重可减少重复消耗，但不能消除首次评分、模型降级、解析失败和兼容维护的支出；
      三，有效成本的分母应是“用户实际阅读并确认有用、最终保存或用于研究的论文数”，不是抓取篇数、推荐篇数或日报字数。
          误推荐、漏推荐、重复论文、无人阅读以及用户还需重新筛选，都会使看似便宜的自动生成变成无效成本；
      四，个人低频自用可利用现有MIT代码、自有设备、少量分类、较低候选上限和缓存，把支出压在较低水平。
          多用户托管则还需任务与凭证隔离、队列、存储、客服和兼容维护，而免费原生订阅与开源脚本会压低收费空间；
      五，公开资料没有统一价格、完整维护工时、毛利或续费数据，本条只确认成本结构和失控条件，不把单个项目的自报日成本外推为普遍账目。
    案例: 真实实现已经设置token预算、缓存和外部配额边界，但每篇实际采纳论文的全成本仍未核算
    证据链接:
      - https://github.com/Lxion0553/dsh-arxiv-inspiration
      - https://github.com/yang3kc/daily_arxiv_digest
      - https://github.com/dw-dengwei/daily-arXiv-ai-enhanced
    置信度: 中

  - 类型: 巨头碾压
    证据: |
      arXiv官方提供按分类每日摘要邮件、RSS与Atom订阅，并明确鼓励第三方开发更好的搜索、论文通知和新式交互界面；
      dsh-arxiv-inspiration、daily_arxiv_digest、AutoLLM/ArxivDigest及daily-arXiv-ai-enhanced已经以开源方式覆盖按需调研、cron日报、邮件或网页展示等不同路线
    推理: |
      一，arXiv原生订阅拥有稳定分类、日期和原文入口，在用户已有邮件或阅读器内即可满足基础跟踪，
          因而会先压低“分类新论文列表、标题摘要搬运和每日通知”的独立产品价值与价格锚点；
      二，多个免费开源实现进一步压低了模型评分、中文摘要和定时日报的获取门槛。若新产品只是把相同元数据交给模型改写，
          用户既可使用原生订阅，也可复制现有代码，难以仅凭一层摘要界面建立持续收费；
      三，但官方订阅并不等于已经提供DSH内的本地兴趣知识库、反馈记忆、中文推荐理由、跨来源去重、私有部署和可检索深读笔记。
          独立产品仍可在可审计筛选、个人或团队知识工作流、隐私与可移植档案上形成差异；
      四，本条判定的是通用论文列表与基础摘要面临强替代压力，不是arXiv或开源项目已经淘汰所有第三方插件。
          官方明确鼓励发现与通知工具，反而说明较可信的机会是解决原生订阅之外的个性化和组织问题，而非复制订阅本身。
    案例: 平台免费分类订阅与多条开源个性化日报路线共同压低通用arXiv摘要服务的价格锚点
    证据链接:
      - https://info.arxiv.org/help/subscribe.html
      - https://info.arxiv.org/help/rss.html
      - https://info.arxiv.org/help/api/tou.html
      - https://github.com/Lxion0553/dsh-arxiv-inspiration
      - https://github.com/yang3kc/daily_arxiv_digest
      - https://github.com/AutoLLM/ArxivDigest
      - https://github.com/dw-dengwei/daily-arXiv-ai-enhanced
    置信度: 中

  - 类型: 政策风险
    证据: |
      arXiv官方API条款将标题、摘要、作者、标识符和分类术语等描述性元数据按CC0提供，同时明确论文全文仍受版权保护，
      再分发需要权利人或许可授权，多数论文仅授予arXiv.org非专有传播权；
      官方允许个人或研究目的读取、存储和使用论文内容，鼓励把用户引导至arXiv摘要页，但禁止未经许可从自己的服务器存储并提供PDF、源文件或其他全文；
      legacy APIs包括OAI-PMH、RSS和arXiv API，所有受控机器合计每三秒至多一次请求且只使用一个连接，不得通过增加机器规避限制或使用他人凭证
    推理: |
      一，论文公开可读不等于全文可以任意转载。元数据CC0、单篇论文许可和插件代码MIT是三条不同授权链，
          产品可以复用代码与描述性元数据，却不能据此把第三方PDF、源文件或全文快照打包进公开仓库或转成自己的公开内容库；
      二，个人本地深读、研究用途存储和向公众提供全文不是同一事实。较稳妥的默认边界是本地保存必要笔记与摘录、
          展示标题摘要等元数据、保留版本化原文链接，并把PDF获取引导回arXiv；确需再分发时逐篇核对许可与权利人授权；
      三，速率限制适用于调用方控制的全部机器，而不是每台机器各享一份配额。增加分类、用户或定时任务时，
          应通过集中队列、缓存、退避和去重控制请求，不能靠多机并发、借用凭证或抓取绕过限制；
      四，官方明确鼓励论文发现、通知和新式界面，因此本条不是认定本点子或现有插件违规。
          风险集中在实现与运营方式：若忽略频率、凭证、版权和平台访问限制，技术链越自动化，违规请求或不当再分发的影响越容易扩大；
      五，多用户服务还需按实际法域、用户内容和部署方式另行评估隐私、数据与生成内容义务，本条不以一份API条款替代完整法律审查。
    案例: arXiv官方同时开放元数据与发现工具创新，并划出全文再分发、全局限速和凭证使用边界
    证据链接:
      - https://info.arxiv.org/help/api/tou.html
      - https://info.arxiv.org/help/api/basics.html
      - https://info.arxiv.org/help/license/index.html
    置信度: 高

  - 类型: 信任成本
    证据: |
      DSH官方安全说明明确其属于实验性开发者预览软件、尚未接受安全审计，第三方插件以及开放的网络、进程、凭据和文件访问都可能造成非预期影响；
      dsh-arxiv-inspiration需要宿主模型配置，可选复用本机alphaXiv Bearer token并消耗其配额，同时保留摘要截断、降级路径、带页码引用问答及画像修改人工采纳机制；
      customize-arxiv-daily公开承认模型推荐过程不稳定、不同模型的相关性分数差异很大，daily_arxiv_digest也声明其主要供作者个人使用且不保证稳定性
    推理: |
      一，用户需要同时信任两条链：执行链不会滥用模型或alphaXiv凭据、读取超出任务所需的本地文件，
          推荐链不会把标题摘要中的有限信息、模型误读或论文自身未经验证的主张包装成可靠研究结论；
      二，标题与摘要筛选可以减少阅读量，却无法自动验证实验、数据、引用和全文限制。预印本也不等于已经同行评审，
          中文推荐理由、评分和深读笔记必须保留arXiv标识、版本、原文链接、信息范围与降级状态，重要结论仍须回到原文核验；
      三，兴趣画像和负反馈会影响后续曝光。👎降权上限、单篇排除和画像草稿须由用户采纳是可审计设计，
          但用户仍需要知道为何推荐或排除、如何撤销反馈、如何纠正画像，避免一次误点或模型误判被长期固化；
      四，较稳妥的默认路线是本地保存兴趣与论文库、最小化外部调用、只把必要论文信息发送给模型或alphaXiv、
          不自动执行论文附带代码、不公开分发全文，并把“摘要”“模型推断”“作者主张”和“用户笔记”分层展示；
      五，本条高置信度指向“执行权限、推荐可解释性与摘要可信度是核心门槛”，不是声称上述仓库已经发生泄露、恶意行为或特定漏洞。
    案例: DSH通用安全警告、真实插件凭据与反馈设计及作者自报模型不稳定性共同说明信任边界
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/SAFETY.zh.md
      - https://github.com/Lxion0553/dsh-arxiv-inspiration
      - https://github.com/JoeLeelyf/customize-arxiv-daily
      - https://github.com/yang3kc/daily_arxiv_digest
    置信度: 高

  - 类型: 执行人限制
    证据: |
      DSH官方明确其处于快速迭代的开发者预览阶段并会发生兼容性破坏变化，安全说明要求最小权限和运行前检查；
      dsh-arxiv-inspiration公开列出宿主与Node版本、bundle登记、重启及新开会话、模型provider、可选Python／uv依赖、本地向量模型和alphaXiv凭据等安装维护事项；
      arXiv官方提示API可能变化且调用方需跟踪修复，daily_arxiv_digest则区分需要API密钥的无人值守管线与无额外依赖的Agent skill，并声明个人项目不保证稳定性
    推理: |
      一，对只有一台普通个人电脑、缺少Node／Python和Agent维护经验的用户，宿主版本、bundle登记、模型密钥、可选环境或定时配置中的任一异常，
          都可能使“持续发现论文”退化为沉默不运行、功能降级或反复手动排障；生成一次推荐不等于能长期无人值守；
      二，对负责维护的个人或小团队，DSH升级、插件协议、arXiv API与发布节奏、模型接口、alphaXiv配额及本地向量模型会持续占用工作。
          这些限制影响兼容性回归、失败通知、权限审计和摘要抽查，后果包括日报中断、重复调用、错误推荐或兴趣数据损坏；
      三，缩小范围可以显著降低门槛：固定已验证版本，先手动跑一轮，只选少量分类与较低候选上限，关闭外部深读和语义检索，
          使用本地论文库及原文链接；需要定时时优先成熟的独立日报路线，并保留手动运行、缓存与失败可见性；
      四，外包安装或让另一个AI代操作只能减少部分命令行劳动，不能替代用户保管凭证、判断论文价值和决定是否发送全文。
          多用户托管还需隔离每人的任务、凭据、兴趣画像和论文库，不能沿用个人原型的低门槛估计；
      五，公开资料没有系统性安装失败率或维护工时，故本条保持中置信度；它说明具体工作约束，不把技术不熟写成无条件死局。
    案例: 现成插件与无依赖skill降低首次实现门槛，但宿主、API、模型、凭证与可选环境仍要求持续兼容维护
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/SAFETY.zh.md
      - https://github.com/Lxion0553/dsh-arxiv-inspiration
      - https://info.arxiv.org/help/api/basics.html
      - https://github.com/yang3kc/daily_arxiv_digest
    置信度: 中

需求证据:
  类型: arXiv官方订阅与API、多个个性化论文发现开源实现
  说明: |
    arXiv官方每日邮件、RSS与Atom订阅证明按分类跟踪新论文是平台持续服务的真实场景，API条款还明确列举更好的搜索、
    论文通知、主题可视化和新式交互界面等鼓励用途，说明第三方发现工具具有被平台承认的使用位置。
    dsh-arxiv-inspiration提供可安装的DSH个性化调研、反馈与论文库，daily_arxiv_digest提供独立定时日报，
    AutoLLM/ArxivDigest等实现则记录了研究者面对大分类论文过载并尝试按自然语言兴趣筛选的具体问题。
    这些材料支持“减少手动筛选、保存论文发现和按需深读”已经出现多种实际供给，但主要证明官方功能与开源实现存在，不等于独立审计后的需求强度。
    当前没有足以确认用户持续阅读、采纳推荐、减少误漏、节省时间、付费或续费的公开数据；仓库Star、生成条数、反馈次数与界面展示均不作为长期留存证据。
  附件: 无

商业及社会价值评估: |
  商业价值：直接受益者是需要持续跟踪预印本的研究人员、学生、工程师、技术策划者和小型研发团队；
            对中文读者，兴趣粗筛、推荐理由、周期归纳和本地论文库可能降低浏览与整理成本。潜在付费者首先是希望获得私有筛选规则、
            团队汇总、可移植知识库和部署支持的用户或组织，可测试安装托管、私有工作流定制、技术支持和研究知识库集成，
            而不是单纯出售公开论文列表或未经授权的全文。arXiv原生订阅免费且多条核心实现以开源代码提供，会显著压低通用日报的收费空间；
            当前没有证据证明用户愿意为个性化推荐持续付费。商业验证应按“每篇经用户确认有用并实际保存或用于研究论文的全成本”
            与节省的筛选时间、持续使用和支付意愿比较，并把模型、外部深读配额、失败重试、凭证隔离、兼容维护和人工抽查计入成本。
            若只在个人低频自用成立，可以是有效工具，但不自动构成可扩张公司。
  社会价值：可追溯的论文发现、中文推荐理由与本地档案可能降低科研信息过载，帮助学习者接触新工作，并为个人研究留下可检索的时间序列；
            开源实现还提供了兴趣画像人工采纳、反馈降权、token预算、摘要降级和深读引用等可拆样本。若保留跨类目探索与全量抽样，
            可能帮助发现原本不在关键词范围内的工作，但这一点尚未验证。相反，兴趣反馈会放大既有偏好与同质化推荐，
            流畅摘要可能掩盖预印本未同行评审、实验限制、版本变化和模型误读，公开再分发全文还可能侵犯权利人利益。
            较有社会价值的形态是原文可追溯、兴趣规则可编辑、推荐理由可质疑、用户可撤销反馈、默认不再分发全文，
            并把是否阅读全文、采用结论或运行论文代码留给本人判断；它应辅助研究发现，而不是替代学术评审或高风险场景的人类专业判断。

可拆零件:
  - 遵守全局请求频率、单连接、缓存、去重与失败退避的arXiv API／RSS分类采集适配器
  - 对应arXiv公告节奏的工作日筛选、跨类目去重、空公告日与回捞窗口处理器
  - 由用户显式维护且画像修订必须人工采纳、编辑或放弃的本地兴趣知识库
  - 关键词与本地向量召回、RRF融合、候选上限和token预算组成的两阶段粗筛与模型排序器
  - 含arXiv标识、版本、摘要页链接、抓取日期、信息范围、推荐理由与降级状态的论文证据卡
  - 将作者主张、模型摘要、模型推断、用户笔记和深读结论分层的可信度标注结构
  - 记录👍、深读、👎、排除与撤销原因，并限制负反馈降权幅度的可审计反馈记忆
  - 支持关键词／语义检索、评分、反馈、翻译、笔记和时间线的本地JSONL论文库
  - 可选alphaXiv带页码引用问答、本地PDF解析降级及不公开再分发全文的深读工作流
  - 将按需调研、外部cron／CI、会话推送和“不自动推送”分开配置的任务与投递路由
  - 模型及alphaXiv凭据最小权限、用量配额、撤销轮换和本地兴趣数据隔离清单
  - 按模型、深读、失败重试、设备、维护和用户复核分摊的有效采纳论文成本核算器
  - 与arXiv原生邮件／RSS对照并测量原文打开、深读、保存、实际使用、误漏及持续阅读的评估表
  - 针对DSH升级、arXiv API、模型更换、向量依赖和定时任务的兼容性回归测试包

