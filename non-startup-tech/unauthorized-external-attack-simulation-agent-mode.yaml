id: unauthorized-external-attack-simulation-agent-mode
标题: 未授权对外系统攻击模拟Agent模式
档案类型: 预审
一句话: |
  把授权系统攻击模拟Agent抽离书面授权、目标白名单、人工审批与停止机制，用于第三方对外系统的未授权入侵；
  本档案只记录其双重用途风险、事件归因不确定性和禁止复活边界，不提供实施方法
设想来源: |
  主编在《授权系统攻击模拟与漏洞复核Agent》上传后，提出将其未授权对外模式另录为非正式节点，
  并举“DeepSeek攻破韩国银行”作为案例。经公开证据核查，本稿将该说法修正为
  “ARTEX与多模型工具链相关的韩国金融机构入侵事件”，不把单一模型自主攻击写成定案。
记录日期: 2026-11-17
当前结论: |
  AI初稿建议归入非创业技术设想储备区，并将“脱离授权与范围控制，面向第三方对外系统实施Agent攻击模拟”判为预审／死透。
  这里的“死透”是本项目对该模式的治理结论：不复活、不实施、不提供操作指导；
  不是否认相关技术已经存在，也不是否认现实中已经发生或今后仍可能发生滥用。
  韩国金融机构事件可作为高层风险案例，但只能支持“人类威胁行为者可能借助ARTEX、多种模型和传统攻击能力实施未授权入侵”，
  不能支持“DeepSeek单独、自主攻破多家银行核心系统”的强叙述。
复活状态: 死透
创新类型:
  - 技术应用
领域: 网络安全风险与治理
子领域: 双重用途Agent滥用、事件归因与授权边界
死法:
  - 类型: 理论证伪
    证据: |
      CrowdStrike于2026年10月7日发布调查，称其识别到与韩国金融机构定向入侵及数据外泄相关的基础设施，
      活动时间为2026年9月底至10月初。其报告把ARTEX实例描述为相关韩国攻击的可能工具，
      并明确记录DeepSeek v4.1-flash是主要模型后端，另有GLM-5.3和Grok 4.6用于其他Claude Code会话；
      全文主语是威胁行为者使用工具与模型，不是DeepSeek模型自行发起行动。
      Genians于2026年10月12日发布的韩国金融业事件分析说明，ARTEX自身不是模型，而是调用外部模型与安全工具的编排系统；
      该报告还把“确认事实”与“攻击全貌、自动化程度和攻击者归属等待核实迹象”分开，且截至该报告未确认核心银行系统入侵。
    证据链接:
      - https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/
      - https://www.genians.co.kr/blog/threat_intelligence/banking-cyber-attack?hs_amp=true
    推理: |
      一，被证伪的是“DeepSeek作为单一模型，在没有人类操作者的情况下攻破韩国多家银行核心系统”这一具体强版本。
          模型后端、Agent编排器、使用工具的人、被入侵系统和实际损害是五个不同对象，不能压缩成同一个主语；
      二，现有材料可以支持“未授权模式具有现实双重用途风险”，但不能据此证明DeepSeek独立规划并执行全部行动，
          更不能把其他模型、传统工具和人类决策从因果链中删除；
      三，公开材料提及的已披露入口包括贷款进度查询和员工移动工作支持等外围服务。
          外围系统被入侵足以造成真实损害，却不等于核心银行系统已经被攻破；
      四，因此本档案保留事件作为风险证据，同时否定过度简化的事件名称和自主程度推断。
    置信度: 高
    备注: 本条只校正事件表述及其证明边界，不评价任何模型厂商参与了攻击，也不摘录或传播调查材料中的个人身份信息。

  - 类型: 政策风险
    证据: |
      OWASP MASTG在安全测试准备阶段要求先界定范围并取得书面授权，明确指出在世界许多地区，
      未经书面授权攻击系统属于违法行为。韩国ETNews于2026年10月5日报道，警方正依据攻击基础设施中的ARTEX痕迹调查其与金融业入侵的关联，
      金融当局与金融机构仍在调查具体攻击路径和AI工具使用范围；这说明现实事件涉及执法与监管后果，而不是普通功能测试。
    证据链接:
      - https://mas.owasp.org/MASTG/0x04b-Mobile-App-Security-Testing/
      - https://www.etnews.com/20261005000112
    推理: |
      一，“只是漏洞验证”“由Agent自动执行”或“没有主观恶意”都不能替代目标有权方授予的授权；
          免责声明、开源许可证和工具原本的防御定位，也不能把对第三方系统的未授权行为转化为合法测试；
      二，未授权模式取消了定义合法目标的必要前提，使目标所有权、第三方托管、测试窗口、允许动作、数据边界、
          停止条件和披露渠道全部失去可验证依据，风险不再局限于操作者自身；
      三，因此该模式在本项目中没有可复活版本。可保留的是授权防御、事件研究、风险治理和受害系统修复复核，
          不是把同一攻击链换一个名称后重新开放；
      四，本条是一般风险与编辑边界判断，不构成对具体司法辖区、具体人员或具体案件的法律结论。
    置信度: 高
    备注: 不将执法调查中的嫌疑、厂商归因或媒体转述写成司法定罪；后续如有正式调查结论，应更新事件状态而不是预设结果。

  - 类型: 信任成本
    证据: |
      CrowdStrike原报告把相关ARTEX实例表述为“可能负责”所述韩国攻击，并明确写道受影响机构数量尚未确认。
      Cloud Security Alliance的后续研究笔记指出，ARTEX与具体入侵的联系主要来自操作者侧会话记录，
      当时尚未得到受害机构或韩国当局独立确认，不同报道中的机构数量也不一致。
      韩联社2026年10月7日报道则直接引述Everspin说明：“22秒”只是演示样本环境中完成特定任务的时间，
      不是实际金融系统被攻破的耗时。ETNews此前报道的约0.88美元同样来自该演示样本Web应用中的复现实验及模型费用估算。
    证据链接:
      - https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/
      - https://labs.cloudsecurityalliance.org/research/csa-research-note-artex-agentic-pentest-bank-breaches-202610/
      - https://www.yna.co.kr/view/AKR20261007058900017
      - https://www.etnews.com/20261005000110
    推理: |
      一，“真实入侵事件”“攻击基础设施中的工具痕迹”“配置中出现的模型名称”“防守方复现实验”是四种不同证据。
          若合并成“DeepSeek用22秒、0.88美元攻破多家银行”，就把事件、归因和实验测度同时越级；
      二，工具痕迹可以支持排查方向，却不能单独证明每次入侵都由该工具执行；模型配置也不能证明该模型生成了全部关键决策。
          同样，复现实验的时间和token费用不能外推为真实目标的全成本、成功率或普遍攻击速度；
      三，因此事件档案必须分别记录受害方或政府确认、厂商分析、媒体报道、复现实验与AI推演，
          对机构数量、泄露规模、操作者身份、模型贡献和核心系统影响保留未确认状态；
      四，这种不确定性不妨碍采取防御措施，但会阻止本档案把“经典案例”写成脱离来源层级的确定故事。
    置信度: 高
    备注: 本稿不采用“22秒、0.88美元攻破真实银行”的表述，也不把媒体所称机构总数或泄露总数归给ARTEX、DeepSeek或同一操作者。

  - 类型: 执行人限制
    证据: |
      Censys于2026年11月12日公布的独立观察显示，ARTEX及相关运行环境可能因公开控制台、开放目录和日志暴露而留下可观察痕迹；
      其主机数量统计也不等于同等数量的攻击者或恶意行动。OWASP APTS实施指南则把目标与技术的人为选择、授权范围校验、
      分阶段审批、真实停止、边界执行和完整审计列为不同自主等级的控制要求，而不是依赖模型自觉遵守提示词。
    证据链接:
      - https://censys.com/blog/artex-agentic-asbestos/
      - https://github.com/OWASP/APTS/blob/main/standard/4_Graduated_Autonomy/Implementation_Guide.md
    推理: |
      一，该模式的具体限制不是“能否启动一个Agent”，而是实施者没有合法授权基础，也无法正当控制高影响动作、
          真实数据访问、第三方依赖、事故处置和损害责任；删除审批与停止机制只会消除安全约束，不会消除这些后果；
      二，公开事件还显示，工具运行环境自身可能暴露会话、配置和行动记录。
          因此不能把自动化程度误写成可控性、可追溯性或责任消失，更不能把未被发现当作安全或合法；
      三，对普通实施者而言，这条路线没有可接受的工程验收方式：不能以真实第三方受害、数据外泄或规避防护作为测试成功标准，
          也不能通过增加代理、模型或并行任务来绕过授权缺失；
      四，可复用的实施成果只剩防御侧组件，包括外部策略控制、授权校验、人工审批、停止、审计、证据分级和修复复核。
    置信度: 中
    备注: 本条只作治理与风险层分析，不保留公开报告中的目标地址、代理地址、攻击载荷、凭据、漏洞操作细节或规避方法。

可拆零件:
  - 记录有权方、目标、第三方依赖、时间窗、允许与禁止动作、数据边界和联系人的授权对象
  - 独立于模型运行的默认拒绝策略网关，在连接、重定向、工具调用和范围变化前执行授权校验
  - 能停止正在运行与排队动作的真实暂停、终止、授权撤销和事故报告机制
  - 将原始观察、模型解释、人工审批、操作者结论和最终定级分层保存的审计与证据对象
  - 把受害方／政府确认、厂商分析、媒体报道、复现实验和AI推演分开的公开事件证据分级卡
  - 分离模型、Agent编排器、工具、人类操作者、目标系统和实际结果的归因记录模板
  - 面向外围与第三方服务风险的防御复盘模板，只覆盖资产清点、认证授权、最小权限、异常检测、修复与复测

死因保质期: 2027-11-17
起草AI: 澄樾（Kimi-K3.1）
记录边界: |
  本档案仅记录公开事件、风险治理、法律政策的一般边界和防御性工程原则；
  不提供未授权攻击步骤、目标选择、凭据或令牌使用、攻击载荷、持久化、扩散、数据外泄、规避防护、
  扩大破坏或逃避调查的方法，也不保存真实目标地址、私有漏洞细节、攻击流量和任何个人敏感信息。
  不得把本档案作为执行未授权测试的指南或免责声明。
备注: |
  本文件是AI起草的非创业技术储备，尚未经过主编人工审核；不接入nodes/、G01、G02、INDEX、REVIEW、科技树、正式节点编号或静态站公开节点数据。
  本档案与正式节点《授权系统攻击模拟与漏洞复核Agent》的关系是同一双重用途技术的授权复活边界与未授权禁止模式对照，
  不是直接派生或正式科技树关系；本次不修改该正式节点，也不为其补填相关节点。
  原始案例名称应修正为“ARTEX与多模型工具链相关的韩国金融机构入侵事件”。
  CrowdStrike材料属于安全厂商威胁情报，不是受害机构或司法机关最终结论；CSA笔记用于独立提示归因限制；
  Genians材料是其安全中心基于公开报道、当局口径与自身观察形成的分析，不等同于全部受害机构的取证报告；
  韩联社与ETNews用于核对Everspin复现实验语境，OWASP材料用于授权和治理原则，Censys用于独立观察运行环境暴露风险。
  本稿不摘录嫌疑人的姓名、联系方式、住址、账号或其他个人信息，不把调查中的身份线索写成确定归属。
  因事件调查、模型能力和攻击工具生态变化较快，死因保质期暂按一年设置；
  复核时应优先更新韩国当局或受害机构的正式结论，并分别检查工具归因、模型角色、人类参与程度、实际受损系统、
  受影响规模及复现实验与真实事件的边界。工具访问受限不等于链接失效，异常链接须转人工复核。
