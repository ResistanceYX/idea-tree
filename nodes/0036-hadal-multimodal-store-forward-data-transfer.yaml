死因保质期: 2027-11-16
起草AI: 澄樾（Kimi-K3.1）
审核人: ResistanceYX
审核日期: 2026-11-16
备注: |
  本节点为AI起草、人类审核的预审档案，不是CORK、GROW、AMOUR、NUI、Sentry、Orpheus或其他项目已经失败、停止或转向的验尸记录；当前没有具体验尸对象，不能编造。
  本稿对应Issue #10清单第31项“独立节点：基于多次多模态回传实现的超深海数据传输”，不是已经入库的正式节点0031；清单序号、Issue编号和正式节点编号属于三个不同体系。
  清单第30项“基于多模态结合的超深海环境记录和总结离线Agent”不在本次处理范围内，本稿没有完成、替代或合并该项。
  复活候选只覆盖可延迟的“声学低速控制—近距高速取数—AUV存储转发—水面／岸上交付”有限组合链；
  不涵盖超深海实时宽带、任意深度与水质通用、长期无人免维护、自动科学分析或商业闭环。
  CORK的2010年与2014年材料保留各自平台、距离、速率、文件规模和重复访问条件；没有把CTD、ROV、Alvin和Sentry的结果写成同一次端到端试验，
  也没有把Sentry或Orpheus的深度额定值当成CORK通信试验深度。Orpheus只证明超深海平台及采集条件存在，不证明其已装配本节点完整网络。
  GROW包含实验室testbed、作者报告和仿真内容，其最高150倍等效吞吐量属于特定实验口径，未作为真实超深海海试或普遍增益证据。
  多数据骡材料包含湖面实验；2023年Lake Guerlédan实验使用双USV、GNSS和WiFi并模拟较短通信距离，不是水下声学／光学或超深海试验。
  NUI材料保留不同年份和配置的深度差异，初步海试的光纤失效、浅水条件和团队排障不得外推为超深海长期可靠性；
  光纤、声学备份、光学调制解调器与水面上传是不同链段，不因同属“通信”就视为已经端到端贯通。
  本节点与0037、0039构成可选数据供给关系：交付数据已经带有可用的对齐元数据时可进入0037，
  需要跨模态整理、时空对齐和质量控制时可先进入0039，再由0039向0037或0040提供观测记录包。
  因而“0036→0039→0037→0040”是可能的协作链之一，不是唯一强制流水线；0036→0037和0039→0040也是独立可选路径。
  本节点不直接挂接0040，因为本节点交付原始数据与完整性记录，0040读取已经形成的观测记录，二者没有直接产物契约。
  本节点以端到端数据完整交付独立验收，不负责下游记录整理、识别、候选复核或总结；所有衔接均非直接派生，
  当前没有实际端到端集成证据，任一节点状态变化不自动改变其他节点边界。
  重启预算“高”对应全尺寸耐压观测设备、AUV、支持船、布放回收和多次海试的完整路线；本轮没有可靠的当前报价，不编造船时费率、项目总价或回本周期。
  复用既有观测站、AUV和船期进行单节点、受控海域、有限数据的集成验证属于另一预算口径，不能反推完整长期部署为低成本。
  来源按证明力分层：项目论文、摘要和官方技术页只证明各自公开试验、配置与作者报告，不作独立长期可靠性或商业采用审计；
  仿真、实验室testbed、湖面、浅水和单次海试结果不得外推为超深海长期全链路效果。
  因海洋通信硬件、AUV平台、导航与任务软件及海试验证条件变化较快，死因保质期设为一年。
  复核时应优先寻找同一系统在超深海多次端到端运行的直接证据，分别核对深度、水质、距离、速率、任务周期、等效吞吐、数据年龄、完整性、失败恢复与全成本；
  若只有新平台额定深度、单链路速率、仿真吞吐或一次下载演示增加，不应据此扩大复活范围。
