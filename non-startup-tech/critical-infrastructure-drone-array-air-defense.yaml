id: critical-infrastructure-drone-array-air-defense
标题: 重要设施廉价无人机阵列动态防空网
档案类型: 预审
一句话: 设想以大量廉价无人机在空中展开动态阵列，为重要设施充当拦截来袭无人系统的盾牌；本档案区分已有公开先例的按需拦截无人机，与尚未由这些先例证明的持续悬空阵列及完整要地防空网。
设想来源: 主编提供的原始技术设想，按“在空中展开无人机阵列充当盾牌”的概念补充系统边界后记录。
记录日期: 2026-11-13
当前结论: AI初稿建议将“大量廉价无人机持续悬空并构成完整要地防空盾牌”的强版本判为预审／死透；合法授权下按需出动、作为分层反无人机体系一部分的拦截无人机已有现实先例，不属于本档案否定对象。
复活状态: 死透
创新类型:
  - 渐进式
  - 技术应用
领域: 国防科技
子领域: 要地防护与反无人系统
死法:
  - 类型: 理论证伪
    证据: 英国政府关于Project OCTOPUS的公开材料说明，拦截无人机已被用于应对单向攻击无人机并计划规模化生产；乌克兰国防部也公开了多型无人空中拦截系统获准部队使用。美国国防部把关键设施防护列入体系化反无人系统战略。GAO则将反无人机技术区分为探测与处置，并指出小型目标探测、虚假探测、有效作用范围以及快速或不规则运动目标等挑战。这些资料证明的是拦截无人机及配套体系具有现实基础，不是持续悬空阵列已经能够独立承担完整防空。
    证据链接:
      - https://www.gov.uk/government/news/groundbreaking-ukraine-tech-sharing-agreement-to-deliver-drones-and-support-jobs
      - https://mod.gov.ua/en/news/defense-forces-arsenal-reinforced-with-new-interceptor-drones
      - https://www.defense.gov/News/Releases/Release/Article/3986597/dod-announces-strategy-for-countering-unmanned-systems/
      - https://www.gao.gov/products/gao-22-105705
    推理: 拦截器只承担处置环节，无法单独替代探测、识别、连续跟踪、指挥控制与交战授权。把更多廉价平台持续放在空中，也不会自动补齐这些能力；来袭目标未被可靠发现和持续跟踪时，阵列存在并不等于能够形成有效屏障。因此，被证伪的是“只要展开廉价无人机阵列即可构成可靠防空网”的强版本，而不是无人机在任何条件下都不能拦截另一架无人机。
    置信度: 中
    备注: 本条不是对所有拦截无人机作物理无效判定。公开材料不足以支持对本设想作具体拦截概率或效能结论；官方项目与使用口径也不能代替对持续悬空阵列的独立验证。
  - 类型: 钱算不平
    证据: 美国国防部公开战略将关键设施防护置于反无人系统整体能力中；英国和乌克兰政府材料则把拦截无人机置于规模化生产、多型号发展、采购与部队保障语境，而不是只采购一架廉价飞行器。上述资料没有给出本设想所需的机队规模、值班周期、传感器配置、维护替换、人员训练和授权成本，因而不能据此推算本设想的确定报价。
    证据链接:
      - https://www.defense.gov/News/Releases/Release/Article/3986597/dod-announces-strategy-for-countering-unmanned-systems/
      - https://www.gov.uk/government/news/groundbreaking-ukraine-tech-sharing-agreement-to-deliver-drones-and-support-jobs
      - https://mod.gov.ua/en/news/defense-forces-arsenal-reinforced-with-new-interceptor-drones
    推理: 单机廉价不等于体系廉价。完整成本还包括探测识别、指挥通信、机队轮换、能源补给、维修补充、训练值班、空域协调、安全审查和潜在第三方损害责任。持续悬空会把部分一次性采购转化为持续保障负担；若防护效果仍主要取决于外部传感器与指挥体系，单纯压低拦截器单价并不能证明整条路线比其他分层防护组合更划算。
    置信度: 中
    备注: 本条只指出全成本核算项和成本优势可能被侵蚀的机制，不虚构机队单价、数量或成本交换比，也不提供以降低拦截成本为目标的部署优化方法。
  - 类型: 政策风险
    证据: FAA机场无人机探测与处置页面强调部署前协调、对导航通信和空中交通的潜在影响，并说明处置权限集中于特定联邦部门；GAO资料同样讨论了通信干扰、隐私和法定授权限制，其中机构数量具有其发布时的历史口径。乌克兰国防部2026年公开的私人防空实验规则显示，企业参与仍须置于军事指挥和统一防空体系控制之下，而不是由企业自由部署。
    证据链接:
      - https://www.faa.gov/airports/new_entrants/uas_detection_mitigation_response
      - https://www.gao.gov/products/gao-22-105705
      - https://mod.gov.ua/en/news/ukraine-private-air-defense-six-key-rule-changes
    推理: 重要设施上空同时涉及空域安全、合法无人机与有人航空器运行、通信导航、隐私、财产和武力使用授权。探测、告警、跟踪与实际处置可能受不同规则约束，设施所有者或设备供应商身份本身不会赋予拦截权限。战时特殊授权也不能直接推广为一般和平时期或其他司法辖区的通行规则，因此完整路线可能在合法部署之前就被授权与协调要求阻断。
    置信度: 高
    备注: 本条只作公开规范层面的风险识别，不构成具体国家或场景的法律意见；实际判断须核对当地空域、执法、军事指挥和设施管理规则。
  - 类型: 信任成本
    证据: GAO指出反无人机系统可能出现虚假探测，动能处置还可能因坠落物、爆炸物或偏航抛射物造成非预期伤害。FAA则明确指出，探测系统本身不能判断无人机意图或威胁等级，并提示相关系统可能对导航、通信和空中交通产生二阶影响。
    证据链接:
      - https://www.gao.gov/products/gao-22-105705
      - https://www.faa.gov/airports/new_entrants/uas_detection_mitigation_response
    推理: 阵列规模扩大不会消除误报和误识别，反而会增加需要解释、协调和承担责任的处置事件。把合法无人机误判为威胁，或处置后造成坠落物与第三方损害，会削弱设施周边公众、航空运行方和监管机构对系统的信任；即使未发生事故，无法说明识别依据和授权链也会提高部署阻力。
    置信度: 高
    备注: 高置信度指误识别、附带损害与协调负担具有明确公开依据，不等于本设想必然造成某一具体事故，也不据此推定所有授权系统都不可靠。
  - 类型: 执行人限制
    证据: FAA材料要求相关部署与航空运行协调，并把处置权限限定于具有法定权限的主体；美国国防部公开战略显示，关键设施反无人系统能力依附于跨部门体系和专门采购。乌克兰私人防空实验虽允许企业参与，但仍要求军事指挥、责任划分和统一防空体系控制。
    证据链接:
      - https://www.faa.gov/airports/new_entrants/uas_detection_mitigation_response
      - https://www.defense.gov/News/Releases/Release/Article/3986597/dod-announces-strategy-for-countering-unmanned-systems/
      - https://mod.gov.ua/en/news/ukraine-private-air-defense-six-key-rule-changes
    推理: 对缺少法定处置授权、空域协调渠道、专业探测识别和指挥保障的普通设施运营者或一般研发团队，关键工作不是造出更多无人机，而是获得并维持整套授权与体系协作；这些条件无法由单机技术自行补足。具备国家、军事或执法授权并接入既有体系可以降低限制，但那已是不同实施主体和治理条件下的缩围路线，不能反过来证明一般主体可以独立实施完整设想。
    置信度: 高
可拆零件:
  - 反无人机探测、识别、告警与指挥控制的公开资料研究
  - 授权设施中的反无人机系统法规与空域协调机制比较
  - 拦截无人机采购、值班、维护、补充与责任保障的全成本研究
  - 动能处置的误报、坠落物与第三方损害风险评估
  - 被动防护、疏散告警和不涉及实际处置的仿真演练研究
死因保质期: 2029-11-13
起草AI: 澄樾（Kimi-K3.1）
记录边界: 本档案仅记录概念、公开先例、法律政策、系统级成本与风险，不提供阵列部署参数、控制算法、目标匹配、拦截窗口、武器集成、值班配置或效能优化步骤，也不把政府公开口径改写为独立效果认证。
备注: 本文件是AI起草的非创业技术储备，尚未经过主编人工审核；不接入nodes/、G01、G02、INDEX、REVIEW、科技树或静态站公开节点数据。英国、乌克兰和美国官方资料分别用于证明公开项目、使用授权、战略需求和制度约束，不相互替代，也不外推为全球统一现状。死因保质期暂按本次记录日起三年设置，人工定案时应根据实际审核日期和最新技术、政策证据重算；工具访问受限不等于链接失效，异常链接须转人工复核。
