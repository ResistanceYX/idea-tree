id: cloud-research-automation-agent
标题: 云端全流程科研自动化Agent
一句话: |
      将研究问题交给在独立云主机中长期运行的多模型Agent，
      由其串联文献检索、证据整理、代码执行、数据分析、绘图与论文初稿，并保留执行轨迹、
      人工接管和领域专家核验，而非承诺无人监督的原创科学发现
档案类型: 预审
复活状态: 已复活
重启预算: 高
创新类型: [渐进式, 技术应用]
领域: 人工智能
子领域: 科研智能体与云端研究工作流
死法:
  - 类型: 条件已死
    证据: |
        ClawsGO官网与2026年10月2日演示视频记录了云端长时运行、文献检索、代码执行和文件交付流程；
        The AI Scientist的同行评议论文与CRUX开放式研究评估分别提供了端到端计算研究和科研工程自动化的公开证据
    推理: |
      一，原门槛不是单独缺一个写作或检索工具，而是模型难以在持续环境中串联检索、浏览器、代码、数据、图表和文稿。
          ClawsGO已经形成可注册使用的云端产品，说明这些组件至少可以被集成为真实工作流，而非停留在概念演示；
      二，The AI Scientist-v2的一篇未由人类修改的生成稿件曾通过ICLR 2025 ICBINB工作坊的首轮人类同行评议，相关系统论文后来发表于Nature。
          这证明部分端到端计算研究流程已经可行，但工作坊个例不等于顶级原创成果，也不覆盖湿实验和全部学科；
      三，CRUX让前沿Agent用六天和数千美元预算处理两个未发表研究问题，Agent完成了文献、环境调试、实验和LaTeX文稿等核心工程步骤，
          人工干预主要涉及脚手架故障、延长时限和改善可读性；两项任务却均未取得足以回答研究问题的实质进展。它同时支持“工程条件已变化”和“原创判断尚未解决”两个边界；
      四，因此翻案对象限定为可执行、可观察、可接管的科研工程与写作流程。产品上线足以否定“当前技术根本无法做出此类工具”，
          不足以证明研究质量、商业持续性或全自动科学家已经实现。
    案例: ClawsGO真实产品、The AI Scientist-v2同行评议个例与CRUX两项开放式研究评估共同支持有限复活
    证据链接:
      - https://clawsgo.cn/
      - https://www.bilibili.com/video/BV1avaS65E65/
      - https://www.nature.com/articles/s41586-026-10265-5
      - https://arxiv.org/html/2607.27191
    置信度: 高

  - 类型: 钱算不平
    证据: ClawsGO付费条款按模型token用量计量并区分模型单价；36氪报道其个人订阅、机构部署和早期商业化状态；CRUX公开了开放式研究Agent所需的时间与预算量级
    推理: |
      一，长时科研任务会连续消耗检索、多个模型的输入输出与缓存、代码执行、存储和失败重试；沙箱与基础存储不向用户单独计费，不等于这些资源对运营方免费。
          并行Agent、长上下文和高价模型还会使成本随任务复杂度快速变化；
      二，订阅、算力额度和机构私有化已经提供了收费路径，但36氪同时明确记载付费用户规模、复购率与营收尚未公开。
          能够收费和能够覆盖模型、云资源、研发、评估、客服与机构交付成本，是两个不同结论；
      三，CRUX每项开放式研究使用六天和数千美元API预算，只说明前沿开放式研究评估可能非常昂贵，不能换算成ClawsGO单次任务价格。
          它仍提示：若把产品承诺扩大到反复探索和原创发现，成本会远高于普通写作辅助；
      四，可行路线是按任务设置预算和停止条件，优先承接高价值、可验收、可复用的工作流，并允许重计算转到用户或机构自有资源。
          尚无完整毛利、留存与支持成本数据，因此本条保持中置信度。
    案例: 已有计量收费与机构交付路径，但公开资料不足以证明长时任务的全成本闭环
    证据链接:
      - https://clawsgo.cn/billing-terms
      - https://eu.36kr.com/zh/p/3995487329308552
      - https://arxiv.org/html/2607.27191
    置信度: 中

  - 类型: 巨头碾压
    证据: |
        OpenAI已将GPT模型、文献搜索、引文和LaTeX协作整合进免费的Prism工作区；
        Google公开了多Agent AI co-scientist；ClawsGO则以云端执行环境和多模型任务助手形成当前产品边界
    推理: |
      一，基础模型厂商可以把检索、写作、引用、代码和协作直接并入既有账号与工作区。
          Prism对个人用户免费并提供不限项目与协作者的基础服务，会先压低“AI辅助论文写作和文献整理”的独立付费锚点；
      二，Google的AI co-scientist显示大型研发机构也在进入假设生成、研究规划和多Agent协作。
          若通用Agent原生获得持久云环境、学术数据库和研究审计能力，独立产品的编排层可能被上游吸收；
      三，但Prism公开功能主要集中于写作与协作，Google公开研究系统也不等于已经提供与ClawsGO相同的通用云主机、文件交付和本地资源连接。
          现有证据不足以断言这些竞品已经完整替代本节点；
      四，独立产品需要把差异化放在可回放执行轨迹、模型可替换、可复现产物、中文学术工作流、机构数据边界和私有化交付，而不是仅包装一次模型调用。
          本条是强替代压力，不是已经发生的淘汰结论。
    案例: 免费AI科研工作区与大型机构科研Agent压缩通用功能价格，但未完整覆盖云端执行产品
    证据链接:
      - https://openai.com/index/introducing-prism/
      - https://research.google/blog/accelerating-scientific-breakthroughs-with-an-ai-co-scientist/
      - https://clawsgo.cn/download
    置信度: 中

  - 类型: 信任成本
    证据:  |
        ClawsGO协议明确要求发表、引用或决策前自行核实；Sakana公开列出错误引用、方法严谨性和复杂代码等限制；
        两项公开研究分别揭示自动科研过程中的隐蔽方法学缺陷和开放式研究失败
    推理: |
      一，科研结果的错误不一定表现为一眼可见的假引用。基准选择、数据构造、指标替换和事后挑选实验都可能让文稿形式完整而结论失真；
          仅审阅最终论文会漏掉大量过程性问题，因此“生成了论文”不能成为可信代理指标；
      二，The AI Scientist虽然取得同行评议突破，研发团队仍承认想法可能幼稚、方法严谨性和复杂代码不足，并可能出现错误引用和重复图。
          正面个例不能抵消这些已知失败模式；
      三，CRUX的两项评估中，Agent未能判断发表门槛、创造性修正研究设计或从失败路线有效回溯，最终均被原研究作者拒绝。
          这支持保留领域专家判断，但样本仅两项AI研究，不能外推为所有学科和所有Agent都必然失败；
      四，可信产品必须交付来源、证据表、代码、数据版本、完整日志和可复现环境，并把人工验收置于提交、发表和实际决策之前。
          若只展示成功演示或最终文稿，用户无法区分真实进展与流畅包装。
    案例: 厂商风险声明、两个开源AI科研系统的受控审计与两项开放式研究评估相互印证核验必要性
    证据链接:
      - https://clawsgo.cn/terms
      - https://sakana.ai/ai-scientist-nature/
      - https://arxiv.org/html/2509.08713v2
      - https://arxiv.org/html/2607.27191
    置信度: 高

  - 类型: 政策风险
    证据: |
        ClawsGO隐私政策披露任务、文件、对话、产出和自愿提供的SSH凭证等处理边界，并说明执行任务时会向所路由的模型服务商发送相关内容；
        《个人信息保护法》规定敏感个人信息处理、委托处理和影响评估等要求；《人工智能生成合成内容标识办法》规定适用范围内的生成、导出与传播标识义务
    推理: |
      一，科研任务可能包含未公开数据、患者或受试者资料、企业秘密和实验室访问凭证，但并非所有科研资料都属于个人信息或敏感个人信息。
          重启时必须按真实数据分类、处理目的和服务范围判断，不能把“上传云端”直接写成违法，也不能把公开文献任务的风险套到所有场景；
      二，中国站披露数据存储于境内，同时任务内容会按步骤发送给模型服务商。运营方和用户仍需分别核对授权、最小必要、委托处理、访问权限、彻底删除和留存安排；
          若实际涉及跨境、人类受试者或特定行业数据，还须另行核对相应规则，不能由通用隐私政策替代；
      三，面向公众提供生成服务、导出文件和在网络平台传播生成内容时，可能触及显式或隐式标识及用户声明义务。
          纯私人离线研究与公开服务的适用事实不同，但产品不能把AI生成文稿默认当成无需披露和核验的人类原创成果；
      四，隐私政策中的加密、最小权限和不用于训练属于运营方公开承诺，不是独立合规认证。
          机构私有化可以缩小部分暴露面，却会增加部署、审计和运维责任，因此本条保持中置信度。
    案例: 云端科研数据路由与AI成果导出同时引入数据处理和生成内容标识两组边界
    证据链接:
      - https://www.clawsgo.cn/privacy
      - https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm
      - https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm
      - https://clawsgo.cn/terms
    置信度: 中

需求证据:
  类型: 公开产品、公开视频与早期商业化报道
  说明: |
    ClawsGO已提供可注册的云端科研Agent，官网展示了从学术检索、文献阅读、代码执行、证据表和图表生成到LaTeX手稿的完整演示，
    并说明智能体可在独立云主机上持续工作、执行轨迹可由用户接管；官方下载页进一步区分本机与云主机两种任务环境。
    2026年10月2日来源视频为ClawsGO发布的《我宣布AI科研进入自动化时代｜带你看ClawsGO Science》：https://www.bilibili.com/video/BV1avaS65E65/
    36氪报道其处于产品验证与早期商业化并行阶段，并记录个人订阅和机构部署两条路径；报道同时明确付费用户规模、复购率与营收尚未公开。
    上述资料支持“研究者存在减少多工具切换和重复科研工程的现实场景”，
    但产品存在、演示传播和报道中的内测反馈均不能单独证明长期留存、付费意愿或开放式原创研究需求已经得到满足。
  附件: 无

商业及社会价值评估: |
  商业价值：直接受益者是需要处理文献、代码、数据和文稿的研究生、科研人员与研发团队；潜在付费者包括个人研究者、实验室、高校和企业研发机构。
            收入可以来自个人订阅、按模型用量计量、团队协作和私有化部署，但付费用户、续费率、任务毛利、机构交付成本与营收均未公开，
            不能据产品上线推定商业闭环已经成立。
            更可行的商业边界是销售可核查的科研工程产能，而不是销售“自动重大发现”或无人负责的论文数量。
            优先任务应具有明确输入、可执行验证和人工验收标准，例如证据表、引文核对、代码复现、统计分析和图表重绘；
            开放式选题、关键实验设计、原始结论和投稿责任仍由研究者承担。若能以完整日志、可复现产物、模型可替换和机构数据治理形成差异化，收入与成本存在匹配可能；
            若只做通用模型的论文生成外壳，则容易被免费工作区吸收并承担高昂信任成本。
  社会价值：此类工具可能减少机械检索、格式排版和重复编码，降低小型团队使用计算研究工具的门槛，并通过保留代码、数据和过程日志促进复核与复现。
            节省的时间可以用于问题选择、实验设计和同行讨论，而不是简单增加低质量稿件。
            同一能力也可能放大错误引用、方法学缺陷、论文灌水、同行评议负担和研究同质化；云端集中处理还会扩大敏感数据与未公开成果的风险。
            社会价值成立的前提是人类对研究问题和最终结论负责，过程产物可审计，AI使用按适用规则披露，并为资源较少的研究者保留可负担入口，
            而不是以生成数量替代科学质量。

可拆零件:
  - 科研任务范围、输入材料、禁止事项、预算上限与验收标准模板
  - 带权限隔离、执行日志、文件差异和人工接管的云端研究任务工作流
  - 原文定位、证据摘录、引用状态与反驳证据并列的文献证据表
  - 数据版本、代码、环境、实验日志、图表和文稿之间的产物血缘记录
  - 分模型与分步骤计量、失败重试上限、任务停止条件和成本复盘机制
  - 将工程完成度、引用可靠性和原创贡献分开的多层科研Agent评估集
  - 投稿或决策前的领域专家验收、AI使用披露与禁止自动提交控制
  - 机构数据分级、凭证托管、彻底删除、审计和私有化部署检查表

相关节点:
