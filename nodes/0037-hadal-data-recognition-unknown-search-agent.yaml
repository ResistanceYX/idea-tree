编号: "0037"
id: hadal-data-recognition-unknown-search-agent
标题: 超深海既有数据识别与未知候选搜索反馈Agent
一句话: |
  对合法取得的既有超深海图像、视频及已经对齐的深度、位置、时间和任务元数据，
  辅助完成质量检查、已知类别识别、分布外／低置信度／未标注目标候选、原始证据回链、专家反馈与后续检索建议草稿；
  声学、eDNA等模态须分别验证适配，不把异常分数、聚类新簇或“unknown biology”标签自动升级为新物种或科学发现
档案类型: 预审
复活状态: 已复活
结论边界: |
  已复活仅指“合法既有海洋视觉及已对齐元数据输入—已知类别识别—分布外或低置信度候选—证据回链—专家反馈—检索建议草稿”
  的有限核心链已有直接实现；不涵盖统一全模态模型、自动确认新物种或科学未知、无人工复航搜索、
  通用全海深可靠识别、真实科研采用或商业闭环
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 海洋科研工具
子领域: 超深海视觉识别、分布外候选与专家反馈
死法:
  - 类型: 条件已死
    证据: |
      FathomNet论文公开了开放海洋图像数据库、REST API、专家标注与审核及模型生态，
      推荐元数据包括位置、深度、时间戳和成像类型，VARS实践还可同步温度、氧、盐度等辅助数据。
      论文另报告NGS Deep Sea Camera System在2010—2020年部署594次、收集1039小时视频、深度范围28—10641米，
      证明超深海既有视觉数据确实存在，但不表示这些数据全部进入FathomNet、全部开放或全部完成专家标注。
      FathomNet 2023竞赛同时要求识别动物和判断图像是否来自不同分布，训练数据来自0—800米、评估覆盖0—1300米并含290个类别，
      直接证明“已知类别识别＋分布外评分”已是明确任务，但不单独证明超深海效果。
      VIAME公开图像搜索、交互式查询和正负反馈训练；NOAA Deployable AI则公开已训练动物类别的检测、跟踪与有限潜器控制配合
    推理: |
      一，若旧判断是“既有海洋数据只能人工逐帧查看，没有系统能识别已知对象、标记分布外样本并吸收专家反馈”，这一条件已经翻案。
          FathomNet、其分布外竞赛和VIAME分别提供数据、任务与反馈工具的直接实现，不再只是“通用视觉模型也许能识图”的内部推演；
      二，可复活的核心链是：读取有权使用的既有图像或视频，检查元数据和质量，对已知类别给出检测或分类结果，
          将分布外、低置信度和疑似未标注目标组织成候选，回链原始帧与任务上下文，再由专家修正、驳回或保留未知；
      三，NOAA系统直接证明的是已训练类别的寻找和跟踪，不是未知发现；FathomNet竞赛的深度也不属超深海。
          超深海数据存在、分布外任务存在和交互反馈存在是三项不同证据，不能拼成“全海深统一模型已经验收”；
      四，因此本节点判为“预审＋已复活”，复活的是既有数据上的辅助识别、候选组织和专家反馈，
          不是自动科学裁决。声学、eDNA和其他传感器只能作为需要独立数据对齐与效果验证的适配器，不能直接并入统一全模态复活范围。
    案例: FathomNet的已知识别与分布外任务、VIAME的交互反馈和超深海既有影像共同支持有限核心链，但不证明全海深通用模型或未知科学发现
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC9508077/
      - https://github.com/fathomnet/fgvc-comp-2023
      - https://www.viametoolkit.org/
      - https://oceanexplorer.noaa.gov/expedition/25deployable-ai/
    置信度: 高

  - 类型: 理论证伪
    证据: |
      FathomNet论文记录跨数据集的分布偏移、背景误报和漏报，并认为可预见的未来不存在适用于全部海洋图像的单一通用分类器。
      2023分布外竞赛把分布外评分作为独立任务，其说明只将此类评分视为可能帮助发现新动物的方向，不等于确认新物种。
      Deepdive深海ROV数据集最终含3994张图像、33类，最佳模型在其特定数据集上的分类准确率为65%；
      “general unknown biology”用于无法进一步分类的生物，不是新物种确认。
      深海分类研究指出隐存种、发育阶段和形态可塑性可能造成仅凭形态的误判，
      综合形态、分子、分布与生态证据更可靠；新物种描述还需要分类专业知识、诊断特征及相应命名和研究程序
    推理: |
      一，强版本“模型打出异常分或形成新簇，就能宣布新物种、新地质现象或科学未知”混淆了数据分布、标注状态和科学结论。
          分布外可能来自深度、相机、光照、背景、成像质量或采集任务变化，低置信度也可能只是已知类别的困难样本；
      二，“没有被标注”不等于目标不存在，“训练集没见过”不等于科学上未知，“无法进一步分类”也不等于具备新物种诊断特征。
          新簇、异常分数和unknown标签都只能生成复核线索，不能自动完成分类学证明；
      三，科学确认可能需要分类专家、更多视角或个体影像、形态或遗传证据及相应研究程序。
          不同类群和问题的证据要求不能一刀切，少数依据高质量影像描述新物种的案例也不能变成Agent自动裁决权限；
      四，因此被证伪的是“异常候选＝科学发现”的强版本，而不是候选筛查无用。
          合格输出必须同时保留已知类别备选、异常依据、原始证据、数据局限、反证与无法判断项，科学结论由有资质的人和后续研究形成。
    案例: 分布偏移、标注缺口和unknown biology都能产生候选，却不能替代分类学诊断与补充证据，Agent不得把“没见过”直接写成“新物种”
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC9508077/
      - https://github.com/fathomnet/fgvc-comp-2023
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11372175/
      - https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2022.799191/full
      - https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2022.989245/full
    置信度: 高

  - 类型: 执行人限制
    证据: |
      FathomNet 2026正例—未标注挑战直接指出海洋视觉标注可能只覆盖专家认识或关注对象，
      没有被标注不等于目标不存在，说明数据本身会带入关注与标注偏差。
      VIAME的交互式查询依赖用户对系统建议样本作正负反馈，再形成面向新问题的检测和分类能力。
      Deepdive采用人工在环标注并由两名研究助手检查，即使过滤极少样本类别后仍有明显类别不平衡；
      其数据来自ROV SuBastian约600—1800米潜次，65%最佳分类准确率只适用于特定数据集，不能外推到万米级或其他任务
    推理: |
      一，具体限制是实施者需要同时具备海洋分类知识、数据工程、视觉模型评估和复核流程设计能力。
          会调用检测器不等于能判断同物异名、发育阶段、相似类群、影像质量和标注缺口，也不等于能对齐不同设备与任务元数据；
      二，关键工作包括确认类别体系和数据许可、清洗与对齐元数据、划分跨潜次和跨区域测试集、校准置信度、
          建立候选去重与证据回链、安排专家复核，并把修正转化为可追踪的新训练样本；
      三，若缺少这些工作，项目后果可能是模型在随机划分测试上看似可用，换潜次、相机或深度后却大量误报，
          专家还要清理重复候选和错误标签，反而增加工作负担；
      四，缓解边界是先限定公开或机构授权的一类视觉数据、一个类群和明确的已知类别清单，
          复用FathomNet／VIAME等组件，以跨潜次测试和专家复核验收，再逐个增加模态和区域。
          中预算只对应这一既有数据软件原型，不包含新船时、潜器任务或全模态科学发现系统。
    案例: 交互反馈仍需要懂数据与类群的人持续修正，Deepdive的人工双检、类别不平衡和限定深度说明开源工具不能消除专业实施门槛
    证据链接:
      - https://github.com/fathomnet/fgvc-comp-2026
      - https://www.viametoolkit.org/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11372175/
    置信度: 中

  - 类型: 信任成本
    证据: |
      FathomNet 2023竞赛将已知类别识别和分布外判断同时列为评估对象，说明两种输出需要分别检验。
      2026竞赛进一步暴露“未标注不等于不存在”的标注不完整问题。
      Deepdive的特定最佳准确率和类别不平衡表明单一总分不足以证明所有类群可靠。
      NOAA Deployable AI经历仿真、10米水池人工水母模型测试及2024年蒙特雷湾实地测试，
      官方只称其针对管水母、栉水母和水母的表现相对较好且仍需改进；该路线直接支持已知类别寻找与跟踪，不证明未知发现或全海深部署
    推理: |
      一，科研人员需要知道每个结果对应哪一帧、哪个体、哪个潜次和哪段元数据，模型为何给出已知类别或异常候选，
          以及是否存在重复个体、相机伪影、背景误报和跨域失效。只给一个“unknown”或风险分无法复核；
      二，可信输出应包含原始帧或片段、检测框或轨迹、位置、深度、时间、任务编号、数据来源、模型版本、
          已知类别备选、置信度、异常依据、备选解释和人工处理状态；缺失元数据必须显式显示，不得由模型补造；
      三，验收应分别测量已知类别检测、跨潜次泛化、分布外候选的误报与漏报、候选去重、专家修改、真实节时和撤回记录。
          自动跟踪已知动物、异常候选排序和科学发现确认是三个不同层级，不能共用一个准确率或演示视频代替；
      四，后续检索或复航建议只能是带预期收益、覆盖区域、数据缺口和不确定性的草稿，由有权人员审批。
          本节点不直接控制真实潜器，不自动执行高成本或可能影响环境的任务，更不能复制NOAA系统的有限控制能力作为自身权限。
    案例: 已知类别跟踪的实地演示不能为异常候选或科学未知背书，每个候选都必须能回到原始证据并经过独立人工判断
    证据链接:
      - https://github.com/fathomnet/fgvc-comp-2023
      - https://github.com/fathomnet/fgvc-comp-2026
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11372175/
      - https://oceanexplorer.noaa.gov/expedition/25deployable-ai/
    置信度: 高

  - 类型: 政策风险
    证据: |
      FathomNet论文的数据字段包括权利人和访问权限，说明海洋图像进入数据库并不等于放弃权利或允许任意再分发。
      2023竞赛页面对图像、标注和其他用途设有需要分别核对的数据使用条款，
      2026竞赛同样要求参与者遵守相应数据使用规则。上述材料证明“公开可访问”“可下载用于竞赛”和“可任意再训练、再发布或商用”不是同一授权
    推理: |
      一，既有数据可以来自开放数据库、机构内部档案、合作潜次或受限科研项目，每类来源的访问、署名、衍生模型、
          再分发和公开成果权限可能不同。技术上能读取文件，不代表有权把原图、视频、标注或敏感任务元数据交给外部服务；
      二，系统应在输入时记录权利人、来源、许可或机构授权、允许用途、署名、保存期限、再分发范围和撤回状态，
          默认本地优先；调用云模型、搜索或外部API前说明发送的是原图、片段、特征还是元数据，并取得相应许可；
      三，不得把绕过登录、验证码、付费墙、访问控制、反爬或平台限制写成数据取得能力，
          也不得向仓库、公开站或公共反馈区上传未经授权的原始影像、视频、内部标注和任务资料；
      四，专家反馈和公开候选默认私密，公开只限人工确认且有权公开的最小必要内容。
          本条不宣称所有海洋数据都受限或所有云处理都违规，具体义务按数据许可、合作协议、机构制度和适用规则分别核对。
    案例: FathomNet保留权利人与访问权限字段、竞赛分别规定数据用途，说明既有公开数据仍需逐项核对授权，不能直接汇总后任意再发布
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC9508077/
      - https://github.com/fathomnet/fgvc-comp-2023
      - https://github.com/fathomnet/fgvc-comp-2026
    置信度: 中

  - 类型: 钱算不平
    证据: |
      FathomNet论文报告一个跨机构视频模型用例减少81%人工标注工作量，但这是特定用例的作者报告，不是所有深海任务的普遍节时；
      论文同时讨论标注和船时成本，并强调模型用于辅助而非替代分类专家与生态学家。
      VIAME的交互式反馈需要用户持续判断建议样本，Deepdive则使用人工在环标注和两名研究助手检查。
      NOAA Deployable AI从仿真、水池到实地测试的过程也说明，把识别结果连接到真实任务需要额外验证，而不是一次模型训练即可完成
    推理: |
      一，全成本不只包括模型训练或调用，还包括数据授权与整理、存储、视频抽帧、元数据对齐、类别体系、专家标注与复核、
          误报清理、跨域测试、模型和工具维护、证据保存、撤回纠错以及可能的私有部署；
      二，有效产出应按经专家确认的新增标注、被排除的无效候选、可复核的数据线索、实际减少的人工查看时间和后续被采用的研究问题计算，
          不能按生成候选数量、模型分数或“unknown”标签数量计算。候选越多，若重复和误报越高，专家成本反而越大；
      三，中预算只对应复用公开或机构既有视觉数据、现成开源工具和限定类群的软件集成与专家验收，
          不包含新购潜器、支持船、复航搜索、全模态采集或大规模基础模型训练；
      四，目前缺少本节点真实用户的持续试用、专家工时、候选采纳、错误撤回、采购与续费数据，故不虚构节省比例、收入或亏损额。
          缩围原型必须与纯人工和既有工具基线比较同一批数据的有效产出与总成本，再决定是否扩展。
    案例: 特定用例的81%人工标注工作量下降不能普遍外推，持续专家反馈、跨域清理和证据复核决定候选工具究竟省时还是增负
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC9508077/
      - https://www.viametoolkit.org/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11372175/
      - https://oceanexplorer.noaa.gov/expedition/25deployable-ai/
    置信度: 中

需求证据:
  类型: 开放海洋数据与模型生态、分布外和标注完整性研究任务、交互式反馈工具及已知类别实地识别
  说明: |
    FathomNet及其模型生态证明海洋科研社区已经建设数据、专家标注、API和识别工具；
    2023分布外竞赛与2026正例—未标注竞赛说明跨域识别和标注不完整是正在被明确研究的问题。
    VIAME公开交互式查询与正负反馈，NOAA Deployable AI则证明科研团队会把已训练类别的视频识别用于实际探索辅助。
    这些材料支持“既有数据识别、候选组织和人工复核”的工具需求，不等于本节点Agent已有独立用户规模或商业订单。
    本轮没有取得海洋科研团队、分类专家或数据管理员的访谈与持续试用，没有真实任务中的候选采纳、专家节时、
    误报撤回、后续检索建议采用、采购、续费或收入数据。最关键的缺口是：谁拥有足够规模且合法可用的既有超深海数据，
    哪类候选能稳定减少而非增加专家工作，以及反馈后的检索建议能否在限定任务中被研究人员认为有行动价值。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在使用者包括拥有既有海洋图像或视频档案的科研团队、海洋观测设施、数据中心和需要整理历史潜次的机构，
            潜在付费方可能是科研项目、机构数据平台或内部分析服务；这些主体和付费关系尚未验证。
            可测试的服务形态是私有化数据接入、限定类群识别、跨潜次评测、分布外候选证据卡、专家复核和模型反馈维护，
            而不是出售自动新物种确认或自动科学发现。免费开源数据和工具会压低通用检测器调用的收费空间，
            可能形成差异的是可追溯数据治理、跨域质量、专家工作流和实际减少的复核时间。
            全成本包括授权、存储、抽帧、元数据对齐、模型、专家标注与复核、误报清理、维护、私有部署和纠错；
            当前没有订单、收入、利润、普遍节时或商业闭环证据。
  社会价值：对既有档案进行证据化复查，可能帮助研究人员重新利用已经采集的影像、发现漏标对象、整理跨潜次材料，
            并把不确定候选交给合适的专家，而不是让所有数据重新依赖逐帧人工筛查。
            价值应按经确认的新增标注、可复核线索、实际节省劳动、撤回误报和促进的后续研究衡量，
            而非unknown数量或模型生成的新名称。潜在负价值包括把成像与采样偏差伪装成生态结论、制造未证实的新物种宣称、
            泄露受限数据、增加专家清理负担，以及让模型输出直接触发高成本或影响环境的任务。
            因此社会价值成立的前提是合法数据、原始证据回链、跨域验收、专家负责、异议纠错和人工审批后续行动同时存在。

可拆零件:
  - 数据集来源、权利人、取得方式、许可或机构授权、允许用途、署名、保存期限、再分发范围和撤回状态的输入登记表
  - 图像与视频及已对齐位置、深度、时间戳、成像类型和任务编号的读取器；声学、eDNA等适配器独立验收，不默认统一对齐
  - 检查重复、损坏、抽帧、时间顺序、元数据缺失和跨设备差异的质量控制器，不用模型补造缺失的位置、深度或时间
  - 面向限定类群的已知目标检测、分类和可选跟踪器，保存类别体系、训练来源、模型版本和适用数据范围
  - 分布外、低置信度、异常特征和疑似未标注目标候选生成器，分别报告触发原因，不输出自动新物种结论
  - 跨帧、跨片段和跨潜次的相似候选聚类与个体去重工具；新簇只作复核入口，不作分类学证据
  - 回链原始帧或片段、检测框或轨迹、位置、深度、时间、任务、数据来源、模型版本和处理历史的证据卡
  - 同时列出已知类别备选、置信度、异常依据、备选解释、数据局限、反证和无法判断项的候选复核清单
  - 专家接受、编辑、驳回、保留未知、请求更多影像或升级分类研究的反馈工作台，所有修改保留人员和时间记录
  - 将确认与驳回样本转为可追踪正负反馈的交互式训练适配器，分别记录标注变化和再训练后的跨域表现
  - 根据候选位置、时间、覆盖缺口和不确定性生成后续检索或复航建议草稿的模块，默认人工审批且不直接控制潜器
  - 私密默认的导出与撤回机制，只分享经人工确认且有权公开的最小必要证据，不自动发布新物种或科学发现宣称
  - 分开评估已知类别识别、跨潜次泛化、分布外候选、去重、专家修改、实际节时和科学确认的验收集
  - 可选的标准化数据输入接口，读取独立回传系统交付的原始文件、元数据和完整性记录；不依赖特定回传网络，也不继承其部署状态

