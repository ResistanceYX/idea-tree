编号: "0012"
id: long-term-learning-companion-ai
标题: 长期伴随学习辅助AI
一句话: 在用户可查看、纠错、导出和删除的长期记忆上，持续理解个人学习史、生活变化与时间安排，并跨阶段调整辅助方式；视觉感知按需启用，本地部署是隐私实现选项而非隐私已经解决的证明
档案类型: 预审
复活状态: 复活候选
重启预算: 高
创新类型: [渐进式, 技术应用]
领域: 人工智能
子领域: 长期个人记忆与智能教育
死法:
  - 类型: 巨头碾压
    证据: OpenAI官方记忆说明显示，ChatGPT已能结合保存的记忆、历史聊天、自定义指令、保存文件及连接应用中的信息进行个性化回应；Google于2025年宣布Gemini能够引用既往聊天、学习用户偏好，并提供临时聊天等控制。两者证明“跨会话记忆加通用助手”已成为大型平台的基础功能，但均没有据此证明多年可靠成长伴随已经实现。
    推理: |
      一，如果产品只提供“记住聊天内容，再在下次回答时引用”，大型通用平台可以直接用现有账号、模型、文件入口和分发渠道覆盖，独立产品很难仅靠这一功能建立持续付费理由；
      二，新产品的差异化不能是聊天历史更多，而应是可检查的长期个人模型：知道一条记忆来自哪里、何时失效、怎样被纠正，以及它如何改变学习路径和时间安排；这属于平台尚未自动解决的纵深工作；
      三，本地优先和开放记忆格式可以避开部分正面竞争，但也缩小了大众市场规模。若完整产品必须依靠持续订阅才能生存，而通用平台把相近基础功能打包提供，价格锚点仍会压低独立产品的收费空间；
      四，本条高置信度针对“通用助手增加记忆功能即可形成独立产品”的竞争判断，不表示巨头已经完成本节点所定义的多年伴随机制。
    案例: ChatGPT与Gemini均已把既往对话和个人上下文用于通用助手的个性化
    证据链接:
      - https://help.openai.com/en/articles/8590148-memory-in-chatgpt
      - https://blog.google/products/gemini/temporary-chats-privacy-controls/
    置信度: 高

  - 类型: 钱算不平
    证据: Ollama的Qwen3-VL公开页面列出2B至235B等多种规格，说明本地视觉模型已有运行路径，但不同规格也对应不同的资源与能力取舍。LongMemEval把长期记忆拆为索引、检索和阅读三个阶段，并显示长历史下的信息更新、时间推理和检索后回答均需额外工程。Harvard的随机对照研究使用的是按教学最佳实践设计的定制AI导师，而非把通用聊天机器人直接等同于有效教学。
    推理: |
      一，完整成本不是一次本地模型下载，而是视觉模型运行、长期存储与索引、原始资料和派生记忆管理、备份恢复、模型升级、故障排查、跨设备迁移以及教学策略设计的总和；持续开启视觉还会进一步增加设备与能耗压力；
      二，云端方案把部分硬件成本转成长期推理和数据治理费用，本地方案则把成本转成用户设备、部署门槛和维护劳动；“本地”可以改变成本由谁承担，不能自动让成本消失；
      三，通用学习AI的高使用率没有证明用户愿意为多年伴随持续付费。个人数据越多，迁移和售后责任越重，而用户在早期尚未积累记忆时又最难感到价值，容易形成先投入、后受益的现金流错位；
      四，缺少完整物料清单、留存和付费数据，因此本条保持中置信度。它否定的是直接承诺全视觉、多年、跨设备且完全本地的重型消费产品，不否定文本优先、用户自备设备、按需视觉的轻量版本。
    案例: 本地多规格视觉模型、长期记忆三阶段工程与定制教学研究共同表明，可行演示不等于低成本完整产品
    证据链接:
      - https://www.ollama.com/library/qwen3-vl
      - https://arxiv.org/html/2410.10813
      - https://serl.fas.harvard.edu/publication/ai-tutoring-outperforms-class-active-learning-rct-introducing-novel-research-based
    置信度: 中

  - 类型: 信任成本
    证据: OpenAI官方说明明确指出，记忆不会保留每次对话的全部细节，记忆摘要和来源展示也不一定列出全部影响因素；删除聊天不一定删除由它生成的保存记忆，彻底删除还需分别处理记忆、原始聊天、文件和连接应用。LongMemEval记录了商业记忆系统覆盖关键信息、漏记间接信息以及长上下文性能下降等失败模式。《个人信息保护法》则对敏感个人信息、更正和删除等提出明确要求。
    推理: |
      一，本产品保存的不是普通聊天记录，而可能是学习困难、健康状态、行踪、家庭关系、作息和持续影像。一次泄露或越权访问的影响会随时间积累，用户需要先相信产品会少收集、真删除、可追责，才可能持续提供数据；
      二，长期记忆中的错误比普通答错题更危险：过时的目标、错误的能力判断或被误读的生活事件可能反复影响后续建议。系统若不能展示来源、处理矛盾、允许纠错并在不确定时拒答，就越“了解用户”越可能造成持续伤害；
      三，本地部署减少云端传输，却不自动解决设备丢失、恶意软件、家庭成员访问、备份外泄、模型更新后旧索引残留等问题。删除也必须覆盖原始资料、抽取记忆、向量或全文索引、缓存及备份，而不是只删除界面中的一条记录；
      四，信任成本来自高敏感数据与长期错误影响的叠加，公开资料足以证明其为核心门槛；但具体事故率和用户接受度尚无本产品的长期数据，不能把本条解释为所有本地产品必然不可信。
    案例: 通用平台的记忆删除复杂性与长期记忆基准中的覆盖、漏记和误用风险
    证据链接:
      - https://help.openai.com/en/articles/8590148-memory-in-chatgpt
      - https://arxiv.org/html/2410.10813
      - https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm
    置信度: 高

  - 类型: 政策风险
    证据: 《个人信息保护法》将生物识别、医疗健康、金融账户、行踪轨迹等以及不满十四周岁未成年人的个人信息列为敏感个人信息，并要求特定目的、充分必要性、严格保护措施及单独同意；处理不满十四周岁未成年人个人信息还须取得监护人同意并制定专门规则。《未成年人网络保护条例》进一步规定访问权限、合规审计以及查阅、复制、更正、删除等要求。面向中国境内公众提供生成式AI服务时，还须核对《生成式人工智能服务管理暂行办法》的适用范围、输入信息和使用记录保护、未成年人防过度依赖等义务。
    推理: |
      一，持续视觉、日程、学习和生活记录很可能组合出敏感画像。不能因为数据用于“个性化”就默认具有充分必要性，也不能用一次笼统同意覆盖未来所有采集和推断；
      二，若目标用户包含不满十四周岁未成年人，监护人同意、专门规则、未成年人及监护人权利响应和最小权限会成为产品设计前提，而不是上线后的补充合规材料；最初面向成年自学者可以缩小风险，但不能靠年龄声明规避实际用户结构；
      三，纯个人离线使用、向境内公众提供服务、学校或家庭部署以及云端同步的监管事实并不相同。重启时必须按真实服务边界逐项判断，不能把“本地运行”写成不受任何规则约束，也不能把面向公众服务的全部义务无差别套到单个用户的私人离线工具上；
      四，本条是明确且可高置信度确认的合规门槛，不是主张该点子已被全面禁止。若进入教育、心理或健康干预等更专门场景，还需另行核对相应规则。
    案例: 长期多模态个人档案同时触及敏感信息、未成年人和公众生成式AI服务三组规则
    证据链接:
      - https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm
      - https://www.gov.cn/zhengce/zhengceku/202310/content_6911289.htm
      - https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm
    置信度: 高

  - 类型: 执行人限制
    证据: LongMemEval要求同时处理信息提取、多会话推理、时间推理、知识更新和拒答，并显示即使检索正确也可能在生成阶段出错。Ollama公开模型页只能证明本地视觉模型存在可选实现，不能证明长期个人系统已经可靠。Harvard研究的学习效果来自针对特定课程、按教学最佳实践设计的AI导师，说明教学有效性本身也是独立设计与验证工作。
    推理: |
      一，执行者需要同时处理记忆数据模型、检索与时间语义、多模态感知、本地安全、备份迁移、教学设计、评估和用户产品，其中任何一层薄弱都可能让“长期伴随”退化为普通聊天加历史搜索；
      二，多年产品还需要处理用户目标变化、旧记忆失效、模型换代和数据迁移，不能用一次演示或模型标称上下文长度代替长期测试。评估集必须覆盖纠错、更新、时间推理和该拒答时不回答，而不只展示几次成功回忆；
      三，个人或小团队可以做出本地记忆原型，但若同时承诺全视觉、全生活场景、跨设备、高可靠和教学有效，验证与维护范围会迅速超过普通应用团队的能力；
      四，本条没有真实创业团队的失败记录，故保持中置信度。可行缩减是先把用户可控记忆层和单一学习场景做深，视觉、生活管理和跨设备功能按独立验收结果逐步加入。
    案例: 长期记忆、视觉、本地运维与教学设计是四套必须分别验收的能力
    证据链接:
      - https://arxiv.org/html/2410.10813
      - https://www.ollama.com/library/qwen3-vl
      - https://serl.fas.harvard.edu/publication/ai-tutoring-outperforms-class-active-learning-rct-introducing-novel-research-based
    置信度: 中

需求证据:
  类型: 公开学生调查与特定课程教学随机对照研究
  说明: |
    HEPI于2025年发布的1041名英国本科生调查显示，92％使用某种AI，88％在评估任务中使用生成式AI，主要用途包括解释概念、总结文章和提出研究思路；这证明通用AI学习辅助已有广泛需求，不证明多年伴随产品的留存或付费意愿。来源：https://www.hepi.ac.uk/2025/02/26/student-generative-ai-survey-2025/
    Harvard研究团队公布的特定大学物理课程随机对照研究显示，按教学最佳实践设计的定制AI导师可带来更好的学习效果和更短学习时间；它支持“精心设计的AI教学可能有效”，不能外推为通用模型、长期记忆或生活管理必然有效。
    目前未观察到目标用户连续数年使用同一伴随系统、持续纠错维护个人记忆并为此付费的一手证据。因此，真实存活的是学习与个性化辅助需求，多年伴随本身仍是待验证的产品假设。
  附件: 无

商业及社会价值评估: |
  商业价值：可能受益者是需要跨越课程、升学、工作和技能转换阶段的长期自学者，以及希望保有个人学习档案的用户；早期更适合先验证成年用户，而不是同时进入未成年人和学校市场。潜在付费者可以是个人用户或家庭，收入形式可能包括本地软件、记忆管理工具或高级服务订阅，但支付意愿、续费率、硬件承担方式和支持成本均未验证。
            可复活路线不是直接销售“全知全能的成长伙伴”，而是先提供文本优先、本地优先、开放格式、可查看来源和可彻底删除的记忆层，在单一学习场景证明持续价值后，再增加按需视觉和时间安排。若只能复现通用平台已有的聊天历史引用，独立商业价值很弱；若能让用户真正拥有并迁移多年个人学习模型，才可能形成差异化。
  社会价值：可迁移、可纠错的个人学习档案可能减少换工具和换阶段时的重复说明，帮助用户保留学习轨迹并增强对本人数据的控制；按需个性化辅助也可能降低部分学习门槛。与此同时，持续采集可能造成监控、依赖和错误标签固化，因此必须把用户自主权、拒答、人工求助和随时退出作为机制的一部分，不能把陪伴时长或数据采集量当作社会价值。

可拆零件:
  - 带来源、时间、有效期、敏感级别和纠错状态的个人长期记忆数据结构
  - 记忆写入前确认、矛盾检测、知识更新、过期和拒答工作流
  - 原始资料、抽取记忆、检索索引、缓存与备份的分层删除及审计清单
  - 文本优先、本地优先、视觉按需授权的最小化采集架构
  - 覆盖多会话推理、时间推理、知识更新和不确定拒答的个人评估集
  - 学习史、目标和日程的显式导入及用户确认接口
  - 可导出、可迁移、模型无关的开放个人学习档案格式
  - 针对单一课程的AI教学设计、效果评估与人工教师转介流程

死因保质期: 2027-11-07
起草AI: 叙棠（Kimi-K3.1）
审核人: ResistanceYX
审核日期: 2026-11-07

备注: |
    本节点为主编提出设想的预审档案，没有声称已有真实创业失败记录。
    复活候选仅指“用户可控长期记忆、文本优先、按需视觉、本地优先、单一学习场景先行”的缩减路线值得验证；
    当前不认可直接启动全视觉、多年伴随、完全本地、跨设备的重型完整产品。
    LongMemEval中的商业系统测试完成于2024年8月，只用于说明记忆机制的典型失败模式，不作为2026年产品排名；
    其500题、约115k tokens设置及30％至60％长上下文性能下降也不能直接换算成现实多年产品的失败率。
    Ollama页面是模型供应商能力说明，只证明本地视觉模型存在实现路径，不证明成本、可靠性或多年记忆已经解决。
    OpenAI与Google资料用于确认通用平台已有记忆功能，不表示其已实现本节点定义的长期伴随。
    由于基础模型、记忆产品和监管实践变化较快，死因保质期设为一年；
    复核时应优先检查可编辑记忆、彻底删除、跨模型迁移、长期对照评估、本地多模态成本及真实留存付费证据。
