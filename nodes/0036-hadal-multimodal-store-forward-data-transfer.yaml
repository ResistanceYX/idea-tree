编号: "0036"
id: hadal-multimodal-store-forward-data-transfer
标题: 基于多次多模态回传的超深海数据传输系统
一句话: |
  面向长期海底观测节点，在不要求实时宽带的前提下，组合声学低速控制、近距光学或其他高速取数、
  AUV多次存储转发以及水面浮标／船舶至岸上网络的交付链，分批带回可校验的原始数据与状态信息；
  不把不同项目、不同深度和不同海试条件下的链段指标拼成已经贯通的全海深实时通信系统
档案类型: 预审
复活状态: 复活候选
结论边界: |
  复活候选仅指“海底观测节点—声学低速控制—近距高速取数—AUV多次存储转发—水面／岸上交付”
  这一可延迟组合链已有分项直接实现；尚无证据证明同一套系统已在超深海完成长期、多次、端到端运行，
  不涵盖实时宽带、任意水质与任意平台通用、无人长期免维护或商业闭环
重启预算: 高
创新类型: [渐进式, 技术应用]
领域: 海洋科研装备
子领域: 超深海观测数据回传、AUV数据骡与多模态通信
死法:
  - 类型: 条件已死
    证据: |
      CORK海底观测站的2010年现场试验摘要公开了声学命令与光学高带宽链路的组合：
      特定CTD下放试验在100米距离实现1／5／10Mbps且无比特错误，一周后的重复试验又在80米距离以5Mbps下载20MB。
      2014年摘要进一步记录ROV、载人潜器与AUV Sentry等平台取数，其中Sentry完成20—150米斜距的数据下载，
      并记录2012年布放、2013年下载及2014年再次唤醒取数，支持重复访问而非仅一次演示。
      AMOUR与PANDA的声学＋光学系统则公开了机器人下载1.2MB文件并携回基站的实验，
      首个实验从至少25米距离开始并完成10次成功下载。GROW公开了数据骡、短距高速装卸、长距低速声学控制和延迟容忍组网体系。
      NOAA说明AUV可在任务中保存高分辨率数据并在浮出水面后回收；Orpheus页面列出6000米或11000米深度额定配置，
      但这些平台指标不证明其已经装配上述完整数据骡网络
    推理: |
      一，若旧判断是“海底数据只能靠缆线实时传回，声学、光学、AUV携数和水面回收无法组成可重复的数据交付链”，这一条件已经翻案。
          多个项目分别公开了控制、近距取数、物理携数、重复访问和延迟容忍处理的直接实现，不再只是通用通信原理推演；
      二，可保留的候选核心是：观测节点平时保存数据，以声学链路传输低速命令和状态，AUV按任务多次靠近，
          在满足距离、对准和水质条件时高速取数，完成存储转发后由水面浮标、船舶或回收过程交付岸上；
      三，上述证据必须按链段和试验条件使用。CORK的CTD、ROV、Alvin和Sentry结果不是同一平台的一次端到端试验，
          GROW的体系与testbed也不是Orpheus额定深度上的部署记录，平台深度额定值不能回填为通信试验深度；
      四，因此本节点只能判为“预审＋复活候选”：组件和有限组合链具有现实基础，
          但同一套系统在超深海长期、多次、端到端运行仍缺少直接证据，不能把分项拼图写成整套能力已经复活。
    案例: CORK重复唤醒取数、Sentry数据下载与AMOUR携数返回证明数据骡路线有直接实现，但超深海平台额定深度不等于整套链路的现场验收
    证据链接:
      - https://ui.adsabs.harvard.edu/abs/2014AGUFMOS53D1083F/abstract
      - https://ui.adsabs.harvard.edu/abs/2010AGUFM.U43A0005T/abstract
      - https://www.mdpi.com/2073-431x/10/10/119
      - https://link.springer.com/chapter/10.1007/978-3-319-00065-7_56
      - https://oceanexplorer.noaa.gov/technology/subs-auvs/
      - https://nautiluslive.org/tech/orpheus-auv
    置信度: 高

  - 类型: 理论证伪
    证据: |
      CORK摘要明确区分声学调制解调器较可靠、较远距但低于57Kbps的通信，
      与自由水光学链路在特定试验中的20—200米、1／5／10Mbps表现；两类指标的距离、速率和用途不能互换。
      GROW把短距高速光学／RF数据装卸与长距低速声学控制分开，其等效吞吐量计算还计入航行、对接、脱离和传输时间。
      声学—光学调度研究把AUV移动、信息年龄、传感器能耗和通信模式列为相互制约的调度对象，主要结果属于仿真。
      水下光学信道研究则说明吸收、散射、浊度、湍流、对准和视距条件会改变链路表现，其建模与仿真结果不是任意海域的统一上限
    推理: |
      一，强版本“多模态＋多次中继就能让超深海获得实时宽带互联网”混淆了物理链路速率、端到端有效吞吐、信息年龄和交付时延。
          声学较远距离不等于高带宽，光学高速不等于远距离，RF在水面或极短距场景也不能外推为水下长距通信；
      二，存储转发可以用航行时间换取分批交付，多次访问也能增加累计取回的数据量，
          但每次往返仍消耗任务时间、能源和布放回收资源，不能消除排队、延迟、失败重访和数据老化；
      三，多跳不会自动增加物理链路容量。中继节点越多，越需要处理调度、缓存、重复、乱序、时钟漂移和故障传播，
          不能把单链路峰值速率乘以跳数或数据骡数量来估算系统吞吐；
      四，因此被证伪的是“链段拼接即可得到无条件的实时、高带宽、线性扩容系统”，而不是延迟容忍数据骡路线。
          合格设计必须分别报告每段距离、速率、水质、平台、深度、任务周期、等效吞吐、数据年龄和交付完整性。
    案例: 光学链路的特定Mbps与声学链路的较低数据率可以同时服务同一任务，却不能合并成远距离、实时且高带宽的单一信道
    证据链接:
      - https://ui.adsabs.harvard.edu/abs/2014AGUFMOS53D1083F/abstract
      - https://ui.adsabs.harvard.edu/abs/2010AGUFM.U43A0005T/abstract
      - https://www.mdpi.com/2073-431x/10/10/119
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC9867368/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12322103/
    置信度: 高

  - 类型: 伪需求
    证据: |
      NOAA的AUV说明同时给出两类现实路线：Sentry等平台可执行6000米级海底测绘，
      而不少AUV的高分辨率原始数据仍在任务结束、浮出水面或回收后由研究人员取得。
      CORK材料证明长期海底观测站确实存在重复唤醒和取数需求，但这是特定科研设施的任务证据。
      多数据骡研究进一步比较线性、环形架构及吞吐量和延迟，并有湖面实验；
      2023年OCEANS论文的公开落地页则记录Lake Guerlédan的双USV实验、78米源汇距离、GNSS与WiFi及软件模拟的较短通信距离，
      这些是调度研究证据，不是水下多模态或超深海采购需求证据
    推理: |
      一，并非所有超深海科研任务都需要“多次多模态回传”。一次性调查若可在任务结束后回收数据，
          或只需少量状态信息，增加长期观测节点、高速取数模组和重复AUV访问可能只是提高成本；
      二，真正较可能存活的需求是：长期固定观测持续积累大体积数据，数据具有时间价值或丢失风险，
          又没有可用缆线，且重复访问的科研收益能够覆盖船时、潜器和维护成本。该场景来自任务结构推演，不能冒充用户访谈；
      三，即使在这一场景中，需求方购买的也应是按约定时限完整交付的可用数据集，而不是“使用了声学、光学和AUV”这一技术名词。
          若优先传回摘要、告警或少量精选片段已经满足研究问题，全量高频回传未必是最佳方案；
      四，当前没有取得海洋科研机构对回传频率、可接受延迟、数据量、预算和现有替代方案的独立访谈或采购记录，
          故本条保留为需求范围风险，不把科研论文中的系统建设直接换算为普遍市场需求。
    案例: 一次性AUV调查可在回收后取数，长期CORK观测站才有较明确的重复访问理由，两类任务不应共用同一回传需求结论
    证据链接:
      - https://oceanexplorer.noaa.gov/technology/subs-auvs/
      - https://ui.adsabs.harvard.edu/abs/2014AGUFMOS53D1083F/abstract
      - https://theses.hal.science/tel-05303004
      - https://hal.science/hal-04440388
    置信度: 中

  - 类型: 执行人限制
    证据: |
      NUI混合通信材料公开了光纤高带宽与声学低速备份并存的路线；
      2014年初步海试的4次潜水中有3次光纤最终失效，随后依靠声学命令引导返回，
      初步下潜最大深度45米、离船最远800米，不能外推为超深海长期表现。
      NUI技术页列出特定5000米配置、20公里光纤Gb Ethernet和低速声学链路，2021年任务页面则记录六个潜水日、
      与Argus的光学调制解调器测试及船上和岸上团队持续排障。Sentry技术页列出6000米深度额定值及USBL／DVL／INS等配置，
      说明平台能力依赖完整导航、能源和任务系统。光学信道研究同时提示浊度、湍流、对准与视距限制
    推理: |
      一，具体限制是实施者必须同时处理耐压与密封、腐蚀和生物污损、能源、水下导航定位、光学对准、通信协议、
          AUV任务规划、布放回收、船上与岸上协同，不是把几个商用调制解调器接入软件就完成系统；
      二，关键工作包括让观测节点和移动平台在真实海况下重复相遇并建立链路，在失败时保留数据和恢复任务，
          还要核对深度额定、导航误差、接口、能源和船期是否属于同一配置；
      三，对缺少海洋工程、潜器和支持船条件的小团队，这些限制会使全尺寸联调和重复海试难以完成，
          项目后果可能是浅水演示成功却在目标深度无法布放、对接、回收或持续维护；
      四，缓解边界是与既有观测站和AUV团队合作，复用已有耐压平台、导航和船时，先完成单节点、单数据骡、
          有限数据类别和多次受控访问，再逐级提高深度与任务周期。该缩围只能降低集成风险，不能免除真实海试验收。
    案例: NUI的高带宽链路失效与跨团队排障说明链路冗余有实际价值，也说明自主平台并不等于无需专业人员和现场保障
    证据链接:
      - https://ui.adsabs.harvard.edu/abs/2016AGUOSIS14A2301J/abstract
      - https://nautiluslive.org/tech/nereid
      - https://nautiluslive.org/video/2021/10/03/pushing-edge-deep-sea-exploration-hrov-nereid-under-ice-nui
      - https://nautiluslive.org/tech/auv-sentry
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12322103/
    置信度: 高

  - 类型: 信任成本
    证据: |
      GROW在数据骡体系中使用延迟／中断容忍网络、数据分块、重组和调度，
      说明“搬运数据”之外还需要处理间歇连接和交付组织；其等效吞吐量也不是单纯物理链路速率。
      AMOUR实验直接下载并携回的是1.2MB文件，CORK公开了不同时间、不同平台的重复取数，
      声学—光学调度研究则把信息年龄列为需要优化的对象。上述材料没有给出任意多次、多跳、超深海任务的数据完整性保证
    推理: |
      一，科研用户需要相信的不只是“文件到了”，还包括它来自哪个观测节点和时段、是否完整、是否重复或乱序、
          时钟是否漂移、传输出错后能否重取，以及原始数据、派生摘要和优先级丢弃记录能否追溯；
      二，多次存储转发可能引入重复块、缺失块、版本冲突、过期数据和重访后覆盖等问题。
          如果只展示单次下载速率或回收文件数量，可能把“链路演示成功”误写成“科研数据完整交付”；
      三，系统应为每次任务保存数据清单、分块哈希、序列号、源时钟与接收时钟、路由和重传记录、缺口及处置状态，
          并支持岸上重新组包、校验和回放。优先级调度必须显式记录未传或延迟数据，不能让摘要静默替代原始数据；
      四，独立验收应以端到端有效数据集的完整性、可追溯性、数据年龄和异常恢复为主，
          链路峰值速率只作分项指标。当前公开试验不足以证明这些治理要求已经在目标超深海系统全部满足。
    案例: 分块、重组和延迟容忍机制是数据骡体系的必要组成，说明多次搬运后的完整性不能由一次高速下载自动担保
    证据链接:
      - https://www.mdpi.com/2073-431x/10/10/119
      - https://link.springer.com/chapter/10.1007/978-3-319-00065-7_56
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC9867368/
      - https://ui.adsabs.harvard.edu/abs/2014AGUFMOS53D1083F/abstract
    置信度: 中

  - 类型: 钱算不平
    证据: |
      GROW把航行、对接、脱离和传输时间都计入等效吞吐量，说明有效交付需要支付移动平台任务时间，
      不能只计算通信模组或空中接口速率。NOAA材料表明AUV数据通常需要浮出水面或回收后取得，
      NUI任务则记录船上与岸上团队共同排障和连续潜水日。多数据骡博士论文及2023年湖面实验继续研究调度、延迟和能耗，
      反映多平台协同仍是需要专门试验与维护的工程，而不是免费增加的吞吐
    推理: |
      一，完整路线的全成本包括耐压观测节点、通信模组、AUV、导航定位、能源、支持船、布放回收、
          水面与岸上交付、备件、腐蚀和生物污损检查、失败任务、重复海试及专业团队；
          还包括数据校验、任务规划和长期维护，不能用单一模组报价或一次试验速率代替；
      二，有效产出应按经校验、满足约定数据年龄且能支持科研分析的交付数据集和成功观测任务计算，
          而不是按物理链路峰值、AUV航行次数或累计搬运字节计算。重复访问若取回大量低价值重复数据，收入或科研收益并不会同步增长；
      三，重启预算“高”对应全尺寸耐压设备、AUV、支持船和多次海试的完整工程量级。
          本轮没有取得可核验的2026年船时、AUV、布放回收和海试报价，故不编造日费率、总成本或回本金额；
      四，若复用既有观测站、AUV与船期，只做单节点、受控海域和有限数据的集成验证，属于另一预算口径，
          可以缩小首次验证投入，但不能据此宣称完整超深海长期部署成本低或已经算平。
    案例: 数据骡的等效吞吐量包含航行与对接时间，高带宽链路背后还有平台、船舶、回收和排障，全成本不能只按通信硬件计算
    证据链接:
      - https://www.mdpi.com/2073-431x/10/10/119
      - https://oceanexplorer.noaa.gov/technology/subs-auvs/
      - https://nautiluslive.org/video/2021/10/03/pushing-edge-deep-sea-exploration-hrov-nereid-under-ice-nui
      - https://theses.hal.science/tel-05303004
      - https://hal.science/hal-04440388
    置信度: 中

需求证据:
  类型: 海底观测站重复取数、AUV数据骡直接实验与多平台调度研究；独立采购和持续运营需求待验证
  说明: |
    CORK公开材料显示海底观测设施存在布放后再次唤醒、重复下载和借助不同平台取数的实际任务，
    AMOUR、GROW及多数据骡研究说明开发者与科研团队持续尝试解决间歇连接下的数据搬运和调度。
    NOAA对AUV任务后回收高分辨率数据的说明，则构成“物理携数返回”这一替代与补充路线的直接证据。
    这些材料支持长期无缆海底观测中的数据取得需求，不等于所有超深海科研都需要多次多模态回传，
    也不等于本节点系统已有用户规模、采购、续用或商业订单。本轮没有取得科研机构访谈、真实待处理数据任务、
    可接受延迟、数据价值、现有缆线／回收方案成本或采购记录。最关键的缺口是：哪一种长期观测任务的数据价值和时间要求，
    足以覆盖重复AUV访问的全成本，并要求多次回传而不是任务后一次性回收。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在使用者是运营长期无缆海底观测站、需要分批取得大体积数据的科研团队与海洋工程机构，
            潜在付费方可能是科研项目、设施运营方或设备与任务服务采购方；这些主体和付费关系仍属待验证场景。
            可测试的服务形态是复用既有观测节点与AUV，提供任务适配、数据清单与校验、重复取数、岸上交付和维护，
            而不是出售“超深海实时宽带”承诺。差异化应来自目标海域中的交付完整性、数据年龄、失败恢复和全成本，
            不是把声学、光学、RF、AUV和卫星名词堆入同一方案。
            全成本须包括耐压硬件、潜器、船时、布放回收、导航、能源、备件、维护、失败任务、岸上交付和专业团队；
            当前没有订单、收入、利润、普遍节费或商业闭环证据。
  社会价值：对确有长期观测需求的项目，多次存储转发可能让无缆设施不必等到最终回收才暴露数据缺口，
            并可在原始数据之外优先传回状态、摘要或高优先级片段，为后续科研分析和设备维护提供材料。
            价值应按新增可用科研数据、提前发现的问题、成功恢复的观测任务和相对替代方案的全成本衡量，
            而非通信演示次数或峰值速率。潜在负价值包括反复航行与布放回收的能源和资源消耗、任务失败造成的数据损失、
            对海洋作业的额外干扰，以及用不完整的“已回传”状态制造错误安全感。
            社会净收益只有在具体科研任务确需该回传频率、数据完整可追溯并与缆线、一次性回收等方案公平比较时才可能成立。

可拆零件:
  - 海底观测节点的数据目录、采集时段、优先级、保留周期和接口登记表，区分原始数据、状态、摘要与告警
  - 仅承担低速命令、状态和任务确认的声学控制链，不把它包装为高带宽原始数据通道
  - 记录距离、水质、视距、对准、速率和误码条件的近距光学或其他高速取数适配器，RF只用于经验证的适用链段
  - AUV数据骡的缓存、任务队列、存储转发、返航和水面交付模块，允许多次访问但不承诺实时通信
  - 延迟／中断容忍的分块、清单、哈希、序列号、去重、重传、重组和源到岸来源追踪记录
  - 处理源时钟、接收时钟、时钟漂移、数据年龄、重复块、缺失块、覆盖与版本冲突的完整性检查器
  - 根据数据价值、能源、位置、船期和链路状态安排单骡或多骡访问的调度器；仿真结果与现场结果分栏记录
  - 包含导航定位、接近、对接或近距驻留、链路建立、失败退出和回收恢复的AUV任务工作流
  - 水面浮标／船舶至卫星或岸上网络的交付适配器，逐段记录速率、时延和责任边界，不与水下链路指标混写
  - 面向科研用户的交付清单与回放工作台，显式展示已收、待收、延迟、损坏、重取和被优先级跳过的数据
  - 区分实验室testbed、仿真、水池、湖面、浅水海试、深海试验与超深海长期部署的证据矩阵
  - 可选的标准化数据交付接口，供独立分析工具读取原始文件、元数据和完整性记录；不包含下游识别、异常判断或自动复航能力

