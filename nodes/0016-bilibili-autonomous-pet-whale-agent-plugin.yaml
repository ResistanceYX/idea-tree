  - 默认六个只读工具、互动显式开启、上传和动态等能力不注册的权限分层结构
  - 无文件系统、命令和一般联网的专用值班profile，以及降级时的显式日志与阻止公共发言策略
  - 本机扫码凭证保存、有效期检查、撤销、轮换与异常登录处理流程
  - 私人日报、私信、评论@和楼中楼回复分开配置的投递路由，公共发布前的人工确认队列
  - 同一视频去重、每轮预算、总频率限制、任务停止和投诉后自动禁用公共互动机制
  - 与任务逻辑解耦的人格提示词、记忆和原创角色包，以及代码、美术和品牌分项授权清单
  - 将扫描量、报告生成、用户阅读采纳、公共互动效果与社区投诉分开的分层评估指标
  - 按模型、转写、设备、电力、失败重试、维护和复核分摊的有效条目／有效互动成本核算器
  - 针对宿主升级、第三方接口、模型更换和profile降级的兼容性回归与权限审计清单

