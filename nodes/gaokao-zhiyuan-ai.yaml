id: gaokao-zhiyuan-ai
标题: 基于概率学模型的高考志愿填报服务（C端）
一句话: 用AI基于概率学模型为考生一键生成个性化志愿填报方案，覆盖查分、选校、填报全流程
复活状态: 死透
创新类型: [渐进式, 技术应用]
领域: 教育
子领域: 高考升学，志愿填报
死法:
  - 类型: 巨头碾压
    证据: 逻辑推理+过往案例
    推理: |
      一、夸克高考连续8年免费，累计服务1.6亿用户；2025年单年服务超4000万考生、
      生成志愿报告超1200万份，全部免费；
      二、2025年起阿里（夸克/千问）、腾讯（元宝）、百度、知乎集体上线免费AI填报，
      元宝单年回答志愿问题超3000万个；
      三、大厂以志愿填报为AI应用流量入口，个人产品在价格与流量上均无胜算；
      四、死因的精确机理：被杀死的是"收费的C端产品"，不是需求本身——
      免费产品在概率透明化与协作导出上仍有明显残缺，高能力用户被迫自建工具，
      但"免费+残缺"已足以掐死"收费+完整"的生存空间。
    案例: |
      2025年6月大厂集体入场，行业分析指出免费模式直接冲击传统机构、
      压低行业客单价，形成"AI辅选、专家兜底"的新分层格局。
    证据链接:
      - http://www.news.cn/tech/20260605/7fe87a14a27f4dc2aaf2ce2e39b963b0/c.html
      - https://finance.sina.com.cn/tech/roll/2025-06-25/doc-infchutm4472041.shtml
      - https://www.cls.cn/detail/2396439
    置信度: 高

  - 类型: 钱算不平
    证据: 逻辑推理+公开数据
    推理: |
      一、全行业付费盘子仅10.9亿元（2025年，艾媒咨询），2027年预计12.2亿，增速个位数；
      二、头部真人服务（峰学未来12999元/18999元档）开售即多省售罄，
      一家切走高端市场大头；
      三、免费AI承接低端测算需求后，C端个人创业者可分的空间趋近于零。
    案例: |
      峰学未来2025届志愿卡3月31日开售，20分钟内多数省份名额售罄；
      艾媒数据显示2024年行业付费规模10.2亿、2025年10.9亿。
    证据链接:
      - https://news.ifeng.com/c/8iCHi6Kt477
      - https://www.cls.cn/detail/2396439
      - https://www.iimedia.cn/c400/111442.html
    置信度: 高

  - 类型: 季节魔咒
    证据: 逻辑推理+过往案例
    推理: |
      一、需求集中在每年6至7月出分至录取窗口，全年有效经营期约两个月；
      二、峰学未来每年3月开售、6月停招，印证行业节律；
      三、一次性消费、零复购，获客成本无法摊薄。
    案例: |
      峰学未来客服确认2025届服务"6月1日停招，招满提前"；
      从业者公开表示"最赚钱的时候已经过了"。
    证据链接:
      - https://news.ifeng.com/c/8iCHi6Kt477
      - https://content.foshanplus.com/newsDetails.html?newsId=300242236
    置信度: 高

  - 类型: 信任成本
    证据: 逻辑推理+过往案例
    推理: |
      一、付费决策人是家长，买的是"真人背书加责任主体"：
      客服明确"均为团队老师服务，非张雪峰本人"仍被抢购，
      说明家长为信誉体系付费而非为信息付费；
      二、AI建议的"AI味"与幻觉风险，使高客单家庭天然倾向真人一对一。
    案例: |
      2025年报道标题即"AI平替天价志愿咨询课"，
      但同文确认大厂AI全部免费、真人高端服务照售罄。
    证据链接:
      - https://news.ifeng.com/c/8iCHi6Kt477
      - https://finance.sina.com.cn/tech/roll/2025-06-25/doc-infchutm4472041.shtml
    置信度: 高

  - 类型: 政策风险
    证据: 逻辑推理+公开文件
    推理: |
      一、志愿填报咨询属强监管领域，省级招委会明文严禁学校与校外机构合作收费咨询；
      二、监管部门联合网信、公安、市场监管专项治理，打击"高价志愿填报指导"诈骗；
      三、个人开发者无资质直接面向考生收费，合规风险高。
    案例: |
      广东省招生委员会2026年通知：严禁学校与校外机构合作通过志愿填报咨询收费，
      并联合多部门加强对社会机构与个人的监管。
    证据链接:
      - https://szeb.sz.gov.cn/szzkw/qt/tzgg/content/post_12863763.html
      - https://szeb.sz.gov.cn/szzkw/qt/tzgg/content/post_12781791.html
    置信度: 高

可拆零件: 
  - B端填报师工作台（县域机构SaaS：数据引擎加概率呈现加Excel全家协作）
  - 概率透明化（录取概率逐条展示加风险偏好自选；已有亲历者使用案例验证）
  - 兴趣-就业翻译层（霍兰德测评现成，缺测评结果到就业数据的翻译）

需求证据:
  类型: 超级用户自建工具（需求真实性的最强信号）
  内容: |
    节点审核人（2026年高考亲历者）因市面产品不提供概率汇总与协作导出，
    手工构建27列×50志愿分析表：六梯度冲稳保（0至1‰冲复旦至99%保底）、
    三情景录取概率（预测/保守/极端）逐条并排、累计概率链滑档风险量化至0.6%、
    期望录取位次等指标。
  附件: evidence/gaokao-2026-table.xlsx
  边界: |
    该手工方案依赖数学能力与极高执行力，普通考生家庭难以复制——
    这既是自动化工具的价值证明，也限定了市场规模：
    能做的人不需要工具，做不了的人未必理解概率，中间层才是市场。
    
死因保质期: 2027-07-15
