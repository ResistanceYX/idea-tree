id: government-power-abuse-corruption-risk-scanning-agent
标题: 政府部门权力滥用与贪腐风险扫描反馈Agent
一句话: |
  在具有明确法定职责、项目授权和数据处理依据的环境中，按既定制度与岗位职责对获准使用的内部档案进行一致性和异常线索扫描，
  向有权复核人员反馈带原始依据、规则版本、反证、不确定性和纠错记录的待核事项；
  不把异常等同于权力滥用或贪腐事实，不自动认定任何人员违法违纪，也不默认普通团队有权汇聚政府内部档案
档案类型: 预审
复活状态: 复活候选
重启预算: 高
创新类型: [渐进式, 技术应用]
领域: 政务科技
子领域: 授权廉政风险审计与线索管理
死法:
  - 类型: 理论证伪
    证据: |
      《中华人民共和国监察法》2024年修改决定明确监察工作以事实为根据、以法律为准绳，遵守法定程序并保障监察对象及相关人员合法权益；
      现行《中华人民共和国审计法》要求审计机关依照法定职权和程序监督，审计报告出具前须征求被审计单位意见，审计决定在法定职权范围内作出。
      公共部门反欺诈与反腐败研究记录了异常交易、合同和申报辅助筛查的现实用途，也明确区分可疑线索、证据充分性与最终处置；
      相关论文特别指出，误报会对官员、供应商和其他相关人员造成严重后果，部分异常工具产生的材料不足以支持起诉
    推理: |
      一，被证伪的是“模型读取制度和档案后，可以自动识别并裁定谁滥权、谁贪腐”的强版本。
          流程缺失、超阈值、关系接近或文本不一致可能来自录入错误、制度更新、合理例外、紧急程序或其他非腐败原因，
          异常分数至多是启动复核的线索，不能替代事实调查、合法证据和有权主体判断；
      二，贪腐行为具有隐蔽性和对抗性，未被发现的行为通常不会自动成为高质量负样本，历史处罚记录也只反映既有发现与处置机制。
          因而模型既可能漏掉新型行为，也可能把过去被重点检查的群体或流程反复标高；
      三，复活对象应改为“在授权范围内发现制度和档案之间值得核对的不一致，并把依据、反证和不确定性交给有权人员”。
          它的成功指标是有效线索率、漏报复盘、复核耗时、纠错和程序合规，不是自动定罪数或模型自行处罚数；
      四，线索扫描仍可能被发现不了全部隐蔽行为所限制，但这一限制并不推翻辅助审计价值。
          只有产品坚持自动认定个人违法违纪、跳过法定程序或以风险分直接触发不利处置时，才与现有事实和程序要求发生根本冲突。
    案例: 监察与审计程序要求结合公共部门误报研究，否定自动裁决强版本，同时保留证据化线索排序
    证据链接:
      - https://www.gov.cn/yaowen/liebiao/202412/content_6994559.htm
      - https://www.audit.gov.cn/n6/n36/n10083637/c10191187/content.html
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12579520/
    置信度: 高

  - 类型: 冷启动死锁
    证据: |
      反腐败AI研究指出，真实欺诈标签有限、未被发现案件未标注、数据碎片、缺失记录和不一致报告会妨碍训练与实施；
      以既往受罚人员为训练数据可能重复既有偏差，而无监督异常检测虽然减少标签依赖，却仍需要专业人员解释异常。
      英国国家审计署关于数据分析应对欺诈与错误的报告把良好质量的关联数据列为潜在收益条件，并显示公共机构仍需解决实施计划、数据共享和能力问题；
      《政务数据共享条例》则要求全过程数据质量管理，并建立校核纠错规则、渠道和处理记录
    推理: |
      一，冷启动不是简单的“先收集一些贪腐案例再训练”。真正可用于监督学习的已核实样本往往稀缺且带有选择偏差，
          正常样本也可能只是尚未被发现的问题；如果再把模型输出经人工采纳后直接回填为真值，就会形成自我确认循环；
      二，不同部门的档案结构、岗位名称、制度版本、审批系统、时间粒度和数据质量不一致。
          在尚未解决来源、口径、权限和错误更正之前，先建统一大模型评分器会把历史混乱放大为跨部门统一误报；
      三，可缓解路线是从单一有权单位、单一业务流程和少量可解释规则开始，使用合成或经批准的脱敏样例验证技术链，
          再由领域人员建立已核实正负例、合理例外库和时间外测试。无监督模型可辅助发现新异常，但不得免标注意味着免复核；
      四，若项目必须先无差别汇聚全部部门档案才能展示任何价值，授权、数据治理和标签问题会相互阻塞，形成冷启动死锁；
          若能在小范围证明有效线索、纠错和流程收益，再逐项扩展数据和制度范围，该死法有可能被缓释。
    案例: 稀缺且有偏标签、数据质量与共享纠错要求共同决定“小范围已核实流程”比全域一次性训练更可检验
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12579520/
      - https://www.nao.org.uk/reports/using-data-analytics-to-tackle-fraud-and-error/
      - https://xzfg.moj.gov.cn/front/law/detail?LawID=1771
    置信度: 高

  - 类型: 政策风险
    证据: |
      《中华人民共和国数据安全法》第三十八至四十条要求国家机关在法定职责范围内依条件和程序收集、使用数据，建立安全管理制度，
      委托建设维护电子政务系统或存储、加工政务数据须经过严格批准并监督受托方，受托方不得擅自留存、使用、泄露或提供政务数据。
      《中华人民共和国个人信息保护法》第三十四条规定国家机关处理个人信息不得超出履行法定职责所必需的范围和限度，
      并对国家机关境内存储、自动化决策说明、安全保护、影响评估和权利救济设有相关要求。
      《政务数据共享条例》要求共享申请说明依据、场景、范围、方式和时限，禁止擅自扩大范围、改变目的或提供给第三方，
      并规定目的完成后的处置、使用记录、委托处理和投诉举报；《审计法》第三十四至三十六条则证明特定审计机关依法取得电子数据与文档具有明确职权基础
    推理: |
      一，“用于廉政监督”是目的描述，不是自动取得所有内部档案的通用授权。
          必须分别确认处理主体的法定职责、具体项目依据、数据目录、共享或调取程序、必要范围、保存期限、人员权限和受托处理安排；
      二，审计机关依法可以要求提供电子数据并进行综合分析，不等于任何技术供应商、普通业务部门或外部Agent平台都继承同一权限。
          同样，某部门能够查看本业务档案，也不当然意味着可把数据交给另一部门、外部模型或用于新的个人风险画像；
      三，内部档案还可能包含国家秘密、工作秘密、商业秘密、个人隐私和个人信息。
          只做私有化部署仍不能跳过处理依据、分类分级、最小权限、访问审计、跨境评估、留存销毁和安全事件处置；
      四，可执行的缩围形态是先由有权机关主导，使用经批准的数据、专网或指定环境和最小必要字段，供应商仅按合同及批准范围受托处理，
          不将真实档案用于通用模型训练，不擅自复制到研发环境。若无法满足这些前提，应停止真实数据试点，而不是以技术创新为由绕过程序。
    案例: 审计法定数据职权与政务数据、个人信息和受托处理限制并存，证明“授权主体＋具体目的＋必要范围”缺一不可
    证据链接:
      - https://www.cac.gov.cn/2021-06/11/c_1624994566919140.htm
      - https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm
      - https://xzfg.moj.gov.cn/front/law/detail?LawID=1771
      - https://www.audit.gov.cn/n6/n36/n10083637/c10191187/content.html
    置信度: 高
    备注: |
      本条仅依据公开现行法规范说明设计约束，不构成对任何具体单位、项目或数据流合法性的法律意见；
      涉及保密、档案、监察、审计、个人信息和地方政务数据规则时，还须由有权机关及其法律、保密和安全人员按实际场景审查。

  - 类型: 信任成本
    证据: |
      反腐败AI研究记录了误报造成的声誉和处置后果、历史处罚数据偏差以及公开曝光错误分类的风险，
      并主张官员被标为高风险时应有透明复核和质疑程序，通过周期审计检查是否过度标记某些群体或忽视其他人员。
      英国国家审计署报告把公共部门数据分析放在具体组织治理和实施条件下评估，而不是只比较算法准确率。
      《监察法》修改决定强调事实、法律、法定程序和合法权益；《个人信息保护法》规定对权益有重大影响的仅自动化决策可要求说明并有权拒绝，
      同时提供更正、补充、解释和投诉等机制，具体适用仍须结合处理主体与场景判断
    推理: |
      一，人员风险评分具有高影响性。错误关联、过时制度、同名人员、缺失上下文或合理例外一旦被领导、审计或纪检人员当作事实，
          可能导致不当调查、声誉损害、寒蝉效应和对工具整体的抵制；
      二，只给出“高风险87分”而不展示触发规则、原始档案位置、制度版本、数据时间、备选解释和模型不确定性，复核者无法有效质疑；
          反之，把未经核验的个人名单广泛公开，又可能在纠错前造成不可逆伤害；
      三，可信反馈应以流程、合同、审批或事项为默认复核对象，只有确有必要且获授权时才关联到个人。
          输出须区分规则命中、统计异常、模型推断和人工已核实事实，并设置双人或相应职责层级复核、回避、异议、纠错、撤回和访问留痕；
      四，模型不得直接触发处分、公开曝光、薪酬或岗位调整等不利决定。对确需保密的问题线索，透明不等于向所有人公开，
          而是向依法有权且相互制约的复核者提供足够依据，并在不妨碍法定职责的前提下保留适当救济。
    案例: 误报与历史偏差研究、法定程序和自动化决策救济共同要求“可质疑线索”而非“不可见人员判决”
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12579520/
      - https://www.nao.org.uk/reports/using-data-analytics-to-tackle-fraud-and-error/
      - https://www.gov.cn/yaowen/liebiao/202412/content_6994559.htm
      - https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm
    置信度: 高

  - 类型: 执行人限制
    证据: |
      《审计法》把取得被审计单位电子数据、有关文档及开展综合分析的权力配置给依法履职的审计机关，并要求审计人员具备相应专业知识和业务能力；
      《数据安全法》和《政务数据共享条例》对国家机关委托处理、共享申请、使用记录、安全责任和受托方行为设置持续义务。
      英国国家审计署的跨政府报告显示，即使公共部门已有数据分析收益，仍需解决跨部门协作、数据质量、共享治理、资源与具体实施计划；
      这些材料描述的是机构能力要求，不是“购买一个通用大模型账号”即可完成的实施清单
    推理: |
      一，对没有法定职责依托、政府项目授权、政务安全环境、领域专家和长期运维资源的普通个人或小团队，
          真实内部档案无法合法取得，制度与例外也难以解释，因而不能完成生产级部署、复核闭环和持续责任承担；
      二，即便通过采购进入项目，技术团队也不能替代有权机关决定数据目的、线索处置或个人责任。
          扫描规则随制度、岗位、系统和组织变化而持续维护，一次交付文档解析器并不等于完成廉政风险系统；
      三，重启预算“高”针对真实生产路线中的授权与合规评估、专有环境、系统集成、分级权限、安全审计、领域复核、试点评估和持续运维，
          而不是模型API价格。仅用公开或合成制度档案做技术演示可以更低成本完成，但不能据此声称已在政府内部落地；
      四，普通团队可验证的边界是公开制度与合成／脱敏样例上的规则解析、证据定位、访问日志和纠错工作流，
          或与有权机关开展经批准的小范围合作。若缺少这些合作与责任条件，应停留在研究原型，不应把“能运行Demo”写成具备真实部署资格。
    案例: 法定职权、受托处理和跨政府实施条件共同限制普通团队的真实数据路线，但不阻止无真实档案的公开技术验证
    证据链接:
      - https://www.audit.gov.cn/n6/n36/n10083637/c10191187/content.html
      - https://www.cac.gov.cn/2021-06/11/c_1624994566919140.htm
      - https://xzfg.moj.gov.cn/front/law/detail?LawID=1771
      - https://www.nao.org.uk/reports/using-data-analytics-to-tackle-fraud-and-error/
    置信度: 中

需求证据:
  类型: 现行法定审计职责、国家审计机构公开案例与公共部门反腐败研究
  说明: |
    《审计法》明确电子数据与有关文档的依法取得、综合分析和内部审计制度，证明授权主体开展数据化监督具有真实制度场景；
    英国国家审计署报告记录了公共机构运用数据匹配、网络分析、异常检测、风险评分和AI辅助发现欺诈与错误的实际案例，
    并指出已有收益与整体潜力之间仍存在实施差距。反腐败研究也记录了公共支出、采购和申报异常筛查的多种既有工具。
    这些材料支持“辅助有权人员排序和复核线索”存在持续公共需求，但不证明任何具体中国政府部门会采购本设想，
    不证明外部供应商有权取得内部档案，也不证明部署后必然减少腐败或形成商业利润。
    后续需求验证应由具有职责的单位提出具体流程、合法数据范围和复核人员，测量有效线索率、漏报、复核耗时、纠错与持续使用，
    不能把一般反腐重要性直接换算成产品订单。
  附件: 无

商业及社会价值评估: |
  商业价值：可能的直接使用者是依法履职的审计、内部控制、廉政风险管理或其他经明确授权的公共机构人员；
            技术供应方的价值在受控环境中的档案解析、制度版本对照、可解释规则、证据定位、权限与审计日志、异议纠错和持续维护。
            付费与采购只能建立在真实职责、批准程序和安全要求之上，不能把公开反腐需求视为供应商可自由汇聚数据的商业机会。
            生产部署需要长期领域复核、系统集成和安全责任，故重启预算为“高”；公开或合成数据原型只能验证技术，不证明生产市场。
            商业评估应按每个经有权人员确认且可进入后续流程的有效线索的全成本、复核时间变化和持续使用衡量，
            同时计入误报处置、数据治理、保密安全和审计成本。若只有通用档案摘要而没有授权工作流与纠错能力，缺乏独立采购价值。
  社会价值：在合法授权和有效监督下，证据化异常筛查可能帮助公共机构把有限审计资源用于更值得复核的流程与事项，
            发现制度冲突、职责缺口、重复审批或控制失效，并借纠错和复盘改善一般治理，而不只是在事后寻找个人问题。
            相反，数据过度汇聚、偏差评分、秘密人员画像和错误公开可能侵害合法权益、强化既有权力失衡并削弱公众信任。
            较有社会价值的形态是目的限定、最小必要、默认扫描流程而非给个人贴标签、保留人工独立判断、异议和回避、可撤回纠错、
            对访问和模型版本留痕，并定期公布在不泄露依法应保密信息前提下的总体误报与治理改进情况。
            系统只能辅助法定监督，不能成为绕过程序、扩大监控或自动惩罚人员的工具。

可拆零件:
  - 法定职责、项目授权、数据目录、处理目的和必要范围的上线前置核验单
  - 制度版本、岗位职责、权限边界、生效日期和合理例外的可追溯知识库
  - 仅连接获批档案与最小必要字段的来源登记、分类分级和用途绑定适配器
  - 合成或经批准脱敏样例生成、真实数据隔离和研发环境禁入控制器
  - 保留原件定位、档案时间、制度版本、规则命中和解析质量的证据卡
  - 将规则冲突、统计异常、模型推断和人工已核实事实分层的线索对象
  - 同时呈现备选解释、反证、信息缺口、置信度和弃判原因的复核界面
  - 默认面向流程、合同、审批或事项而非个人标签的最小化扫描设计
  - 有权人员双人复核、职责回避、异议、纠错、撤回和后续结果反馈台账
  - 角色与属性结合的最小权限、专网部署、密钥管理和全量访问审计日志
  - 共享申请、使用场景、处理过程、存储、销毁和受托操作的期限化记录器
  - 稀缺标签、历史处罚偏差、时间外样本、合理例外和群体误报的评估包
  - 模型、Prompt、规则和制度更新后的回归测试、版本签名及可回滚机制
  - 禁止自动处分、公开曝光或其他不利处置的人工最终决定与输出约束层
  - 按集成、安全、模型、误报复核、制度维护和人员培训分摊的有效线索成本表

