编号: "0035"
id: open-source-single-paper-academic-review-agent
标题: 开源单文献学术评议Agent
一句话: |
  对用户自有、开放许可或机构明确授权的单篇论文及必要补充材料，用开源Agent辅助解析研究问题、核心主张、
  论证链、方法适配、证据支持、统计与可复现性、引文状态、局限和伦理材料缺口，
  生成带页码或对象定位、证据强度和不确定性的评议草稿；
  不自动裁决科学真伪、原创性、学术不端、录用拒稿或正式伦理结论
档案类型: 预审
复活状态: 已复活
结论边界: |
  已复活仅指OpenReviewer、Co-Researcher和poldrack/ai-peer-review已经分别公开单篇论文解析、
  结构化批评、方法与引文检查、多模型评议或元评议等可直接复用的实现，
  共同证明“授权单篇论文输入—分项检查—证据化评议草稿—人工核对”的有限核心链具有现实基础；
  不表示这些项目已经合并为同一端到端产品，不表示本轮已独立安装复现全部能力，
  也不涵盖全学科等效专家评议、研究真实性与原创性确认、科学结论最终裁决、真实审稿采用或商业闭环
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 科研工具
子领域: 单篇论文证据化评议、写作反馈与人工审稿辅助
死法:
  - 类型: 条件已死
    证据: |
      OpenReviewer论文与代码页公开了面向机器学习和AI会议论文的开放评议系统：
      输入论文PDF与评议模板，提取正文及公式、表格等技术内容，生成结构化会议评议；
      项目同时提供公开代码、模型、Demo、PDF转Markdown和训练脚本，并明确其用途是补充而非替代人类同行评议。
      Co-Researcher公开了面向多种编程Agent宿主的学术研究插件，包含critical-analysis、peer-review、
      research-methodology、quantitative-analysis和ethics-review等技能，并提供稿件批评、方法评议与参考文献核验工作流。
      poldrack/ai-peer-review则公开了对同一论文调用多个模型生成独立评议、再生成元评议的实现，
      可输出Markdown、CSV、JSON及问题对照表
    推理: |
      一，若旧判断是“单篇论文学术评议只能完全依赖人工，没有开源系统能解析论文并生成结构化批评”，这一条件已经翻案。
          三个项目分别提供了直接实现，不再只是“通用大模型似乎能写评论”的内部推演；
      二，可复活的核心链是：在授权范围内输入一篇论文，解析可提取内容，按明确模板检查主张、方法、证据、引文和局限，
          把优点、缺点、待澄清问题与需补充材料组织成草稿，再由作者、审稿人或领域专家核对；
      三，三个项目的能力不能相互回填。OpenReviewer的结构化会议评议不等于Co-Researcher已经完成引文语义裁决，
          Co-Researcher的校验脚本也不等于poldrack的多模型路线已经验证科学结论；
      四，项目论文、公开代码和功能说明是一手技术证据，不等于本轮已独立安装并复现全部版本，
          更不证明任意学科、任意PDF和真实编辑流程中的可靠性、采用率与维护状态；
      五，因此本节点判为“预审＋已复活”，复活的是授权单篇论文的辅助评议与证据组织，
          不是自动替代领域专家或正式同行评议的强版本。
    案例: OpenReviewer、Co-Researcher与poldrack/ai-peer-review已经把单篇评议的不同环节做成公开实现，基础工具缺位不再是成立的死亡条件
    证据链接:
      - https://aclanthology.org/2025.naacl-demo.44/
      - https://github.com/maxidl/openreviewer
      - https://github.com/poemswe/co-researcher
      - https://github.com/poldrack/ai-peer-review
    置信度: 高

  - 类型: 理论证伪
    证据: |
      OpenReviewer将系统定位为投稿前反馈，并明确不用于替代人类同行评议。
      一项独立的LLM辅助同行评议研究认为，模型在语言、结构反馈和语言不一致方面有辅助价值，
      但对语言呈现的敏感可能妨碍对基础科学分析的判断，临床和统计等任务仍需要领域专家监督。
      Co-Researcher的validate_review.py可检查评议产物与claims.json、refs.json等来源记录的一致性，
      其项目说明同时承认这类校验不能确认来源本身正确，也不能完整判断语义
    推理: |
      一，强版本“给Agent一篇PDF，就能判断研究是否真实、原创且科学结论正确”混淆了四个层级：
          文本内部一致性、外部证据核验、研究真实性与原创性、正式同行评议决定，不是同一任务；
      二，单篇成稿通常不能提供完整原始数据、实验记录、代码运行环境、伦理申请、检索全貌和作者研究过程。
          即使解析无误、引文均存在，也只能增加部分可核查证据，不能据此证明实验实际执行、数据未伪造或优先权成立；
      三，引文存在、引文与原文相符、引文能支持当前论断、来源本身正确又是不同检查。
          来源一致性脚本能防止评议脱离记录，却不能把错误来源自动升级为可靠事实；
      四，因此被证伪的是“生成一份像审稿意见的文本，就等于完成科学真实性与质量裁决”的强版本，
          而不是结构化批评完全无用。合格输出必须区分已观察、已核验、推断和无法判断，
          允许请求补充材料、保留分歧和明确弃判，最终学术责任仍由人承担。
    案例: 引文记录一致、语言流畅和多模型意见完整都不能独立证明实验真实或科学结论正确，单篇PDF不是完整事实审计材料
    证据链接:
      - https://aclanthology.org/2025.naacl-demo.44/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11952698/
      - https://github.com/poemswe/co-researcher
    置信度: 高

  - 类型: 执行人限制
    证据: |
      OpenReviewer的训练和评估主要面向机器学习与AI场馆；作者公开了79,000条专家评议的训练规模和400篇测试论文评估，
      但这些是特定项目与领域中的作者报告，人类评分分布接近也不等于科学正确性或事实真实性判断准确。
      Co-Researcher依赖具体Agent宿主、工作区文件和参考核验流程，可选PDF处理依赖还包含需要单独核查许可的组件；
      poldrack/ai-peer-review默认场景偏神经科学，其scientific-validity-only配置虽聚焦方法、推断、统计和可复现性，
      仍要求对PDF未提取到的内容请求澄清，而不是直接断言研究未做
    推理: |
      一，具体限制是实施者同时面对学科判断、文档工程和评议责任：会调用模型不等于能判断方法适配、识别公式与表格解析错误，
          也不等于能区分“论文没有报告”“PDF没有提取到”和“研究实际没有做”；
      二，关键工作包括确定授权和评议模板、校准版面与对象锚点、选择学科规则、核对主张与证据、
          检查引文语境、请求原始数据和代码、记录模型及提示版本，并让有能力的人处理专业分歧；
      三，若缺少这些能力，项目后果不是评论稍显笼统，而是可能把解析缺失误判为研究缺陷、
          把陌生学科惯例误判为方法错误，或用流畅措辞掩盖证据缺口，增加作者与审稿人的纠错负担；
      四，缓解边界是先限定一个学科、一种稿件类型和少量可核验维度，复用现有解析与评议组件，
          分别验收解析、主张提取、证据定位、引文检查、事实错误和人工采纳，再逐步扩大范围。
          中预算只对应这一缩围原型，不包含全学科专家级自动审稿系统。
    案例: 现有项目分别暴露领域模板、PDF提取和补充材料依赖，说明直接实现存在不等于普通实施者可以无差别评议所有学科论文
    证据链接:
      - https://aclanthology.org/2025.naacl-demo.44/
      - https://github.com/poemswe/co-researcher
      - https://github.com/poldrack/ai-peer-review
    置信度: 中

  - 类型: 信任成本
    证据: |
      独立研究认为LLM可辅助语言与结构反馈，但不能替代基础科学分析和领域专家监督。
      一项有24名HCI审稿人参与的对照研究报告，ChatGPT可辅助摘要、检索、构思和信心，
      但没有显著降低总评审时间或提高评审质量，内容核验与人类监督仍然必要；该样本和领域不能外推为所有学科的确定结论。
      关于ICML 2026政策的随机实验与调查预印本则报告，政策分配对最终论文决定、评分和审稿人信心的影响接近零，
      自报收益与政策违规并存；自我报告和单一场馆的结果不能直接当作普遍质量提升证据
    推理: |
      一，学术评议的风险不只是“意见写错”，还包括措辞权威化、漏掉关键反证、对不同学科或非主流方法产生系统性偏差。
          多模型一致只能作为意见汇总信号，不能当作相互独立的事实验证，因为模型可能共享训练材料与偏差；
      二，可信输出不应只有一个总分或一份成稿。每条批评至少应回链页码、章节、公式、表格、图注或引文，
          标明证据来源、检查方法、证据强度、置信度、备选解释、无法判断项和人工处理状态；
      三，验收必须区分文本解析、事实与引文核验、方法判断、评论有用性和最终决定，分别测量误报、漏报、
          无依据断言、专家修改幅度、实际节省工时和错误撤回，不能用评论长度、语气或评分分布冒充质量；
      四，现有独立研究支持“可用作补充工具”，也直接否定了“只要生成评议就必然省时提质”的推论。
          信任需要按学科和任务积累可复核记录，而不是由AI自我评分或多模型投票自动获得。
    案例: 小样本对照研究与真实场馆政策研究均未给出普遍省时提质的保证，流畅评议必须经过来源回溯和人工实质核验
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11952698/
      - https://dl.acm.org/doi/10.1145/3729176.3729196
      - https://arxiv.org/html/2609.19420v1
    置信度: 高

  - 类型: 政策风险
    证据: |
      ICMJE关于审稿人使用AI的建议要求遵守期刊AI政策，或在使用AI前取得期刊许可；
      审稿人必须维护稿件保密性，在保密无法保证时，上传稿件到软件或AI技术可能被禁止，
      除非期刊明确允许；使用AI还应向期刊披露，且AI输出可能错误、不完整或有偏差。
      ICML 2026政策随机实验与调查预印本说明，具体场馆需要对辅助范围、政策执行和披露进行治理，
      不能把“技术上可以调用模型”视为当然合规。poldrack/ai-peer-review的多模型流程则提示部署时应逐模型核对数据去向，
      但其公开页面本身不证明每一种配置都必然把全文外发
    推理: |
      一，用户拥有一份稿件或获得作者许可，不等于正式审稿人可以绕过期刊、会议和机构的保密与AI使用规则。
          作者投稿前自查、公开论文教学分析和受保密约束的正式审稿，是三种不同场景，授权链不能混用；
      二，系统应默认本地优先，在调用云模型、搜索、OCR或外部API前说明发送的是全文、片段还是元数据，
          记录接收方、保留期限、许可、场馆规则和披露要求；未发表或受限稿件未经明确许可不得上传；
      三，不得把绕过付费墙、验证码、访问控制、反爬或平台风控写成能力，也不得向仓库、公开站或公共评论交换未经授权的论文全文、
          审稿材料、原始数据和私人信息。公开讨论默认只分享经人工确认且有权公开的最小必要内容；
      四，AI辅助及使用范围应按适用政策披露，评议者对最终内容负责。工具只能生成私密默认的草稿，
          不得自动公开指控、自动拒稿、自动提交正式评审或对作者实施其他不利处置。
          本条不裁决所有AI辅助审稿都违规，具体义务仍须按场馆、合同、机构和适用规则分别核对。
    案例: ICMJE把期刊许可、保密和披露列为审稿人使用AI的前置边界，说明开源与本地可运行并不会自动消除政策责任
    证据链接:
      - https://www.icmje.org/recommendations/browse/artificial-intelligence/ai-use-by-reviewers.html
      - https://arxiv.org/html/2609.19420v1
      - https://github.com/poldrack/ai-peer-review
    置信度: 高

  - 类型: 钱算不平
    证据: |
      poldrack/ai-peer-review对同一论文调用多个模型生成独立评议并再生成元评议，
      说明多模型路线会增加调用、汇总和结果核对环节；这些环节不是独立事实核验的免费替代品。
      Co-Researcher的批评、方法、定量、伦理和参考文献核验流程也需要工作区、来源记录和离线校验等配套工作。
      独立HCI对照研究未观察到ChatGPT辅助显著降低总评审时间或提高评审质量，
      另一项独立研究则继续强调领域专家监督，说明生成评论与减少合格评议全成本不是同一结果
    推理: |
      一，全成本不只包括模型调用，还包括授权与保密配置、PDF解析、外部检索、补充材料取得、专家复核、
          无依据评论清理、版本维护、数据删除、披露和纠错。多模型与多技能若只增加文字，反而可能提高阅读与核验成本；
      二，有效产出应按经人确认且可行动的问题、得到修正的论文缺陷、被澄清的方法信息或成功撤回的误报计算，
          不能按生成评论篇数、token数、模型数量或自动给出的分数计算；
      三，商业上可测试的是私有部署、特定学科模板、证据锚定、审计与协作支持，而不是承诺自动替代审稿人。
          免费开源项目会压缩单纯生成评论的收费空间，差异化只能来自可验证的质量与治理增量；
      四，目前缺少跨学科真实采用、专家工时、误报处置和持续维护的全成本数据，故本条不虚构确定亏损额。
          缩围原型应先比较“人工基线—单模型—多模型”在相同任务上的有效产出和总成本，再决定是否扩大部署。
    案例: 多模型与多技能能够增加评议材料，但独立研究没有证明普遍节时提质，未经核验的额外输出本身也会成为成本
    证据链接:
      - https://github.com/poldrack/ai-peer-review
      - https://github.com/poemswe/co-researcher
      - https://dl.acm.org/doi/10.1145/3729176.3729196
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11952698/
    置信度: 中

需求证据:
  类型: 开源直接实现、辅助同行评议研究与期刊AI治理需求；独立持续采用和付费需求待验证
  说明: |
    OpenReviewer、Co-Researcher和poldrack/ai-peer-review分别把单篇论文结构化评议、批评与引文核验、
    多模型独立评议和元评议做成公开实现，直接证明已有开发者尝试满足作者反馈、稿件检查和审稿辅助需求。
    独立LLM评议研究、HCI审稿人对照研究及ICML 2026政策研究说明，审稿辅助是否省时、提质以及如何治理，
    已经成为被实际研究的问题；ICMJE规则则证明期刊需要处理保密、许可、披露和责任边界。
    这些材料支持有限辅助工具和治理需求，不等于本节点产品已有独立用户规模或商业订单。
    本轮没有取得作者、审稿人、编辑或机构的访谈与持续试用，没有真实部署中的专家节时、评论采纳、
    误报撤回、采购、续费或收入数据。最关键的缺口是：谁拥有高频且合法授权的单篇评议任务，
    哪些分项检查能稳定减少而非增加人工工作，以及证据化草稿能否在限定学科中通过真实对照验收。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在使用者包括投稿前自查的作者与科研团队、开展内部预审的实验室、遵守场馆规则的审稿人与编辑，
            以及需要私有化学术写作和评议工具的科研机构；直接开源实现证明工作链可被搭建，
            但不等于这些主体会采用同一产品，也不等于普通论文作者存在高频付费需求。
            可测试的收入或持续支持路径包括本地或私有部署、限定学科模板、授权文献与检索源接入、
            证据锚定、专家验收测试集、审计协作和技术支持，而不是出售自动录用拒稿、学术不端认定或未经授权的稿件处理。
            免费开源组件会压低通用评论生成的收费空间，可能形成差异的是可追溯质量、私有材料治理、
            专业规则维护和实际减少的专家纠错时间，这些增量仍需真实项目验证。
            全成本应包括授权与合规、文档解析、模型和检索、补充材料、专家复核、错误纠正、
            存储删除、披露、安全、兼容维护与用户支持；当前没有订单、收入、利润或商业闭环证据。
  社会价值：单篇证据化评议可能在投稿前帮助作者发现论证跳跃、方法说明缺口、引文问题和可复现性材料缺口，
            也可帮助审稿人组织待澄清问题并保留无法判断项，减少部分重复阅读与材料查找。
            其价值应按经人确认的有效意见、论文修正、证据可追溯、实际节省劳动和纠错情况衡量，
            而非生成评论数量、评论长度或自动评分。主要负价值来自未发表稿件泄露、无依据批评、学科与语言偏差、
            多模型一致造成的虚假确定性、把辅助草稿用于自动不利处置，以及把学术责任转移给模型。
            因此社会价值成立的前提是保密、许可、披露、人工负责、异议纠错和按任务验收同时存在。

可拆零件:
  - 论文来源、权利人、取得方式、开放许可或机构授权、允许用途、保存期限、再分发范围和撤回状态的输入登记表
  - 区分作者自查、公开论文分析与正式保密审稿的场景路由器；未满足场馆政策、保密或许可要求时停止处理
  - 本地优先的数据路由器，在调用云模型、OCR、搜索或外部API前列明全文／片段／元数据的去向、接收方、保留期限和费用
  - 保留页码、章节、段落、公式、表格、图注、补充材料和参考文献锚点的PDF解析器，显式记录OCR、阅读顺序和提取失败
  - 将研究问题、核心主张、分主张、方法、证据和结论连接起来的主张—证据图，允许一个主张对应多个支持与反对来源
  - 按学科、稿件类型和评议目的配置的模板库，分别控制总结、优点、缺点、问题、证据强度和置信度字段，不用单一模板覆盖全学科
  - 检查概念定义、前提、推理步骤、替代解释和结论边界的论证链辅助器；只标出待核查跳跃，不自动宣布科学结论真伪
  - 方法适配、统计表达、实验设计与可复现性检查器，区分文本内部不一致、需原始数据／代码和需领域专家判断
  - 结合合法检索源、书目元数据、撤稿或编辑关注状态和正文引用片段的引文核验器，分别报告不存在、元数据不符、上下文异常与支持关系待审
  - 论文已报告的局限、伦理批准、知情同意、数据来源和利益冲突材料缺口提示器；文本缺字段不等于研究未做或正式伦理违规
  - 可选的多模型独立评议与元评议器，保存模型、提示、模板、时间和成本记录；一致性只作汇总信号，不作独立事实投票
  - 私密默认的证据卡与评议草稿，逐项记录定位、证据来源、检查方法、证据强度、置信度、备选解释、无法判断项和人工状态
  - 人工接受、编辑、驳回、保留分歧、请求补充材料和升级专家复核的工作台，正式提交与公开披露必须由有权人员明确操作
  - 纠错、撤回、删除、异议和披露记录，保存AI使用范围及责任确认，不自动公开指控、录用拒稿或实施其他不利处置
  - 按学科、文档质量和检查任务分桶的验收集，分别测量解析、事实与引文错误、无依据断言、专家修改、实际节时和有效产出全成本
  - 向0034导出最小必要分项结果与证据卡的可控适配器；批量队列、暂停恢复、去重和平台交换由下游另行实现，不默认交换论文全文

