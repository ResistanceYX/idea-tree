编号: "0032"
id: ai-generated-chat-sticker-plugin
标题: AI自助生成与使用表情包插件
一句话: |
  让人或宠物鲸这类AI Agent按语境搜索、生成并取得表情，再在权限允许的文章、对话或平台贴纸包中使用；
  已复活的是这些能力的若干有限组合，不把Agent实际接入、所有平台覆盖、角色一致性、内容权利、
  持续使用或付费闭环一并视为已证明
档案类型: 预审
复活状态: 已复活
结论边界: |
  已复活仅指memecub已公开Agent Skill、远程MCP、CLI、REST API及表情搜索、文章配图、自定义生成能力，
  以及Sogni与Banana分别打通聊天生成返回和照片生成贴纸包的部分组合；
  不表示0016宠物鲸已经安装或调用memecub，不涵盖memecub完整网站与数据处理后端开源、
  所有聊天平台、复杂参考图可靠生成、批量角色一致性、内容安全与权利保证、独立用户规模或持续商业运营；
  memecub作者自报首单只是有限付费信号，不等于利润、复购或完整商业闭环
重启预算: 低
创新类型: [渐进式, 技术应用]
领域: 内容生成
子领域: Agent表情生成与个性化表达工具
死法:
  - 类型: 条件已死
    证据: |
      liyupi／memecub公开仓库与开发者文档显示，其面向AI Agent提供Agent Skill、远程MCP、CLI和REST API；
      search_memes可按情绪、角色等搜索既有表情，match_article可阅读文章、选择位置并插入表情，
      generate_meme则可按配文、描述或既有梗图角色生成自定义表情。开发者文档同时给出生成接口与“没有合适图片时用AI绘制”的调用路径。
      Sogni AI公开了MIT许可的Telegram／Discord贴纸机器人，覆盖提示词生成、背景处理和聊天贴纸返回；
      komly／banana_sticker_bot也以MIT许可公开照片生成系列表情、去背景、放大和创建Telegram贴纸包的实现。
      三类直接实现分别覆盖“Agent搜索／生成／文章使用”“聊天提示词生成与返回”和“照片生成与贴纸包创建”
    推理: |
      一，若旧判断是“图片生成器只能由人导出图片，不能让AI Agent按语境自取、生成并实际使用表情”，这一条件已被memecub直接翻案；
          它证明的不只是生成一张图，还包括Agent工具接入、既有表情搜索和文章中的实际插入路径；
      二，generate_meme证明自定义生成能力存在，但不证明复杂参考图、多人、人脸或同一角色批量生成始终可靠，
          也不证明所有Agent均已安装、会在恰当时机调用或能把结果发布到任意聊天平台；
      三，Sogni与Banana分别证明聊天生成返回和贴纸包创建，不能把这两条链回填成memecub已经具备的能力；
          同理，memecub的文章配图与Agent接入也不能替代聊天平台格式适配、贴纸上传和实际发送证据；
      四，仓库、官方文档与接口说明属于一手技术证据，不等于独立复现、活跃维护或大规模真实使用。
          本轮没有安装并运行全部依赖，也没有让0016宠物鲸实际调用memecub、用真实账号上传贴纸或完成支付测试；
      五，因此本节点判为“预审＋已复活”，复活的是可公开观察到的有限技术、接入与产品链，
          不是声称所有能力已由同一产品贯通，也不是据此推断需求、收入或内容安全已经解决。
    案例: memecub让Agent能够搜索、生成并插入表情，两个开源机器人又分别打通聊天生成贴纸和照片生成贴纸包，直接消除“只能生成图片、不能由AI或聊天用户实际使用”的旧条件
    证据链接:
      - https://github.com/liyupi/memecub
      - https://memecub.com/developers
      - https://github.com/Sogni-AI/sogni-sticker-bot
      - https://github.com/komly/banana_sticker_bot
    置信度: 高

  - 类型: 执行人限制
    证据: |
      memecub虽然提供Skill、MCP、CLI和API等接入方式，但公开仓库主要开放接入侧内容；
      作者后续文章明确说明网站与数据处理代码继续保持私有，不能把接入代码当作完整网站、生成服务和数据后端均已开源。
      Sogni机器人的自托管流程仍需要平台Bot令牌、Sogni账号、可写状态目录及平台权限；
      Banana则需要Node.js 20、PostgreSQL、Telegram Bot令牌、OpenRouter与Replicate等外部服务配置，
      并包含数据库迁移、图像网格切分、贴纸上传和交易记录
    推理: |
      一，普通实施者可以调用memecub托管服务或复用开源机器人，但仍要完成账号与密钥配置、工具权限、额度、
          异步任务、失败重试、输出检查、内容管理和用户支持；能安装Skill或MCP不等于获得可维护的完整产品后端；
      二，当目标使用者是宠物鲸这类Agent时，关键工作还包括判断何时适合使用表情、搜索与生成如何选择、
          文字与语境是否匹配、图片插入哪里以及失败后如何降级。角色人设不能代替这些决策与验收规则；
      三，若输出会进入公共评论、文章或群聊，还需保留人工确认、频率限制、接收者边界和停止机制。
          当前没有0016已经接入memecub的证据，不能把“技术上可接入”写成“宠物鲸已经自主使用”；
      四，每增加一个聊天平台，消息权限、文件限制、贴纸格式、交互方式、审核和支付规则都可能不同。
          不能把Telegram／Discord实现直接写成微信、QQ或B站已经覆盖，也不能把绕过平台限制当作复活能力；
      五，缓解边界是先做单Agent或单聊天平台、单生成服务、草稿预览、公共发布前人工确认和有限配额。
          这适合低预算原型；独立重建memecub私有后端、跨平台生产运营和全天候审核不再属于同一实施难度。
    案例: 接入侧工具降低了Agent起步成本，但完整后端、使用时机、公共发布和平台运营仍需实施者持续负责
    证据链接:
      - https://github.com/liyupi/memecub
      - https://memecub.com/developers
      - https://ai.codefather.cn/post/2121056875893026818
      - https://github.com/Sogni-AI/sogni-sticker-bot
      - https://github.com/komly/banana_sticker_bot
    置信度: 中

  - 类型: 信任成本
    证据: |
      Adobe生成式AI用户指南禁止利用其功能创建、上传或分享侵犯第三方版权、商标、隐私或肖像等权利的内容，
      明确涵盖侵权提示词和含第三方版权内容的参考图。Firefly贴纸页将“商业安全”表述限定于Adobe自有Firefly模型，
      对合作模型则要求用户自行判断其是否适合项目；这说明生成服务的选择会改变权利与使用边界，
      不能把某一家模型的承诺外推给所有后端
    推理: |
      一，用户或Agent使用自拍、朋友照片、动漫角色、品牌标志、既有梗图或网络图片时，并不自动拥有生成和公开传播表情所需的全部权利。
          插件若默认鼓励“把任何人变成表情包”或让Agent自行抓取素材，可能把娱乐功能变成肖像、隐私、骚扰或侵权风险；
      二，可信流程应在上传或引用前说明权利与授权要求，对可识别真人、他人作品和品牌素材提供醒目提醒，
          并保留来源记录、删除、举报、人工复核和停止传播入口。模型输出“看起来原创”不等于没有权利争议；
      三，当使用者是Agent，主人一句“自由发挥”不能视为所有输入素材和公共传播的充分授权。
          需要限制可访问素材、记录实际调用和发布位置，并让公共输出可预览、可撤回、可追责；
      四，不同生成模型的训练、商业使用和内容政策不同。产品需要按实际后端保存适用条款、生成记录和限制，
          不能用“AI生成”“Agent自主决定”或“用户自己输入的Prompt”把全部责任推给模型、Agent或用户；
      五，本条不声称所有同人表情、梗图或真人照片都必然侵权，也不对具体案例作法律裁决。
          它确认的是授权、平台规则、内容安全和投诉处理是持续信任成本，而非上线后才补充的文案。
    案例: 官方指南明确覆盖提示词、参考图、第三方权利和模型差异；Agent自主调用只增加来源与发布控制要求，不会使权利风险自动消失
    证据链接:
      - https://www.adobe.com/legal/licenses-terms/adobe-gen-ai-user-guidelines.html
      - https://www.adobe.com/products/firefly/features/sticker-generator.html
    置信度: 中

  - 类型: 巨头碾压
    证据: |
      Adobe Firefly已提供文本或参考图生成贴纸、背景移除、局部编辑、尺寸调整、PNG下载和贴纸集合等通用能力，
      免费账户含每日生成额度，付费计划提供更高用量。Sogni除开源自托管机器人外，还直接提供可邀请进群组或服务器的官方Telegram／Discord机器人。
      memecub则已把搜索、文章配图和自定义生成包装成Agent可安装的Skill、MCP、CLI与API，
      说明“再做一个通用生成器或只增加Agent接入”也会面对现有垂直工具的直接替代
    推理: |
      一，当大型创作工具已经提供生成、去背景、编辑与导出，模型供应方又提供现成聊天机器人时，
          一个仅把同一生成API接入聊天窗口的插件缺少明显技术护城河，并会受到免费额度和官方入口压价；
      二，memecub不是巨头，本条不把它伪装成平台垄断证据；它证明的是Agent原生表情能力的基础线已经被现有实现抬高，
          新项目若只复制Skill、MCP或generate_meme接口，同样缺少独立增量；
      三，平台、模型或创作工具若继续原生整合贴纸生成，独立插件可能失去入口和议价能力。
          本条是现实替代压力，不是声称Telegram、Discord或其他平台已经在所有原生界面中内置同等AI功能；
      四，Adobe网页生成和下载不直接替代Agent按语境选图，Sogni官方机器人也不替代私有化、自定义提示词或特定社区模板，
          memecub的文章配图又不等于所有聊天平台贴纸包闭环。独立项目仍可从这些差异保留价值；
      五，因此可防守部分不是“我也能生成一张贴纸”或“我也提供MCP”，而是特定角色与语境的可靠表达、
          单平台顺滑闭环、用户自有角色与贴纸包管理、私有部署、透明权利配置和社区特定质量。上述差异仍需真实使用验证。
    案例: 通用创作套件、模型方官方机器人与现有Agent工具共同压低简单套壳价值，但各自都没有单独覆盖全部语境与平台
    证据链接:
      - https://www.adobe.com/products/firefly/features/sticker-generator.html
      - https://github.com/Sogni-AI/sogni-sticker-bot
      - https://github.com/liyupi/memecub
    置信度: 中

  - 类型: 钱算不平
    证据: |
      memecub价格页列出免费账户每月1000额度，搜索一次消耗1额度，文章每实际插入一张图消耗20额度，
      AI生成一张表情消耗500额度，并说明生成失败不收费或返还；这些价格证明搜索、实际配图和生成已被拆成不同计费环节。
      作者2026年11月12日文章称产品上线约一个月、单周总浏览量接近5万，并报告首单：一位国内用户用支付宝开通Hobby套餐，
      随后购买20美元额度包。访问量、套餐和订单均为作者自报，本轮没有独立支付、财务或审计材料。
      Banana仓库展示了按次消耗代币、Telegram Stars购买代币、余额和交易记录的代码结构，但不提供真实成交或毛利数据；
      Adobe免费账户的每日贴纸生成额度则构成免费替代
    推理: |
      一，全成本应包括生成模型、参考图处理、去背景与放大、失败和重复生成、存储与传输、Agent或Bot托管、数据库、
          内容审核、投诉处理、支付对账、退款和用户支持。不能把一次搜索或模型调用的标价当成每个被实际使用表情的成本；
      二，有效产出应分别按Agent或用户接受、实际插入文章、实际发送或加入贴纸包的结果计算，而不是原始生成图片数。
          memecub对实际插图与AI生成设置不同额度，恰好说明“找到图”“生成图”和“使用图”不是同一成本与价值层；
      三，memecub作者自报首单使旧稿“完全没有真实付费信号”的表述不再成立，应修正为“出现作者报告的有限付费信号”。
          但一次首单及其后续额度包仍不证明利润、复购、持续收入、通用获客效率或完整商业闭环，访问量也不等于付费用户；
      四，免费创作工具、官方机器人和托管Agent工具压低通用生成收费空间。可测试的收入包括额度包、订阅、单套贴纸、
          社区定制、角色模板、私有部署或维护支持，但每种路径都要证明用户或Agent所有者愿意为可靠语境表达和实际使用付费；
      五，支付代码、价格页、余额记录、Stars入口和作者自报订单证明的是不同层级的商业机制与早期信号，
          不能相互拼接成已经盈利的结论，也不能把memecub的订单归给其他实现或本节点泛指的新项目。
    案例: memecub作者自报首单提供了有限付费信号，但定价、访问量和支付入口仍不能替代有效产出、全成本、复购与利润验证
    证据链接:
      - https://memecub.com/pricing
      - https://ai.codefather.cn/post/2121056875893026818
      - https://github.com/komly/banana_sticker_bot
      - https://www.adobe.com/products/firefly/features/sticker-generator.html
    置信度: 中

需求证据:
  类型: 多个直接实现、Agent接入能力与作者自报早期付费信号；独立持续使用和商业需求仍未验证
  说明: |
    memecub直接面向AI Agent提供表情搜索、文章配图、自定义生成及Skill、MCP、CLI、API接入，
    使“宠物鲸这类AI为自己找到、生成并使用表情”不再只是人类聊天贴纸工具的外推。
    Sogni与Banana则分别实现提示词生成聊天贴纸、照片生成系列贴纸包和平台内代币购买机制，
    证明人类聊天用户的另一条直接产品链也已存在。Adobe Firefly证明通用生成与设计环节已有供给，但不证明聊天或Agent闭环。
    memecub作者较新文章自报了上线约一个月的访问表现和首单，支持出现早期关注与有限付费信号；
    这些数字和订单没有独立审计，也不能外推为其他实现或整个类别的需求规模。
    上述实现、文档、价格和经营材料仍以开发者或厂商一手自述为主。本轮没有取得独立安装复现、活跃Agent数、
    表情实际插入／发送率、留存、复购或社区访谈数据，也没有验证0016宠物鲸用户是否提出、安装或持续使用这项能力。
    因而不能把“已有多个实现和作者自报首单”改写为“已有大规模需求”，更不能因缺少独立数字就反判伪需求。
    最关键的缺口是：Agent能否在合适语境主动调用、输出是否被人接受并实际使用、新鲜感消失后是否仍会持续，
    以及角色化表达、聊天便利或社区定制能否形成相对免费工具的持续增量。
  附件: 无

商业及社会价值评估: |
  商业价值：直接使用者包括希望快速表达情绪和管理个人贴纸的聊天用户、社区管理员、主播与品牌运营者，
            也包括宠物鲸这类需要按语境搜索、生成和使用表情的角色化AI Agent；Agent是工具使用者，
            支付与责任仍由其所有者、部署者或组织承担，不能把Agent调用写成AI已经自主购买。
            memecub作者自报的Hobby套餐和20美元额度包提供了有限真实付费信号，但不等于独立核验收入，
            更不证明利润、复购或持续运营；该订单只能归于memecub，不能归给Sogni、Banana或本节点泛指的新项目。
            可测试的收入路径包括搜索／配图／生成额度包、订阅、按套生成、社区或角色模板、品牌贴纸包、私有部署与维护支持。
            免费创作工具、官方机器人和现有Agent工具压低通用生成价格，独立产品的增量应落在可靠语境判断、
            实际使用闭环、用户自有角色与贴纸包管理、隐私部署和社区管理。
            全成本须包括搜索、生成、图像处理、失败重试、存储传输、托管数据库、内容审核、投诉、支付退款、获客和支持；
            有效产出按被接受并实际插入、发送或加入贴纸包的结果计算，并按接受率、复用、留存和真实付费核算，
            不以原始生成量、Agent调用量、访问量或支付功能存在代替。当前商业闭环仍未验证。
  社会价值：低门槛的个性化表情可帮助人和角色化Agent以图像表达情绪、语言和文化语境，也能支持小型社区形成共享符号；
            Agent可接入的搜索、生成和文章配图能力，为角色从纯文本回应扩展到多模态表达提供了可复用零件。
            对不擅长绘图的人，这类工具可能降低创作门槛，但不应贬低或替代人类创作者的授权与劳动。
            风险包括未经许可使用真人肖像或他人作品、同质化复制创作者风格、骚扰和色情内容、误导性图片、
            未成年人使用及上传照片的隐私泄露；Agent自主调用还可能在不合适的公共语境插入图片，增加噪音和接收者负担。
            社会价值应按实际表达与社区使用、接收者评价、投诉、删除、授权和内容事故评估，不能只用生成量或调用量证明；
            自动审核可作为辅助，不能成为封禁用户或裁决权利争议的无人复核最终依据。

可拆零件:
  - 面向人或Agent统一的提示词、配文、描述与参考图入口，记录输入来源、权利和必要授权，不默认收集无关聊天或通讯录
  - 可替换图像生成后端与条款配置表，分别记录模型版本、商业使用限制、内容政策、额度和失败状态
  - 面向真人、他人作品、品牌、色情、骚扰和未成年人场景的输入提醒、限制与人工升级规则
  - Agent Skill、远程MCP、CLI与REST API适配层，分别暴露搜索、文章配图和自定义生成，不把可接入写成已接入特定Agent
  - 让Agent按语境决定何时使用表情、搜索还是生成、插入位置和何时保持纯文本的策略，并记录调用理由与置信度
  - 公共评论、文章或群聊发布前的草稿预览、人工确认、频率限制、接收者拒绝和停止机制
  - 提示词白名单／黑名单、输出安全检查和举报申诉队列；自动标签只作辅助，不直接作高影响最终裁决
  - 角色、表情、文字和风格模板，以及同一贴纸包内一致性与文字可读性检查
  - 保留Alpha通道的背景移除、边缘清理、放大和预览模块，不把简单去白底当作所有复杂图片的可靠分割
  - 按目标平台实际规则配置的图片尺寸、格式、大小与静态／动态贴纸适配器，规则失效时停止发布而非伪装成功
  - Telegram／Discord消息命令、权限、异步任务和聊天返回适配器；未核实的平台不声称已经支持
  - 文章阅读、候选位置选择、实际插图和失败后保持原文的配图工作流，不把返回图片链接算作已经插入
  - 用户预览、选择、重做、删除和明确确认后创建或更新自己贴纸包的工作流
  - 搜索、实际插图、AI生成分开计量的配额、失败返还、余额、支付和退款对账模块，支付记录与实际使用结果分开审计
  - 上传图片、生成结果、Agent工具调用和日志的最小留存、访问控制、删除与凭据保护；不把Bot令牌或API密钥写入公开仓库
  - 以接受率、实际插图、实际发送、入包、重做、留存和复购为核心的使用面板，区分技术生成、Agent调用、实际使用和商业结果
  - 覆盖复杂背景、多人、人脸、文字、梗图角色、失败生成、不合适语境、内容审核和平台拒绝的真实验收集
  - 记录搜索、生成、处理、审核、托管、支付、退款和支持的全成本账本，并与免费工具、官方机器人及现有Agent工具对照验证需求

