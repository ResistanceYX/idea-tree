备注: |
  本节点为AI起草、人类审核的预审档案，不是AIDocStringGenerator或RepoAgent已经失败的验尸记录，二者仅作直接零件证据。
  本批五个明确层级依次使用0044—0048候选编号，0049未分配；正式入库前须再次核对云端，不因本地文件存在而视为占号。
  “单一语言”指每个部署明确选择并只处理一种语言，例如Python；不是同一实例同时支持多语言后再自动识别，也不把Shell／YAML混为通用编程语言能力。
  中档预算对应一种语言、少量真实仓库、成熟解析器、只读差异、人工接受和修改任务验收集；不包含多语言扩展或长期无人值守服务。
  AIDocStringGenerator的默认擦除、档位和已知行长问题只代表该项目；RepoAgent的Python限制、文档生成和更新只代表其公开实现。
  Java注释研究与CCISolver不能外推为Python效果；LongCodeU是Python长代码理解基准而非修改效果试验，本稿没有据此宣称AI修改已受益。
  私有代码默认最小范围与本地优先，使用外部模型时须说明数据去向，不上传凭据、无关文件或专有仓库内容。
  死因保质期设为一年：语言专属AST、文档约定与注释漂移问题相对稳定，但RepoAgent类仓库级工具、模型质量和专用／通用竞争仍会变化；
  该日期不是沿用同批模板，复核重点是单语言深度是否产生可测优势、详细档位接受与后续编辑、第二次运行冲突、动态依赖漏报和真实修改收益。
