<!-- BEGIN FILE: .github/workflows/pages.yml -->
```yaml
name: 生成并部署公开静态索引站

on:
  push:
    branches: [main]
    paths:
      - "nodes/**"
      - "README.md"
      - "scripts/generate_site.py"
      - "scripts/node_files.py"
      - "site/**"
      - "tests/test_generate_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "nodes/**"
      - "README.md"
      - "scripts/generate_site.py"
      - "scripts/node_files.py"
      - "site/**"
      - "tests/test_generate_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 校验并生成静态站
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装生成依赖
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: 运行自动化测试
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 校验正式节点
        run: python scripts/validate.py --root .

      - name: 生成公开静态站
        run: python scripts/generate_site.py --root . --output _site

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署到 GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署站点
        id: deployment
        uses: actions/deploy-pages@v4
```
<!-- END FILE: .github/workflows/pages.yml -->
