    关系: 直接母题
    说明: |
      本节点继承0047的不可选块、固定注释程度、单一语言／配置语义、注释＋独立说明文档和长代码修改辅助目标，
      进一步把处理对象收窄到一个明确CI平台的完整工作流。新增的平台语义、权限和安全边界使其成为专门变体，
      但不继承0047对某一种通用编程语言的任何具体实现承诺

