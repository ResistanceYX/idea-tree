备注: |
  本节点为AI起草、人类审核的预审档案，不是现有汇总产品或作者已经失败、停止或转向的验尸记录。
  原始目标是减少逐个点击阅读各插件产出的劳动。本稿因此把Agent放在下游内容审阅层，不把它写成替代开源GitHub有趣仓库发现Agent插件、
  开源arXiv有趣论文发现及总结Agent插件和开源哔哩哔哩自主宠物鲸Agent插件进行平台浏览的采集器。
  已复活仅指读取已知格式产出、跨来源聚合与去重、AI兴趣筛选、分维审核、可解释排序和统一私人投递等核心技术链已有公开实现与可组装基础；
  不表示无损读取所有DSH插件、跨平台审核准确率、优先级长期符合用户目标、商业闭环或社会净收益已经证明。
  TrendRadar证明多平台聚合、筛选、分析和投递链，不等于它已经无损读取全部DSH插件产出，也不等于其AI评分就是真实性审核；
  首批复活范围只纳入具有明确适配器的已知格式，新增插件必须增加Schema与验收样本。
  重启预算“低”针对个人利用现有DSH、开源聚合组件和本地已知文件进行低频只读汇总；
  多用户托管、全量原文复核、无限插件适配、长期规则维护或公共自动行动不属于这一预算口径。
  排序不得压成不可解释的唯一分数，兴趣匹配、来源质量、时效、证据完整性、紧急度、行动成本和用户反馈应分维保存；
  模型输出只作为辅助判断，不作为内容真实性、高影响行动或公共发布的最终裁决。
  来源按证明力分层使用：TrendRadar官方仓库证明公开聚合、AI筛选、去重、分析和安全降级功能；
  DSH官方文档证明读取工作区与通用安全边界；各插件仓库证明产出形态、依赖和作者自报限制，不替代独立安装或审核效果基准。
  本稿没有独立安装并复现上述项目的所有版本，也没有把README截图、样例或功能声明写成第三方基准；实际部署前须重新核对版本、许可、依赖和默认配置。
  本项目未复制第三方网页全文、完整快照、私有报告、Cookie、storage state、token或浏览器profile；
  汇总所需的本地文件访问仅限用户授权的固定路径，日志和公开仓库不得保存敏感凭证或未经授权全文。
  与开源GitHub有趣仓库发现Agent插件、开源arXiv有趣论文发现及总结Agent插件和开源哔哩哔哩自主宠物鲸Agent插件均为下游产出审阅，
  与通用宠物鲸仅为可选产出审阅调用；不因个性化DSH平台自动浏览、内容发现及总结插件生成Agent能生成新插件就自动把个性化DSH平台自动浏览、
  内容发现及总结插件生成Agent列为本节点关系，
  也不因开源arXiv有趣论文发现及总结Agent插件与开源理论研究路径生成及记录辅助理解Agent插件相关而把论文理论溯源自动纳入本节点。
  由于DSH、上游插件Schema、聚合工具、模型与用户需求均变化较快，死因保质期设为一年。
  复核时优先检查：适配器是否完整保留来源和失败、去重是否可逆、摘要是否回原文、排序是否分维且可纠错、
  总阅读耗时与误漏是否优于逐份阅读、每有效事项全成本，以及模型分数是否仍被误当成真实性或用户利益的最终裁决。
