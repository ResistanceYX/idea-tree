备注: |
  本节点为AI起草、人类审核的预审档案，不是某个法律科技项目实施后失败、停止或转向的验尸记录；当前没有具体验尸对象，不能编造。
  清单原题为“开源判决文书网低级错误判决检测和反馈Agent”。正文将网站名称规范为“裁判文书”，把“低级错误判决”收窄为“裁判文书形式异常”，
  因为原措辞容易把错字、误算等形式问题与实质错判混为一谈；标题和输出边界因此调整，不保留自动认定错判的语义。
  复活候选仅指法院内部智能纠错、人工审核、开源中文组件和既有反馈入口使有限原型具备条件；
  不表示外部开源完整Agent已实现，不表示法院采用、反馈采纳、裁判结果改善或商业闭环已经证明。
  重启预算“中”对应用户合法提供文书、限定文书类型和形式异常、人工法律复核、只做反馈草稿的小规模原型与专项验收；
  全站持续采集、全类型覆盖、自动提交、法院系统集成和大规模公共平台不属于同一预算口径，也未证明合规或可行。
  来源分层使用：最高法与法院材料证明制度、既有场景和特定系统自报，不作独立准确率审计；
  pycorrector只证明开源中文纠错组件及其公开评测，JuDGE只证明相邻法律文书生成评测与标注要求，二者都不证明本产品效果；
  裁判文书网协议与帮助用于界定正式文本、反馈、访问、镜像和撤回边界，人民网报道只作访问约束背景。
  产品不得绕过验证码、反爬、访问控制或平台风控，不得保存或复用他人Cookie、token、浏览器配置和登录态，
  不得把公开文书无限制镜像、用于个人画像或作为自动不利处置依据。
  与0005、0010虽都涉及法律文本和AI，但本节点没有由二者直接派生的证据，任务也从漏洞／立法反馈转为裁判文书形式质量检查；
  本节点仅与0005建立“法律文本异常检查与人工复核工作流参照”双向关系，参照法条冲突线索初筛、人工法律复核与报告生成边界；
  与0010的相似点主要在官方反馈草稿与人工确认层面，本版不据此新增关系，也不把上述工作流参照写成同源、直接派生或实质错判认定能力。
  候选文件名与编号为0029-open-source-judgment-formal-error-feedback-agent；0029按本次起草时云端已有27个正式节点、且本地另有0028候选稿提出，仅用于本地校验，不视为预约或占用，
  正式上传前必须由主编按当时云端最大编号和实际入库顺序复核。若编号变化，文件名与顶层“编号”须同步修改，id和公开详情页主键不变。
  死因保质期设为一年，复核时应更新裁判文书公开与使用规则、合法数据来源、法院纠错实践、开源组件、专项验收、反馈处理和真实需求证据。
