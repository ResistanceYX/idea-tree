编号: "0016"
id: bilibili-autonomous-pet-whale-agent-plugin
标题: 开源哔哩哔哩自主宠物鲸Agent插件
一句话: |
  在DSH中以插件组合关键词搜索、字幕读取、可选抽帧或本地转写、模型筛选、Markdown日报与定时任务，
  再按用户配置通过自有B站账号私信或评论@用户，并以鲸鱼娘人设、记忆和楼中楼回复形成自主宠物鲸；
  私人信息筛选与公共评论区自主发言是两条价值和风险不同的路线
档案类型: 预审
复活状态: 已复活
重启预算: 低
创新类型: [渐进式, 技术应用]
领域: 人工智能
子领域: 内容平台自主Agent与角色化个人信息筛选
死法:
  - 类型: 条件已死
    证据: |
      DeepSeek官方DSH仓库确认其采用Cordis插件架构、以MIT许可开源，但仍处于开发者预览阶段；
      dsh-bili-scroll公开仓库已经实现搜索视频、读取字幕、无字幕时抽帧或可选本地Whisper转写、模型筛选、Markdown日报、定时运行、私信、评论@与楼中楼回复；
      媒体报道记录了社区在通用刷站插件上叠加鲸鱼娘头像、人格提示词、记忆和定时任务后形成真实的大肥鱼活动与扩散
    推理: |
      一，若旧判断是“缺少能持续读取B站内容、筛选并主动投递结果的Agent运行链”，这一技术条件已经翻案。
          现有实现把搜索、内容读取、模型判断、报告生成和账号互动串成了可安装插件，不再只是概念演示；
      二，复活的核心是“单用户、自有账号、自主刷站与私人筛选日报”，鲸鱼娘只是可替换的角色层。
          即使不使用大肥鱼形象，关键词订阅、全文筛选和私人日报仍然成立；角色化则增加了陪伴、二创和传播价值；
      三，技术可运行不等于B站提供官方Agent接口或承诺第三方自动化长期可用，也不等于公共评论区愿意接受机器发言。
          插件依赖扫码登录、真实账号和第三方接口封装，部署连续性仍受宿主版本、平台接口和账号状态影响；
      四，公开仓库与真实社区使用足以证明有限复活，不证明所有版本都能无故障安装，不证明筛选准确率、长期留存、商业收入或社会净收益已经成立。
    案例: DSH官方运行环境、dsh-bili-scroll开源实现与大肥鱼真实社区扩散共同支持核心技术链复活
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness
      - https://github.com/c1overzz/dsh-bili-scroll
      - https://www.thepaper.cn/newsDetail_forward_34440373?commTag=true
    置信度: 高

  - 类型: 伪需求
    证据: |
      dsh-bili-scroll当前默认只私信投递，自动评论与回复评论均默认关闭，说明作者已经把私人日报与公共发言拆成不同选择；
      大肥鱼消除计划提供了在本机浏览器识别并隐藏疑似AI评论的实际工具，证明“少看自动评论”也形成了反向需求；
      媒体报道同时记录了用户养鱼、追踪新闻和写日记的主动玩法，以及创作者难以从AI评论中寻找真人反馈、收到错误问题反馈的反面案例
    推理: |
      一，真实存活的是两类需求：用户希望减少刷站和信息筛选劳动，部分用户也希望拥有一个可养成、可扮演角色的Agent。
          但后者不能自动推出“其他视频创作者和观众需要接收这些Agent的公开评论”；
      二，对宠物主人有用的自动汇报，可能对评论区其他参与者只是重复、同质化或与视频无关的噪音。
          评论数、@次数和账号增长衡量的是Agent活动量，不是读者需求；播放量与短期玩梗热度也不能替代留存和持续使用；
      三，插件默认私信、关闭自动评论以及清理插件的出现，共同支持“私人工具价值不能直接外推为公共互动价值”。
          若产品增长依赖大量账号在他人评论区展示人格，而不依赖用户持续使用日报，需求结构就已从效率工具转成公共空间占用；
      四，本条不判定整个点子没人要。较可信的缩围是先验证用户是否持续阅读日报、采纳其中条目并愿意维护关键词；
          角色与公开互动只能作为独立假设分别验证，不能用大肥鱼的热度替代这两项验证。
    案例: 私人刷站日报与角色养成出现真实使用，但公共AI评论同时催生了隐藏和清理需求
    证据链接:
      - https://github.com/c1overzz/dsh-bili-scroll
      - https://github.com/liyupi/dafeiyu-cleaner
      - https://www.thepaper.cn/newsDetail_forward_34440373?commTag=true
    置信度: 中

  - 类型: 钱算不平
    证据: |
      dsh-bili-scroll公开说明中，基础安装与启用本地转写的存储占用明显不同，Whisper模型还需额外下载；
      插件支持按模型优惠时段运行，也记录了headless定时会话、桌面端自动运行和依赖安装等故障排查事项；
      DSH官方则明确其仍在快速迭代并会发生兼容性破坏变化。公开资料没有给出普通用户完整一轮任务的模型token、失败重试、电力、维护和人工复核账目
    推理: |
      一，全成本不能只算一次模型回答。私人自用路线应按“搜索与字幕读取＋模型推理＋可选抽帧／本地转写设备及电力＋存储＋
          失败任务与重试＋依赖和凭证维护＋用户复核时间”计算；公共互动路线还要加入内容审校、投诉处理、账号处置和平台合规成本；
      二，有效成本的分母不能是扫描视频数或发出评论数，而应分别是“用户实际阅读并确认有用的日报条目数”与“经人工确认、
          对接收者有增量价值且未造成投诉的互动数”。无字幕跳过、误筛、重复推荐、无人阅读和错误评论都可能消耗成本而没有同等产出；
      三，本地Whisper减少按次转写费用，却把成本转移为用户设备、存储、电力和维护；云端模型减少本地部署工作，却形成随扫描量、
          上下文长度和重试次数变化的持续支出。峰谷运行只能改变部分模型价格，不能消除整条链路的成本；
      四，个人低频率自用可以通过减少关键词、限制每日扫描量、优先字幕、跳过低价值视频和关闭公共互动来控制成本。
          但若靠增加账号、评论和全天扫描维持曝光，成本随活动量上升，而公共价值可能下降，收入又没有已验证来源，账最容易算不平；
      五，当前没有真实付费、续费或完整成本数据，因此本条只确认成本结构与失控条件，不虚构单次价格，也不断言现有插件必然亏损。
    案例: 真实插件已经控制运行时段和权限，但有效日报与有效互动的全成本仍须按实际任务核算
    证据链接:
      - https://github.com/c1overzz/dsh-bili-scroll
      - https://github.com/deepseek-ai/deepseek-harness
    置信度: 中

  - 类型: 政策风险
    证据: |
      2026年8月7日生效的哔哩哔哩社区规范覆盖评论、私信等互动行为，要求社区功能仅用于正常交流互动，并明确禁止骚扰、批量灌水和扰乱社区秩序；
      《人工智能生成合成内容标识办法》自2025年9月1日起施行，将AI生成文本纳入生成合成内容，
      并要求用户使用网络信息内容传播服务发布此类内容时主动声明、使用平台提供的标识功能；
      鲸鱼娘社区项目则把代码、文档、图片与第三方素材分层授权，明确MIT代码许可不等于角色美术素材和商业品牌权利已经获得许可
    推理: |
      一，公共评论路线首先受平台社区规则约束。单账号设置每轮上限和同一视频去重有助于减少刷屏，但不能保证多个Agent聚集后仍属正常交流；
          是否违规应看实际内容、频率、语境和对社区秩序的影响，不能用“机器人只发一条”作为普遍免责理由；
      二，Agent自动生成并发布评论时，账号使用者需要按真实发布场景履行AI内容声明与标识义务。
          鲸鱼娘头像、昵称自称AI或在Prompt中写身份约束，不当然等于已经使用平台提供的标识功能；评论场景实际可用的声明入口仍须以平台当前功能为准；
      三，纯私人离线日报、仅向自己私信和向公共视频评论区投稿不是同一种传播事实。
          不应把面向公众服务提供者的全部义务无差别套到个人离线整理，也不能因工具本地运行就免除公开发布时的平台规则和标识要求；
      四，代码开源、角色二创和品牌使用是三条不同授权链。复用插件代码可以遵循MIT，但若产品同时分发鲸鱼娘立绘、角色设定、DeepSeek标识或收费周边，
          仍需逐项核对原作者、改编者和品牌权利人的许可，不能把“社区都在用”当成商业授权；
      五，可缓解路线是默认私人投递、公共发布前人工确认、明确AI身份、遵守平台频率与内容规则，并把角色素材替换为权利清楚的原创资产。
          本条不是认定现有插件违法，而是确认公共自主发言和商业化不能只做技术开关。
    案例: 平台正常交流规则、AI生成文本标识义务与角色素材分层授权共同构成公共互动和商业复用边界
    证据链接:
      - https://member.bilibili.com/studio/convention/?lang=zh-Hans
      - https://www.gov.cn/zhengce/zhengceku/202503/content_7014286.htm
      - https://github.com/Neko3000/deepseek-whalechan/blob/main/README.zh.md
    置信度: 高

  - 类型: 信任成本
    证据: |
      DSH官方安全说明明确其属于实验性开发者预览软件、尚未接受安全审计，
      模型生成命令、第三方插件以及开放的网络、进程、凭据和文件访问都可能造成非预期影响，沙箱和审批不能保证隔离；
      dsh-bili-scroll记录了早期值班Agent可读取本机会话记录的问题，后续改用专用profile、六个只读B站工具、固定路径窄口工具，并在开启互动后才增加发评论能力；
      大肥鱼消除计划和媒体报道则分别提供了用户主动隐藏疑似AI评论、创作者寻找真人反馈困难以及Agent集中指出错误bug的实际反应
    推理: |
      一，主人侧要同时信任插件不会滥用B站长期凭证、不会把本机隐私带入外部内容、不会受视频标题或评论中的恶意输入诱导，
          还要相信筛选和总结足以减少而不是转移阅读劳动。扫码凭证只存本机是有利设计，但不能代替文件权限、撤销、更新和泄露后的处置；
      二，社区侧的信任更脆弱：拟人化头像和流畅角色语言会让评论看起来像有真实理解与在场经验，模型却可能误读字幕、补出不存在的细节或集中复现同一错误。
          对创作者而言，筛选这些反馈本身又成为工作，错误反馈还可能诱发无效调试；
      三，默认只读、专用profile、无文件系统／命令／一般联网、固定路径、互动默认关闭和私人投递优先，都是实质性的降险措施；
          但DSH官方明确沙箱不是唯一安全边界，插件也保留专用profile无法铺开时退回普通headless的路径，因此必须显示实际权限和降级状态，不能只看设置页开关；
      四，AI身份标识可以处理来源透明，不能证明内容正确；内容人工复核可以提高质量，又会增加主人的持续劳动。
          信任建立需要可查看依据、可撤回权限、可停止任务、发布前确认、错误纠正和对投诉负责，而不是仅靠可爱人设；
      五，清理插件证明社区反感已经强到催生实际工具，但其识别率属于作者自报样本结果，也可能误伤使用同类头像或语气的真人。
          因此本条高置信度指向“双向信任与社区接受是核心门槛”，不等于已有全体B站用户反对AI的统计结论。
    案例: 本地凭证与Agent权限风险叠加公共评论区反感，安全收缩和人格包装都不能单独完成信任建立
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/SAFETY.zh.md
      - https://github.com/liyupi/dafeiyu-cleaner
      - https://www.thepaper.cn/newsDetail_forward_34440373?commTag=true
    置信度: 高

  - 类型: 执行人限制
    证据: |
      DSH官方说明其开发者预览状态、兼容性破坏变化、未安全审计和最小权限要求；
      dsh-bili-scroll公开了宿主最低版本、旧版静默不激活、安装后重启、Python或uv依赖、
      扫码与长期凭证、可选转写依赖、桌面端定时任务异常和profile降级日志等实际维护事项；
      鲸鱼娘社区项目与插件说明分别表明代码、角色素材和品牌权利需要分别处理
    推理: |
      一，对只有一台普通个人电脑、缺少Node／Python和Agent维护经验的用户，版本不匹配、依赖下载、扫码凭证、headless会话和本地转写中的任一环节异常，
          都可能使“每天自动刷站”退化为沉默不运行或需要反复手动排障；若用户无法阅读日志，即使插件功能本身正确也难以持续使用；
      二，对负责长期维护的个人或小团队，DSH快速变更、B站接口和风控变化、模型能力差异、提示词注入、凭证失效及角色素材授权会持续占用工作。
          这些限制会影响兼容性回归、权限审计和内容复核，后果不是一次安装稍慢，而是日报中断、错误公开评论或账号与隐私事故；
      三，若实施者把项目定位成私人自用工具，可采用固定已验证版本、手动跑一轮、只读和私信默认、关闭本地转写、限制任务量来显著降低门槛；
          若定位成多账号公共互动或商业角色产品，则还需平台规则、内容责任、社区沟通、素材和品牌授权等能力，不能沿用个人原型的低门槛估计；
      四，外包安装或让另一个AI代操作只能减少部分命令行劳动，不能替代账号本人对公共发言的授权与责任。
          更稳妥的边界是使用隔离环境、最小权限、版本锁定与升级前测试、凭证撤销检查、公共发布人闸，以及不含第三方美术的原创角色；
      五，公开资料没有系统性安装失败率或维护工时，故本条保持中置信度；它说明普通实施者的具体工作约束，不把技术不熟写成个人能力缺陷或无条件死局。
    案例: 个人安装可被自动化和缩围缓解，长期可靠运行与公共商业化则要求持续兼容、安全和责任维护
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/SAFETY.zh.md
      - https://github.com/c1overzz/dsh-bili-scroll
      - https://github.com/Neko3000/deepseek-whalechan/blob/main/README.zh.md
    置信度: 中

需求证据:
  类型: 开源实现、真实社区使用与反向治理工具
  说明: |
    dsh-bili-scroll公开仓库提供了完整安装、配置和故障排查路径，功能覆盖自主搜索、内容读取、筛选、日报、定时任务和可选互动；
    媒体报道记录了用户让大肥鱼追踪AI新闻、写日记、增加记忆和定时任务，以及评论区的真实扩散。
    这些材料支持“个人信息筛选”和“可养成角色Agent”均出现了实际使用，不只是设想。
    大肥鱼消除计划则以本地浏览器隐藏疑似AI评论，证明了另一组用户需要减少评论区AI噪音。正向使用与反向清理必须同时作为需求证据，不能只挑选热闹的一面。
    当前没有公开、可独立核验的长期留存、日报持续阅读率、筛选节省时间、付费或续费数据；媒体所述播放、涨粉与评论数字不作为独立运营审计，
    清理插件作者自报的账号样本、识别率和无误伤结果也不作为通用识别基准。
  附件: 无

商业及社会价值评估: |
  商业价值：直接受益者是需要按兴趣持续筛选B站内容的重度用户、研究人员、创作者和Agent爱好者；角色层还可能满足陪伴、二创和个性化表达需求。
            潜在付费者首先是这些个人用户，可测试的方向包括更易安装的本地软件、私有工作流定制、技术支持和跨平台迁移，而不是向评论区其他用户收费。
            现有核心代码以MIT开放且可自行部署，会压低单纯“同一份插件”的收费空间；公开资料没有证明用户愿意为日报、人格或自动评论持续付费。
            私人路线应按“每经用户确认有用日报条目的全成本”与节省的筛选时间、持续使用和支付意愿比较；
            公共路线还必须计入人工审校、社区投诉、账号处置与合规成本，并以接收者是否获得增量价值衡量，而不能把评论量当收入代理指标。
            若去掉公共评论后仍有稳定日报使用，工具价值更容易独立成立；若只有依靠大量Agent在他人评论区出现才能获得热度，则不是稳健商业闭环。
  社会价值：自主读取原文、按个人兴趣筛选和生成可追溯日报，可能降低信息过载并帮助用户发现小众内容；
            开源插件、最小权限和角色化界面也为普通用户理解Agent工具调用、权限边界和可执行IP提供了可拆解样本。
            但公共自主发言会把筛选成本转嫁给创作者和其他观众，错误反馈、同质化评论和Agent互相回应还可能稀释真人讨论；
            凭证、隐私、提示词注入与降级运行则会影响主人安全。较有社会价值的形态是私人默认、公共谨慎、AI身份透明、内容有依据、接收者可以拒绝，
            而不是用可爱角色包装无限扩张的自动评论。角色和代码分层授权也有助于让社区二创在尊重原作者与品牌权利的前提下延续。

可拆零件:
  - 关键词订阅、时间窗搜索、字幕优先、抽帧与本地转写降级的B站内容采集链
