编号: "0029"
id: open-source-judgment-formal-error-feedback-agent
标题: 开源裁判文书形式异常检测反馈Agent
一句话: |
  对用户合法取得或明确授权的裁判文书，检查错字、当事人称谓、日期、金额误算、诉讼费用、法条引注和前后不一致等可定位异常，
  生成含原文位置、规则来源、备选解释和置信度的复核报告与反馈草稿；由人核对正式文本并决定是否使用既有渠道，
  不自动认定错判、改判或批量提交反馈
档案类型: 预审
复活状态: 复活候选
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 法律科技
子领域: 裁判文书质量检查与公众反馈
死法:
  - 类型: 条件已死
    证据: |
      最高法2018年通知明确要求推广裁判文书智能纠错软件，把智能纠错与人工审核结合，并对已上网文书开展筛查和纠错整改；
      法院公开案例记录了错别字、当事人信息前后不一致、法条引用、格式和逻辑瑕疵等辅助检查及人工校核机制；
      pycorrector以Apache License 2.0公开中文文本纠错工具包，包含多种纠错方法和EC-LAW等评测；
      中国裁判文书网使用帮助列出意见建议功能及针对当前文书的留言入口。法院系统案例属于特定时期和系统的官方自报，
      通用开源工具也未证明对真实裁判文书的检出率，二者不能混写成外部Agent已被法院采用
    推理: |
      一，若旧判断是“错字和部分形式异常只能靠人工逐字发现，也没有公开反馈渠道”，这一条件已不成立。
          法院内部实践证明了辅助检查需求与部分技术可行性，公开网站提供了用户可主动使用的反馈入口；
      二，开源中文纠错组件可以承担部分文字处理，确定性规则也能检查日期、数值、引注和字段一致性，
          因而构建“用户合法提供文书—机器筛查—人工复核—生成反馈草稿”的原型具有现实基础；
      三，但既有法院系统不等于本节点所述外部开源Agent，pycorrector的通用或法律语料评测也不等于真实裁判文书低级错误的检出证明。
          本轮没有观察到一个已完成合法数据接入、裁判文书专项验收和反馈闭环的开源产品，因此只判复活候选，不判已复活；
      四，复活路线应复用现有纠错与规则组件，并把差异化放在文书类型、定位证据、法律引注版本、人工复核和合规反馈上，
          而不是重复训练一个只会改错字的模型或另建不受控制的公共曝光平台。
    案例: 法院智能纠错、人工审核、开源中文纠错组件和既有留言入口共同支持有限原型条件，但完整外部产品仍待验证
    证据链接:
      - https://www.court.gov.cn/zixun/xiangqing/95152.html
      - https://www.court.gov.cn/zixun/xiangqing/12338.html
      - https://github.com/shibing624/pycorrector
      - https://wenshu.court.gov.cn/website/wenshu/181109AWZA70BFK4/index.html
    置信度: 高

  - 类型: 理论证伪
    证据: |
      民事诉讼法司法解释第二百四十五条把可补正的“笔误”界定为法律文书误写、误算，诉讼费用漏写、误算和其他笔误；
      最高法2025年法答网答问进一步区分一般文字差错、重要文字差错及不同文书类型的补正方式；
      JuDGE研究为中文判决文书生成建立格式、法条、推理等多维评测，并由具备法律知识的人员参与标注，
      但其任务是评价生成文书，不是扫描公开文书并认定错判，相关指标不能移植成本节点检测准确率
    推理: |
      一，强版本“只凭公开裁判文书文本，Agent就能自动认定低级错误判决或实质错判”混淆了文书形式异常与裁判结论错误。
          误写、误算可以依定位和规则复核，证据采信、事实认定、法律适用和裁量则需要完整案卷、程序与专业判断；
      二，即使发现称谓、日期、金额或引注异常，也只能说明文本存在待核线索。异常可能有排版、简称、计算口径、引用版本或上下文解释，
          不能跳过原文、正式文本和案卷核对就宣告判决错误；
      三，形式错误如何补正取决于文书类型、错误性质和法定程序。Agent可以生成补正线索或反馈草稿，
          不能替代法院裁定、上诉、再审等程序，也不能把公众反馈包装成具有裁判效力的处理；
      四，因此被证伪的是“文本异常等于实质错判、检测器有权最终裁决”的强版本，不是形式异常辅助检查。
          后者应把输出限定为证据化线索，并明确哪些事项拒绝自动判断。
    案例: 笔误补正的正式定义和分文书处理规则表明，形式异常可检与实质错判裁决是两种不同任务
    证据链接:
      - https://www.court.gov.cn/fabu/xiangqing/353651.html
      - https://www.court.gov.cn/zixun/xiangqing/452221.html
      - https://arxiv.org/html/2503.14258v3
    置信度: 高

  - 类型: 政策风险
    证据: |
      中国裁判文书网用户协议说明网站信息仅供参考、内容以正式文本为准，当事人可向公布法院书面申请更正或下镜；
      协议还禁止非法使用和干扰网站运行，未经许可商业性网站不得建立全部或局部镜像，文书依法撤回时其余网站有义务及时撤回；
      最高法关于互联网公布裁判文书的规定要求公开文书除技术处理外与原本一致，并对补正公布、撤回纠正和公众意见处理作出安排；
      人民网报道引述最高法关于验证码、翻页限制及暴力爬取影响正常访问的说明。该报道用于说明访问约束，不提供任何绕过方法
    推理: |
      一，公开可看不等于可以无限制复制、批量镜像、商业化或持续保存。产品若依赖未经授权的全站抓取和永久副本，
          会把一个辅助纠错工具变成访问、复制、撤回同步和个人信息处理风险叠加的数据平台；
      二，合规路线应优先处理用户合法下载并有权提供的文书、明确授权数据或其他合规来源，记录来源、取得时间、授权和正式文本核验状态；
          不绕过验证码、反爬、访问控制、平台风控或技术限制，不把批量镜像写成复活能力；
      三，公开文书仍可能包含当事人和案件信息。系统应最小化收集与展示，限制私有语料访问和日志内容，
          建立撤回同步、删除、异议和更正流程，不基于案件文本对个人做画像或自动不利处置；
      四，本条不判定处理任何公开文书都违法，也不给出“绕过限制即可商业化”的路径。
          能否扩大数据来源和用途须按实际角色、授权、协议与适用法律另行审查，高风险的外部持续扫描不能默认可行。
    案例: 用户协议、公开与撤回规则和现实访问约束共同限定输入与留存方式，合法数据治理是产品零件而非上线后的补充
    证据链接:
      - https://wenshu.court.gov.cn/website/wenshu/181011B4PMBWW37C/index.html
      - https://www.court.gov.cn/fabu/xiangqing/25321.html
      - http://legal.people.com.cn/n1/2019/0802/c42510-31271126.html
    置信度: 高

  - 类型: 信任成本
    证据: |
      最高法2018年通知明确要求智能纠错与人工审核结合，而不是让软件独立决定文书质量；
      法院既有系统公开材料能证明辅助检查场景和部分自报结果，但没有提供本节点外部开源Agent的独立准确率审计；
      pycorrector的公开评测覆盖通用中文及EC-LAW等语料，不等于真实裁判文书上对错别字、金额、称谓、法条和逻辑异常的综合检出表现；
      JuDGE的多维法律评测和人工标注也说明法律文本质量不能由一个通用文本分数替代，其生成评测结果不能当成本检测产品的效果
    推理: |
      一，误报会把正常简称、计算口径或引用表达指为错误，浪费读者与法院处理时间；漏报又可能让使用者误以为“没有告警就是没有错误”。
          在高影响法律场景，二者都不能只靠一个总体准确率数字掩盖；
      二，每条输出至少应保留文书来源与版本、页／段／字符位置、最小必要原文、触发规则、法条或计算依据、
          备选解释、置信度和人工处理记录。法条引用还需核对当时有效版本与适用语境，不能只做字符串匹配；
      三，反馈前应核对正式文本，由具备相应能力的人确认问题类型、措辞和渠道。
          对事实认定、证据采信和裁判结论的异议，应提示进入适当法律程序，而不是混入“错字反馈”自动提交；
      四，本条高置信度指向人工复核、来源追溯和分任务验收不可省略，不宣称现有法院系统或开源组件普遍不可靠。
          厂商或法院自报数字、通用语料指标和生成任务榜单均不得冒充本产品的独立效果证明。
    案例: 法律文本的误报漏报都有外部成本，只有可定位证据、人工复核和分任务测试能建立有限信任
    证据链接:
      - https://www.court.gov.cn/zixun/xiangqing/95152.html
      - https://www.court.gov.cn/zixun/xiangqing/12338.html
      - https://github.com/shibing624/pycorrector
      - https://arxiv.org/html/2503.14258v3
    置信度: 高

  - 类型: 钱算不平
    证据: |
      最高法通知和既有法院系统说明文书纠错有真实工作需求，同时也表明人工审核与系统建设需要持续投入；
      2025年法答网答问显示差错处理需区分文书类型和错误性质，意味着规则与复核不能只有一套通用错字表；
      裁判文书网已有意见建议和逐篇留言入口，用户不需要为本产品另行付费才能获得基础反馈渠道。
      当前没有本项目的开发、法律专家复核、合规数据、维护报价或用户支付意愿数据
    推理: |
      一，开源模型减少部分研发成本，却不会消除合法数据取得、文书类型适配、法条版本维护、测试集标注、专业复核、
          安全与撤回同步、反馈措辞审核等持续成本。法律规则和文书模板变化还会带来回归测试；
      二，若收入依赖向普通公众出售“发现错判”的希望，既可能夸大能力，也会让大量低质量反馈成为外部成本。
          较可信的付费对象若存在，更可能是有合法文书处理需求的专业团队或机构，而不是被承诺改判结果的当事人；
      三，已有免费官方反馈入口和法院内部系统会压低单纯“提交留言”或“通用纠错”的价值。
          产品必须证明专项检出、证据定位和内部复核流程节省了足够人工时间，才可能覆盖维护费用；
      四，若项目定位为公益或基础设施，可持续资源可以来自志愿维护、研究或机构支持，不应以未盈利直接判定无价值；
          但资源来源仍未落实，不能把社会价值当成已经算平的商业账。
    案例: 真实纠错需求不等于外部产品可收费，法律维护与人工复核成本必须相对既有免费渠道证明增量
    证据链接:
      - https://www.court.gov.cn/zixun/xiangqing/95152.html
      - https://www.court.gov.cn/zixun/xiangqing/452221.html
      - https://wenshu.court.gov.cn/website/wenshu/181109AWZA70BFK4/index.html
    置信度: 中

  - 类型: 执行人限制
    证据: |
      JuDGE的中文法律评测需要法律知识、分维度和人工标注支持，说明高质量法律文本评价并非单纯调用通用模型；
      裁判文书网使用帮助提供的留言和意见建议是面向用户的既有入口，不等于第三方可以自动批量提交或法院必须采纳；
      互联网公布裁判文书规定对补正、撤回、公众意见和正式文本一致性设有管理机制，外部工具不能替代这些职责。
      本轮没有证据表明普通开源团队已取得法院系统集成、授权批量数据或真实反馈闭环
    推理: |
      一，小团队可以做用户主动提供少量文书的本地检查原型，但持续公开扫描、跨文书类型规则维护、法条时效、
          法律专家复核、撤回同步和反馈处置是更大规模的组织能力；
      二，实施者需要把工程、法律、数据治理和公共沟通分开验收。模型开发者不能自行充当最终裁判者，
          也不能通过自动留言制造“已经向法院举报”的虚假完成状态；
      三，反馈功能默认只生成草稿和官方渠道指引，由用户核对、编辑并明确操作。
          未获得接收方明确授权和专门合规审查前，不做自动批量提交，不使用他人账号、Cookie或浏览器登录态；
      四，本条不否定小团队做出有限工具，而是否定在没有数据、专业人员、接收方合作和维护机制时直接承诺完整公共平台。
          缩小输入与反馈范围后，执行难度才可能与中等预算相符。
    案例: 可做的是合法输入上的辅助检查和人工反馈草稿，不能把小团队原型直接扩展成自动公共纠错与裁判系统
    证据链接:
      - https://arxiv.org/html/2503.14258v3
      - https://wenshu.court.gov.cn/website/wenshu/181109AWZA70BFK4/index.html
      - https://www.court.gov.cn/fabu/xiangqing/25321.html
    置信度: 中

需求证据:
  类型: 法院纠错制度与实践、公开反馈入口；外部开源Agent需求待验证
  说明: |
    最高法2018年通知及法院公开案例直接证明裁判文书形式质量检查、智能辅助与人工审核存在真实需求，
    民事笔误补正规则和2025年法答网答问证明差错需要按类型与程序处理。
    裁判文书网的意见建议、逐篇留言以及当事人向公布法院申请更正等渠道，证明部分反馈路径已经存在，
    但不证明第三方可自动批量提交、法院会采纳本产品或外部用户愿意付费。
    本轮没有取得律师、法律援助机构、当事人、法院工作人员对所述开源Agent的访谈或试用，
    没有真实文书专项检出率、复核工时、有效反馈采纳、持续使用、采购或续费数据。
    最关键的缺口是：谁拥有合法文书来源和重复检查任务，现有工具仍未覆盖哪些形式异常，以及经人工确认的有效线索能否节省足够成本。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在使用者包括有合法文书处理需求的律师与法律团队、法律援助或研究机构，以及进行内部质量检查的组织；
            法院内部已有智能纠错实践不等于会采购外部开源产品，实际使用者和付费者均待访谈与采购验证。
            可测试的收入路径包括私有部署、特定文书类型与规则适配、经法律专业人员验收的测试集、技术支持和机构服务；
            不应以向公众承诺“发现错判”“帮助改判”或批量代发反馈获利。开源核心和官方免费留言入口使通用纠错、单纯提交反馈难以形成高溢价。
            成本应包括合法数据取得、法条和规则版本维护、法律专家标注与复核、误报漏报处置、安全、撤回同步和用户支持；
            只有经确认的有效线索所节省的复核时间与风险处理成本足以覆盖上述支出，并形成持续使用或机构支持时，商业或运营闭环才成立。
            当前没有订单、收入、利润、资助或真实反馈效果证据。
  社会价值：准确、克制且可追溯的形式异常提示，可能帮助读者和法律工作者发现误写误算，降低补正线索整理成本，
            并通过正规反馈渠道支持文书质量改进。开放规则和人工复核记录也有助于公众理解“形式差错”与“实质裁判争议”的区别。
            但低质量批量反馈会增加法院与公众负担，错误公开指认可能损害当事人或司法人员声誉，过度复制和画像会带来个人信息风险。
            社会价值不能以扫描文书数、告警数或留言数衡量，应以人工确认率、有效更正、撤回同步、隐私保护和实际节省的复核劳动评估；
            工具不能替代上诉、再审、补正裁定或其他法定程序，也不能将模型输出作为对法院、法官或当事人的最终不利裁决。

可拆零件:
  - 合法输入登记表，记录来源、取得方式、授权、下载时间、文件指纹、正式文本核验状态和允许用途
  - 文书类型、审级、程序与地区识别模块，先确定适用检查规则，再运行检测
  - 对错别字、字符重复、标点、当事人称谓、日期、金额、诉讼费用和前后字段一致性的分任务规则库
  - 法条引注解析与官方来源、效力版本和施行日期核验模块；引注异常只生成线索，不自动推导裁判结论
  - 跨段落事实与数字对照表，保留原文位置、计算过程、上下文和可能解释，避免把合理简称或口径差异直接报错
  - 包含文书版本、页／段／字符定位、最小必要原文、触发规则、引用依据、置信度、备选解释和复核状态的报告
  - 接受、驳回、编辑、升级和撤回提示的人工复核工作流，以及规则版本、处理人和理由的审计记录
  - 将已确认形式差错映射到既有官方渠道的反馈草稿与指引，默认不自动提交、不批量留言、不使用他人登录态
  - 撤回同步、删除、更正、异议、个人信息最小化、访问控制和日志脱敏机制
  - 由合法取得的补正裁定、公开更正记录和授权文书构建的分任务验收集，严格区分训练、调参与最终测试
  - 按文书类型和错误类别分别报告检出、误报、漏报、人工确认与有效反馈，不用单一总分掩盖高影响失败
  - 法条、模板和规则变更的版本维护与回归测试，以及失效规则停用和历史报告重标机制

