id: open-data-statistical-spy-satellite-identification
标题: 基于地天观测数据及公开资料实现的统计学估计间谍卫星识别
档案类型: 预审
一句话: 设想融合公开地面／天基观测、轨道目录、发射登记和公开报道，对空间对象进行统计推断、候选排序与置信度表达；本档案把“发现值得复核的候选”与“确认某颗卫星承担机密间谍任务”严格区分。
设想来源: 主编提供的原始技术设想，按题名所述地天观测、公开资料和统计学估计路线记录，不补写未提供的具体模型或部署方案。
记录日期: 2026-11-13
当前结论: AI初稿建议判为预审／复活候选。公开目录、独立观测与历史报道支持开展可复现的候选筛查和概率研究；公开数据缺口、任务真值稀缺、对象关联错误与双用途语义决定了其输出不能自动升级为对机密任务的确定识别。
复活状态: 复活候选
创新类型:
  - 渐进式
  - 技术应用
领域: 空间信息科学
子领域: 公开来源空间态势感知与统计推断
死法:
  - 类型: 理论证伪
    证据: CelesTrak的SATCAT格式提供对象名称、国际标识、目录编号、对象类型、运行状态、所有者、发射信息和基本轨道参数，但没有提供“间谍卫星”真值字段。Space-Track文档说明公开目录存在国家安全原因、传感器覆盖、交叉标记和再入等造成的缺口。联合国《登记公约》要求登记国提供空间物体的一般功能，而非详细任务或载荷能力；Spaceflight Now关于NROL-108的报道则显示，独立观测者可以作出推断，而具体任务仍可能保持秘密。
    证据链接:
      - https://celestrak.org/satcat/satcat-format.php
      - https://www.space-track.org/documentation
      - https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/registration-convention.html
      - https://spaceflightnow.com/2020/12/16/nro-using-spacexs-commercial-launch-service-for-spy-satellite-payload/
    推理: 统计模型只能利用可观测特征和已有标签估计条件概率，不能从缺失字段中必然恢复被刻意保密的任务真相。轨道相似、所有者相同或功能描述相近可以构成候选证据，却也可能由民用、政府、军事和双用途任务共享。因此，被证伪的是“仅凭公开字段和统计评分即可确定识别所有间谍卫星”的强版本，而不是公开资料完全不能支持候选排序或历史个案研究。
    置信度: 高
    备注: 本条不是对一切公开来源空间目标研究作无效判定；其结论仅限制确定识别和完整覆盖，允许保留带证据来源、时间戳、不确定性和反证的候选输出。
  - 类型: 冷启动死锁
    证据: SATCAT和联合国登记资料能提供目录及一般功能信息，却不等于完整、准确且统一的任务标签。SpaceNews对业余观测者的历史报道同时指出，未列入公开轨道的对象不必然是保密卫星，也可能是丢失对象或碎片；NROL-108报道则说明，即便有轨道、光学和无线电等公开线索，具体任务仍可未被公开确证。
    证据链接:
      - https://celestrak.org/satcat/satcat-format.php
      - https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/registration-convention.html
      - https://spacenews.com/amateur-satellite-trackers-keep-watchful-eye-sky/
      - https://spaceflightnow.com/2020/12/16/nro-using-spacexs-commercial-launch-service-for-spy-satellite-payload/
    推理: 训练与校准“间谍卫星概率”需要独立可信的正负样本和误差记录，但保密对象恰恰最难获得这种真值。如果把公开报道的推测当标签，再用模型复现这些推测，就会形成自我确认；如果只训练已公开任务，又会产生选择偏差，无法证明对未公开对象同样有效。独立观测、人工复核和允许弃判可以缓解这一问题，但会把成果限定为研究性候选清单，而非通用确证器。
    置信度: 中
    备注: 本条不否认用已公开、已确证对象建立有限基准的价值；后续验证必须保留标签来源、时间切分、类别不平衡、未知类别和误报记录，不能用模型自身输出回填真值。
  - 类型: 政策风险
    证据: Space-Track文档包含注册、访问频率、引用与再分发要求；CelesTrak使用政策要求自动化访问遵守频率限制，并说明其数据来自Space-Track且使用条件须一并遵守。ESA DISCOSweb说明其提供的是可跟踪、非保密对象信息，不分发监视系统的轨道或姿态星历，并要求衍生作品和再分发标注来源。
    证据链接:
      - https://www.space-track.org/documentation
      - https://celestrak.org/usage-policy.php
      - https://discosweb.esoc.esa.int/
    推理: 公开可访问不等于可以无条件批量抓取、再分发或保证长期复现。账号条款、访问频率、来源署名、数据库更新和历史快照保存都会影响研究流程；绕过限制可能中断数据获取，忽略引用与许可则会削弱结果的可审计性。该风险主要约束数据取得与复现方式，不意味着使用公开资料或开展独立观测当然违法。
    置信度: 中
    备注: 本条不构成具体司法辖区的法律意见。实施时须逐项核对数据条款、登记义务和当地规定，不通过多账号、代理轮换或其他方式绕过访问控制与频率限制。
  - 类型: 信任成本
    证据: Space-Track公开文档提示未知来源对象、交叉标记和目录缺口；SpaceNews历史报道提醒观测者可能把碎片误认为保密载荷。NROL-108报道把独立推断与仍未公开的具体任务明确区分。轨道估计综述还讨论了轨道不确定性，以及传统TLE／SGP4在长时预测和不确定性表达方面的局限。
    证据链接:
      - https://www.space-track.org/documentation
      - https://spacenews.com/amateur-satellite-trackers-keep-watchful-eye-sky/
      - https://spaceflightnow.com/2020/12/16/nro-using-spacexs-commercial-launch-service-for-spy-satellite-payload/
      - https://arxiv.org/html/2207.08993v4
    推理: 数据关联错误、轨道误差、标签循环和双用途歧义会沿处理链传递到最终评分。如果只展示一个醒目的“间谍卫星概率”而不展示证据来源、观测时间、备选解释和反证，错误候选很容易被二次传播为确定事实，进而损害研究可信度并引发不必要的外交、声誉或安全争议。可纠错、可撤回和允许弃判因此是核心交付要求，而不是界面附加项。
    置信度: 中
    备注: 本条要求人工监督、来源披露、置信度校准、异议复核和纠错记录，不把模型输出用于对个人、机构或国家作自动最终裁决。
  - 类型: 执行人限制
    证据: ESA DISCOSweb明确不通过该服务提供保密对象及监视系统星历；SatNOGS证明低成本开源地面站网络和公共观测数据库真实存在，但其公开项目定位不能自动等同于全天候、全球、多模态覆盖。SpaceNews的历史报道显示独立观测者能够取得有价值的长期跟踪成果，同时也依赖长期积累、协作与专门经验。机器学习轨道估计综述则表明，从观测到稳定轨道及不确定性表达本身仍是研究问题。
    证据链接:
      - https://discosweb.esoc.esa.int/
      - https://www.libre.space/projects/satnogs/
      - https://spacenews.com/amateur-satellite-trackers-keep-watchful-eye-sky/
      - https://arxiv.org/html/2207.08993v4
    推理: 对缺少长期观测积累、跨站协作、数据治理和轨道专业能力的个人或小团队，直接承诺完整识别和持续覆盖会超出可验证资源；公开网络降低了参与门槛，却不能自动补齐观测空白和独立真值。若缩为使用许可数据研究公开、历史对象，发布可复现的候选排序与误差报告，执行限制会明显降低，但不能据此宣称已经解决保密任务识别。
    置信度: 中
可拆零件:
  - 公开轨道目录、登记资料与观测数据的来源及许可登记表
  - 目录缺口、交叉标记、时间戳和观测质量的不确定性标注规范
  - 保留证据链、备选解释、反证和弃判状态的候选概率研究框架
  - 独立观测历史个案与误识别案例的可复核资料库
  - 面向公开科学、民事和历史对象的可复现统计研究基准
  - 数据来源署名、访问频率、版本留存、人工复核与纠错撤回机制
死因保质期: 2029-11-13
起草AI: 澄樾（Kimi-K3.1）
记录边界: 本档案仅记录公开、历史或经许可数据上的概念与统计研究方法，不提供实时规避侦察、侦察空档利用、目标选择、攻击引导或规避监测的方法；不输出可执行行动建议，不把候选概率写成对机密任务、机构意图或国家行为的最终裁决。
备注: 本文件是AI起草的非创业技术储备，尚未经过主编人工审核；不接入nodes/、G01、G02、INDEX、REVIEW、科技树或静态站公开节点数据。公开目录、政府登记、项目页面、专业媒体与论文分别证明字段范围、制度条件、观测先例和研究局限，不越级证明通用间谍卫星分类器已经成立。业余观测报道中的规模与案例属于其历史时点，不能当作当前覆盖能力；论文中的轨道估计成果也不能直接换算为任务识别准确率。死因保质期暂按本次记录日起三年设置，人工定案时应根据实际审核日期、数据条款和最新研究重算；工具访问受限不等于链接失效，异常链接须转人工复核。
