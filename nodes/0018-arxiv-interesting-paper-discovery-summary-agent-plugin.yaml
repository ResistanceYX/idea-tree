备注: |
  本节点为AI起草、人类审核的预审档案，不是现有插件或作者已经失败、停止或转向的验尸记录。
  原始清单只给出节点名称，未指定某个仓库、推荐算法或完整产品说明；本稿因此把“有趣”具体化为分类与日期、自然语言主题、本地兴趣知识库及反馈筛选，
  不假装主编已经指定某一实现，也不把不同仓库的功能合并成单一产品已经兑现的承诺。
  已复活仅指公开arXiv元数据获取、分类与工作日筛选、本地兴趣知识库或自然语言主题、模型排序与中文摘要、原文链接、反馈、
  本地论文库、外部定时日报及可选深读等核心技术链已经存在；不表示推荐准确率、误漏率、深读可靠性、持续阅读、商业闭环或社会净收益已经证明。
  目标DSH插件公开说明为按需调研且不自动推送，星期设置不被写成内置无人值守调度；定时复活证据同时来自独立日报项目的外部cron路线。
  重启预算“低”针对个人利用现有开源代码、自有设备、少量分类和较低候选上限进行低频本地部署；多用户托管、长期全文处理、
  外部深读配额、私有团队集成和持续兼容维护不属于这一预算口径。
  来源按证明力分层使用：DeepSeek与arXiv官方文档证明运行环境、API、订阅、许可、限速及通用安全边界；
  各插件与日报仓库证明作者公开的功能、默认配置、依赖、排障和降险设计，不替代独立安装测试、安全审计或推荐效果基准。
  daily-arXiv-ai-enhanced约每日0.2元人民币仅为作者特定配置的自报值，正文没有据此推算其他模型、分类规模或用户的成本。
  本稿没有独立安装并复现上述插件的所有版本，也没有把README中的截图、样例或功能声明写成第三方基准；版本与默认配置以审核日期页面为准，实际部署前须重新核对。
  arXiv描述性元数据CC0不覆盖论文全文，插件MIT许可也不改变单篇论文权利；本项目未复制第三方PDF、论文全文、网页全文、仓库快照或访问凭证。
  本地个人研究使用与向公众再分发必须区分，公开实现中的凭据处理方式仅作架构证据，不表示本项目保存或需要任何真实token。
