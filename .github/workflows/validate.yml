```yaml
name: 校验节点并维护索引与复核清单

on:
  push:
    branches: [main]
    paths:
      - "nodes/**"
      - "evidence/**"
      - "README.md"
      - "scripts/validate.py"
      - "scripts/node_files.py"
      - "scripts/generate_index.py"
      - "scripts/generate_review.py"
      - "tests/**"
      - "INDEX.md"
      - "REVIEW.md"
      - "review_records.yaml"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "nodes/**"
      - "evidence/**"
      - "README.md"
      - "scripts/validate.py"
      - "scripts/node_files.py"
      - "scripts/generate_index.py"
      - "scripts/generate_review.py"
      - "tests/**"
      - "INDEX.md"
      - "REVIEW.md"
      - "review_records.yaml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 结构校验、测试、索引与复核清单同步
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装校验依赖
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: 运行自动化测试
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 校验当前仓库
        run: python scripts/validate.py --root .

      - name: 检查 PR 索引是否同步
        if: github.event_name == 'pull_request'
        run: python scripts/generate_index.py --root . --check

      - name: 检查 PR 复核清单是否同步
        if: github.event_name == 'pull_request'
        run: python scripts/generate_review.py --root . --check

      - name: 更新并提交 main 索引与复核清单
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          python scripts/generate_index.py --root .
          python scripts/generate_review.py --root .
          if git diff --quiet -- INDEX.md REVIEW.md; then
            echo "INDEX.md 与 REVIEW.md 已是最新，无需提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX.md REVIEW.md
          git commit -m "chore: 自动更新索引与复核清单"
          git push
```
<!-- END FILE: .github/workflows/validate.yml -->
