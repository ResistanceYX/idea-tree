name: 校验节点与本地引用

on:
  push:
    branches: [main]
    paths:
      - "nodes/**"
      - "evidence/**"
      - "README.md"
      - "scripts/validate.py"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "nodes/**"
      - "evidence/**"
      - "README.md"
      - "scripts/validate.py"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 结构校验与错误样本测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装校验依赖
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: 运行自动化测试
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 校验当前仓库
        run: python scripts/validate.py --root .
