编号: "0034"
id: open-source-cnki-paper-integrity-feedback-agent
标题: 开源知网论文全量扫描与科研诚信反馈Agent
一句话: |
  原设想是让开源Agent慢速扫描知网全部已有论文，检查排版、错别字、引用、文字相似、图片处理、
  数据处理、数据伪造与伦理问题并反馈；目前只能考虑收缩为合法授权论文集上的分项质量与科研诚信线索检查，
  通过受控平台交换任务和复核状态，不把全库访问、自动学术不端认定或自动伦理审议列为复活能力
档案类型: 预审
复活状态: 复活候选
结论边界: |
  复活候选仅指在用户或机构明确授权的论文子集上，组合格式与文字规则、相似片段定位、引文元数据核验、
  图像异常提示、统计一致性复算和伦理材料缺口提示，生成带证据定位、备选解释和不确定性的人工复核报告；
  不表示第三方Agent已经取得知网全库扫描授权，不表示不同检测层已经端到端集成并通过中文全学科验收，
  也不表示异常线索能够证明作者故意、完成科研失信认定、替代正式伦理审查或形成商业闭环
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 科研诚信
子领域: 授权论文质量检查、科研诚信线索筛查与人工反馈
死法:
  - 类型: 政策风险
    证据: |
      2026年6月版《中国知网使用协议》将检索、查阅题录和全文、下载全文及智能工具列为服务，
      同时对知网内容给予个人、不可移转、非专属的单机使用权，禁止出租、出借、转载、发表、出版和建立镜像，
      并禁止使用非知网开发或授权的第三方软件、插件、外挂或系统登录、使用知网网络服务。
      知网科研诚信管理系统研究中心另行列出个人查重、机构版检测、论文送审和科研诚信风险自查等产品与工作流。
      这些页面证明普通服务与专门检测工作流并存，不证明某一外部Agent已经取得全库自动扫描、长期保存或再分发许可
    推理: |
      一，普通个人或机构账号能够查阅、下载部分论文，不等于获得让第三方Agent遍历全库的授权。
          “慢速”只改变请求速率，不改变处理对象、数据权利、平台条款和保存范围，也不能把受限访问变成批量许可；
      二，原强版本要成立，至少要逐项取得数据获取、自动处理、保存期限、结果交换和反馈用途的明确许可，
          并使用授权接口或其他被允许的数据通道。不得共享账号凭证、Cookie、token或浏览器登录态，
          也不得绕过验证码、付费墙、访问控制、批量下载限制或平台风控；
      三，现行协议并不证明知网永远不存在合作接口或专项授权，因此本节点不宣称任何授权路线绝对不存在。
          若未来取得可核验的书面合作与数据许可，应按实际授权范围重新评估，而不是用旧账号权限外推；
      四，复活候选因此只处理用户自有、开放许可或机构明确授权的论文子集。默认拒绝来源和许可不清的材料，
          不把“知网全量扫描”写进可执行能力，也不把第三方论文全文作为平台公共交换资产。
    案例: 普通论文下载权限与全库自动处理许可不是同一权利，降低抓取速度并不能填补授权缺口
    证据链接:
      - https://my.cnki.net/cnkiAgreement/cnkiUseAgreement.html
      - https://check.cnki.net/
    置信度: 高

  - 类型: 理论证伪
    证据: |
      国务院学位委员会、教育部明确要求论文重复率检测仅作为检查学术不端行为的辅助手段，
      不得以重复率结果代替导师、答辩委员会和学位评定委员会的把关。
      statcheck能在限定条件下提取并复算部分统计结果，但非APA格式、表格、解析误差及统计校正都可能影响输出；
      数据伪造统计工具综述指出，数据异常不足以得出科研不端结论，相关工具不应成为指控伪造的唯一证据；
      ASM使用Imagetwin的试点也需要培训、人工复核与监督来验证输出并过滤误报
    推理: |
      一，原设想把排版、错别字、错误引用、大段相似、图片异常、统计异常、数据伪造和伦理审议压成一个“排毒”结论，
          但这些任务的证据对象和责任层级不同。格式或文字问题可以依指定规范提示，却当然不等于科研失信；
      二，文字相似可能来自规范引用、公共表述或合理重述，也可能漏掉改写后的不当挪用；
          参考文献不存在、格式错误、引文与原文不符、引文不能支持论断又是四种不同检查，单一重复率无法包办；
      三，图像重复、拼接或处理痕迹可能有合理编辑、扫描与排版解释，统计不一致也可能来自四舍五入、
          多重比较、模型假设或报告错误。二者都可以是值得核查的线索，却都不能独自证明作者故意伪造；
      四，因此被证伪的是“从论文表面异常即可自动完成学术不端与数据造假认定”的强版本，
          不是分项质量检查完全无用。合格系统必须允许“无法解析”“证据不足”“需原始材料”和“人工弃判”，
          不得为追求全量覆盖率而强制给每篇论文贴上确定标签。
    案例: 同一处相似文本、图片异常或p值不一致可以对应多种原因，检测线索与失信结论之间不存在通用等号
    证据链接:
      - https://www.gov.cn/zhengce/zhengceku/2020-09/28/content_5548010.htm
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC7540394/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12121900/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12505991/
    置信度: 高

  - 类型: 执行人限制
    证据: |
      statcheck主要面向APA风格的NHST统计结果，PDF转文本通常比HTML更不可靠，表格和非APA统计可能漏检；
      Crossref REST API提供成员及可信来源存放的书目元数据、标识符、部分摘要、许可和出版后更新检索，
      但元数据不等于论文全文，也不证明引文内容支持正文论断。Scite Reference Check可检查参考文献状态、
      编辑关注或撤稿通知并展示稿件中的引用片段，但引用上下文展示本身仍不是论断支持关系的自动裁决；
      ASM的Imagetwin试点中，相关问题只在半色调图像内发现，不能外推到线稿、草图、图表或任意图片处理
    推理: |
      一，具体限制是实施者面对的是中文、多学科、多版式和多证据形态，而不是一种干净文本。
          会调用通用大模型不等于能稳定恢复版面、表格、公式、图注、参考文献和统计表达，也不等于具备各学科复核能力；
      二，关键工作包括授权清单、版面与阅读顺序解析、页码和对象锚点、参考语料许可、引文版本与撤回状态、
          图像类型适配、统计规则选择、原始数据和代码请求、学科专家复核，以及每个检测器单独的验收集；
      三，若缺少这些工作，项目后果是解析错误被当成论文错误、数据库缺记录被当成虚构引用、
          合理统计校正被当成异常、图像误报被公开扩散；增加模型数量只会叠加成本，不会自动修复证据链；
      四，缓解边界是先选一种授权论文类型和少量可确定规则，复用成熟解析、元数据与专项检查组件，
          分别验收检出、误报、漏报、无法解析和人工确认，再逐层扩展。中预算只对应这一缩围原型，
          不包含知网全库、全学科、全历史论文的持续扫描和专家处置。
    案例: 现有工具分别证明局部统计、引文和图像检查可行，同时以各自适用条件否定了“一次接入即可覆盖所有论文”的推论
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC7540394/
      - https://www.crossref.org/documentation/retrieve-metadata/rest-api/
      - https://help.scite.ai/zh/article/how-do-i-use-the-scite-reference-check-u52q0w/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12505991/
    置信度: 高

  - 类型: 信任成本
    证据: |
      《科研失信行为调查处理规则》要求由有职责的单位牵头调查，举报应有明确对象、违规事实、客观证据或可查证线索，
      调查可核对原始实验数据、协议、发票和研究过程，并保障陈述申辩、复查复核、保密与回避。
      《科技伦理审查办法（试行）》要求责任主体审查研究实施方案、风险防控、知情同意、样本与数据来源、利益冲突等材料，
      原则上采取会议审查，并设置申诉、跟踪审查、暂停或终止机制。
      数据伪造统计工具综述还提醒，大规模筛查会面对误报、公开指控、专家数量和原始数据共享意愿等问题
    推理: |
      一，论文扫描能看见的是发表文本中的线索，通常看不见完整原始数据、实验记录、图像原文件、伦理申请和作者说明。
          因而“伦理字段缺失提示”不等于完成伦理审议，“异常分数较高”也不等于有权机构已经认定失信；
      二，作者、机构和论文的声誉使误报具有外部性。平台若默认公开异常名单、自动批量举报或把分数传给第三方作不利处置，
          会把尚未核验的技术信号转化为现实伤害，并放大派系、学科偏见和恶意举报风险；
      三，可信输出应是私密默认的证据卡与反馈草稿，至少记录材料来源、授权范围、页码或对象定位、检测器版本、
          规则依据、备选解释、置信度、人工复核状态和反馈去向；正式提交必须由有权人员明确操作；
      四，纠错、撤回、删除、异议和申诉不是附加界面，而是反馈链的必要组成。
          平台只交换最小必要任务与复核数据，不默认交换第三方全文、原始数据、审稿材料、举报材料或作者私人信息。
    案例: 有权调查需要原始材料和申辩程序，正式伦理审查需要责任主体与申请材料，论文异常扫描只能提供前置线索
    证据链接:
      - https://www.gov.cn/zhengce/zhengceku/2022-09/14/content_5709819.htm
      - https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/fgzc/gfxwj/gfxwj2023/202310/t20231008_188309.html
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12121900/
    置信度: 高

  - 类型: 钱算不平
    证据: |
      数据伪造统计工具综述指出，异常检测方法存在适用假设和实施困难，最终判断需要知情专家，
      通常还需检查结果、原始数据与代码；大规模筛查还受专家供给、误报和数据共享意愿限制。
      ASM的实际期刊图像筛查试点虽使用Imagetwin提高效率，仍配置培训、人工复核与监督来验证输出、过滤误报。
      科研失信调查规则所规定的原始材料核对、行政调查、学术评议、陈述申辩和复查复核，也属于无法由扫描器消除的程序工作
    推理: |
      一，全量扫描的全成本不只是模型调用，还包括授权与数据取得、解析和算力、存储、参考库维护、
          专家复核、反馈沟通、纠错撤回、申诉处理和规则更新。只报告每篇扫描价格会漏掉决定有效产出的后续成本；
      二，“慢速”可能降低瞬时负载和接口压力，却不减少论文总数、每篇检测步骤或每条高风险线索的人工责任；
          扫描周期拉长还会增加版本过期、规则变更和重复复核的维护工作；
      三，有效产出应分别计算为经人工确认且可行动的错误修正、合格核查线索或成功撤回的错误报告，
          不能用扫描页数、异常总数或举报数量冒充社会收益。误报越多，后续单位成本越高；
      四，目前缺少中文全学科全库路线上的授权报价、分任务检出率、专家工时和申诉成本数据，
          故本条只判定原强版本缺少全成本闭环，不虚构一个确定亏损额。缩围原型应先验证每百篇有效线索全成本与人工节时。
    案例: 期刊图像试点仍需人工验证，说明自动扫描可以转移和减少部分工作，却不能把复核与处置成本归零
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12121900/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12505991/
      - https://www.gov.cn/zhengce/zhengceku/2022-09/14/content_5709819.htm
    置信度: 中

  - 类型: 巨头碾压
    证据: |
      知网科研诚信管理系统研究中心已公开个人查重、内容／格式检查、论文相似性检测、机构管理、送审、
      人事论文诚信档案和科研诚信综合风险自查等产品，覆盖作者、学校、期刊和人事等场景。
      Scite Reference Check提供参考文献状态与引用片段检查，ASM试点则显示专业图像筛查可嵌入期刊编辑流程。
      这些材料证明既有平台与专项工具已经占据部分工作流，不证明它们的实际检出效果或本设想完全没有差异化空间
    推理: |
      一，原强版本把核心竞争力写成“扫描知网全部论文”，但知网自身同时掌握数据入口、机构产品和既有工作流，
          外部Agent在没有独立授权和独特复核能力时，既难以获得同等语料，也难以仅凭“开源＋慢速”形成优势；
      二，文字相似和机构流程已有平台供给，统计、引文和图像又分别存在专业工具。
          若新工具只是把这些宣传词合并为一个总分，既不能继承各组件的证据，也不能证明比既有流程更准确或更可信；
      三，复活候选必须避开对全库和既有平台的正面复制，把差异化放在用户授权材料的本地优先处理、
          可审计证据卡、可独立替换的检测器、真实暂停恢复、跨工具结果对齐和人工纠错上；
      四，本条不表示大型平台已经解决科研诚信，也不否认开源组件的公共价值。
          它否定的是把“能接入知网全库”当作未经验证的商业壁垒；真实需求、采购意愿和相对效果仍待试点证明。
    案例: 既有全链路平台与专项工具已分别覆盖部分需求，新Agent只有提供可验证的互补能力才可能避免重复建设
    证据链接:
      - https://check.cnki.net/
      - https://help.scite.ai/zh/article/how-do-i-use-the-scite-reference-check-u52q0w/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12505991/
    置信度: 中

需求证据:
  类型: 科研诚信制度、既有检测产品与期刊工作流需求；外部Agent独立采用和付费需求待验证
  说明: |
    知网科研诚信产品体系、学位论文质量管理制度、科研失信调查规则和期刊图像筛查试点共同证明，
    论文质量检查、诚信风险线索发现和人工复核具有真实制度与编辑工作流需求。
    statcheck、Crossref、Scite及数据异常研究进一步证明，部分检查可以拆成可执行的工具任务。
    但这些证据只支持授权材料上的分项辅助，不证明外部第三方拥有知网全库处理权，
    也不证明作者、期刊或机构愿意采用一个自动公开指控的Agent。主编提出的暂停键和平台交流是明确产品要求，
    不是独立用户规模、采购意愿、真实反馈采纳或商业收入证据
  附件: 无

商业及社会价值评估: |
  若严格限定在合法授权论文集，分层检查可减少格式、文字、引文状态和部分统计复算的重复劳动，
  并通过证据定位、备选解释与人工复核帮助作者自查、编辑初筛和有权机构整理合格线索。
  其社会价值应看有效修正、可靠线索、节省的复核工时与错误纠正，而非给多少论文贴上风险标签。
  主要负价值来自未授权全文汇集、误报和公开羞辱、学科偏差、伦理与私人材料泄露、自动举报及申诉负担。
  因此应先做私密默认的小范围对照试点，分别报告各层检出、误报、漏报、无法解析、人工确认、撤回和全成本；
  当前没有真实采用、效果、收入或全库社会收益证据，不能据此宣称科研诚信问题已被“排毒”或商业闭环成立

可拆零件:
  - 数据来源、权利人、许可文本、允许操作、保存期限、再分发范围与撤回状态的授权清单；来源或许可不清时默认拒绝处理
  - 仅接收用户自有、开放许可、机构授权文件或正式授权接口数据的采集适配器；不接收账号凭证，不绕过访问控制与平台风控
  - 保留页码、章节、段落、表格、图注和图像区域锚点的版面解析与阅读顺序组件，并显式记录OCR和解析失败
  - 按指定学科与刊物规范分别运行的排版、错别字和文字一致性规则包，规则版本可回溯，结果不自动归为科研失信
  - 基于合法参考语料的相似片段定位器，区分直接引语、引注、公共表述与待复核相似，不用重复率自动裁决抄袭
  - 结合DOI与书目元数据、撤稿或编辑关注信息和正文引用片段的引文核验器，分别报告不存在、元数据不符、上下文异常与论断支持待审
  - 针对限定图像类型的重复、拼接和处理异常提示器，保留原图、对照图、检测区域与人工结论，不推断作者故意
  - 统计表达提取、数值与表格一致性、p值复算及原始数据／代码请求清单，分别标记不适用、无法复算和需专家复核
  - 仅检查论文中伦理批准、知情同意、数据来源和利益冲突等信息缺口的提示器；正式伦理审议仍由责任主体依程序完成
  - 私密默认的证据卡与反馈草稿，记录来源、定位、规则、检测器版本、置信度、备选解释、人工状态和反馈去向
  - 真实暂停与恢复状态机：暂停后停止领取新任务，明确进行中任务等待或安全取消，保存检查点；恢复时去重且不重复反馈
  - 预想项目平台的受控交换适配器，只传任务描述、文件指纹、授权记录、最小必要检测结果、证据定位和复核状态，并保留审计日志
  - 人工确认、异议、申诉、纠错、撤回、删除和反馈幂等机制；禁止自动公开指控、批量举报或据评分自动实施不利处置
  - 按论文类型和检测层分桶的授权验收集，分别测量检出、误报、漏报、无法解析、人工采纳、撤回、有效产出和每百篇全成本

