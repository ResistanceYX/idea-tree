id: ai-legal-loophole-hunter
标题: AI法律漏洞搜寻与意见提交
一句话: 用AI扫描现行法律法规找出漏洞与冲突，向有关部门提交立法建议，并向企业与个人售卖漏洞报告
复活状态: 死透
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 法律服务
子领域: 法律科技、AI法律咨询
死法:
  - 类型: 理论证伪
    证据: 公开研究（一手论文及基准测试）
    推理: |
      一，幻觉率证伪：斯坦福团队对三大主流法律AI工具的对照测试（2025年经同行评议发表）显示，
          接了法律数据库的专用工具仍有17%至33%的幻觉率，通用大模型约43%——法律问答错一个案例是瑕疵，
          "找漏洞"错一个条款是事故；
      二，引用核验证伪：EACL 2026的CLAUSE基准用7500份扰动合同测试法律矛盾检测，
          最强模型在"法律引用匹配"任务上准确率不足14%——连引用对不对都查不清，遑论认定漏洞；
      三，中文法律任务证伪：LawBench对51个模型在中国法律任务上的评测结论是"距离可用仍有相当距离"，
          2026年PLawBench对10个前沿模型的实务题评测无一达到强表现。
      核心承诺被系统性证伪：现在的模型是"听起来专业的法学生"，不是"不会漏的审查官"。
    置信度: 高
    证据链接:
      - https://legaltek.ai/AI_Ethics_Case_Law_Report_2023-2026.pdf
      - https://github.com/mannanxanand/CLAUSE-Benchmark
      - https://kili-technology.com/blog/domain-specific-llm-benchmarks-guide

  - 类型: 巨头碾压
    证据: 公开案例
    推理: |
      一，免费锚点由国家提供：司法部主办的中国法律服务网（12348法网）由专业律师免费解答，
          累计服务超3000万人次，另有各地法律援助中心无偿服务——基础法律咨询的付费意愿被官方免费服务封顶；
      二，真实买家不要无责任主体的产品：企业法务与合规部门采购漏洞检索类服务时，
          买的是附带执业责任的"律师签名"，AI报告承担不起对等责任。
    置信度: 高
    证据链接:
      - https://info.imlaw.cn/wenda/78188.html
      - https://ncx.nc.gov.cn/ncxrmzf/xydt/202405/ec19c44be9654387b8324fca284e8f4c/files/bfce67996f4c45fb9193d3ac552b61bc.pdf

  - 类型: 政策风险
    证据: 公开法规+内部推演
    推理: |
      一，《生成式人工智能服务管理暂行办法》自2023年8月15日施行：向公众提供生成式AI服务
          须承担网络信息内容生产者责任；具有舆论属性或社会动员能力的服务须安全评估与算法备案；
          法律法规规定需行政许可的须取得许可——一个"自动给现行法律挑毛病并向公众输出结论"的服务
          三项全部踩线，安全评估对"漏洞报告"类输出的内容审查天然不友好；
      二，法律意见的资质红线：以营利为目的向社会输出法律结论，与律师执业许可制度的边界在哪里，
          目前没有给AI产品开绿灯的任何规则（纯内部推演）。
    置信度: 中
    证据链接:
      - https://www.gov.cn/zhengce/zhengceku/202307/content_6891752.htm

  - 类型: 信任成本
    证据: 公开研究（复用理论证伪证据）+内部推演
    推理: |
      一，错误代价不对称：漏掉真漏洞与信了假漏洞，对使用者都是真金白银的损失，
          而AI产品没有执业责任保险、没有行业纪律约束，出事无主体可追责；
      二，验证成本转嫁：用户拿到漏洞报告后仍须找真人律师复核——终局信任仍要回到人，
          AI只是多收一道钱的中间层；
      三，法律AI的可靠性缺陷已被证明是系统性的（见"理论证伪"条），信任无法靠营销话术建立。
    置信度: 高
    证据链接:
      - https://legaltek.ai/AI_Ethics_Case_Law_Report_2023-2026.pdf
      - https://github.com/mannanxanand/CLAUSE-Benchmark

  - 类型: 执行人限制
    证据: 创始人自我分析
    分析: |
      一，非法学专业学生，无力判断AI输出的法律结论对错，"人类审核"这一环无从履行；
      二，没有法律行业资源，拿不到真实场景做验证；
      三，合规成本（备案、评估、资质问题）远超学生项目承受能力。
    置信度: 中

需求证据:
  类型: 反向观察
  内容: |
    未观察到"AI找漏洞"的真实付费需求。反向观察：法律从业者确有检索类工具采购，
    但采购对象是附带责任主体的专业服务，本产品形态不在其采购清单上。
  附件: 无
  边界: |
    本节点可拆零件的价值在立法反馈方向（见备选节点ai-legislation-feedback），
    不在商业漏洞报告方向。

可拆零件:
  - 立法意见辅助生成器（公众端，见备选节点）
  - 法条冲突线索初筛工具（定位为律师助手，不替代判断，不输出结论）
  - 立法征求意见动向监测提醒

