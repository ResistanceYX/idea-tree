备注: |
  本节点为AI起草、人类审核的预审档案，不是某个注释产品已经失败或停止运营的验尸记录。
  按主编指定作为0044候选起草；五个明确层级依次使用0044—0048候选编号，0049由主编补充指定为0047固定策略版本的类比修改与合并节点；正式入库前仍须按当时云端复核。
  “可选块”在本系列中操作化为用户能明确选择一个或多个代码块作为处理范围，不是“代码块输入可有可无”；
  “通用”指有明确清单的多种编程语言，不等于任意语言均已支持；“说明文档”指独立Markdown等文件，不把代码内docstring重复命名成第二种产物。
  中档重启预算对应少量语言、只读建议、人工确认和小样本修改任务对照的缩围原型；全语言、全仓库自动回写和长期服务不在该承诺内。
  Winds-AI项目同时写有多语言自述与仅支持JavaScript／Python基本语法的已知问题，本稿按更窄的已知问题限定其直接证据；
  Aspose、Swimm和VS Code扩展页面只证明公开功能及厂商自述，不证明独立效果、订单或本点子需求。
  Java注释研究、Python长代码基准和Java方法级修复研究分别保留语言、数据集、任务与评价边界，不能外推为所有仓库的修改效果。
  使用云模型处理私有代码时须明确数据去向并优先提供本地或只读模式；不得为收集上下文绕过仓库权限、上传无关私有文件或保存访问凭据。
  因IDE通用助手、上下文选择、模型能力和代码耦合文档功能变化快，且本节点竞争面最宽，死因保质期设为六个月；
  复核时应重点检查巨头是否已提供双产出同步、块外依赖检索、真实修改任务对照、人工复核成本与新的失效修复证据，而不是只更新产品链接。
