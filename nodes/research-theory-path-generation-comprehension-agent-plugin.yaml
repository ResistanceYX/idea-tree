id: research-theory-path-generation-comprehension-agent-plugin
标题: 开源理论研究路径生成及记录辅助理解Agent插件
一句话: |
  输入论文URL、DOI、arXiv ID或PDF后，Agent可检索候选引用、回到核心论文证据审核重要起源、后续与争议，
  生成可扩展研究图和带定位的论文导读，并保存图谱与阅读记录；把引用闭包当成完整理论前提、自动穷尽到本科基础及正确解释所有细节仍未解决
档案类型: 预审
复活状态: 已复活
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 人工智能
子领域: 论文理论溯源与证据化辅助阅读Agent
死法:
  - 类型: 条件已死
    证据: |
      watericetangcw/academic-research-graph已经支持从论文URL、DOI、arXiv ID、标题或PDF开始，生成可交互、可继续扩展的重要起源、后续发展、争议与代码关系图，
      并为核心论文提供背景、问题、方法、证据、意义和限制导读；其开发者文档明确区分候选引用图与经过正文、实验、表格、附录或代码证据审核的语义图；
      Yurken/xiaoyan提供本地优先的多Agent学习路线、PDF全文提取、图表识别、翻译、复现指南、引用图、证据图谱、Graph RAG与Markdown笔记；
      Future-House/paper-qa已实现本地论文索引、证据片段检索、评分与上下文化摘要、带文内引用的回答、缓存及模型调用成本跟踪
    推理: |
      一，若旧判断是“缺少从单篇论文出发，向后查找研究来源、生成研究关系图并辅助读懂论文的Agent技术链”，这一条件已经翻案。
          现有实现已经覆盖输入解析、候选文献检索、核心关系证据审核、图谱展示、核心论文导读、证据问答和本地记录，不再只是抽象设想；
      二，复活的是一条可拆分的有限链：从目标论文或标识符开始，优先扩展与目标结论有关的重要分支，
          为核心节点保存来源与解释，允许用户从任一节点继续调研、合并结果和补充笔记。它不要求先发明一个能理解全部科学的通用模型；
      三，研究溯源和论文理解是两条相连但不同的任务。引用数据可以给出候选起点，正文、实验、附录与代码证据用于筛选实质关系，
          证据问答与全文解析用于解释目标论文；任何一条链都不能仅凭另一链已经存在就被宣布完成；
      四，现有实现没有证明“全部研究链路”“所有论文细节”或“自动递归到统一本科／研究生基础终点”已经完成。
          academic-research-graph自己把示例限定为代表性图谱而非穷尽式引用图，因此本节点只判有限核心技术链复活，不判完整研究史自动重建复活。
    案例: 研究图Skill、本地AI科研工作台与论文证据问答共同支持“代表性研究谱系＋带证据导读＋可持续记录”的有限复活
    证据链接:
      - https://github.com/watericetangcw/academic-research-graph
      - https://github.com/watericetangcw/academic-research-graph/blob/master/DEVELOPMENT.zh-CN.md
      - https://github.com/Yurken/xiaoyan
      - https://github.com/Future-House/paper-qa
    置信度: 高

  - 类型: 伪需求
    证据: |
      academic-research-graph围绕重要思想起源、后续、争议和未读论文导读组织结果，xiaoyan围绕学习路线、论文精读、证据关系与本地笔记组织科研流程；
      Connected Papers也说明研究者需要领域概览和发现重要论文，但其官方明确图谱按相似性排列，并不是引用树；
      当前公开材料没有给出可独立核验的长期阅读完成率、概念理解提升、节省溯源时间、误漏关键前提比例、研究采纳或持续付费数据
    推理: |
      一，“论文难读、文献太多”不等于“用户愿意长期阅读一张自动生成的巨型研究树”。研究者可能只需要一个定义、一条证明思路或几篇关键文献，
          若Agent默认交付几十个节点和长摘要，反而把阅读负担改造成图谱维护负担；
      二，图看起来完整会制造学习幻觉。用户浏览节点、收藏论文或觉得解释流畅，不等于能复述论证、独立推导、判断证据强弱或把方法用于自己的研究；
      三，相似论文发现与前提补全也是不同需求。Connected Papers等工具已经能辅助领域探索，独立Agent必须证明自己在“为什么目标论文需要这条前提、
          应先看哪一步、哪个难点已经理解”上带来增量，而不是把文献列表换一种视觉形式；
      四，可缩围为围绕具体阅读任务的按需工具：先询问读者背景、目标和可用时间，只展开当前结论所需分支，
          用“目标论文＋原有搜索方式”作对照，测量定位时间、理解测验、错误纠正、后续独立阅读和实际研究使用，而非只统计节点数与生成速度；
      五，本条不判定研究者没有溯源和精读需求，而是指出“自动生成完整研究历程”是否比少量关键解释更有持续价值，仍缺少独立需求证据。
    案例: 多种研究图与精读工具证明问题场景存在，但巨型研究树是否改善真实理解和研究行动仍未得到公开验证
    证据链接:
      - https://github.com/watericetangcw/academic-research-graph
      - https://github.com/Yurken/xiaoyan
      - https://www.connectedpapers.com/about
    置信度: 中

  - 类型: 钱算不平
    证据: |
      jnshi/math-lineage作者自报，一篇27页预印本的深度思想来源核查约消耗350M tokens，其中97%为缓存读取，运行约4小时；
      其估计50页论文可能消耗基础付费订阅每周额度的50%至100%，这些数字只属于特定实现与配置；
      academic-research-graph先做较广候选检索，再对核心论文和关系进行正文、实验、表格、附录或代码证据审核，意味着成本不只是画出引用边；
      PaperQA2提供索引缓存、集中速率限制和成本跟踪，同时说明较大论文库可能需要Crossref与Semantic Scholar密钥以避免公共限流
    推理: |
      一，完整成本是“目标论文解析＋多源检索＋全文获取＋版本去重＋逐层候选扩展＋核心论文复读＋引用上下文与证据定位＋
          反驳或第二Agent复核＋图谱渲染与存储＋失败重试＋用户纠错时间”，不能用一次摘要调用的价格代替；
      二，递归会带来分支膨胀。即使每个节点只保留少量重要前驱，深度、学科交叉、版本族、争议与后续分支仍会增加读取和复核量；
          缓存只减少重复工作，不能消除首次全文阅读、漏引补查、模型升级后的重跑和无法获取全文时的人工处理；
      三，有效成本的分母应是“经用户确认且对理解目标结论真正有用的已核验分支”，不是发现论文数、生成边数或token吞吐量。
          被剪掉的错误边、无人阅读的分支和仍需专家重做的解释都应计入无效成本；
      四，个人试用可以限制深度、节点数、全文预算和模型档位，并优先使用开放全文与本地缓存；但深度理论溯源不宜沿用普通论文日报的低预算假设。
          多用户托管还需任务队列、凭证与文档隔离、版权处理、存储、客服和兼容维护，而免费图谱与开源零件会压低通用功能收费空间；
      五，本条不把一个项目的自报消耗外推为所有论文的统一报价，也没有公开毛利或续费数据。
          预算“中”是小范围工程集成、评测与人工复核的档位，不表示单次生成至少消费一万元，更不支持“递归越完整越值得无限烧钱”。
    案例: 深度来源核查已出现高token与长耗时自报，图谱还需为证据审核和人工纠错计价，而非只计算引用遍历
    证据链接:
      - https://github.com/jnshi/math-lineage
      - https://github.com/watericetangcw/academic-research-graph/blob/master/DEVELOPMENT.zh-CN.md
      - https://github.com/Future-House/paper-qa
    置信度: 中

  - 类型: 政策风险
    证据: |
      arXiv官方说明描述性元数据与论文全文属于不同授权链，多数论文仅授予arXiv非专有传播权，全文再分发需要相应许可或权利人授权；
      PaperQA2公开说明其研究版本使用的部分论文API与许可不能开放共享，在缺乏可自由获取论文的开放路线时，用户需要自己提供PDF；
      xiaoyan明确“本地优先”不等于“完全离线”，云模型、联网搜索与同步会把相关请求发送给配置的服务商，未公开或受约束材料提交前需核对条款；
      academic-research-graph要求记录论文代表图的来源、署名、许可或使用依据，并明确项目许可证不会自动覆盖第三方论文图片
    推理: |
      一，开源Agent代码、学术元数据、单篇论文全文、论文图片和用户上传文档是不同权利对象。代码采用MIT或Apache许可，
          不会把第三方论文、图、公式排版或付费数据库内容一并变成可任意复制和公开再分发的材料；
      二，个人获得授权后的本地阅读与向公众提供全文库不是同一行为。默认应保存必要元数据、页码定位、少量必要摘录、用户笔记和原文链接，
          把全文留在用户授权的本地位置或合法来源，不绕过付费墙、访问控制或平台限制，不把第三方PDF与网页全文快照打包进公开仓库；
      三，用户输入未公开论文、审稿稿件或受合作约束材料时，本地存储不等于没有外发。模型、嵌入、搜索、OCR和同步各环节都可能构成对外传输，
          需要按任务显示数据去向，提供本地或经批准的处理路线，并将访问凭证与项目文件、日志和公开图谱隔离；
      四，递归扩展还会放大授权差异：目标论文可公开获取，不代表全部前驱、后续、补充材料和代码都能用同一方式处理。
          每个节点应保留版本、来源、开放状态、许可和获取失败原因，无法合法读取时只能降级为元数据卡并标记未核验；
      五，本条不认定现有开源项目或本点子违法，也不以单一平台条款替代具体法域、机构和合同审查。
          高置信度指向“全文、图片、私有稿件和外部模型传输必须分别管理”这一确定边界。
    案例: 代码开源与本地部署均不消除论文全文、代表图和未公开稿件的版权、许可及外部传输边界
    证据链接:
      - https://info.arxiv.org/help/license/index.html
      - https://github.com/Future-House/paper-qa
      - https://github.com/Yurken/xiaoyan
      - https://github.com/watericetangcw/academic-research-graph
    置信度: 高

  - 类型: 信任成本
    证据: |
      academic-research-graph明确把候选引用图与审核后的语义图分开，并把示例限定为代表性图谱而非穷尽式引用图；
      math-lineage通过回到较早论文原文和另一Agent复核寻找漏引，但其报告不声称完整、不判断论文是否正确，且通常未经人工审核；
      GROBID公开指标显示，PDF参考文献提取与解析在特定独立集合约0.87至0.90 F1，引用上下文识别与关联约0.76至0.91 F1，随集合变化；
      OpenAlex区分真实的referenced_works与算法计算的related_works；哥廷根大学图书馆团队的比较研究发现OpenAlex与Semantic Scholar的参考覆盖随出版商而异，
      并观察到Semantic Scholar网站与API不一致及部分references被出版商省略；Connected Papers也明确自己的相似图不是引用树
    推理: |
      一，引用关系不等于理论依赖。被引论文可能只提供背景、定义、数据、代码、基准或反例，真正采用的思想也可能漏引、错引或来自教材与更早工作；
          因此参考文献闭包既不是“理解所必需前提”的超集保证，也不是已审核的理论谱系；
      二，相似图、共被引图、文献耦合图、真实引用边与理论前提边必须分层。把OpenAlex的related_works或Connected Papers的相似关系画成箭头，
          再命名为“思想起源”，会把算法相关性强写成未经证明的学术继承；
      三，研究谱系通常会合流、分叉、互相引用和跨学科迁移，底层更适合有向图并在去重后尽量形成DAG。
          可以为用户生成树状阅读路径，但必须保留汇合边、替代路径与被剪枝原因，不能假装整个研究史天然是一棵唯一的树；
      四，“回溯到本科／研究生基础”也没有天然唯一终点。停止位置取决于读者已会什么、目标结论、学科传统、概念粒度和时间预算，
          应由读者背景诊断、概念前置测试和人工选枝决定；递归到最老论文不等于到了基础，停在教材名词上也不等于读者已经理解；
      五，PDF解析、元数据覆盖、全文不可得、公式与图表识别、模型概括和论文自身正确性会形成复合误差。
          每个结论需区分作者主张、模型解释、模型推断和用户笔记，保留页码、章节、公式、图表、附录及版本定位；
      六，完成状态必须可审计：列出已检索来源、已读全文范围、仅有摘要或标题的节点、待限流与失败任务、循环和预算截断、人工确认与争议。
          预印本不等于同行评审，Agent用于辅助阅读，不把流畅解释当作理论正确性或学术优先权的最终裁决。
    案例: 引用语义、图谱覆盖、PDF解析和思想漏引均存在独立误差，研究图必须展示证据与未完成状态而非只给流畅结论
    证据链接:
      - https://github.com/watericetangcw/academic-research-graph/blob/master/DEVELOPMENT.zh-CN.md
      - https://github.com/jnshi/math-lineage
      - https://github.com/grobidOrg/grobid
      - https://github.com/ourresearch/openalex-docs/blob/main/api-entities/works/work-object/README.md
      - https://subugoe.github.io/scholcomm_analytics/posts/s2_reference_analysis/s2_reference_analysis.html
      - https://www.connectedpapers.com/about
    置信度: 高

  - 类型: 执行人限制
    证据: |
      academic-research-graph公开列出宿主、Node与pnpm要求，开发者文档说明实时检索由宿主环境提供，可对接OpenAlex、Semantic Scholar、Crossref、arXiv、出版商页面与GitHub，
      并不绑定一个万能爬虫；其核心关系需要证据审核、稳定ID、版本族去重、Schema校验和渲染检查；
      GROBID源码构建要求OpenJDK 21及Linux或macOS原生环境，当前不能保证既有Windows支持，较高精度深度学习模型还需额外配置，部分场景需要Python、JEP或GPU；
      xiaoyan源码运行需要Node、pnpm、Rust与Tauri平台依赖，并按任务配置模型和可选搜索服务；PaperQA2要求Python 3.11以上和模型服务，较大索引还涉及元数据服务密钥与限流
    推理: |
      一，安装一个插件不等于建立可靠研究链。输入解析、检索适配器、全文权限、模型密钥、向量或全文索引、图数据库、渲染与本地备份任一环节异常，
          都可能使自动递归退化为标题级列表、部分完成或沉默失败；
      二，更难的工作在学术判断而非画图。维护者需要能检查引用上下文、版本族、公式与实验定位，目标读者或领域专家还要决定哪些前驱真正必要、
          哪个基础概念可以停、哪些解释误导了原论证。外包部署或让另一个AI代操作不能替代这类责任；
      三，个人或小团队还需持续处理宿主升级、API与出版商页面变化、模型替换、限流、全文权限、数据迁移和成本回归。
          对长任务必须提供暂停、恢复、去重、循环检测、深度与节点预算、失败可见性和增量合并，不能依赖一次超长无状态生成；
      四，可缩围为先支持一个学科、少数开放全文来源和固定版本的单篇论文，人工选定少量核心前驱，先验收目标论文导读与一层证据链，
          再逐步增加递归深度、争议和跨学科分支；固定环境、缓存与人工审核能降低门槛，但不会把深度溯源变成零维护；
      五，公开资料没有跨学科安装失败率、专家复核工时或长期维护成本，故本条保持中置信度。
          它说明实际执行约束，不把工程复杂或需要领域知识写成所有用户都无法使用。
    案例: 现成研究图、PDF解析和证据问答降低零件门槛，但适配器、全文权限、长任务恢复与领域复核仍决定能否持续运行
    证据链接:
      - https://github.com/watericetangcw/academic-research-graph
      - https://github.com/watericetangcw/academic-research-graph/blob/master/DEVELOPMENT.zh-CN.md
      - https://github.com/grobidOrg/grobid
      - https://github.com/Yurken/xiaoyan
      - https://github.com/Future-House/paper-qa
    置信度: 中

需求证据:
  类型: 研究图与论文精读开源实现、文献发现产品及深度思想来源核查案例
  说明: |
    academic-research-graph提供从论文、概念、benchmark、学术主张或论文代码仓库开始的研究图，支持重要起源、后续、争议、核心论文导读和从任一节点继续扩展；
    xiaoyan把研究规划、PDF精读、实验、知识主张与笔记连成可追溯工作流，PaperQA2则把科学文档证据检索和带引用回答做成可复用组件。
    Connected Papers公开说明其源于研究者改进文献检索工作流的实际需要，math-lineage进一步展示了逐节阅读、寻找漏引、回到较早论文核查并保留双方定位的深度需求。
    这些材料共同支持“理解一篇论文不仅需要摘要，还需要知道关键前提从何而来、证据在哪里、下一步读什么”是已出现多种实际供给的问题场景。
    但现有材料主要证明产品、功能和案例存在，不等于独立审计后的需求强度。当前没有足以确认用户会长期使用完整链路树、
    理解效果优于传统阅读、节省时间、接受递归成本、付费或续费的公开数据；仓库Star、图谱节点数、截图和作者自报性能均不作为长期留存证据。
  附件: 无

商业及社会价值评估: |
  商业价值：直接受益者是需要进入新领域的研究生、科研人员、工程师、跨学科团队、研发策划者，以及需要向他人解释研究脉络的教师和技术写作者；
            对读者而言，按自身背景选择停止层、从目标结论反查必要前提、保留公式与图表定位、在下一次会话继续扩展，可能比单次摘要更接近真实工作。
            潜在付费者首先是希望获得私有部署、团队共享图谱、机构全文访问适配、可审计研究记录和部署支持的个人或组织，
            可测试安装托管、私有工作流定制、学科模板、人工专家复核和研究知识库集成，而不是出售公开论文列表或未经授权的全文。
            免费文献图、通用模型和开源组件会压低基础图谱与摘要的收费空间；真正可能形成差异的是可验证覆盖率、证据定位、错误纠正、
            用户背景适配、持续记录和私有材料治理，而这些差异目前均未证明能形成商业闭环。
            商业验证应按“每条经读者确认有用且证据核验通过的分支全成本”与节省的检索和阅读时间、理解提升、持续使用及支付意愿比较，
            把全文获取、模型、深度复核、失败重试、存储、凭证隔离、专家纠错和兼容维护计入成本。若只在低频个人自用成立，可以是有效工具，但不自动构成可扩张公司。
  社会价值：可审计的研究谱系与分层导读可能降低跨学科阅读门槛，帮助学习者看到概念、方法、数据和争议如何汇合，
            也能通过回到较早论文和保存双方定位，减少漏引造成的思想来源遮蔽，为教学、同行讨论和研究复盘留下可修改档案。
            开源零件与本地记录提供了避免黑盒一次性回答的可能，用户可检查为什么选取某条边、哪些全文未读、何处被预算截断，并补充自己的笔记和反证。
            相反，把引用闭包包装成完整研究史会抹去未被引用的贡献，把模型解释包装成定论会放大误读；
            高计算成本、付费全文和学科数据覆盖差异还可能让资源充足者获得更完整的图谱。自动选择“重要工作”也会继承数据库与模型的主流偏好，
            使小众、非英文、跨学科或早期未被充分索引的研究更容易被剪枝。较有社会价值的形态是默认公开证据范围和未完成状态，
            允许多条阅读路径与人工补枝，保留原始出处和版本、尊重全文及图片权利、默认不公开私有稿件，
            并把是否接受论文结论、认定学术优先权或采用高风险领域建议留给研究者和相应专业审核，而不是让Agent担任最终裁决者。

可拆零件:
  - 接收论文URL、DOI、arXiv ID、标题或授权PDF，并维护预印本、发表版、补充材料与代码仓库版本族的输入解析器
  - 保留页码、章节、段落、公式、图表、附录和PDF坐标的本地论文结构化与降级处理器
  - 区分定义、定理、方法、数据、基准、反例、背景和仅作相关工作罗列的引用上下文分类器
  - 对接OpenAlex、Semantic Scholar、Crossref、arXiv及出版商页面并记录来源、许可、限流与缺失字段的多源检索适配器
  - 按DOI、标题、作者、年份和版本族去重，同时检测循环引用、重复扩展与错误合并的实体解析器
  - 具有深度、节点、全文、token、时间和费用上限，支持暂停恢复及pending状态的递归扩展队列
  - 将目标论文拆成研究问题、前提、关键主张、方法、证据、限制和结论之间依赖关系的论证骨架
  - 分开记录真实引用、算法相似、理论前提、方法继承、数据使用、扩展、批评与复现关系的分层边模型
  - 以有向图保存合流和分叉、按读者目标投影为树状阅读路径并保留被剪枝原因的双视图图谱
  - 根据读者学科背景、已掌握概念、目标结论、粒度和时间预算决定何时停止的前置诊断与人工选枝器
  - 将作者主张、模型解释、模型推断和用户笔记分层，并逐项回链页码、公式、图表和附录的证据化导读卡
  - 记录已检索数据库、全文覆盖、仅有标题或摘要节点、漏引补查、失败任务、预算截断与人工确认的覆盖率报告
  - 保存图谱Schema、证据卡、阅读进度、笔记、争议与修订历史，并支持从任一节点继续扩展和增量合并的本地研究档案
  - 默认使用原文链接和必要定位、不公开再分发全文或代表图、对私有稿件显示外部模型与搜索数据去向的权利和隐私路由器
  - 以理解测验、独立复述、关键前提召回、错误边率、定位准确率、实际阅读完成和每条有效分支全成本为指标的评估包
  - 面向数学、计算机、实验科学等不同证据形态配置教材终点、证明步骤、实验复核和争议展示方式的学科适配模板

