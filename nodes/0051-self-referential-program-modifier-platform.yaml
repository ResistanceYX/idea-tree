  “自指”仅指本系统也能把自身代码与元修改机制列为修改对象，不创建指向0051自身的相关节点记录，也不表示人类意义的自我意识。
  平台默认指私有的目标登记、候选修改、独立评测、版本档案和回滚系统，不预设公开作品分发社区；若改为公开平台，须另评冷启动、供应链和内容治理。
  与0008、0020、0049均为跨样本元层抽象而非直接派生：三者分别提供修改器与平台、专用程序生成及版本修改组合样本，
  不能据此传递扩展关系到它们的其他相关节点，也不能把归纳来源改写成直接母题。
  已复活仅指限定任务、预算与外部反馈下的自指修改和版本筛选技术链；公开论文结果均按作者实验报告引用，本稿未独立复现这些系统，
  不把论文基准提升写成任意平台收益，不把固定外层、冻结基础模型、人工设定目标或监督机制省略掉。
  所有目标须为自有、开源许可允许或明确授权的代码与配置；默认本地优先、最小权限、只读基线和隔离副本，使用云模型或外部服务时须说明数据去向。
  不在节点、日志、证据附件或公开站保存API Key、Cookie、token、秘密值、私有地址、第三方全文或无关专有代码；
  不绕过仓库权限、访问控制、验证码、反自动化或平台限制，不让候选版本自行批准、发布、扩张权限或控制真实生产系统。
  本稿只使用公开HTML研究页和项目页作为证据，没有上传论文PDF、网页全文、完整代码包或实验材料；论文中的风险案例只作概念层摘要，不形成操作指南。
  死因保质期设为六个月：自指Agent从固定元机制到可编辑元机制仍在快速演进，独立评测、防篡改和成本结论也可能随新系统及复现研究变化；
  到2027-05-25前应重点复核任务表现与修改能力是否仍被混同、平台外层是否可安全开放、独立复现和真实使用是否出现，以及每有效修改全成本是否下降。
  若更早出现可复现的通用自指平台、重大评测完整性事件或成本显著变化，应提前复核；不得机械顺延日期。
