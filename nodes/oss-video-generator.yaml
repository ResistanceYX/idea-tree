id: oss-video-generator
一句话: 开源工具，输入任意 GitHub 仓库，AI 一键生成约5分钟宣传视频与约5分钟入门讲解视频，中英双语，便于上传国内外社交媒体
档案类型: 预审
复活状态: 死透
重启预算: 低
创新类型: [渐进式, 技术应用]
领域: 开发者工具
子领域: 内容生成与项目推广
死法:
  - 类型: 钱算不平
    证据: Tidelift 2025 维护者调查显示 60% 开源维护者无报酬、26% 从项目年收入不足 1000 美元；AI 视频 API 按秒计费，2026 年市场价约 $0.05-0.60/秒（Veo 3.1 全档位），一条 300 秒视频仅生成成本约 $15-180
    推理: 目标用户（开源维护者）约 86% 从项目年收入不足 1000 美元，却要为一个仓库付出 $15-180 的单次生成成本（重试另计）；开源项目营销传统上零预算，收入端无任何付费设计，成本端随视频时长线性膨胀
    案例: 维护者经济状况调查与视频 API 公开定价
    证据链接:
      - https://safeguard.sh/resources/blog/open-source-funding-crisis-dependency-tree-impact
      - https://www.cloudzero.com/blog/veo-3-pricing/
    置信度: 高
    
  - 类型: 巨头碾压
    证据: repo-to-video 赛道 2026 年已有至少五个商用工具（Poko Motion、RepoClip、readme-to-video、Code2Video、OpenMontage）；视频模型 API 由 Google/OpenAI/字节等巨头掌控且寿命极短，Sora API 于 2026-09-24 关停、Veo 3.1 preview 于 2026-10-22 关停
    推理: 开源套壳工具在别人的按秒计费 API 之上没有成本优势与技术护城河；商用竞品已占据搜索结果与心智，巨头随时可将该功能原生集成进自家平台，依赖的 API 本身也可能在下个季度消失
    案例: 赛道竞品盘点与视频模型 API 关停记录
    证据链接:
      - https://poko.video/blog/best-github-to-video-tools
      - https://www.cloudzero.com/blog/veo-3-pricing/
    置信度: 高
    
  - 类型: 伪需求
    证据: GitHub README 不支持内嵌视频（其 Markdown 渲染器会剥离 video 与 iframe 标签），项目主页这个最大展示位只容得下 GIF 或外链；终端演示 GIF 工具 charmbracelet/vhs 已成事实标准（含官方 CI Action，GIF 可随代码更新自动重建）
    推理: 视频需求的自然落点（README）恰好放不了视频，只能流向社交媒体，而维护者为项目运营双平台社交账号并制作五分钟长视频的意愿极低；轻量演示需求已被代码生成 GIF 以更便宜、可版本化的方式满足
    案例: README 渲染限制与 vhs 生态
    证据链接:
      - https://github.com/charmbracelet/vhs
    置信度: 中
    
  - 类型: 执行人限制
    证据: 创始人自我分析
    分析: 起草时为大一学生，无视频生产与 GenAI 工作流经验，无开源社区人脉；该点子需要持续跟踪多家视频模型 API 的定价与关停变动（2026 年内已发生两次），维护成本与课业冲突
    置信度: 中
    
需求证据:
  类型: 竞品生态观察
  说明: 赛道存在五个以上商用 repo-to-video 工具且持续更新，间接证明存在小众付费需求；但未观察到开源维护者群体层面的直接需求证据（社区呼吁、高频讨论等）
  附件: 无
  
可拆零件:
  - 仓库理解到讲解脚本的 Prompt 流程
  - 中英双语视频脚本文案模板与校对清单
  - README 关键信息抽取器（可迁移到其他文档生成场景）
  - AI 视频 API 价格追踪表（多厂商按秒计价比价）

