备注: |
  “已复活”仅指单节点链接到可编辑视频的技术链已有模型、公开创作实践和产品证据，不代表这个具体开源项目已经实现或获得持续采用。
  本项目由创作者选择节点、配置生成、审核成品并自行发布；不包含抓取整个知识库后无人审核地批量发布，也不自动替创作者承担或免除内容责任。
  漫士沉思录动态采用其公开动态页作为来源，具体文字位于2026年10月17日11:32动态；
  伊万不是大氢弹10月30日动态仅保留为主编指定线索，未取得稳定直链前不引用其具体观点。
  与oss-video-generator是深化扩展而非直接派生，因为新节点的问题域超出GitHub开源仓库，不满足直接派生子题须完全包含于母题的规则。

