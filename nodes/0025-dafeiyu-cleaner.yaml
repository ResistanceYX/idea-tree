备注: |
  本节点为AI起草、人类审核的预审档案，不是现有插件或作者已经失败、停止或转向的验尸记录。
  已复活仅指“本地识别、标记、折叠或隐藏特定大肥鱼生态疑似评论”的开源浏览器插件已经存在；
  不表示通用AI文本检测已经可靠，不表示账号身份得到最终确认，不表示平台治理、长期留存、商业闭环或社会净收益已经证明。
  重启预算“低”针对个人使用现有开源代码、自有浏览器和可选自有API Key进行本地部署；
  商业再分发、持续跨浏览器维护、独立识别评估和平台级治理不属于这一预算口径。
  来源按证明力分层使用：公开仓库、隐私说明、架构与源码证明作者公开的功能、权限、数据流和作者自述；
  独立媒体用于确认评论过滤需求、互补工具关系与真人模仿现象；国家网信办法律文本和政策问答用于公开个人信息与自动化处理边界；
  通用AI文本检测研究只支持一般误报和评估依赖，不作为本插件的实测结果。作者自报识别指标未当作独立审计。
  源码核对发现空间公开资料请求使用credentials: 'include'；本节点只据此要求区分“未直接读取Cookie”与“请求不携带登录状态”，
  没有据此声称Cookie被发送给DeepSeek或已经发生泄露，也未在档案中保存任何API Key、Cookie、登录态或真实用户私人数据。
  死因保质期设为一年，因为大肥鱼话术与热梗、B站DOM和公开接口、浏览器扩展权限、模型服务及相关规则均可能快速变化。
  本节点来自主编新指令，不预填原清单序号或G17永久编号；G17编号方案在本稿起草时仍未实施。
  相关节点只保留与开源哔哩哔哩自主宠物鲸Agent插件的强互补关系；通用跨平台宠物鲸仅共享生态证据，
