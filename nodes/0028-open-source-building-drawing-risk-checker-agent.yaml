编号: "0028"
id: open-source-building-drawing-risk-checker-agent
标题: 开源建筑图纸低级风险智能检测Agent
一句话: |
  在合法取得且有权处理的IFC／BIM等输入上，运行结构、必需属性、引用、版本差异、构件碰撞和明确规则的机器校核，
  生成带对象定位、规则来源、模型版本和复核状态的待核问题；PDF、扫描图纸与DWG须分别验证输入能力，
  检测结果不构成建筑安全认证、施工图审查合格或专业责任替代
档案类型: 预审
复活状态: 已复活
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 建筑信息化
子领域: 图纸与BIM质量检查
死法:
  - 类型: 条件已死
    证据: |
      IfcOpenShell官方文档将其介绍为开源IFC库，列出IFC语法与更详细的Where Rule校验、IfcClash碰撞检查、
      IfcDiff模型比较、IfcTester按IDS生成校验报告，以及向AI编程助手暴露查询和编辑工具的IfcMCP；
      buildingSMART官方页面说明IDS 1.0已于2024年成为正式标准，可用计算机可解释形式定义IFC对象、分类、材料、属性和值的要求，
      其示例包括检查墙体是否具有指定FireRating属性及合法值；
      Solibri的Autorun厂商页面则把定时运行检查、分类和报告作为既有商业产品能力。前两项证明开源与标准底座，
      厂商页面只证明公开产品形态和厂商主张，不是独立效果审计
    推理: |
      一，若旧判断是“没有开源工具能对建筑模型执行结构校验、明确属性规则、碰撞或版本差异检查”，这一条件已经不成立。
          这些任务具有明确输入、机器规则和可定位输出，不必先解决所有建筑规范的自然语言理解；
      二，本节点复活的是“把现有开源检查器、规则包和模型接口编排成辅助工作流，并由人复核问题”的技术条件。
          IfcMCP等接口证明大模型可以调用工具，但不证明它能自行选择正确规则、理解所有项目语境或对结果负责；
      三，IFC／BIM结构化模型、原生CAD图纸、PDF、扫描图像和OpenSCAD等程序化模型不是同一种输入。
          IFC能力不能直接外推成对扫描PDF或任意DWG具有同等检出能力，跨格式转换还可能丢失语义；
      四，既有商业产品已经覆盖部分自动检查，说明需求类别和产品形态并非空白，也意味着新项目不能只凭“会跑碰撞检查”形成差异化。
          已复活不等于完整Agent、真实项目效果、采购需求或商业闭环已经验证。
    案例: 开源IFC校验、IDS规则、碰撞与差异工具已经能组成有限检查链，复活范围止于可追溯的辅助检查
    证据链接:
      - https://docs.ifcopenshell.org/introduction.html
      - https://www.buildingsmart.org/standards/bsi-standards/information-delivery-specification-ids/
      - https://www.solibri.com/solutions/autorun
    置信度: 高

  - 类型: 理论证伪
    证据: |
      2023年自动规范审查综述指出，规范自然语言形式化、规则解释与更新、BIM模型信息不足和人工预处理仍是关键难点，
      并区分规则表示、模型准备与审查执行等不同环节；2025年一项LLM辅助规范审查研究也要求模型准备、规则解释和人工核验，
      其脚本生成与检查结果只对应论文的数据集、规则和实验设置，不是所有项目或规范的固定成功率；
      另有二维CAD图纸符号检测研究使用深度学习和合成数据识别特定符号，它证明的是特定视觉任务，不等于恢复完整BIM语义或完成施工图审查
    推理: |
      一，强版本“输入任意格式图纸，Agent即可自动发现所有低级风险并判定规范合格”与其核心机制相矛盾：
          图像或PDF中未表达、模型中未建模、交换时丢失的信息，不能靠检查器凭空恢复为可靠事实；
      二，规范中的定量阈值、必需属性和对象关系可能形式化，定性条款、例外、引用链和地方适用规则则需要解释与版本管理。
          能把一条规则写成代码，不代表整座规范体系都能无歧义自动执行；
      三，视觉模型识别一个符号，与理解该符号在专业图纸中的系统关系、设计意图和法律审查意义是不同任务。
          不得用单一数据集识别指标替代跨专业、跨图纸类型的风险检出证明；
      四，因此被证伪的是无条件、全格式、全自动的强承诺，不是明确规则检查本身。
          可行路线必须把每条检测规则绑定到适用输入、所需字段、规范出处和已知盲区。
    案例: 模型缺信息、规范难形式化和视觉识别任务边界共同否定“任意图纸一键审查”的强版本
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC10151318/
      - https://www.mdpi.com/2079-9292/14/11/2146
      - https://link.springer.com/article/10.1007/s10032-024-00492-9
    置信度: 高

  - 类型: 伪需求
    证据: |
      湖南省政府2020年材料记录了当地BIM三维智能审查实践和施工图审查改革，福建省住建厅2025年材料也记录了当地智能审查系统应用；
      两者均是特定地区、时期和系统口径的官方材料，可证明施工图质量检查存在真实工作场景，不能外推为全国采用率或新产品订单；
      Solibri等商业产品已经提供规则检查与自动运行能力。当前没有目标设计团队对开源Agent的访谈、试用、采购或持续使用数据
    推理: |
      一，需要检查图纸和模型，不等于需要再买一个开源Agent。设计团队可能已使用商业BIM审查、建模软件自带功能、
          内部检查表和人工会审，新工具必须证明相对这些替代方案的增量；
      二，官方智能审查案例证明的是质量检查场景和机构需求，不证明外部小团队能进入同一采购与责任体系，
          更不能把官方系统自报数量写成本产品可获得的市场规模；
      三，较可信的缩围是找到已经维护IFC模型、反复遇到同类属性或版本问题的团队，记录现有检查耗时、漏检返工和工具费用，
          再用真实项目做对照；只拿公开样例模型展示“能报问题”不足以证明需求；
      四，本条不判定建筑质量检查是伪需求，而是把“行业需要质量控制”与“用户需要本节点所述新产品”分开。
          后者尚未验证，故保持中置信度。
    案例: 官方实践与商业供给证明检查需求存在，但开源Agent仍需证明相对既有工具和人工流程的增量价值
    证据链接:
      - http://www.hunan.gov.cn/hnyw/bmdt/202011/t20201123_13963791.html
      - https://zjt.fujian.gov.cn/xxgk/gzdt/bmdt/202509/t20250911_7008848.htm
      - https://www.solibri.com/solutions/autorun
    置信度: 中

  - 类型: 信任成本
    证据: |
      自动规范审查研究持续把模型信息质量、规则解释、人工补充和结果核验列为限制；
      2025年LLM辅助研究同样保留人工审查环节，不能把特定实验中的脚本生成或检查结果当作独立安全证明；
      中国政府网公布的经两次修正的施工图设计文件审查管理办法规定，勘察设计企业对建设工程勘察、设计质量负责，
      审查机构对施工图审查工作负责并承担审查责任，同时对审查范围、专业人员和合格书等作出要求
    推理: |
      一，建筑图纸问题可能牵涉结构与消防安全，用户需要相信的不只是“工具有输出”，还包括输入完整、规则适用、定位准确和漏报边界。
          一个低误报演示不能证明未报告的区域没有风险；
      二，可信报告应同时给出模型版本、构件或图纸位置、触发规则、规范及版本、所需输入是否齐全、置信度和备选解释，
          并允许复核人接受、驳回、补充或升级问题。只给红色告警或自然语言结论不足以支持追责与修复；
      三，自动结果只能作为辅助线索，不能签发审查合格、替代注册专业人员或改变法定责任。
          “低风险”“低级”只是任务分层标签，不是免证词，更不能凭名称推定错误不会造成高影响后果；
      四，本条高置信度指向“高影响场景必须保留证据链与人工责任”，不是宣称现有工具必然误报或无效。
    案例: 规范与模型的不确定性叠加法定审查责任，使可追溯报告和人工复核成为交付条件而非附加装饰
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC10151318/
      - https://www.mdpi.com/2079-9292/14/11/2146
      - https://www.gov.cn/zhengce/2022-01/25/content_5711961.htm
    置信度: 高

  - 类型: 钱算不平
    证据: |
      自动规范审查研究表明，规则转换、模型准备、数据补充和结果核验需要独立工作；
      LLM辅助研究可减少部分规则编写劳动，但仍依赖模型准备、规则解释与人工核验，且实验结果不能直接外推为维护成本；
      Solibri等既有产品已经把部分检查和自动运行产品化。当前没有本项目的真实开发报价、规则库规模、项目清理工时、复核成本或付费数据
    推理: |
      一，开源库降低的是部分许可与底层开发成本，不会自动消除规则获取与解释、项目模板配置、坏模型清理、测试、专业复核、
          部署支持和版本维护。每增加一种文件格式、专业或地区规则，都会增加独立验收集；
      二，如果工具产生大量需要专家逐条排除的误报，节省的自动检查时间可能被复核劳动抵消；
          如果为压低误报而只保留极窄规则，又可能不足以覆盖用户期待。应以每个经确认问题的总处理成本而非告警数量核算；
      三，既有商业产品会压缩“通用检查器”的溢价空间。开源项目较可能的收入在私有部署、项目适配、经审核规则包、集成和支持，
          但这些路径的采购意愿与毛利均未验证；
      四，本条没有证据支持具体亏损数字，只确认成本项和替代竞争不可省略，因此保持中置信度。
    案例: 底层检查开源不等于项目交付免费，规则、模型、复核和维护决定每个有效问题的真实成本
    证据链接:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC10151318/
      - https://www.mdpi.com/2079-9292/14/11/2146
      - https://www.solibri.com/solutions/autorun
    置信度: 中

  - 类型: 执行人限制
    证据: |
      IfcOpenShell虽提供丰富开源组件和AI工具接口，使用仍需理解IFC对象、查询、规则与模型上下文；
      二维CAD符号检测研究需要针对特定符号构建训练与测试数据，不能把通用多模态模型当作无需验收的替代；
      施工图审查管理办法对审查机构和专业人员设有条件与责任要求。上述资料均未证明普通小团队已经具备真实项目交付能力
    推理: |
      一，实施者至少要同时具备BIM／IFC数据处理、建筑工程语境、规则工程、软件测试与质量责任意识。
          只会调用大模型API，不能补齐缺失的构件语义、专业规则与验收数据；
      二，最小团队可以复用IfcOpenShell，从单一IFC版本、少数对象和明确属性规则开始；
          若一开始承诺扫描PDF、DWG、IFC全格式及多专业规范，标注、转换、回归测试与专家复核会迅速超出同一规模团队的能力；
      三，真实项目还可能含客户知识产权和未公开设计资料，需要访问控制、最小留存、日志脱敏和删除机制。
          把图纸直接交给未经客户批准的第三方模型服务，不是无条件的“开源部署”优势；
      四，本条不判定所有小团队都不能做，而是要求把完整交付拆成可验收能力，并以真实项目专家和负样本测试补齐团队边界。
    案例: 开源组件可缩短原型路径，但跨格式、跨专业、真实项目和责任交付仍需要复合团队与受控数据流程
    证据链接:
      - https://docs.ifcopenshell.org/introduction.html
      - https://link.springer.com/article/10.1007/s10032-024-00492-9
      - https://www.gov.cn/zhengce/2022-01/25/content_5711961.htm
    置信度: 中

需求证据:
  类型: 官方智能审查实践、现有商业供给；开源Agent增量需求待验证
  说明: |
    湖南与福建官方材料证明特定地区存在BIM／施工图智能审查实践，Solibri产品页证明规则检查和自动运行已有商业供给。
    这些材料分别属于地方历史实践、地方系统材料和厂商自述，不能合并推算全国需求、实际准确率、节省工时或采购规模。
    IfcOpenShell与IDS证明开源和标准化检查条件存在，但技术供给不等于用户愿意更换流程。
    本轮没有取得目标设计企业、BIM团队或审查人员的访谈，没有本项目真实项目试用、误报漏报、返工下降、订单或续费数据；
    最关键的缺口是：谁已经拥有质量足够的结构化模型，仍反复遇到现有工具未覆盖的明确问题，并愿意为适配与复核付费。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在使用者包括维护BIM模型的设计与顾问团队、需要版本和碰撞复核的项目团队，以及希望增加辅助质量检查的机构；
            谁采购、预算来自软件、咨询还是质量流程，以及回款周期均未验证。开源底座可支持私有部署、项目适配、
            经专业审核的规则包、与现有BIM流程集成及技术支持，但通用检查功能已有商业产品，不能把开源或接入大模型本身当作付费理由。
            商业核算应比较同一项目上的规则配置、模型清理、自动运行、专家复核、误报处理和维护总成本，
            与现有流程的审查工时、返工和软件支出；告警数量、演示速度和开源下载量都不能替代持续使用与回款。
            当前没有本项目的订单、收入、利润或商业闭环证据。
  社会价值：对明确属性和几何关系的早期检查，可能帮助团队更早发现不一致、减少返工与材料浪费，
            开放规则和报告也有助于使用者理解检查依据。但上述收益只有在真实项目中减少经确认问题且不过度增加复核负担时才成立；
            漏报造成虚假安全感、误报造成无效整改、未经批准泄露设计资料，都可能抵消收益。
            辅助检查不能替代法定施工图审查、专业设计和安全责任，不能把“技术可运行”直接写成“建筑更安全”的社会结果。

可拆零件:
  - IFC、原生CAD、PDF、扫描图纸和程序化模型的输入能力矩阵，逐项记录保留语义、所需转换和禁止外推的能力
  - 基于IfcOpenShell的IFC语法、Where Rule和对象结构校验，以及输入版本与文件指纹记录
  - 带规范出处、版本、地区、适用对象、必要字段和人工解释记录的IDS／自定义规则包
  - 可配置检查范围、碰撞集合、排除条件和容差的IfcClash工作流，避免无差别全模型告警
  - 基于IfcDiff的模型版本比较，将新增、删除和属性变化与规则复核任务关联
  - 包含模型版本、构件定位、原文或规则依据、输入完整性、置信度、备选解释和复核状态的问题报告
  - 接受、驳回、补充、升级和关闭问题的人工复核队列，以及误报漏报回流和规则变更审计
  - 由真实授权项目与合成故障共同组成的验收集，分别覆盖正例、负例、缺字段、跨版本和格式转换失真
  - 面向未公开设计资料的访问控制、私有部署、最小留存、日志脱敏、删除和第三方模型调用批准机制
  - 按每个经确认问题记录自动检查、人工复核、误报处理、返工避免和规则维护成本的项目账本
  - 面向设计团队的替代方案访谈与同项目对照试用，验证相对商业工具、软件自带功能和人工会审的增量价值

死因保质期: 2027-11-14
起草AI: 澄樾（Kimi-K3.1）
审核人: ResistanceYX
审核日期: 2026-11-14
备注: |
  本节点为AI起草、人类审核的预审档案，不是某个建筑软件项目实施后失败、停止或转向的验尸记录；当前没有具体验尸对象，不能编造。
  已复活仅指开源IFC校验、IDS规则检查、碰撞、版本比较和工具编排已经能支持有限的辅助检测，
  不表示原设想的全格式、全自动、全规范Agent已经交付，也不表示建筑安全、审查合格、真实需求或商业闭环得到证明。
  标题沿用清单中的“建筑图纸低级风险”，正文将“低级风险”限定为可定义、可定位、可复核的机器检查线索；
  风险是否低级仍须结合构件、专业与项目语境判断，不能由告警模板自行保证。
  重启预算“中”对应复用开源底座、限定IFC输入和少量明确规则、由专业人员参与的小规模原型与项目验证；
  任意PDF／扫描图纸／DWG、多专业规范、生产级部署和完整责任交付不属于同一预算口径，可能需要高预算且仍未证明可行。
  来源分层使用：IfcOpenShell证明开源功能，buildingSMART证明IDS标准，Solibri只证明厂商公开产品能力；
  学术论文用于说明规范形式化、模型准备和特定实验边界，不跨任务外推检出率；
  湖南与福建材料只证明地方实践，住建部规章用于说明法定审查与责任边界。
  本节点没有直接派生或已证实的强关联节点，相关节点不填写，不因同属Agent或都涉及文档检查而机械建立关系。
  死因保质期设为一年，复核时应更新IFC／IDS与AI工具接口、跨格式输入能力、规范形式化研究、真实项目验收、监管与商业证据。
