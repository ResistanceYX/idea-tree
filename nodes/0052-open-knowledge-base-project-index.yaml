编号: "0052"
id: open-knowledge-base-project-index
标题: 开源知识库索引库
一句话: |
  面向分散在代码托管站、机构仓储和独立站点的知识库项目，建立只保存必要元数据与原文入口的分层索引：
  先登记公开候选，再分别核验代码许可、内容／数据许可、访问方式、维护主体、更新状态与来源证据，
  经人工复核后标记开放状态；自动检查只提示失效、变化与许可缺口，不把Star、最后提交时间或模型摘要当作内容可信证明
档案类型: 预审
复活状态: 复活候选
结论边界: |
  复活候选仅指通用元目录、自动聚合器、专业登记库与开放关联数据目录已经分别证明“项目发现—元数据登记—筛选查询—持续更新”的相邻技术链，
  可支撑一个限定领域、元数据优先、人工复核的缩围原型；不表示已经存在并验证了一个覆盖跨领域开源知识库、逐条区分代码与内容许可、
  同时处理来源追溯、纠错撤回和持续维护的同名完整产品，也不证明独立目录的持续需求、商业闭环或内容质量认证能力
重启预算: 低
创新类型: [渐进式, 技术应用]
领域: 信息基础设施
子领域: 开放知识资源登记、元数据治理与发现
死法:
  - 类型: 条件已死
    证据: |
      bayandin/awesome-awesomeness已经把其他Awesome列表作为收录对象，公开展示“目录的目录”这一形态；
      Ecosyste.ms Awesome进一步把多个列表及其项目、主题、项目数和最近更新时间组织为可浏览的聚合目录；
      re3data官方说明其提供覆盖各学科的研究数据仓库登记、多个筛选维度、开放元数据与API；
      LOD Cloud则公开了数据集收录门槛、机器可读原始数据、SPARQL查询和带日期的历史版本表
    推理: |
      一，若旧前提是“无法把分散的知识资源项目整理成可搜索、可筛选、可机器读取并持续更新的目录”，这一强条件已被多类公开实现推翻；
      二，可复用的不是某一个网站的页面皮肤，而是项目级标识、收录标准、元数据Schema、原始入口、更新记录、查询接口和版本历史；
          因而缩围原型不必先发明新的爬虫、搜索引擎或知识图谱技术；
      三，这些实现的对象并不相同：Awesome元目录收录列表，Ecosyste.ms聚合Awesome生态，re3data限定研究数据仓库，
          LOD Cloud限定符合Linked Data要求的数据集。它们不能拼接成一个“跨领域开源知识库索引已经完整存在”的结论；
      四，因此本节点保持复活候选：基础目录与元数据链已成熟，真正的增量应是对“何为知识库项目、何为开放、何时失效”的可复核治理，
          而不是再生成一个只有名称、链接和AI简介的静态榜单。
    案例: 通用元目录、自动聚合器、研究数据登记库和Linked Data目录共同证明相邻技术链已存在，但准确产品边界仍未被完整覆盖
    证据链接:
      - https://github.com/bayandin/awesome-awesomeness
      - https://awesome.ecosyste.ms/
      - https://www.re3data.org/about
      - https://www.lod-cloud.net/
    置信度: 高

  - 类型: 伪需求
    证据: |
      GitHub官方Topics已经支持按主题探索仓库、寻找项目和发现解决方案；
      sindresorhus/awesome与Ecosyste.ms Awesome分别提供人工总目录和自动聚合视图，re3data的长期运行及第三方服务使用则说明专业登记库可以服务明确场景；
      这些材料证明“发现仓库、列表或研究数据仓库”有真实用途，但本轮没有取得用户需要一个新增跨领域开源知识库索引的访谈、持续使用、
      跨领域检索成功率、纠错贡献或付费数据
    推理: |
      一，“知识库分散”不等于“用户愿意切换到另一个总目录”。通用搜索、代码托管平台主题、Awesome列表和专业登记库已经覆盖部分查找路径，
          新产品必须证明它减少了跨站检索和许可核对劳动，而不是把同一批链接再搬一次；
      二，跨领域既可能是差异化，也可能使分类和推荐失去明确任务：寻找可复用研究数据、寻找学习资料、寻找可嵌入Agent的知识源，
          并不是同一个需求，不能用统一的“知识库”标签掩盖使用场景差异；
      三，较可信的验证是让用户带着真实查找任务，分别使用现有搜索／目录和本索引，比较找到合适项目的成功率、所耗时间、
          许可信息补齐率、原文点击后的实际复用及一段时间后再次使用；
      四，条目数、抓取量、页面访问和Star只能证明供给或可见度，不能替代“找到了原本漏掉的合适知识库”这一有效产出。
          若去掉AI摘要和跨领域包装后，用户仍只需要GitHub、Awesome或某一专业登记库，独立产品的需求就不成立。
    案例: 多类目录已经服务发现需求，但“再建一个跨领域索引是否比现有入口更有效”仍缺少直接对照证据
    证据链接:
      - https://docs.github.com/articles/classifying-your-repository-with-topics
      - https://awesome.ecosyste.ms/
      - https://www.nature.com/articles/s41597-023-02462-y
    置信度: 中

  - 类型: 巨头碾压
    证据: |
      GitHub原生Topics把仓库分类、相关主题和搜索留在开发者已经使用的平台内；
      sindresorhus/awesome已经形成跨主题人工总目录，Ecosyste.ms Awesome则提供低门槛的聚合浏览与更新信息；
      re3data在研究数据仓库这一高价值垂直场景提供细粒度登记与开放接口。上述服务并非同一产品，也不全是商业巨头，
      但共同构成免费或已嵌入既有工作流的强替代供给
    推理: |
      一，对“按主题找项目、浏览热门列表、查看最近更新”这些基础任务，平台原生功能和既有目录拥有更低切换成本，
          会先压低通用链接导航的独立价值与收费空间；
      二，自动聚合进一步削弱了“把别人的列表汇总起来”作为技术壁垒的意义。若新增项目只做标题、描述、Star和最后提交时间，
          用户可以直接使用现有平台，而不必等待另一个目录重新收录；
      三，仍可测试的差异是跨来源实体去重、代码与内容／数据许可分栏、收录证据、许可变更、归档撤回、人工复核记录和可导出历史，
          这些属于治理与审计服务，而不是更漂亮的榜单；
      四，本条判定的是通用发现层受到强替代压力，不是GitHub、Awesome或re3data已经覆盖所有知识库，
          也不是主张新产品必须在流量上击败它们。若差异化只剩“更多链接＋AI摘要”，最容易被既有生态吞没。
    案例: 平台原生发现、免费总目录、自动聚合和专业登记库共同压缩通用索引层，但尚未消除可审计开放状态治理的空间
    证据链接:
      - https://docs.github.com/articles/classifying-your-repository-with-topics
      - https://github.com/sindresorhus/awesome
      - https://awesome.ecosyste.ms/
      - https://www.re3data.org/about
    置信度: 中

  - 类型: 执行人限制
    证据: |
      re3data官方FAQ说明，仓库运营者可提交候选，项目团队依据手册分析网站，发布前由第二位团队成员复核；
      2013年PLOS ONE论文进一步记录，不同仓库网站结构差异使索引耗时，很多网站缺少必要政策信息而需要联系运营者，
      第二人复核至少再花费首次索引一半的时间；
      Awesome的PR模板要求提交者认真评审至少4个其他开放PR、列表至少存在30天、运行lint、排除重复及无人维护条目并具备合适许可，
      其主仓库当前又暂时关闭PR以处理积压；OpenDOAR当前公告则暂停新提交和更新，正在审查服务并计划于2027年1月提供进展
    推理: |
      一，普通实施者的具体限制是“缺少领域语境→收录边界漂移；缺少许可与政策阅读能力→把公开误记为开放；
          缺少第二人复核和运营者联络时间→待审积压；缺少持续巡检与纠错人力→元数据陈旧却仍被搜索和传播”；
      二，关键工作不是一次性导入链接，而是候选去重、范围判断、许可适用范围核对、缺失信息询问、来源证据保存、
          独立复核、变更检测、归档撤回、异议处理和复核队列治理；
      三，这些工作被省略后，项目后果是收录标准随投稿漂移、同一项目多份记录、代码许可误覆盖内容、失效项目仍标活跃，
          最终需要用户重新核验全部条目，目录反而增加而不是减少劳动；
      四，缓解边界是先限定两个明确领域和少量字段，允许“未知／待核验”而非强行补全，把候选公开与开放核验通过分层，
          并设定每条记录的复核预算和停止条件。自动lint、链接检查和模型抽取可以减负，但不能替代政策判断与责任承担；
      五，OpenDOAR的暂停只直接证明其自身服务治理状态，Awesome的积压也只代表该项目，不能外推为所有目录必然失败；
          它们与re3data的编辑流程共同说明，持续维护是核心生产工作而非上线后的零星修补。
    案例: 专业登记库的第二人复核、Awesome的投稿门槛与积压、OpenDOAR的暂停更新共同揭示目录维护的人力约束
    证据链接:
      - https://www.re3data.org/faq
      - https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0078080
      - https://github.com/sindresorhus/awesome/blob/main/pull_request_template.md
      - https://github.com/sindresorhus/awesome
      - https://opendoar.ac.uk/help/policy-support
    置信度: 高

  - 类型: 信任成本
    证据: |
      Open Definition 2.1把开放知识与开放许可或公共领域状态、整体访问、机器可读和开放格式等要求联系起来；
      Choose a License的“无许可证”说明指出，公开仓库没有许可证时，通常不意味着他人获得使用、修改和分享许可；
      re3data的收录流程要求弄清访问方式和使用条款，OpenDOAR则把元数据、数据、内容、提交和长期保存政策分开处理
    推理: |
      一，“能在网页上看到”“能克隆仓库”“代码采用开源许可证”“文字与数据允许再利用”是不同命题；
          若索引只用仓库主页的一个许可证徽章给整个知识库贴上“开源”标签，可能把代码权限错误扩展到文档、图片、数据库和第三方摘录；
      二，用户还需要知道许可证据来自哪个文件、适用于哪部分作品、由谁在何时核验，以及项目改版、撤回或许可证变化后如何处理；
          模型可以提取候选许可证，却不能把缺失条款补成授权，也不应把自动判断当成最终法律结论；
      三，目录应至少区分“公开候选、开放状态已核验、许可范围不完整、无法核验、已归档、已撤回”，并保留原始证据和复核历史；
          对无许可或范围不明的项目仍可登记发现信息，但不能进入“已核验开放”集合；
      四，即使开放许可成立，也不等于内容准确、完整、安全或适合某个高影响场景。索引可以提供来源和更正入口，
          不能把收录、Star、链接存活或最近提交包装成内容可信认证；错误的开放标签和过期状态本身会制造新的信任成本。
    案例: 开放知识定义、无许可证风险和专业登记库的政策字段共同要求把可访问、可复用与内容可信拆成不同核验层
    证据链接:
      - https://opendefinition.org/od/2.1/en/
      - https://choosealicense.com/no-permission/
      - https://www.re3data.org/faq
      - https://opendoar.ac.uk/help/policy-support
    置信度: 高

  - 类型: 钱算不平
    证据: |
      re3data的2013年论文直接记录了网站异构、缺失政策信息和第二人复核带来的持续人工工作；
      2023年Scientific Data论文展示了该登记库多年运行、元数据开放和被其他开放科学服务使用的基础设施价值，
      但两篇论文都不是本节点的成本、收入或利润审计；
      OpenDOAR暂停新提交和更新则提供一个现实反例：即使目录已有公共价值，服务治理与持续供给仍可能需要重新安排
    推理: |
      一，完整账包括候选发现、实体去重、许可与政策核对、运营者联络、第二人复核、争议和撤回、失效巡检、
          API与搜索托管、元数据迁移以及用户纠错；静态网页和自动抓取只能减少其中一部分；
      二，成本应按“每条在复核周期内仍有效、且被用户实际采用的知识库项目记录”计算，而不是每条抓取链接或每次页面访问。
          大量低质量候选、重复条目和无人使用的字段会同时增加审核成本与噪声；
      三，志愿服务、机构资助和公共基础设施都是可行价值实现方式，开源项目也不必以利润为唯一目标；
          但“有人愿意无偿审核”不能被记作零成本，长期公共价值也不能自动证明某个独立团队有可持续时间和资金；
      四，可缩围为现有目录的许可补层、变更监测或某一机构内部的私有观察清单，由使用者承担检索与托管成本；
          若要向普通用户持续收费，免费平台和专业登记库会压低基础链接列表的价格锚点，目前无订单、收入或续费证据。
    案例: 长期登记库证明社会基础设施价值，却不能抵销逐条编辑、复核和治理账；公共价值与商业可持续性必须分开验收
    证据链接:
      - https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0078080
      - https://www.nature.com/articles/s41597-023-02462-y
      - https://opendoar.ac.uk/help/policy-support
    置信度: 中

需求证据:
  类型: 多类目录与专业登记库证明资源发现需求；新增跨领域索引的独立持续需求未证实
  说明: |
    GitHub Topics、Awesome总目录、Ecosyste.ms聚合、re3data和LOD Cloud说明用户与机构确实需要发现、筛选和机器读取分散资源，
    其中re3data的长期运行及第三方服务使用是专业登记库具有实际作用的较强信号。
    这些证据支持“减少资源发现和元数据核对劳动”的问题存在，却不能直接证明还需要一个覆盖所有领域的开源知识库索引。
    最小验证应限定两个领域和一种明确用户任务，与GitHub／通用搜索、Awesome及相关专业目录进行同任务对照，
    记录找到合适项目的成功率、检索和许可核验时间、原文点击后的实际复用、误收录与漏收录、重复查询、纠错贡献和再次使用。
    若优势只来自条目更多或摘要更流畅，而用户仍须回到原站重新完成全部核验，则不应扩张为跨领域公共目录。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在使用者是需要寻找可复用知识源的研究人员、开发者、开放源码维护者、图书馆与数据管理人员，
            以及希望把合法知识源接入自身工具的团队；实际预算承担者和付费意愿尚未确定。
            可测试的付费点不是出售公开链接，而是面向机构的许可证据补全、私有观察清单、变更与撤回提醒、审核工作流、
            元数据API和技术支持。免费原生搜索、Awesome生态与专业登记库压低了通用目录价格，人工复核又使规模扩张不是零成本；
            商业验证应比较每条持续有效且被采用记录的全成本与用户节省的检索／核验时间，当前没有收入、续费或商业闭环证据。
  社会价值：可追溯的项目级索引可能帮助小众知识库被发现，降低重复搜集和许可核对劳动，并保留归档、变更与撤回历史；
            候选与开放核验分层也能把“公开可见但无再利用授权”的资源从误导性开源榜单中分离出来。
            风险包括热门平台与英语项目偏差、自动摘要掩盖来源、错误开放标签扩大未经授权复用，以及中心目录停更后形成新的过期依赖。
            较有社会价值的形态是元数据和复核规则开放、原文入口清楚、未知状态诚实、纠错撤回可执行，并允许其他目录复用核验结果，
            而不是以收录数量或流量宣称知识质量。

可拆零件:
  - 收录范围决策器：区分知识库项目、知识库软件、资源列表、单篇文档和全文镜像，记录纳入与排除理由
  - 多源候选发现适配器：读取合法公开页面和公开接口，只保存必要元数据、原始链接与自制摘要，不绕过访问限制
  - 跨来源实体解析与去重器：识别改名、迁移、镜像、Fork和同源列表，保留关系而不把链接数当成独立项目数
  - 项目级元数据Schema：记录名称、主题、维护主体、原文入口、访问方式、代码许可、内容／数据许可、更新状态与最近复核时间
  - 候选与核验分层状态机：区分公开候选、开放状态已核验、信息不全、无法核验、已归档和已撤回，禁止自动跳级
  - 许可证据卡：绑定具体许可文件、适用作品范围、权利声明、证据日期与复核人，允许未知和冲突，不由模型补造授权
  - 来源与修订链：保存字段来源、必要摘录、变更前后值和撤回原因，不复制第三方全文、完整网页快照或数据库dump
  - 持续变化巡检器：检测入口失效、仓库归档、许可文件变化和维护状态异常，只生成复核任务而不自动宣布内容可信或死亡
  - 人工复核与异议队列：支持第二人复核、运营者补充、用户纠错、来源撤回和受影响记录标记，公开处理状态
  - 静态搜索、筛选与开放导出：按主题、访问、许可、维护和复核状态查询，提供带版本日期的元数据导出与API
  - 对照需求评估表：与GitHub、通用搜索、Awesome和专业登记库比较任务成功率、核验时间、实际复用、误漏与再次使用
  - 全成本账本：按候选筛选、人工索引、第二人复核、联络、巡检、纠错、托管和实际采用记录归集成本，并设置停止条件

