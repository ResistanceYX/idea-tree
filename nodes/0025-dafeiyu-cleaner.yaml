编号: "0025"
id: dafeiyu-cleaner
标题: 大肥鱼消除计划
一句话: |
  在Chrome／Edge／Firefox浏览器中以离线规则和可选DeepSeek精判识别B站疑似大肥鱼评论，
  并在使用者本机标记、折叠或隐藏；它复活的是个人评论过滤，不是对账号AI身份的最终裁决或平台级清理
档案类型: 预审
复活状态: 已复活
重启预算: 低
创新类型: [渐进式, 技术应用]
领域: 人工智能
子领域: AI生成内容识别与个人信息过滤
死法:
  - 类型: 条件已死
    证据: |
      liyupi/dafeiyu-cleaner公开仓库已经提供Chrome／Edge／Firefox浏览器扩展，采用Manifest V3、原生JavaScript和本地存储，
      以昵称、签名、等级、头像颜色、评论文本、行为模式与跨页面记录进行离线评分，并可选用使用者自己的DeepSeek API Key精判；
      插件支持只标记、折叠、自动处理、极简模式、人类白名单、放回来和名单管理。
      项目说明与架构文档明确“赶走”“清场”只修改本机页面，不删除服务器评论，不调用举报、拉黑、点赞或发评论等B站写接口；
      独立媒体报道也把它记录为与自动宠物鲸相对的评论隐藏工具
    推理: |
      一，若旧判断是“普通用户缺少能识别并减少特定AI评论的可用工具”，这一条件已经翻案。
          公开源码、安装路径、离线识别、页面处理和纠错控件共同构成了可检查的产品链，不再只是概念；
      二，复活核心是“接收者本地、可设置、可撤销的信息过滤”。离线规则使不配置模型Key的用户也能使用基本功能，
          白名单、撤销和极简模式则把误伤纠正与低干扰使用纳入同一产品，而非事后补充；
      三，本地隐藏只改变当前使用者看到的内容，不等于原评论被删除、被隐藏账号受到平台处罚，
          更不等于插件已经证明某账号必然由AI控制。其技术可行性也不能外推为跨平台通用AI检测能力；
      四，公开实现与媒体记录足以支持有限复活，不证明所有浏览器版本均能无故障运行，
          不证明作者样本之外的识别率、长期留存、商业收入或社会净收益已经成立。
    案例: 开源浏览器扩展与独立媒体报道共同支持“本地识别、标记、折叠或隐藏特定疑似AI评论”的核心路线复活
    证据链接:
      - https://github.com/liyupi/dafeiyu-cleaner
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/docs/ARCHITECTURE.md
      - https://m.sohu.com/a/1098096428_122014422?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334
    置信度: 高

  - 类型: 伪需求
    证据: |
      澎湃新闻转载报道记录了大肥鱼评论扩散后，创作者需要从大量AI评论中寻找真人反馈；
      大肥鱼消除计划提供本地隐藏、只标记、折叠和极简模式，说明实际需求既包括减少评论噪音，也包括保留人工判断空间；
      独立报道把它概括为“一个把鱼放出去，一个把鱼挡在视线外”的互补工具。
      与此同时，插件还包含空间鉴定、战绩、动画、音效和驱逐玩法，公开资料没有分别证明这些扩展功能都有持续需求
    推理: |
      一，已被支持的需求是“我不想付出那么多筛选成本”，不是“我想知道每个账号在本体上是不是AI”。
          前者可以通过本地折叠、关键词过滤、只看熟人或平台屏蔽等多种方式满足，识别模型只是其中一种手段；
      二，对需要真人反馈的创作者，漏掉AI评论会继续增加筛选劳动，误藏真人评论则会直接损失目标信息。
          因此有效产出应是“经用户确认保留下来的有用真人评论和节省的筛选时间”，不是识别账号数、遣返数或战绩；
      三，动画、音效、空间评分和驱逐仪式可以增强玩梗传播，却也可能把效率工具变成另一种页面干扰。
          极简模式是重要降险设计；若用户长期只使用极简过滤，就不能把角色玩法的热度当成核心功能留存；
      四，本条不判定整个点子没人要。较可信的缩围是默认本地、可解释、可撤销的评论过滤，
          把空间鉴定、跨页面前科和娱乐化表现分别验证，不能用工具出现本身证明全部功能组合都有必要。
    案例: 评论噪音催生了真实过滤工具，但用户需要的是减少筛选劳动，不一定是娱乐化鉴定或确定账号身份
    证据链接:
      - https://www.thepaper.cn/newsDetail_forward_34440373?commTag=true
      - https://github.com/liyupi/dafeiyu-cleaner
      - https://m.sohu.com/a/1098096428_122014422?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334
    置信度: 中

  - 类型: 季节魔咒
    证据: |
      现有产品的名称、角色、台词、武器、战绩与传播话语都紧密围绕“大肥鱼”这一特定社区热梗；
      媒体报道显示该现象来自DeepSeek社区二创、DSH插件和B站评论互动的集中扩散。
      当前公开材料能够证明热度期的使用与反向需求，尚不能证明热梗降温后这套特定包装仍有持续使用
    推理: |
      一，热梗越集中，专用清理工具越容易在短期内获得理解和传播；但当大肥鱼账号减少、平台治理改变或讨论转向新梗，
          “专门消除大肥鱼”的新增需求可能同步下降，已有用户也可能不再维护规则；
      二，长期存在的母需求是减少重复、低价值和非自愿的机器评论，而不是永远针对某一种蓝色鲸鱼形象。
          若产品只能识别固定昵称、头像和话术，它会随目标换装与热梗迁移而老化；若扩展为通用过滤，又会面对更难的误报与需求定义；
      三，角色化包装与底层过滤应分开评估。前者可能是季节性传播层，后者才可能沉淀为长期工具；
          不能用通用信息过滤需求永远存在，反推这套大肥鱼主题产品不会过时；
      四，本条没有大肥鱼热度已经衰退的证据，因此只判定季节依赖与转型门槛，不宣布当前需求已经消失。
    案例: 热梗专用包装帮助工具短期传播，也使持续需求依赖大肥鱼生态或向通用评论过滤成功转型
    证据链接:
      - https://github.com/liyupi/dafeiyu-cleaner
      - https://www.thepaper.cn/newsDetail_forward_34440373?commTag=true
      - https://news.qq.com/rain/a/20261103A0EWS500
    置信度: 中

  - 类型: 钱算不平
    证据: |
      项目免费开源，默认离线规则不需要用户配置模型Key，也没有作者自有服务器；
      可选DeepSeek精判由使用者填写自己的API Key，插件把昵称、等级、签名、至多三条评论和离线分发送给模型，
      空间鉴定还可能发送近期投稿标题与头像地址；七天精判缓存用于减少重复Token支出。
      公开资料没有给出普通用户完整一个月的精判调用量、失败重试、维护工时、纠错时间或付费数据
    推理: |
      一，个人低频使用现有开源代码时，离线路线可以把直接货币成本压得很低，这是有限复活的重要条件；
          但“免费开源”只说明获取代码的价格，不等于安装、升级、误伤纠正、名单整理和兼容维护没有时间成本；
      二，云精判的全成本应按“API输入输出＋失败与重试＋缓存维护＋密钥管理＋用户查看判词和纠错”计算。
          如果每个可疑账号都反复精判，而用户仍需逐条复核，模型费用可能叠加而不是替代人工筛选成本；
      三，有效成本的分母应是用户确认有用的过滤结果和节省的阅读时间。误藏真人需要找回，漏判AI仍需手动处理，
          过多动画与报告也可能增加新的阅读负担；遣返数和模型调用量都不是有效产出；
      四，开源核心会压低单纯转售同一份插件的收费空间。较可验证的收费方向是安装支持、私有规则定制、企业或创作者工作流维护，
          但当前没有支付意愿或续费证据；若靠导出和传播账号名单获利，还会新增隐私与信任成本；
      五，本条不虚构API单价或断言作者亏损，只确认“离线默认较低成本、云精判与持续维护可能使账重新失衡”的条件。
    案例: 离线本地路线控制直接费用，但模型精判、人工纠错和长期兼容仍须计入有效过滤的全成本
    证据链接:
      - https://github.com/liyupi/dafeiyu-cleaner
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/dafeiyu-cleaner/PRIVACY.md
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/dafeiyu-cleaner/src/background.js
    置信度: 中

  - 类型: 政策风险
    证据: |
      扩展会向B站页面注入脚本，并在本地保存账号ID、昵称、遣返名单、人类白名单、跨页面前科、最近BV号和可选API Key；
      开启精判后，部分公开账号资料与评论会发送给DeepSeek，Firefox还要求单独取得websiteContent授权。
      《个人信息保护法》要求处理个人信息具有明确合理目的、采取影响最小方式并保证信息质量，
      对已公开个人信息只可在合理范围内处理；个人明确拒绝或处理对个人权益有重大影响时另有约束。
      国家网信办2026年政策问答进一步把超出合理范围收集、留存或处理已公开个人信息，以及利用其从事网络暴力等列为审计关注情形。
      此外，项目代码、标题字体、角色美术与品牌分别具有不同授权说明，MIT代码许可不自动覆盖全部分发素材
    推理: |
      一，评论、昵称和账号资料公开可见，不等于可以不受目的、范围和影响约束地永久画像或公开扩散。
          个人在本机隐藏评论、开发者规模化汇总账号标签、把名单公开用于声讨，是风险不同的处理活动，不能混成一句“处理公开数据”；
      二，当前本地、默认离线、可清空和可撤销设计有利于缩小影响；云精判则把数据流扩展到第三方，
          应明确展示发送字段、触发时机、接收方政策与关闭方式，不能把“没有作者服务器”写成“数据永不离开本机”；
      三，隐私说明称不直接读取或发送Cookie，但公开源码的空间资料请求使用credentials: 'include'。
          这不证明Cookie被发给DeepSeek或已经发生泄露，却说明“未直接读取Cookie”不等于“所有请求均不携带浏览器登录状态”，
          隐私说明和后续版本审计应分别核对直接读取、浏览器自动附带凭据和第三方接收三件事；
      四，本地过滤本身不等于平台自动处罚，不宜把针对重大权益决定的全部规则无差别套到个人隐藏操作；
          但若把概率标签升级为自动举报、公开黑名单、商业风控或其他权益裁决，准确性、告知、人工复核、更正和申诉要求就会显著提高；
      五，代码开源也不等于角色、美术、字体和品牌均可商业复用。再分发或商业产品应逐项核对许可并替换权利不清的素材。
          本条不是认定现有插件违法，而是确认公开数据、第三方精判、页面注入和素材分发各有不能省略的边界。
    案例: 公开评论的本地过滤与云精判、跨页面画像、公开名单及商业分发具有不同合规与授权边界
    证据链接:
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/dafeiyu-cleaner/PRIVACY.md
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/dafeiyu-cleaner/manifest.json
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/dafeiyu-cleaner/src/space.js
      - https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm
      - https://www.cac.gov.cn/2026-08/12/c_1788195297373459.htm
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/README.md
    置信度: 高

  - 类型: 信任成本
    证据: |
      作者自述曾在一个含284个账号的真实评论区样本中，离线规则不看头像认出约85%的大肥鱼且未误伤；
      该结果属于作者样本自报，不是覆盖真人模仿、AI换装、不同视频语境和长期运行的独立基准。
      媒体报道记录了真人顶着大肥鱼头像和昵称模仿AI的现象；通用AI文本检测研究也表明检测结果会受任务、文本和评估条件影响，
      但后者不能直接当作本插件特定角色规则的实测失败率。
      项目已提供人类白名单、“是人类”、放回来、名单管理、只标记和极简模式，并把不含前科的原始分作为记录前科的门槛以避免自我强化
    推理: |
      一，这个工具处理的是“像不像某类账号”的概率判断，不是可凭昵称、头像、低等级或文风最终证明身份。
          真人可以玩梗，AI也可以更换外观和表达；误报与漏报会随模仿、对抗和生态变化同时存在；
      二，误藏真人会让使用者错过本来希望看到的反馈，公开传播误判名单还可能损害账号声誉；
          漏判则使用户继续承担筛选劳动。两类错误不能用同一个“识别率”掩盖，也不能只展示成功遣返案例；
      三，白名单、撤销、可解释命中原因、原始分与前科分离、默认只标记和本地处理都是实质降险措施。
          但跨页面记录仍会把一次判断带入新语境，导出名单也会把私人过滤辅助变成可扩散标签，因此需要清空、更正、到期和外传警示；
      四，DeepSeek判词或思维链可以让用户看到模型理由，却不等于理由真实、完整或足以裁决身份。
          较稳妥的交互是显示“不确定”、允许用户只看本地标签、随时恢复，并明确禁止把分数直接用于自动举报或公开羞辱；
      五，本条高置信度指向“概率识别必须保留纠错与用途边界”，不是宣称现有插件普遍误伤，
          也不是用通用AI检测研究替代该插件尚缺少的独立、分层和持续评估。
    案例: 真人模仿与AI外观变化使身份判断存在双向错误，本地可撤销过滤与公开身份裁决必须严格分开
    证据链接:
      - https://github.com/liyupi/dafeiyu-cleaner
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/dafeiyu-cleaner/PRIVACY.md
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/docs/ARCHITECTURE.md
      - https://news.qq.com/rain/a/20261103A0EWS500
      - https://arxiv.org/html/2503.23622v1
    置信度: 高

  - 类型: 执行人限制
    证据: |
      架构文档明确插件需要在B站页面主世界于document_start读取评论组件数据，再通过postMessage交给隔离世界处理；
      B站改版时评论DOM、shadow root和选择器是最先可能失效的部分，空间页公开接口也可能因风控降级。
      Chrome与Firefox的后台、主世界注入和数据收集授权存在版本差异，Firefox精判还需运行时websiteContent授权；
      公开接口、头像读取、模型API和本地缓存共同构成持续维护面
    推理: |
      一，对普通使用者，开发者模式安装、浏览器版本、权限弹窗、可选Key和异常后的名单恢复都可能成为具体门槛；
          默认离线和无构建步骤降低了部署难度，但不能保证页面升级后仍开箱即用；
      二，对维护者，关键工作包括跟踪B站组件和公开接口、回归Chrome／Firefox、处理跨域头像与权限差异、
          更新目标话术规则、检查模型返回变化，并验证升级不会把旧白名单或前科错误迁移；
      三，任一适配层失效都可能表现为评论不再扫描、错误折叠或空间鉴定中断。
          若实施者只会安装而不会查看日志、回退版本和清空错误记录，一次平台改版就可能让工具长期沉默或持续误处理；
      四，缩围路线是优先维护只标记和本地折叠，关闭自动处理与云精判，给DOM／接口失败设置显式降级，
          并在更新前用包含真人模仿、AI换装和不同评论长度的测试页回归。通用跨平台扩展不能直接复用这里的低维护估计；
      五，公开资料没有系统性的安装失败率、页面改版频率或维护工时，因此本条保持中置信度，
          不把源码复杂或需要维护直接写成项目已经不可用。
    案例: 页面主世界注入、平台DOM与接口、浏览器权限和模型服务共同决定普通用户与维护者能否持续使用
    证据链接:
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/docs/ARCHITECTURE.md
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/dafeiyu-cleaner/manifest.json
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/dafeiyu-cleaner/src/space.js
      - https://github.com/liyupi/dafeiyu-cleaner/blob/main/dafeiyu-cleaner/src/background.js
    置信度: 中

需求证据:
  类型: 开源实现、独立媒体报道与反向评论过滤需求
  说明: |
    公开仓库提供了可检查的浏览器扩展、离线识别、可选云精判、本地处理和纠错设计，证明工具已被实际实现；
    澎湃新闻转载报道记录了创作者从大量AI评论中寻找真人反馈的困难，独立报道又明确记录了大肥鱼消除计划与自动宠物鲸的互补关系。
    这些材料共同支持“部分B站用户和创作者需要减少AI评论噪音、提高真人反馈可见度”，而不只是作者对需求的单方面宣称。
    需求成立的对象首先是使用者自己的信息过滤，不是所有观众都要求清理AI，也不是平台应当按插件分数处罚账号。
    当前没有独立核验的长期活跃安装、持续使用、节省阅读时间、误报／漏报分层评估、付费或续费数据；
    作者自报的284账号样本、约85%识别和无误伤结果只作为项目样本自述，不作为通用准确率或商业需求审计。
  附件: 无

商业及社会价值评估: |
  商业价值：直接受益者是被重复AI评论增加筛选劳动的B站观众、希望找到真人反馈的创作者，以及需要研究特定社区互动生态的用户。
            现有核心代码免费开源、默认可离线使用，单纯转售同一插件的空间有限；较可验证的方向是安装与升级支持、
            私有规则和工作流定制、面向创作者的本地反馈整理，以及明确不公开账号标签的维护服务。
            商业核算应比较“每个经用户确认有用的过滤结果或每小时节省筛选时间的全成本”与持续使用和支付意愿，
            全成本包括可选API、失败重试、人工纠错、兼容维护和隐私保护；遣返数、调用数和短期下载热度都不能替代有效产出。
            当前没有公开商业闭环证据。若去除动画、战绩和公开名单后仍有稳定过滤使用，工具价值更容易独立成立。
  社会价值：接收者在自己浏览器里减少不想看的内容，能够增加信息选择权，并以比平台级删除更小的外部影响缓解评论过载；
            本地默认、只标记、可解释原因、白名单、撤销和极简模式，为概率识别工具提供了可复用的降险样本。
            但误伤真人会损失真实声音，跨页面前科与导出名单可能把临时猜测固化为身份污名，云精判还扩大了数据处理边界。
            社会净收益较高的形态是私人默认、最小数据、可纠错、不外传标签、不自动举报，并把真人模仿和AI换装纳入持续评估；
            不是用“清理”话术鼓励公开围猎，也不是把本地偏好包装成对账号身份的客观裁决。

可拆零件:
  - B站评论组件与空间页的适配层，以及DOM、公开接口或风控变化时的显式降级和停止自动处理机制
  - 昵称、签名、评论、行为和头像特征组成的可解释离线评分器，并保留命中原因与不确定档
  - 不含历史前科的原始分与跨页面记忆分离机制，以及前科清空、到期、更正和防自我强化测试
  - 只标记、折叠、自动处理和极简模式分离的本地处理路由，默认不调用任何B站写接口
  - 人类白名单、“是人类”、放回来、遣返名单管理和整页撤销组成的纠错链
  - 可选云精判的字段最小化、发送前提示、接收方说明、运行时授权、失败降级与一键关闭
  - 本地API Key保存、七天精判缓存、调用计数和按有效过滤结果核算的成本面板
  - 默认不公开、导出前提示误伤与扩散风险的本地名单导入导出，以及到期清理和更正机制
  - 同时包含真人模仿、AI换装、不同评论长度与视频语境的独立测试集，分别报告误报、漏报、不确定率和找回率
  - Chrome／Firefox、B站组件、公开接口、头像读取和模型服务变化的分层兼容性回归清单
  - 与识别逻辑解耦的原创角色和界面包，以及代码、美术、字体、品牌分别记录的授权清单

