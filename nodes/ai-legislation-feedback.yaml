id: ai-legislation-feedback
标题: AI立法意见辅助提交
一句话: 公众对着法律草案说出自身经历，AI将其整理成规范立法意见并辅助提交至中国人大网征求意见系统
复活状态: 死透
重启预算: 低
创新类型: [渐进式, 技术应用]
领域: 政务服务
子领域: 立法参与、公民科技
死法:
  - 类型: 巨头碾压
    证据: 公开案例
    推理: |
      一，官方渠道二十年前已存在且零门槛：中国人大网法律草案征求意见系统2005年开通，
          常态化设置征求意见专栏，线上系统实行"零门槛"设置，登录即可对正在审议的法律草案
          直接提交意见——产品的"提交"环节没有可占据的空间，本工具只能寄生在官方渠道之内，
          无法自立为平台；
      二，官方渠道同时垄断了正当性：经由人大系统的意见是制度承认的参与，
          第三方工具代交的意见没有独立的制度地位，工具价值只剩"格式整理"这一薄层；
      三，官方渠道仍在自我强化：征求意见接口已扩展至国家法律法规数据库、
          "全国人大"微信公众号等多个平台——轮子的制造者一直在给轮子加辐条。
    置信度: 高
    证据链接:
      - http://www.npc.gov.cn/npc/c2/c30834/202502/t20250211_442772.html
      - https://www1.xinhuanet.com/politics/20250214/f361b3cfb3134f028c9870026c694799/c.html

  - 类型: 伪需求
    证据: 公开统计（官方数据、评论案例及文献摘录卡）
    推理: |
      一，规模数据反杀需求基础：官方口径2008年以来367件次草案、
          参与超185万人次——摊到十四亿人头上，深度参与者约千分之一量级；
          文献抓取2008至2022年277次征求意见的全量统计显示，参与人数中位数仅327人
          （数据见evidence/ai-legislation-feedback-sources.md摘录卡）；
      二，结构极端且动力单向：约70%的法律草案参与人数不足1000人，
          《立法法（修正草案）》这类重要法律仅466人参与；
          参与集中于利益直接相关的草案（民法典婚姻家庭编超21万人次），公益性草案普遍冷场，
          东莞地方立法甚至出现"零意见"（见人民网案例链接）；
      三，意愿缺口是需求本身的问题：入口开着、门槛为零、二十年劝不动——
          AI把"写意见"变得再顺滑，也回答不了"我为什么要参与"。
    置信度: 高
    证据链接:
      - http://cpc.people.com.cn/pinglun/n/2013/0712/c78779-22179176.html
      - https://www.qstheory.cn/20260224/a9a82032b37b40c7b843d86ffa483332/c.html
      - https://www.toutiao.com/article/7512358432578470415/

  - 类型: 理论证伪
    证据: 公开研究（复用母体节点证据）
    推理: |
      一，代写意见的AI自身法律能力存疑：LawBench对51个模型在中国法律任务上的评测结论是
          "距离可用仍有相当距离"，PLawBench对前沿模型的实务题评测无一达到强表现
          （详见母体节点ai-legal-loophole-hunter"理论证伪"条）；
      二，立法意见的特殊性放大了该缺陷：找漏洞错了是用户受损，立法意见写错了
          是污染立法参考信息——后者的错误负外部性更大，容错率更低。
    置信度: 中
    证据链接:
      - https://kili-technology.com/blog/domain-specific-llm-benchmarks-guide

  - 类型: 执行人限制
    证据: 创始人自我分析
    分析: |
      一，学生身份，非法学专业，无力评估AI代写意见的法律准确性；
      二，公益工具没有收入，纯靠热情维持，热情曲线与学期强相关（期中周即停更）；
      三，涉及立法内容的输出需额外谨慎，个人承担不起内容出错的舆论与合规风险。
    置信度: 中

需求证据:
  类型: 暂无需求
  内容: |
    未观察到公众"想要AI辅助写立法意见"的需求信号。
    现有参与数据中，主动提交意见者的动机主要是利益相关（行业、地域），
    无利益相关的纯公共参与极少——需求不是没有入口，而是没有动机。
  附件: 无
  边界: |
    本节点是社会价值归档，不构成创业建议。可复用的是"把官方法律文本
    翻译成人话"的生成能力，方向在普法内容而非参与工具。

可拆零件:
  - 草案文本"人话版"摘要生成器（普法方向）
  - 立法征求意见动向监测提醒（订阅制小工具）

相关节点:
  - 节点: ai-legal-loophole-hunter
    关系: 母体（同源）
    说明: |
      本节点由主节点的可拆零件"立法意见辅助生成器"独立成节点，
      是"没有商业价值但可能有社会价值"判词的实体化归档。
      相对母体的弱化轴：付费方从企业/个人变为无；输出从"漏洞结论"
      降为"意见草稿"；责任从卖方承担变为用户自担。

死因保质期: 2027-06-30
