编号: "0033"
id: open-source-guji-collation-agent-plugin
标题: 开源古籍版本比对与校勘辅助Agent插件
一句话: |
  对用户合法取得或明确授权的古籍扫描件与文本，用开源Agent完成预处理、OCR、分级校对和修改审计，
  并接入多版本对比、异文留存与来源页回溯，生成供研究者裁决的校勘材料；
  不把文本差异自动判为讹误，也不把文献比对包装成真实历史事件的自动还原
档案类型: 预审
复活状态: 已复活
结论边界: |
  已复活仅指Collate已公开中文历史文献的Agent OCR、校对、审计与导出链，
  Open Guji Platform已公开古籍多版本对比和可视化差异能力，两者共同证明有限技术组合具有现实基础；
  不表示同一Agent已经端到端贯通全部能力，不涵盖任意古籍与扫描质量的可靠识别、
  底本与版本源流的自动裁决、真实历史事实还原、独立用户规模、学术效果或商业闭环
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 数字人文
子领域: 古籍数字化、版本比对与校勘辅助
死法:
  - 类型: 条件已死
    证据: |
      MidnightDarling／collate以Apache-2.0公开中文历史文献OCR、校对与阅读工作流，提供Claude Code插件及Codex、
      Gemini CLI、Cursor、Hermes等接入面；公开流程覆盖扫描预处理、OCR、A／B／C分级校对、
      修改审计和Word／HTML导出，并保留中间产物、注释与修改记录。
      其中diff-review比较的是OCR原稿raw.md与校对稿final.md，不能直接当作多个古籍版本已经自动对齐。
      Open Guji Platform则以Apache-2.0公开古籍数字化VS Code扩展，集成图像处理、PaddleOCR、质量分析，
      并在04_proofread阶段明确提供多个版本对比、手动修正与可视化差异；这是独立的多版本功能证据
    推理: |
      一，若旧判断是“缺少开源Agent处理中文历史文献扫描件，也缺少可复用的古籍多版本比对工具”，这一条件已经翻案。
          Collate直接证明Agent接入、OCR校对和审计链，Open Guji Platform直接证明多版本对比与差异展示，不再只是抽象设想；
      二，复活的是一条有限组合链：合法输入扫描件与版本元数据，完成OCR和分级校对，保留来源页与修改记录，
          再由多版本工具呈现异文并交由研究者校勘。它不要求先发明一个能自动裁决全部古籍与历史问题的通用模型；
      三，两个项目各自证明的对象不能相互回填。Collate的raw／final差异审计不是版本校勘，
          Open Guji Platform的多版本对比也不证明Collate或另一Agent已经完成端到端集成；
      四，项目页面、公开代码入口和功能说明属于一手技术证据，不等于本轮已独立安装复现，
          更不证明任意版式、异体字和破损扫描件上的识别质量、真实学术采用或长期维护；
      五，因此本节点判为“预审＋已复活”，复活的是“古籍数字化、版本差异比对与人工校勘辅助”的有限技术组合，
          不是原题强版本“比对文献即可自动还原真实历史细节”。
    案例: Collate的Agent OCR校对链与Open Guji Platform的多版本对比共同消除基础工具缺位，但并未自动合并成完整历史还原产品
    证据链接:
      - https://github.com/MidnightDarling/collate
      - https://marketplace.visualstudio.com/items?itemName=open-guji.guji-platform
    置信度: 高

  - 类型: 理论证伪
    证据: |
      中国人民大学清史研究所刊载的杜泽逊文章将版本学任务分为确定版本性质及年代、质量和源流，
      将校勘学任务分为改正古书错误与保存异文；文章明确指出，有些异文需要再加考证和旁证，
      有些无法确认是非，应先记录而不表示态度，不能把全部文本差异都视为可直接消除的错误。
      山东大学儒学高等研究院刊载的陈峰文章则区分文献学与历史学的研究对象：
      史撰关注历史过程和历史现象本身，史考聚焦历史记录、史料和史书；古籍整理有助于利用史料，
      但不等于已经直接重建历史过程
    推理: |
      一，强版本“Agent比对若干古籍版本，就能自动还原真实历史细节”混淆了三个层级：
          识别页面字符、发现版本异文与判断历史叙述是否符合过去发生的事实，不是同一任务；
      二，即使OCR完全正确、版本对齐也无误，所得仍主要是“各版本写了什么”。异文可能来自传抄、刊刻、通假、异体、
          避讳、删改或不同记事传统，既可能是讹误，也可能是有独立价值的文本证据；
      三，从历史文本到历史事实还需要史料来源、形成语境、版本关系、旁证、反证和相应学科论证。
          工具可以帮助定位材料和保存分歧，却不能把某一流畅结论升级为真实历史的唯一裁决；
      四，因此被证伪的是“文本比对等于历史事实自动还原”的强版本，而不是版本比对与校勘辅助。
          合格输出应是带来源、版本、定位和未决状态的异文材料，由研究者决定是否勘误及如何解释。
    案例: 版本学要求保存部分无法定是非的异文，历史学又区分历史记录与历史过程，直接否定“比对即还原真实历史”的推论
    证据链接:
      - http://iqh.ruc.edu.cn/old/zglswxxyj/wx_xsyj/e14f2cfd92a6401ba3076b8e8305fc06.htm
      - https://www.rxgdyjy.sdu.edu.cn/info/1053/4229.htm
    置信度: 高

  - 类型: 执行人限制
    证据: |
      杜泽逊的文章说明，校勘要从版本调查开始，需判断哪些版本必须参校，并结合版本源流、质量和旁证；
      底本选择不能简化为年代最早或错字最少，部分异文只能记录而暂不确定是非。
      Open Guji Platform虽提供现成扩展，仍要求VS Code、Python及相应图像处理与OCR依赖，
      其三层索引、资源适配、前置条件检查和分阶段流程也不是一次通用模型调用即可替代。
      公开材料没有证明普通实施者无需古籍知识就能稳定完成跨版本校勘
    推理: |
      一，具体限制是实施者同时面对文献学判断与工程依赖：会安装插件不等于会选底本、辨认版本关系、
          处理异体与避讳字，也不等于能解释缺页、错简、夹注和不同版式造成的对齐失败；
      二，关键工作包括合法取得各版本、核对书目与页码、维护版本元数据、检查OCR和阅读顺序、
          校准跨版本对齐、保存异文、记录修改理由，并由有能力的研究者处理未决问题；
      三，若缺少这些能力，项目后果不是“效率稍低”，而是可能把版式差异当异文、把异文当错误、
          把后世通行字静默回写进原文，最终生成外观整洁但证据链受损的伪定本；
      四，缓解边界是限定一种文献类型和少量授权版本，复用现有OCR与比对组件，保留原图、原文、异文和人工复核，
          先验收单书、单卷或单页链，再扩大范围；中预算对应这一缩围原型，不包含全古籍自动校勘平台。
    案例: 现成扩展降低安装和比对门槛，但版本调查、异文判断与学术责任仍要求实施者具备或引入专业能力
    证据链接:
      - http://iqh.ruc.edu.cn/old/zglswxxyj/wx_xsyj/e14f2cfd92a6401ba3076b8e8305fc06.htm
      - https://marketplace.visualstudio.com/items?itemName=open-guji.guji-platform
    置信度: 高

  - 类型: 信任成本
    证据: |
      TongGuOCR研究指出，中国历史文献OCR仍受复杂版面、长尾罕用字、竖排、双行夹注和复杂阅读顺序影响；
      整页缩放可能损失小字，逐行识别又可能丢失上下文，阅读顺序错误会导致跳行、重复和跨行混淆。
      论文在M5HisDoc上报告AR 93.76、NED 6.15、RO-ED 3.49，在MTHv2上报告AR 97.93、RO-ED 1.51；
      这些是指定基准上的结果，不是任意古籍、任意扫描质量或完整校勘链的成功率。
      Collate则以五步校对、A／B／C问题清单、来源页回溯和accepted／missed／outside-checklist／unanchored
      四类修改审计保留核查入口，但该设计本身不等于独立质量审计
    推理: |
      一，OCR、版面分析、阅读顺序、跨版本对齐和校勘判断会叠加误差。即使基准字符指标较高，
          残余错误若落在人名、地名、年代、职官或关键字上，仍可能改变研究者的判断；
      二，可信输出不能只给一份清理后的文本。每处修改和异文至少应回链版本、页码、图像区域、OCR原文、
          建议文本、规则或理由、置信度和复核状态；无法定位或无法判断的内容应显式保留，而不是静默补写；
      三，验收应分别测量字符识别、阅读顺序、版本对齐、异文发现、误改漏改和人工接受情况，
          并按文献类型、版式和扫描质量分层。单一总分、生成页数或流畅排版都不能证明学术可靠；
      四，本条中置信度反映目前缺少这些直接实现在真实多版本项目上的独立对照、专家工时和长期纠错数据，
          不是否定其审计设计；它确认的是信任必须靠来源追溯和分任务验收建立，不能由“AI校过”自动获得。
    案例: OCR论文的基准进步与Collate的修改审计提供质量控制零件，但都不能替代真实古籍版本链上的独立验收
    证据链接:
      - https://arxiv.org/html/2608.07917v2
      - https://github.com/MidnightDarling/collate
    置信度: 中

  - 类型: 政策风险
    证据: |
      Collate默认使用本地MinerU CLI，但其MinerU Cloud路线会先把PDF上传至catbox.moe匿名公共文件托管，
      保留24小时后再把URL提交给MinerU；百度OCR路线会把每页base64编码后经HTTPS发送至百度。
      因而“插件可本地运行”不能外推为所有OCR配置都不外发材料。
      Open Guji Platform列出14+网站资源适配器和批量下载功能，但公开功能本身不等于获得绕过源站访问控制、
      验证码、限流、许可或再分发限制的授权。中国著作权法将数字化列入复制权，并分别规定整理、翻译、
      注释及技术措施等边界；开源代码许可不会自动覆盖用户输入的古籍图像、现代整理成果和数据库内容
    推理: |
      一，古籍原件年代久远不等于所有高清扫描、现代点校、注释、翻译、版式和数据库均可自由抓取、再分发或商用。
          应逐资源核对原件、数字图像、现代整理成果、汇编结构与平台条款，不能用“古籍”二字一次清空权利审查；
      二，产品只应处理用户合法取得或明确授权的材料，默认保存来源、取得方式、许可和允许用途。
          不把去水印、资源适配器或批量下载写成绕过付费墙、验证码、访问控制、平台风控和技术措施的能力；
      三，调用云OCR前必须显示数据去向、公共可访问状态、保留时间和服务商条款。未公开、受限制或含敏感信息的材料，
          应使用经批准的本地路线或停止处理；不能把临时公共托管当成无风险传输；
      四，本条不判定所有古籍数字化、公开资源下载或云OCR都违法，也不对具体资源作权利裁决。
          高置信度指向授权、数据路由和第三方材料管理不可省略，具体项目仍需按材料、合同、机构与适用规则分别审查。
    案例: 开源插件的本地默认、云OCR公共临时托管和资源适配器说明，技术可用与材料授权、数据外发是三条不同边界
    证据链接:
      - https://github.com/MidnightDarling/collate
      - https://marketplace.visualstudio.com/items?itemName=open-guji.guji-platform
      - https://www.gov.cn/guoqing/2021-10/29/content_5647633.htm
    置信度: 高

需求证据:
  类型: 开源直接实现、历史文献OCR研究与国家古籍数字化任务；独立持续使用和付费需求待验证
  说明: |
    Collate和Open Guji Platform分别把中文历史文献Agent校对、古籍多版本对比做成公开工具，
    直接证明已有开发者尝试满足扫描处理、校对、差异查看和整理输出需求。
    TongGuOCR论文说明扫描图像只有转成机器可读文本后，才便于全文检索、跨文献比对、实体提取和计算分析；
    版本学材料则证明版本调查、异文保存与校勘本身是持续的学术工作，而不是为AI虚构的任务。
    中办、国办《关于推进新时代古籍工作的意见》明确推进古籍数字化、专业数据库开发利用、文本结构化、
    知识体系化和利用智能化，并强调整理研究、专家评审、标准与质量检查，支持其公共文化工作和学科建设价值。
    这些材料不等于本节点产品已有独立用户规模或商业订单。本轮没有取得古籍研究者、图书馆、出版机构的访谈或试用，
    没有真实多版本项目的安装成功率、节省工时、专家接受率、持续使用、采购或续费数据。
    最关键的缺口是：谁合法拥有重复的多版本处理任务，现有流程最耗时且适合机器辅助的环节是什么，
    以及可追溯的异文与校勘建议能否在不增加专家纠错负担的情况下改善实际工作。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在使用者包括古籍整理与出版团队、图书馆和档案馆、高校与科研机构、数字人文项目及个体研究者；
            有直接开源工具证明工作链可被实现，但不等于这些机构会采购同一产品，也不等于普通读者存在高频付费需求。
            可测试的收入或持续支持路径包括私有部署、特定版式与文献类型适配、授权资源接入、版本对齐与审计工作流、
            经专家验收的测试集、技术支持和机构项目服务，而不是出售未经授权的扫描件或承诺自动恢复历史真相。
            免费开源组件和公共数字资源会压低通用OCR与简单差异展示的收费空间，可能形成差异的是可追溯质量、
            专业模板、私有材料治理、团队协作和持续维护，这些增量仍需真实项目验证。
            全成本应包括合法资源取得、扫描与预处理、OCR或云服务、版本元数据、专家标注和复核、错误纠正、
            存储备份、安全、兼容维护及用户支持；有效产出应按经研究者确认的可靠文本、异文和校勘记录计算，
            而非处理页数或生成字符数。当前没有订单、收入、利润、资助或商业闭环证据。
  社会价值：可追溯的古籍数字化和版本比对可能降低重复录入与逐页查找成本，帮助研究者保存异文、
            回查原图并公开未决分歧，为古籍保护、教学、研究和公众利用提供更可检查的基础材料。
            国家政策对古籍数字化、智能化利用、专业人才培养和质量检查的支持，说明该方向具有公共文化价值；
            但政策支持不是本产品的采用、效果或收入证明。
            主要风险是制造看似权威的唯一文本、抹平异文和版本历史、把文献记载误述为已证实历史事实，
            以及未经授权传播扫描资源或将受限材料外发。社会价值应按专家确认的有效修正、异文保存、来源可追溯、
            实际节省劳动、合法开放与纠错情况评估，而非只按数字化页数、模型指标或自动生成的“历史细节”数量衡量。

可拆零件:
  - 合法输入与版本登记表，记录书目、版本、收藏或来源机构、取得方式、授权、允许用途、文件指纹和缺页情况
  - 按著作、丛书、单书、卷、页组织的元数据与图像索引，保留原文件并防止不同版本被静默合并
  - 面向竖排、夹注、异体字和复杂版面的扫描预处理、版面分析、阅读顺序与OCR适配层
  - 本地与云端OCR路由器，在处理前显示数据去向、公共可访问状态、保留时间、费用和适用授权，不默认上传受限材料
  - 将每段文本回链到版本、页码和图像区域的证据锚点，缺图、缺页和低置信度区域显式标记
  - 结构、字形、格式、跨段一致性和专名的分级校对清单，区分确定OCR错误、编辑惯例和待研究问题
  - 对OCR原稿与校对稿进行accepted、missed、outside-checklist和unanchored分类的修改审计器
  - 独立于OCR修改审计的跨版本对齐器，处理卷页差异、缺页、重复、倒序和段落对应，不把raw／final差异冒充版本异文
  - 保存各版本原文、异体、通假、避讳和未决异文的校勘记录表，默认不强制归一、不自动删除少数版本读法
  - 底本选择、参校版本、版本源流和旁证记录的人工研究工作台，Agent只组织材料，不自动宣布最终学术结论
  - 接受、驳回、编辑、保留分歧和升级专家复核的工作流，记录处理人、时间、理由和规则版本
  - 同时导出原貌文本、校订文本、异文表、未决问题与审计报告的生成器，避免只交付无法回查的清理稿
  - 按文献类型、版式和扫描质量分层的真实验收集，分别测量OCR、阅读顺序、版本对齐、异文发现、误改漏改和人工接受
  - 记录授权核验、云调用、专家工时、失败重试、存储和维护的全成本账本，以经确认的有效校勘产出评价运营持续性

