  清单原题“基于图片生成器的AI自助生成使用表情包插件”压缩为现标题。目标使用者既包括人类聊天用户，也包括宠物鲸这类AI Agent；
  “AI自助”指Agent可经工具接口搜索、生成和使用表情，不表示Agent具有法律主体资格、自主付款责任或可以脱离其部署者独立承担后果。
  “贴纸”与“表情包”在本节点中指可在文章、对话中插入或发送，或可按平台规则加入贴纸包的图像；
  搜索既有表情、生成新图片、透明背景处理、文章插图、聊天返回、平台贴纸包发布、实际使用和商业闭环是不同证明层级。
  已复活仅指memecub公开了Agent搜索、文章配图、自定义生成和多种接入能力，且Sogni与Banana分别覆盖有限聊天贴纸链；
  不表示这些能力已由单一产品全部贯通，不表示本轮独立安装并复现全部版本，不表示0016宠物鲸已实际接入memecub，
  也不表示所有平台、用户规模、持续付费、内容安全或持续运营已证明。
  重启预算“低”对应复用memecub现有托管接入或Sogni／Banana的MIT代码，制作单Agent或单聊天平台、有限配额、草稿预览和小规模原型；
