备注: |
  本节点档案类型为预审，因为入库对象是对此类创业点子及其剩余死法的证据评估，没有将ClawsGO尚未发生的停止、失败或转向写成验尸记录；
  已复活指已有真实产品使核心技术条件发生翻案，不表示预审对象已经经历商业失败。
  复活范围仅限云端长时运行、可观察、可接管的科研工程与写作流程，包括检索、证据整理、代码、分析、绘图和初稿；
  不宣称开放式原创发现、湿实验闭环、研究质量或商业可持续性已经解决。
  来源视频和ClawsGO官网、文档、协议均属于厂商公开材料，只能证明产品形态、公开承诺和演示内容，不能替代独立测评。
  当前未找到足以验证ClawsGO实际研究质量、长期留存、续费或利润的独立公开数据。
  The AI Scientist资料来自系统研发团队及其同行评议论文，正面个例与限制说明均保留；
  CRUX仅评估两个开放式AI研究问题，《The More You Automate, the Less You See》仅受控评估两个开源机器学习科研系统，均不得外推为全部学科或所有产品的固定失败率。
  付费、隐私和协议页面记录的是起草时可公开查阅的规则，不是实际成本、合规或安全已经通过独立审计的证明。
  Bilibili与Nature页面若自动访问受限，应交由主编人工复核，不据此判定链接失效。
  由于基础模型、科研Agent竞品、价格和机构合规实践变化较快，死因保质期设为一年；
  复核时应优先检查独立任务评估、完整日志与代码审计、真实续费和毛利、免费巨头工作区的功能覆盖，以及敏感研究数据处理规则。
