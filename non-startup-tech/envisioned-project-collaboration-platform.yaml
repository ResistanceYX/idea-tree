  不得仅通过把文件移入nodes/来启用；未来正式化前须补齐独立证据、字段、审核、编号和验证，并由主编另行决定。
  本次只为Issue #10第09项提供依赖组件记录，不替主编勾选清单，也不把储备稿存在称为平台任务完成
