备注: |
  本节点为AI起草、人类审核的预审档案，不是NOAA、NCEI、VARS、OceanGPT、DAP或其他项目已经失败、停止或转向的验尸记录；当前没有具体验尸对象，不能编造。
  本稿对应Issue #10清单第30项拆分后的30B；30A为《超深海多模态环境记录与时空对齐离线Agent》。清单序号、Issue编号和正式节点编号属于三个不同体系。
  按节点格式v1.9，主编已确定本节点编号为0040，正式文件名为0040-hadal-multimodal-observation-summary-evidence-offline-agent.yaml。
  本节点与《超深海多模态环境记录与时空对齐离线Agent》建立“可选下游总结／可选上游记录供给”的双向关系，目标使用双方确定的带编号文件名主体；
  两者不是直接派生，任一节点均可独立建设与验收，当前没有实际端到端集成证据。
  本节点可读取30A式记录包，也可直接处理科研机构既有且合法使用的观测档案，不依赖30A必须建成；
  独立交付物是证据化潜次摘要、观测时段报告或研究材料汇编，独立验收看事实一致性、证据覆盖、漏报误述、来源完整性和人工修改，而非文本流畅度。
  本节点不与《基于多次多模态回传的超深海数据传输系统》《超深海既有数据识别与未知候选搜索反馈Agent》机械挂接；
  前者负责数据传输与交付，后者负责已知识别、未知候选和专家反馈，本节点只负责既有观测记录的证据化总结与人工定稿辅助。
  复活候选只覆盖合法既有档案上的离线有限核心链，不证明同一套Agent已在超深海完成多模态总结和端到端事实一致性验收；
  不涵盖原始数据时空对齐、自动科学或环境结论、自动新物种或未知候选、无人工复航搜索、自动公开发表或商业闭环。
  NOAA与NCEI材料只证明潜次／航次报告、关联档案和数据治理需求；VARS只直接证明结构化证据查询与回链等组件；
  OceanGPT论文和项目页只证明海洋语言模型及本地生成组件。上述证据不能拼成“本节点已复活”，也不证明其多模态理解或科学可靠性。
  OceanGPT论文结果含作者自报、自动评价和小规模人工评价，仅按论文所报任务理解，不作为本节点独立审计、超深海效果或真实科研采用证据。
  Maynez等与RAGTruth属于通用摘要和检索增强生成研究，只支持事实性风险和评价边界，不提供海洋领域具体错误率，不能据此编造本节点失败比例。
  Java Trench材料用于说明空间缺口与“相机中未见”不等于不存在；DAP材料用于说明传感器后处理和未决不确定性，均不证明本节点已有自动判断能力。
  “离线”指数据处理默认在本地、船上或岸上受控工作站完成，运行时不依赖持续公网或云端连接；
  不等于必须在万米海底运行大模型，也不等于模型和依赖可在完全没有预置资源的情况下凭空安装。
  重启预算“中”对应复用合法既有档案、现成工具和本地模型，完成少量潜次或时段的离线软件集成、人工事实性基准和独立评测；
  不包含新造耐压平台、购买潜器或支持船、新增海试航次、大规模基础模型训练或长期多机构运营。
  本节点只处理公开许可、用户自有或机构明确授权的数据；不保存平台账号、Cookie、token或浏览器登录态，
  不把绕过登录、验证码、付费墙、访问控制、反爬或平台限制写成能力，不上传或交换未经授权的原始影像、视频、内部标注和任务资料。
  所有总结、跨模态印证和后续表述均须保留原始证据与不确定性，不自动发布科学发现或环境结论，不直接控制真实潜器或执行高成本、可能影响环境的任务。
  因海洋科研档案、开放数据许可、本地语言模型、事实一致性评价和证据检索工具变化较快，死因保质期设为一年。
  复核时应优先寻找同一离线系统在合法超深海档案上的端到端报告、陈述级证据回链、独立事实一致性与漏报误述验收、跨潜次复现、人工工时和撤回记录；
  若只有本地模型演示、通用榜单分数、报告文本样例、检索接口或引用链接数量增加，不应据此扩大复活范围。
