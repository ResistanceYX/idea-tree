id: dsh-platform-content-discovery-plugin-generator-agent
标题: 个性化DSH平台自动浏览、内容发现及总结插件生成Agent
一句话: |
  用户给出目标平台、内容类型与筛选需求后，Agent参考既有DSH插件和官方开发文档，在隔离工作区生成平台专用插件候选包，
  完成静态检查、隔离安装和浏览器测试后交人工审核；输入平台名即可自动获得可安装、可授权、可长期运行成品的强承诺仍未解决
档案类型: 预审
复活状态: 已复活
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 人工智能
子领域: DSH插件生成与平台内容发现工具工程
死法:
  - 类型: 条件已死
    证据: |
      DeepSeek官方文档说明DSH Agent可以读取和编辑工作区文件、运行命令、委派工作并维护计划，需要审批的操作按权限策略先询问用户；
      官方插件教程给出了TypeScript插件、工具注册、组合包manifest、profile安装与配置检查路径；
      NanmiCoder/dsh-agent-teams附带执行型dsh-plugin-development Skill，覆盖插件形态、bundle／profile契约、工具、持久化、构建、分发和真实组合验证；
      Microsoft Playwright MCP可通过结构化accessibility snapshots导航、点击、输入和读取网页，并提供持久或隔离浏览器profile及测试断言；
      PerryLink/dsh-test-drive已把一次性DSH_HOME中的安装、bundle patch核对、headless启动、可选能力断言、卸载和清理串成Agent可调用流水线
    推理: |
      一，若旧判断是“缺少让编程Agent参考既有插件、生成一个新DSH插件并做基础验收的工程条件”，这一条件已经翻案。
          宿主能够读写代码和执行命令，官方文档给出插件契约，执行型Skill提供开发步骤，浏览器工具与隔离安装检查提供验证零件；
      二，复活的是“需求澄清—参考实现取证—生成候选代码—静态检查—隔离安装—受控平台冒烟—差异与权限报告—人工验收”的开发辅助链。
          对结构相近的平台，可以复用13、14、19号的采集、筛选、摘要、日报和定时模块，而不是每个平台从零发明一套Agent；
      三，平台名称本身不足以确定插件。Agent还需询问内容类型、兴趣与排除项、官方API／RSS／公开页面／用户授权会话等访问路线、
          运行频率、输出格式、模型预算、凭证边界以及是否允许任何公共互动，再选择最小实现；
      四，现有工具没有证明“任意平台名称输入后自动生成正确、安全且长期可用的插件”。代码生成、构建通过、页面一次跑通、
          内容摘要准确、平台允许、用户授权和长期维护是不同验收事项，本节点只判候选插件开发链有限复活。
    案例: DSH工作区编程能力、官方插件契约、执行型开发Skill、Playwright与隔离安装检查共同支持插件候选生成链复活
    证据链接:
      - https://deepseek-harness.github.io/deepseek-harness/
      - https://deepseek-harness.github.io/deepseek-harness/develop/basic/
      - https://github.com/NanmiCoder/dsh-agent-teams/blob/main/skills/dsh-plugin-development/SKILL.md
      - https://github.com/microsoft/playwright-mcp
      - https://github.com/PerryLink/dsh-test-drive
    置信度: 高

  - 类型: 伪需求
    证据: |
      dsh-bili-scroll、dsh-arxiv-inspiration和DSH GitHub趋势插件已经分别提供平台内容读取、筛选、摘要或日报，
      说明“少手动刷站、多自动发现”存在实际供给；DSH自身也能直接读取资料、编辑代码和委派工作；
      当前公开材料没有给出可独立核验的用户为“再生成一个专用插件”持续付费、生成后长期启用、跨平台复用率或维护时间下降数据
    推理: |
      一，用户真正需要的通常不是插件代码，而是持续获得符合兴趣且可靠的内容。若已有插件、RSS、官方订阅或一次通用浏览器任务即可解决，
          再生成一个平台专用包可能只增加安装、授权和维护对象；
      二，“输入抖音就输出抖音宠物鲸”适合作为交互示例，不足以证明每位用户都需要独立插件。只有需要固定兴趣记忆、私有日报、
          可重复调度、专门权限收缩或平台特有解析时，专用插件才比一次性Agent指令更有增量；
      三，生成数量也不是价值指标。十个外形相同、解析脆弱且无人持续使用的插件，不如一个可配置适配器和一份被实际阅读的日报；
          仓库数、代码行数、安装成功率和生成速度都不能替代内容采纳与长期留存；
      四，可缩围为个人或小团队的按需开发助手：先检索是否已有可配置插件，只有差异明确时才生成；
          以一个平台、一种内容、一个私人输出为最小验收，记录生成后四周仍在运行的比例、用户实际阅读与维护工时；
      五，本条不否定长尾平台适配需求，而是否定“每个平台都必须拥有新插件”以及“生成插件本身就是用户价值”的推断。
    案例: 多个平台专用插件证明自动发现需求存在，但是否需要为每个平台重新生成独立插件仍缺少持续使用证据
    证据链接:
      - https://github.com/c1overzz/dsh-bili-scroll
      - https://github.com/Lxion0553/dsh-arxiv-inspiration
      - https://github.com/morehao/dsh-github-trending
      - https://deepseek-harness.github.io/deepseek-harness/
    置信度: 中

  - 类型: 钱算不平
    证据: |
      Playwright MCP官方比较有状态MCP与CLI＋SKILLS路线，指出后者对高吞吐编程Agent更节省token，
      而持续浏览器上下文和大型accessibility trees会与代码库、测试和推理争夺上下文；
      DSH仍处于快速迭代的开发者预览阶段，dsh-test-drive把安装、配置、启动、能力断言、卸载与清理分段记录，
      dsh-plugin-development Skill也要求按目标版本重新核实接口并做真实组合验证
    推理: |
      一，全成本不是“生成一份TypeScript文件”的模型报价，而是“需求澄清＋现有插件与官方文档取证＋页面结构探索＋代码与测试生成＋
          依赖安装＋隔离环境＋失败重试＋真实账号下的人工验收＋摘要抽查＋后续宿主和平台适配”；
      二，平台长尾会放大维护账。越冷门的平台越少用户分摊解析、登录、测试和售后成本；页面结构、接口或风控一变，
          曾跑通的插件也可能退化。生成器降低首版成本，却不会自动承担每个生成物的版本维护；
      三，有效成本的分母应是“经人工验收且持续产生有用内容的插件数”，不是生成包数或一次安装成功数。
          重复造已有插件、测试只跑通空页面、生成后弃用以及用户重新手写修复都应计入无效成本；
      四，个人自用可复用开放代码、自有设备、固定宿主版本和少量平台，采用CLI优先、缓存页面证据和限制模型上下文来控费。
          但若产品承诺任意平台、代管账号和长期保修，就需要隔离测试 fleet、凭证治理、兼容矩阵、客服和安全响应，预算不能沿用普通日报插件；
      五，公开资料没有统一生成成本、跨平台维护工时、毛利或续费数据。预算“中”是少数平台的工程集成、隔离测试和人工复核档位，
          不是每次生成至少消费一万元，也不覆盖无限平台适配。
    案例: 浏览器上下文、版本取证、隔离安装和持续适配共同说明首版代码便宜不等于每个有效插件便宜
    证据链接:
      - https://github.com/microsoft/playwright-mcp
      - https://github.com/deepseek-ai/deepseek-harness
      - https://github.com/PerryLink/dsh-test-drive
      - https://github.com/NanmiCoder/dsh-agent-teams/blob/main/skills/dsh-plugin-development/SKILL.md
    置信度: 中

  - 类型: 政策风险
    证据: |
      DSH官方打包文档明确，git依赖的prepare构建授权就是允许该包代码在安装时于用户机器上执行，且不在Agent沙箱之内，
      并建议只信任源码、锁定commit；arXiv官方API条款对全局限速、凭证和全文再分发分别设限；
      哔哩哔哩社区规范要求社区功能用于正常交流并禁止批量灌水，说明内容读取、私人日报和公共账号互动不能用同一份权限与规则假设
    推理: |
      一，生成器面对的不是一种统一的“网页数据”。官方API、RSS、公开页面、用户授权浏览器会话和逆向第三方接口具有不同授权、
          频率、隐私与稳定性边界，生成前应逐平台记录可用路线和禁止事项，不能把浏览器能打开等同于允许自动采集；
      二，不得把绕过登录、验证码、付费墙、访问控制、反爬或平台风控写成复活能力。无法访问时应显示失败并降级为官方源、
          用户合法导出的资料或人工确认，而不是让Agent自行寻找规避办法；
      三，代码、平台内容、论文全文、视频字幕、角色美术和用户账号数据是不同权利对象。参考MIT插件代码不表示可以复制其全部素材，
          更不表示可以把第三方全文、页面快照、Cookie、storage state、token或扫码凭证写入生成包、测试日志和公开仓库；
      四，私人只读摘要与代表用户公开发布是两条路线。若生成插件保留评论、私信、动态或关注能力，应按目标平台规则、AI身份透明、
          接收者边界和人工确认单独验收，不能因专用插件由用户自己生成就免除责任；
      五，本条不认定某个目标平台或现有插件违法，高置信度指向“访问路线、内容权利、构建执行与公共互动必须分别管理”这一确定边界。
          具体项目仍需按平台、法域、账号合同和实际行为重新审查。
    案例: 官方构建执行警告、平台API与社区规则共同说明插件可生成不等于访问、内容和互动授权已经取得
    证据链接:
      - https://deepseek-harness.github.io/deepseek-harness/develop/basic/publish
      - https://info.arxiv.org/help/api/tou.html
      - https://member.bilibili.com/studio/convention/?lang=zh-Hans
    置信度: 高

  - 类型: 信任成本
    证据: |
      DSH官方安全说明明确其实验性开发者预览软件尚未接受安全审计，第三方插件和开放的网络、进程、凭据与文件访问可能造成非预期影响；
      官方安装文档要求把构建授权视为在Agent沙箱外执行包代码；
      Playwright MCP说明持久profile会保存登录信息，allowedOrigins、blockedOrigins不是完整安全边界且不能覆盖重定向，
      secrets替换和URL参数脱敏只是便利措施；dsh-test-drive也把干净启动与具名能力真实调用分开，未验证时不记成pass
    推理: |
      一，生成插件的风险高于生成一篇摘要。它可能包含依赖、安装脚本、文件与网络访问、长期账号会话和定时任务，
          用户需要信任的不只是代码能构建，还包括生成过程没有引入恶意依赖、隐藏权限、凭证外发或不可回滚修改；
      二，浏览器中的标题、评论、仓库README和论文摘要都可能包含对Agent的恶意指令。生成器和生成后的插件都应把网页内容当不可信数据，
          不能因页面要求就扩大工具权限、读取本地秘密、执行下载代码或向公共账号发布内容；
      三，测试需要分层留证：需求与参考来源、代码差异、依赖与许可、静态检查、隔离profile安装、无凭证冒烟、授权会话测试、
          内容准确性抽查和卸载残留分别记录。静态审查或一次浏览器断言不能替代逻辑、安全和长期内容质量验收；
      四，默认交付应是未启用的候选包和权限报告，而不是直接装入日常profile。代码生成、静态检查、隔离测试、人工审核、
          正式安装、账号授权和公共互动开关必须分开；回滚、卸载、凭证撤销与失败可见性属于成品的一部分；
      五，本条高置信度指向供应链、凭证、提示词注入和测试证据门槛，不声称上述工具必然恶意或已发生特定泄露。
    案例: 宿主安全警告、安装时代码执行、持久登录会话与加载／运行差异共同构成生成插件的四重信任门槛
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/SAFETY.zh.md
      - https://deepseek-harness.github.io/deepseek-harness/develop/basic/publish
      - https://github.com/microsoft/playwright-mcp
      - https://github.com/PerryLink/dsh-test-drive
    置信度: 高

  - 类型: 执行人限制
    证据: |
      DSH官方明确其会快速迭代并发生兼容性破坏变化；dsh-plugin-development Skill提醒历史模板不代表当前Harness API，
      独立使用时必须按目标精确tag与npm产物重新核实，并从真实组合和用户安装路径验证；
      Playwright MCP提供隔离profile、已有浏览器连接和测试断言，但并行客户端需要隔离profile或不同用户目录；
      dsh-test-drive公开列出dsh CLI与pnpm定位、网络、模型凭据、Desktop不支持作为测试宿主、临时环境清理等实际运行约束
    推理: |
      一，实施者既要懂平台内容语义，也要能处理TypeScript、Cordis契约、构建依赖、浏览器定位器、账号授权、模型提示词和测试。
          让Agent代写代码可减少语法劳动，不能替代用户决定访问权限、判断内容是否有用和对公共行为负责；
      二，维护者需要保存宿主—插件—依赖—浏览器—平台路线的版本矩阵和可复现验收包。平台改版后应能区分页面解析失败、
          登录失效、接口限流、模型摘要异常与宿主不兼容，而不是笼统显示“Agent已死”；
      三，可缩围为先复用一个近似插件，只支持单平台、单内容类型、公开或官方只读路线、私人Markdown日报和手动运行；
          通过固定测试样例与真实小样本后，再增加定时、授权会话和其他平台。每次只新增一种能力，避免一次生成全部权限；
      四，对只有普通个人电脑的用户，隔离DSH_HOME、浏览器profile、依赖构建和凭证撤销仍有学习成本；
          对长期维护的小团队，持续回归、依赖安全、失败通知和用户纠错更是主要工作，而不是一次性生成；
      五，公开资料没有系统性生成成功率、安装失败率或维护工时，故本条保持中置信度。它说明具体执行约束，不把工程复杂写成所有用户都无法使用。
    案例: 插件接口版本、浏览器会话隔离、依赖环境和平台改版共同决定生成物能否从演示变成可持续工具
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness
      - https://github.com/NanmiCoder/dsh-agent-teams/blob/main/skills/dsh-plugin-development/SKILL.md
      - https://github.com/microsoft/playwright-mcp
      - https://github.com/PerryLink/dsh-test-drive
    置信度: 中

需求证据:
  类型: DSH官方开发能力、平台专用插件、执行型开发Skill与插件验收工具
  说明: |
    13、14、19号对应的公开实现已经分别覆盖GitHub仓库、arXiv论文和B站视频的发现、筛选、摘要或日报，
    证明“平台访问—内容发现—个性化总结”在多个平台反复出现，而不是只适用于单一网站。
    DSH官方提供可读写工作区、运行命令和插件开发契约，dsh-plugin-development Skill、Playwright MCP及dsh-test-drive进一步提供
    从开发到隔离验收的实际零件，说明把重复适配工作交给Agent具有可操作的工程基础。
    这些材料支持开发者或高级个人用户需要减少插件样板、页面探索和测试劳动的场景，但不等于独立审计后的需求强度。
    当前没有足以确认用户愿意为每个平台生成新插件、生成物长期启用、跨平台复用、节省时间、付费或续费的公开数据；
    仓库Star、生成包数、代码行数、安装成功和界面截图均不作为长期留存证据。
  附件: 无

商业及社会价值评估: |
  商业价值：直接受益者是需要为长尾平台定制个人信息流的开发者、研究人员、内容策划者、小型团队及DSH高级用户；
            生成器可以把已有插件的采集、筛选、证据卡、日报、调度和权限结构作为模板，减少重复开发。
            潜在付费者更可能是需要私有平台适配、内部数据源接入、隔离测试、部署托管和持续维护的个人或组织，
            可测试按验收交付的定制开发、兼容维护、私有模板库和安全审查，而不是按生成代码行数收费。
            DSH、浏览器工具、参考插件和检查工具多已开放，通用编程Agent也会压低“生成一个相似插件”的收费空间；
            真正可能形成差异的是访问路线合规、生成后持续可用、权限可审计、内容采纳率和维护响应，而这些均未证明能形成商业闭环。
            商业验证应按“每个经人工验收并持续产生有用条目的插件全成本”与节省的开发及维护时间、持续使用和支付意愿比较，
            把探索、失败重试、隔离测试、账号治理、平台改版、客服和安全响应计入成本。个人低频自用成立不自动等于可扩张平台。
  社会价值：可复用的插件生成与验收流程可能降低普通用户定制个人信息工具的门槛，让长尾平台和小众兴趣不必等待官方或大厂优先支持；
            公开参考来源、代码差异、权限报告和隔离测试也能为Agent生成软件提供可审计样本。
            相反，批量生成低质量插件会扩大供应链、凭证泄露、未经授权采集和公共空间自动发言的影响；
            “AI生成的”标签还可能让用户误以为已经安全验收。较有社会价值的形态是先复用已有插件、默认公开或官方只读路线、
            私人输出、最小权限、未启用交付、人工验收、可卸载可回滚，并把平台限制和内容权利明确展示给使用者，
            而不是把“一个平台一个插件”变成无限自动扩张的借口。

可拆零件:
  - 收集平台、内容类型、兴趣与排除项、访问路线、频率、输出、预算、账号授权和公共互动边界的需求澄清器
  - 检索已有插件并比较可配置复用、改造、重新生成和直接放弃四条路线的复用决策器
  - 保存参考仓库版本、许可证、关键模块、官方文档tag和不可复制素材边界的参考实现取证卡
  - 将官方API、RSS、公开页面、用户授权浏览器会话和人工导入分开选择的平台访问路由器
  - 由采集、证据卡、兴趣筛选、摘要、去重、日报、定时和反馈模块组成的平台插件模板库
  - 固定宿主与依赖版本、生成package.json、cordis.patch.yml、入口、工具Schema和测试的候选包脚手架
  - 使用独立工作区、一次性DSH_HOME和隔离浏览器profile且不污染日常配置的沙盒测试器
  - 以固定公开样例和授权小样本验证导航、解析、去重、摘要依据、失败降级和定时任务的验收包
  - 分开记录代码差异、依赖与许可、静态检查、构建打包、隔离安装、真实运行和卸载残留的验证报告
  - 默认不包含Cookie、storage state、token、扫码凭证和网页全文快照的凭证与证据隔离器
  - 代码生成、静态检查、隔离测试、人工审核、正式安装、权限启用和公共互动逐闸推进的发布状态机
  - 平台改版后的失败分类、兼容性回归、版本矩阵、更新差异、回滚与撤销授权维护器
  - 以持续启用、有效内容采纳、人工修复工时和每有效插件全成本为指标的生成价值评估表

