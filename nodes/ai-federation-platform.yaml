id: ai-federation-platform
标题: AI联合平台
一句话: 让用户挑选多个AI组成"委员会"分工协作、辩论决策，覆盖从点子到产品到销售的全流程
复活状态: 死透
重启预算: 高
创新类型: [渐进式, 技术应用]
领域: 人工智能
子领域: 多智能体协作平台
死法:
  - 类型: 巨头碾压
    证据: 公开案例
    推理: |
      一，模型路由层已被资本重注占据：OpenRouter于2026年5月获1.13亿美元B轮（CapitalG领投），
          聚合400余个模型、60余家提供商，统一API、故障转移、成本路由已是企业级基础设施；
      二，协作层已成大厂标配：帆软2026年5月推出悟帆AI，原生支持多Agent并行调度、交叉验证
          与"圆桌讨论"（主持人、顺序、自由三种模式），同赛道还有扣子、Dify及腾讯、阿里、百度的
          同类功能，多Agent协作已从卖点退化为出厂功能；
      三，全流程层已有独角兽正面占位：Manus 2026年10月完成超5亿美元融资（估值约40亿美元），
          把"数字员工群聊协作"产品化，通用agent入口之战已经开打。
      三层生态位各有巨头或独角兽把守，独立平台无立锥之地。
    置信度: 高
    证据链接:
      - https://www.tamradar.com/funding-rounds/openrouter-series-b-113m
      - https://opc.csdn.net/6a80175c662f9a54cb9d023e.html
      - https://m.cls.cn/detail/2499630

  - 类型: 冷启动死锁
    证据: 公开案例+内部推演
    推理: |
      一，平台是双边乃至多边结构：用户要的是"开箱即用的委员会配置"，模型方要的是分发与收入，
          冷启动时两者互相等待；
      二，开发者侧心智已被开源先占：TradingAgents以"模拟华尔街投委会"叙事在GitHub拿下
          超11万星（2026年10月），个人团队做的通用协作平台在可信度与功能深度上都无可比性；
      三，"搜索框不是给软件用的接口"：agent时代模型调用的正确形态是API与MCP管道，
          C端"选模型聊天"的聚合界面正在被原生agent管道绕过，聊天框型平台的上游在缩水；
      四，用户没有动机离开已绑定的办公生态（钉钉、飞书、Office全家桶）迁移到一个新平台。
    案例: TradingAgents 开源多智能体投研框架，96,700+星（2026年8月）→114,000+星（2026年10月）
    置信度: 高
    证据链接:
      - https://explainx.ai/blog/tradingagents-multi-agent-llm-trading-framework-v0-7-chatgpt-plan-hn-skeptics-guide-2026
      - https://www.cnblogs.com/gyc567/p/19992602

  - 类型: 执行人限制
    证据: 创始人自我分析
    分析: |
      一，学生身份，学业繁忙，期中周在11月中旬；
      二，无分发渠道，而冷启动获客恰是平台型创业的命门，是本人最短的板；
      三，单人无法同时维护模型接入层、编排层与前端，任何一层掉链子都会让"联合"退化为"单聊"。
    置信度: 中

  - 类型: 理论证伪
    证据: 公开研究（一手论文）
    推理: |
      一，同预算对照证伪：Zhang等2025年《Stop Overvaluing Multi-Agent Debate》发现，多Agent辩论
          常常打不过单体的思维链与自洽采样——同样的token预算花给"辩论结构"不如花给"多采几次"；
      二，机制层面证伪：2510.20963号论文证明主流辩论范式存在"辩论黑客"行为——竞争式辩论退化为
          空洞修辞游戏（ cheap talk ），共识式辩论则过早过滤掉有价值的分歧，两种范式在同预算下
          均低于单体方法；
      三，增益归因证伪：《Beyond Symmetric Agents》（2026年9月，5500余次对照实验）显示辩论的增益
          实为集成采样效应：同等生成预算下辩论打平或输给自洽采样，却付出1.6倍时间和3.4倍token，
          人设提示反而降低准确率（"人设税"），混合模型组队还输给对自家阵容的简单多数投票；
      四，失败模式系统性存在：约翰霍普金斯大学研究显示辩论轮次越多准确率越低，强模型会被弱模型
          的诡辩带偏（谄媚性顺从），无外部证据核验时辩论是"说服力竞赛"而非"求真机制"。
      边界说明：被证伪的是"多个AI随便联合起来就更聪明"这一原承诺；在协议精心设计
      （如ColMAD）或配证据核验的场景下协作仍可能有效——这正是本条目须配死因保质期的原因。
    置信度: 高
    证据链接:
      - https://arxiv.org/abs/2502.08788
      - https://arxiv.org/html/2510.20963v2
      - https://arxiv.org/html/2609.35875v1
      - https://arxiv.org/html/2509.05396v1
      - https://github.com/Kaizer-1/LLM-Council

需求证据:
  类型: 自我观察
  内容: |
    需求没有死，只是窄化了：idea-tree仓库本身即该点子的最小可行形态——Kimi负责多角色起草
    （检索、结构、校对），本人负责审核（相当于杠精Agent的人类替代）。
    通用"多AI委员会平台"死透，垂直"委员会工作流配置"（预设角色、辩论规则、输出格式）
    仍可作为功能零件存活。
  附件: 无
  边界: |
    零件成立的前提是寄生在已有分发渠道上（课程群、飞书机器人、GitHub模板），
    不能自立门户。

可拆零件:
  - 垂直委员会工作流配置（如"创业验证委员会"：市场、财务、法务Agent加杠精Agent）
  - "杠精Agent"红队预设Prompt包
  - 辩论规则与投票机制设计（主持人、顺序、自由三模式）

死因保质期: 2027-04-30
