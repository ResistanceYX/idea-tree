备注: |
  本节点为AI起草、人类审核的预审档案，不是VARS、SOVIS、DAP、NOAA或其他项目已经失败、停止或转向的验尸记录；当前没有具体验尸对象，不能编造。
  本稿对应Issue #10清单第30项拆分后的30A；30B为《超深海多模态观测总结与证据回链离线Agent》。清单序号、Issue编号和正式节点编号属于三个不同体系。
  30A与30B拟建立“可选上游记录供给／可选下游总结”的双向关系，但相关节点字段必须使用双方入库后的带编号文件名主体；
  按节点格式v1.9，主编已确定本节点编号为0039，正式文件名为0039-hadal-multimodal-environment-record-alignment-offline-agent.yaml。
  本节点与《超深海多模态观测总结与证据回链离线Agent》建立“可选上游记录供给／可选下游总结”的双向关系，目标使用双方确定的带编号文件名主体；
  两者不是直接派生，任一节点均可独立建设与验收，当前没有实际端到端集成证据。
  本节点不与《基于多次多模态回传的超深海数据传输系统》《超深海既有数据识别与未知候选搜索反馈Agent》机械挂接；
  前者负责数据传输与交付，后者负责已知识别、未知候选和专家反馈，本节点只负责观测记录整理、对齐、质量和来源追踪。
  复活候选只覆盖合法既有数据上的离线有限核心链，不证明同一套Agent已在超深海完成跨设备、跨潜次、全模态端到端验收；
  不涵盖统一全模态科学理解、自动修复原始数据、海底通信、实时潜器控制、自动环境结论或商业闭环。
  “离线”指数据处理默认在本地、船上或岸上受控工作站完成，运行时不依赖持续公网或云端连接；
  不等于必须在万米海底运行大模型，也不等于模型和依赖可在完全没有预置资源的情况下凭空安装。
  DAP与Java Trench材料只证明特定超深海任务的数据采集和限制；MBARI VARS主要证明机构级深海数据治理；
  VARS官方文档与SOVIS只证明特定数据管理、时间索引和后处理组件。SOVIS的0—91米采集深度不属于超深海，严禁外推为全海深可靠性。
  DAP的8370米级任务和氧传感器校正问题用于说明真实深水数据仍需后处理与不确定性披露，不证明本节点已有自动校正能力。
  重启预算“中”对应复用合法既有数据、现成开源工具和少量设备与潜次，完成离线软件集成、人工基准和独立评测；
  不包含新造耐压平台、购买潜器或支持船、新增海试航次、大规模基础模型训练或长期多机构运营。
  本节点只处理公开许可、用户自有或机构明确授权的数据；不保存平台账号、Cookie、token或浏览器登录态，
  不把绕过登录、验证码、付费墙、访问控制、反爬或平台限制写成能力，不上传或交换未经授权的原始影像、视频、内部标注和任务资料。
  所有质量判断、异常候选和派生记录均须保留原始证据与不确定性，不自动发布环境结论，不直接控制真实潜器或执行高成本、可能影响环境的任务。
  因海洋数据工具、设备接口、多模态方法、开放数据许可和本地模型变化较快，死因保质期设为一年。
  复核时应优先寻找同一离线系统在合法超深海数据上的端到端记录包、跨设备与跨潜次验收、原始回链、误差、缺口识别、人工工时和撤回记录；
  若只有新增数据集、单次同步演示、模型参数或普通浅水结果，不应据此扩大复活范围。
