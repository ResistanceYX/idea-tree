# 人工复核记录：节点日期和排序由scripts/generate_review.py自动维护。
# 没有记录的节点自动以待复核进入REVIEW.md，无需在此预建条目。
# 已复核必须填写复核结论和复核后日期；暂缓必须在备注中写明原因和下次检查条件。
# 备注只进入REVIEW.md，不进入公开静态站；可选履历的说明会在公开详情页展示，只填写真实历史。
# 示例结构（请勿把示例当作实际复核记录）：
# records:
#   example-node:
#     复核状态: 已复核
#     复核结论: 维持原判
#     复核后日期: 2026-11-09
#     备注: 已核对死因、证据、链接与附件
#     履历:
#       - 日期: 2026-11-09
#         档案类型: 预审
#         复活状态: 死透
#         说明: 已完成真实复核，维持当前状态。
records: {}
