编号: "0040"
id: hadal-multimodal-observation-summary-evidence-offline-agent
标题: 超深海多模态观测总结与证据回链离线Agent
一句话: |
  对合法取得且已经形成的超深海潜次或长期观测记录进行本地整理，输入可来自独立记录整理工具，也可来自机构既有档案；
  按潜次、站点、时段或研究问题组织材料，生成带原始片段、传感器曲线、时间位置和处理历史回链的摘要或报告，
  区分直接观测、跨模态印证、模型推断和无法判断项，保留数据缺口、人工修改与撤回记录；
  不把“本次未观测到”写成“对象不存在”，不自动公开报告或替代研究人员定稿
档案类型: 预审
复活状态: 复活候选
结论边界: |
  复活候选仅指“合法既有观测记录输入—按任务组织材料—证据检索与回链—摘要草稿—事实类型和不确定性标记—
  人工修改与定稿”的有限核心链具有可复用的分项直接实现；尚无证据证明同一套离线Agent已在超深海完成多模态总结、
  逐项事实一致性、证据覆盖率、跨潜次复现和人工工作流的端到端验收。不涵盖原始数据时空对齐、自动科学或环境结论、
  未知候选识别、自动复航搜索、自动公开发表、真实科研采用或商业闭环
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 海洋科研工具
子领域: 超深海洋观测总结、证据回链与离线人机复核
死法:
  - 类型: 条件已死
    证据: |
      DAP论文公开了额定11公里的超深海剖面平台，其嵌入式计算机记录CTD和氧传感器数据，
      并按任务文件执行预设或自适应采样，完成8370米级多次部署；该平台证明超深海原始观测可由平台在任务中自动记录，
      但论文不是自动时空对齐Agent的实现，也不以视频—CTD自动对齐为已验收能力。
      MBARI的VARS公开了船端视频记录、海上标注、回岸同步、视频质量控制，以及将视频观察与位置、深度、氧等辅助数据合并的流程。
      SOVIS论文另公开了将视频、声呐和潜器日志清洗并同步为成对样本的后处理管线；
      其数据采集深度为0—91米，只证明处理组件，不能冒充超深海部署证据
    推理: |
      一，若旧判断是“超深海观测只能得到无法关联的孤立文件，离线条件下也无法组织多模态记录”，这一条件已经翻案。
          平台自动记录、时间戳同步、视频—辅助数据合并及多传感器后处理均有直接实现；
      二，可保留的候选核心是：原始文件保持只读，各模态使用独立适配器，Agent把已有时间、位置、深度、设备和校准信息
          组织成共同索引，并明确标出无法对齐、缺失、重复、冲突和需要人工判断的部分；
      三，上述证据属于不同平台、深度和任务。DAP证明超深海平台自动记录，VARS证明特定机构的深海数据治理，
          SOVIS证明多传感器关联和后处理；三者不能拼成某一超深海Agent已经完成全部工作；
      四，因此本节点判为“预审＋复活候选”：有限记录与对齐链值得缩围验证，但仍需在合法超深海既有数据上
          独立验收跨设备误差、缺口识别、可追溯性和复现性，不能直接写成通用系统已复活。
    案例: DAP超深海自主记录、VARS辅助数据合并和SOVIS多传感器同步分别证明关键环节存在，但只有保留各自条件才能支持离线记录候选链
    证据链接:
      - https://journals.ametsoc.org/view/journals/atot/38/10/JTECH-D-20-0139.1.xml
      - https://www.mbari.org/technology/video-annotation-and-reference-system-vars/
      - https://arxiv.org/html/2606.01398v1
    置信度: 高

  - 类型: 理论证伪
    证据: |
      Maynez等对抽象式摘要开展人工评价，发现被测模型生成的摘要中存在大量不忠于输入的内容，
      并指出ROUGE等常规指标不能代替事实一致性评价。RAGTruth进一步表明，检索增强生成仍可能产生不受检索内容支持或与其矛盾的说法，
      现有幻觉检测方法也不能保证完全可靠。两者说明“有原文”或“有检索”不等于生成内容自动真实，但不提供海洋领域错误率。
      Java Trench超深海研究因缺少准确水下导航和连续位置记录，只能结合深度与固定参考点估计位置；
      论文在讨论潜在外围生物时使用“相机中未见”而非断言其不存在。DAP的8370米级任务还记录了深水氧传感器滞后伪影与后处理需求，
      且6000米以下仍有未解决校正趋势，说明输入记录本身也可能带有未消除的不确定性
    推理: |
      一，强版本“只要把多模态记录和检索结果交给语言模型，就能自动生成真实、完整、可直接发表的环境总结”被上述证据证伪。
          证据链接是访问入口，不是对每项生成陈述的逻辑蕴含证明；检索到相关材料也不保证模型没有误述、拼接或过度推广；
      二，多模态一致可能来自共同采样设计、相关处理流程或对同一有限区域的重复观察，不能自动升级为独立科学印证。
          传感器异常、处理伪影与真实环境变化也须保留备选解释，不能由摘要模型选择最流畅的一种写成事实；
      三，“本次未观测到”只描述指定设备、时空覆盖、检测能力和数据处理下的结果，不等于“对象不存在”或“环境没有变化”。
          缺少连续导航、传感器校正未决或档案覆盖不完整时，报告必须显式保留限制，不能补造精确轨迹、环境参数或观测事实；
      四，因此被证伪的是“检索＋生成＝可信科学报告”的强版本，而不是摘要辅助本身。
          合格输出应区分直接观测、跨模态印证、模型推断和无法判断项，并让每类陈述接受不同强度和范围的证据检查。
    案例: 通用摘要与检索增强研究揭示事实性风险，Java Trench和DAP则说明海洋档案中的空间缺口与传感器不确定性必须随摘要一起保留
    证据链接:
      - https://aclanthology.org/2020.acl-main.173/
      - https://aclanthology.org/2024.acl-long.585/
      - https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2022.856992/full
      - https://journals.ametsoc.org/view/journals/atot/38/10/JTECH-D-20-0139.1.xml
    置信度: 高

  - 类型: 执行人限制
    证据: |
      NOAA明确说明声呐、CTD、视频和其他观测资料的取得与发布仍包含人工布放、监控、排障、清理、质控、打包和归档，
      数据经过质量控制和审查后才提交归档。MBARI的VARS流程包含海上研究人员标注、回岸同步、视频质量控制、注册和Video Lab人员进一步标注，
      说明证据库背后存在持续领域劳动。Maynez等依靠人工评价揭示自动指标未能充分反映的摘要事实性问题。
      DAP的深水氧传感器数据需要后处理且仍保留未解决趋势；OceanGPT论文中的结果包含作者自报、自动评价和小规模人工评价，
      只能按论文所报任务理解，不能替代本节点的超深海多模态报告人工验收
    推理: |
      一，具体限制是实施者必须同时理解研究问题、观测覆盖、设备与处理限制、证据链和摘要事实性评价。
          会调用本地语言模型，不等于能判断哪些环境变化有证据、哪些只是推断，也不等于能识别报告遗漏的关键反证；
      二，关键工作包括确定报告模板和读者、建立陈述—证据映射、整理代表性直接观测与反例、构造漏报／误述／过度推断测试集，
          再由研究人员核对原始片段、传感器曲线、时间位置和处理历史，并记录修改与驳回理由；
      三，若缺少这些工作，项目后果可能是文本流畅却隐藏采样缺口、把设备状态误写成环境变化，或让专家为寻找证据和修正措辞重新阅读全部材料，
          形成比纯人工更重的复核负担；
      四，缓解边界是先选择少量合法且证据链完整的既有潜次或时段，优先采用结构化模板和可抽取内容，
          将生成部分限制在有明确证据的段落，以独立人工事实性基准验收后再扩大范围。缩围原型不等于自动科研写作或真实任务采用。
    案例: NOAA与VARS的人工质控、摘要研究的人工事实性评价和DAP的未决校正共同说明，离线生成不会消除海洋领域复核工作
    证据链接:
      - https://oceanexplorer.noaa.gov/expedition-feature/data-collected-on-okeanos-explorer/
      - https://www.mbari.org/technology/video-annotation-and-reference-system-vars/
      - https://aclanthology.org/2020.acl-main.173/
      - https://journals.ametsoc.org/view/journals/atot/38/10/JTECH-D-20-0139.1.xml
      - https://arxiv.org/html/2310.02031v7
    置信度: 高

  - 类型: 信任成本
    证据: |
      RAGTruth说明检索增强生成仍会产生缺乏依据或与检索内容矛盾的陈述，且检测方法并非完全可靠；
      Maynez等则证明常规摘要分数不能替代输入一致性检查。MBARI的VARS既提供图像、视频、环境参数和潜次元数据回链，
      也保留质量控制、人员标注及历史数据偏差免责声明，说明“能查到材料”与“材料天然适合所有结论”是两件事。
      NCEI将潜次总结、航次总结及关联内容纳入数据管理和元数据结构，支持报告与档案关联的可追溯形态。
      Java Trench研究对缺少连续位置和“相机中未见”的谨慎表述，则直接展示科研文本需要保留观测边界
    推理: |
      一，科研用户需要相信的不只是报告读起来连贯，还包括每项重要判断对应哪些原始证据、证据是否覆盖该时空范围、
          是否经过校正或其他处理、哪些内容是模型推断，以及谁修改、批准或撤回了陈述；
      二，可信输出应提供陈述级证据回链、来源与处理版本、观测覆盖和缺口、事实类型、不确定性、备选解释及人工状态。
          直接观测、跨模态印证和模型推断不得共用同一种无差别肯定措辞；无法判断项应保留为空缺而非由模型补齐；
      三，验收应分别测量摘要事实一致性、重要陈述证据覆盖率、无依据陈述、关键漏报与误述、来源完整性、跨潜次复现和人工修改，
          不能只报告ROUGE、语言流畅度、模型偏好分数或用户主观好感；自动检测器也只能辅助筛查，不能成为真实性最终裁决；
      四，报告应允许人工修改、驳回、补充和撤回，并保留版本差异。错误陈述即使已被导出也须能标记失效和更正，
          不自动公开报告、科学发现或环境结论，最终定稿责任仍由研究人员承担。
    案例: VARS的证据访问与质控流程只有在摘要陈述级回链、人工评价和缺口披露同时存在时，才能转化为可复核报告而非流畅但不可信的文本
    证据链接:
      - https://aclanthology.org/2024.acl-long.585/
      - https://aclanthology.org/2020.acl-main.173/
      - https://www.mbari.org/technology/video-annotation-and-reference-system-vars/
      - https://www.ncei.noaa.gov/products/ocean-exploration-and-research-oer-data-management
      - https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2022.856992/full
    置信度: 高

  - 类型: 政策风险
    证据: |
      NOAA数据入口说明视频搜索结果可连接视频详情、潜次总结和预览，并明确其视频门户中的视频属于public domain；
      这一声明只适用于相应NOAA门户内容，不能外推为所有机构影像、标注、报告和任务元数据都可自由复制、再分发或公开。
      同一入口还说明不同数据经质控和发布后才会进入相应档案，可用时间并不一致。
      NCEI的数据管理页面把航次、潜次、视频和关联报告纳入正式数据管理流程，证明报告及证据发布属于有治理的档案活动，
      而不是任意文件生成后即可公开
    推理: |
      一，观测记录可能来自公开档案、机构内部资料、合作潜次或受限项目；获准内部阅读或研究总结，不当然包含公开原图、视频、
          精确位置、未发表结果和任务细节的权限。技术上能回链证据，也不等于接收者有权访问或再分发该证据；
      二，系统应在输入和导出时分别记录来源、权利人、许可或机构授权、允许用途、署名、保存期限、再分发范围和撤回状态，
          默认本地处理与私密报告；调用云模型、搜索或外部API前必须说明发送的是原始材料、片段、特征还是元数据，并取得相应许可；
      三，不得把绕过登录、验证码、付费墙、访问控制、反爬或平台限制写成数据取得能力，
          也不得向仓库、公开站或公共报告区上传未经授权的原始影像、视频、内部标注和任务资料；
      四，报告和证据链接默认只在有权人员范围内可用，公开只限人工确认且有权公开的最小必要内容。
          本条不宣称所有海洋数据都受限或所有云处理都违规，具体义务按许可、合作协议、机构制度和适用规则分别核对。
    案例: NOAA特定视频的public domain口径与正式数据管理流程说明，公开案例不能替代对其他数据来源和报告发布权限的逐项核对
    证据链接:
      - https://oceanexplorer.noaa.gov/data/access-tools/
      - https://www.ncei.noaa.gov/products/ocean-exploration-and-research-oer-data-management
    置信度: 中

  - 类型: 钱算不平
    证据: |
      NOAA公开的数据工作需要人工布放、监测、排障、清理、质控、打包、审查和归档；
      MBARI的VARS流程涉及船端记录与标注、回岸同步、高容量存储、视频质量控制、注册及Video Lab人员进一步标注。
      OceanGPT项目页证明本地部署组件存在，但本地下载和WebUI说明不是完整系统的硬件、运维或科研复核报价。
      RAGTruth关于生成幻觉和检测方法局限的研究还提示，检索与自动检测不能替代事实性验收，
      因而不能把一次本地推理费用当作可信报告的全部成本
    推理: |
      一，完整路线的全成本包括合法数据取得、档案整理、证据索引、本地计算与存储、报告模板、陈述—证据映射、
          事实性测试集、领域专家复核、错误清理、版本维护、撤回纠错和权限管理，不能用模型下载免费或单次推理价格替代；
      二，有效产出应是经研究人员确认、重要陈述可回链且明确披露缺口的潜次摘要、观测时段报告或研究材料汇编，
          以及实际减少的重复查找和整理返工；若生成报告需要专家逐句重查，文本页数越多反而可能增加成本；
      三，重启预算“中”对应复用公开许可或机构授权的既有档案、现成工具和本地模型，完成少量潜次或时段的离线软件原型与独立评测；
          不包含新造耐压平台、购买潜器或支持船、新增海试航次、大规模基础模型训练或长期多机构运营；
      四，本轮没有取得可核验的2026年报告编写工时、专家费用、机构存储、硬件或运维报价，故不编造节时比例、项目总价或回本周期。
          缩围原型应与纯人工和既有档案工具比较同一批材料的有效产出与总成本，再决定是否扩展。
    案例: NOAA与VARS的持续人工和档案流程说明，证据化总结能否算平取决于减少多少检索与返工，而不是本地模型能否免费运行
    证据链接:
      - https://oceanexplorer.noaa.gov/expedition-feature/data-collected-on-okeanos-explorer/
      - https://www.mbari.org/technology/video-annotation-and-reference-system-vars/
      - https://github.com/zjunlp/OceanGPT
      - https://aclanthology.org/2024.acl-long.585/
    置信度: 中

需求证据:
  类型: 潜次与航次总结、证据化档案查询和海洋语言生成的直接工作基础；独立用户、事实一致性和采购需求待验证
  说明: |
    NOAA与NCEI的公开档案结构证明潜次总结、航次总结及其与视频、传感器和任务资料的关联是实际科研数据产品，
    MBARI的VARS Query证明研究人员需要按时间、空间和物理参数找到图像、视频、环境数据与潜次元数据。
    OceanGPT及其本地部署说明进一步证明海洋语言生成不是空白，但只提供可复用组件，不提供本节点端到端证据。
    这些材料支持“把既有观测记录组织成可核查、可修改报告”的需求，不等于本节点Agent已有用户规模、普遍节时或商业订单。
    本轮没有取得海洋科研团队、报告撰写者或数据管理员的访谈与持续试用，也没有真实任务中的事实一致性、证据覆盖、
    漏报误述、人工工时变化、采购或续用数据。最关键的缺口是：哪些既有超深海档案确实需要跨材料总结，
    哪些重要陈述可以稳定回链证据，以及新Agent能否比现有报告模板、VARS查询和人工写作更低成本地产出可信结果。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在使用者是拥有合法超深海或深海观测档案的科研团队、观测设施、数据中心和需要汇编历史任务材料的项目组，
            潜在付费方可能是科研项目、机构数据平台或内部知识管理服务；这些主体和付费关系尚未验证。
            可测试的服务形态是私有档案接入、研究问题与报告模板配置、证据检索、陈述级回链、事实性评测和人工复核工作台，
            而不是出售“自动撰写可靠科学结论”的承诺。现有NOAA／NCEI档案、VARS及开源语言模型会压低通用摘要功能的收费空间，
            可能形成差异的是特定档案适配、可追溯证据质量、跨潜次事实一致性和实际减少的报告返工。
            全成本包括授权、存储、证据索引、本地计算、模板与评测集、专家复核、维护、权限和纠错；
            当前没有订单、收入、利润、普遍节费或商业闭环证据。
  社会价值：对确有多源档案复用需求的项目，证据化总结可能帮助研究人员重新利用历史潜次、快速定位代表性材料、
            保留观测缺口和不确定性，并让读者区分原始观察与后续推断，而不是只保存无法追踪来源的叙述文本。
            价值应按经确认的事实一致摘要、可复核证据、减少的重复劳动、纠正的误述和促进的后续研究衡量，
            而非生成页数、引用链接数量或模型自评分数。潜在负价值包括制造无依据环境事件、把未观测到误写为不存在、
            让多模态一致伪装成科学定论、泄露受限数据、增加专家清理负担，以及诱发对流畅报告的自动化偏信。
            社会净收益只有在合法数据、陈述级证据回链、独立事实性验收、人工负责和可撤回纠错同时存在时才可能成立。

可拆零件:
  - 档案来源、权利人、取得方式、许可或机构授权、允许用途、署名、保存期限、再分发范围和撤回状态的输入登记表
  - 读取已形成观测记录、既有潜次档案及其原始证据和处理历史的适配器；不要求特定上游记录工具建成，不负责重新自动对齐原始数据
  - 按潜次、站点、时间段或研究问题生成材料清单与报告提纲的组织器，显式记录纳入、排除和缺失范围
  - 汇总观测覆盖、设备状态、采样间隔、空间缺口、处理版本和既有质量标记的覆盖说明器，不用模型补造缺失信息
  - 回链原始图像或视频片段、声学记录、传感器曲线、时间位置、任务编号和处理历史的证据检索与陈述映射模块
  - 分别标记直接观测、计算派生、跨模态印证、模型推断和无法判断项的事实类型与不确定性标注器
  - 在本地模板和经批准的模型之间生成潜次摘要、观测时段报告或研究材料汇编草稿的组件，保存模型、提示、参数和版本
  - 检查重要陈述是否有证据、证据是否覆盖对应时空范围及措辞是否超过证据强度的辅助校验器，不把自动检测结果当真实性保证
  - 识别“未观测到＝不存在”、多模态一致＝科学定论、传感器异常＝真实环境事件等过度表述的风险清单
  - 人工接受、修改、驳回、补充、保留未知和撤回报告陈述的工作台，所有变更保留人员、时间、理由和证据差异
  - 保存报告版本、原始与派生材料、处理历史、审核状态和撤回记录的来源追踪模块
  - 私密默认的导出与更正机制，只分享经人工确认且有权公开的最小必要报告和证据，不自动公开科学或环境结论
  - 分别评估摘要事实一致性、重要陈述证据覆盖率、无依据陈述、关键漏报误述、来源完整性、跨档案复现和人工工时的验收集
  - 可选的标准化观测记录输入接口，可读取独立记录整理工具输出的记录包，也可接入机构既有档案；不包含未知候选识别、复航搜索、海底通信或潜器控制

