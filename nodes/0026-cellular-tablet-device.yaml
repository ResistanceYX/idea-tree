编号: "0026"
id: cellular-tablet-device
标题: 可插卡使用蜂窝数据的平板设备
一句话: |
  面向离开无线局域网后仍需独立联网的平板使用场景，生产配备实体SIM卡槽的蜂窝数据平板；
  真正需要验证的是独立联网需求与场景差异化，而不是把卡槽本身当作尚未出现的技术
档案类型: 预审
复活状态: 已复活
重启预算: 高
创新类型: [渐进式, 技术应用]
领域: 消费电子
子领域: 蜂窝联网平板电脑
死法:
  - 类型: 条件已死
    证据: |
      三星中国的Galaxy Tab S11产品页列出5G网络说明和SIM卡／microSD卡槽顶针，
      Galaxy Tab A11+ 5G产品页同样列出SIM卡／微型SD卡托盘顶针，说明可插实体SIM卡的5G平板已经有公开量产产品；
      Apple官方指南则列出多代无线局域网＋蜂窝网络iPad，并说明部分后续机型使用eSIM且没有实体SIM卡。
      三类官方材料共同证明平板独立使用蜂窝数据并非尚未实现，实体卡槽与eSIM是两条已经存在的产品路线
    推理: |
      一，若旧判断是“平板不能插电话卡，因而没有能独立使用蜂窝数据的平板”，这一条件已经被现有产品翻案。
          无线局域网机型较多即使属实，也只能说明产品配置结构，不能推出蜂窝平板不存在；
      二，本节点的已复活同时覆盖两种技术条件：实体SIM卡平板已经量产，取消实体卡槽的eSIM平板也能开通蜂窝数据。
          因而产品目标不应写成“让平板第一次连上移动网络”，而应写成满足哪些仍未被服务好的独立联网场景；
      三，实体SIM卡槽提供可更换载体，eSIM提供数字化开通，二者都受运营商、地区、机型和套餐约束。
          卡槽不是网络能力的同义词，取消卡槽也不等于取消蜂窝数据；
      四，复活只证明产品与技术条件成立，不证明“大多数用户都需要蜂窝平板”，不证明新品牌能够取得销量、利润或持续留存，
          更不证明仅增加一个卡槽就足以形成可防守的创新。
    案例: 三星实体SIM卡5G平板与Apple蜂窝iPad共同证明独立联网路线已经存在，eSIM则改变了实体卡槽的必要性
    证据链接:
      - https://www.samsung.com.cn/tablets/galaxy-tab-s/galaxy-tab-s11-gray-256gb-sm-x736czaxchc/
      - https://www.samsung.com.cn/tablets/galaxy-tab-a/galaxy-tab-a11-plus-gray-128gb-sm-x236czaochc/
      - https://support.apple.com/zh-cn/119592
    置信度: 高

  - 类型: 伪需求
    证据: |
      Apple官方支持页允许其他设备通过无线局域网、USB或蓝牙连接iPhone或蜂窝iPad的个人热点，
      并提示该功能取决于运营商且可能产生额外费用；其eSIM指南又说明蜂窝iPad可以不经实体SIM卡开通套餐。
      这些材料证明“平板在户外上网”已有手机热点、实体SIM蜂窝平板和eSIM蜂窝平板等多种满足方式，
      但没有给出目标用户对实体卡槽的独立偏好、使用频率或付费意愿
    推理: |
      一，用户真正需要的是离开无线局域网后仍能联网，不一定需要平板里有一张可拔出的电话卡。
          对随身带手机的轻度用户，热点已经能以较低新增硬件成本满足同一任务，实体卡槽带来的增量价值可能很小；
      二，对手机不总在身边、多人共用平板、需要独立设备在线或不希望联网操作持续占用手机的用户，
          内置蜂窝能力仍可能有明确价值。上述场景是待验证假设，不能在没有用户记录时写成已经证实的大众需求；
      三，不能用“多数在售配置没有实体卡槽”反推“多数用户被压抑地需要卡槽”。
          厂商同时提供不同配置也可能是在服务分层需求，需求研究必须分别记录独立联网频率、现有替代方案、换卡习惯和总支付意愿；
      四，较可信的缩围不是泛泛生产插卡平板，而是先找出热点与eSIM都不方便的具体人群，
          再检验他们是否愿意为独立连接、实体卡兼容和相应售后承担硬件与套餐的全成本。
    案例: 手机热点解决轻度偶发联网，实体SIM或eSIM蜂窝平板服务独立在线，三类方案应按场景比较而非互相替代全部用户
    证据链接:
      - https://support.apple.com/zh-cn/111785
      - https://support.apple.com/zh-cn/119592
    置信度: 中

  - 类型: 巨头碾压
    证据: |
      IDC对2026年第二季度全球平板市场的分析称，Apple、Samsung、Lenovo、Huawei、Xiaomi前五厂商合计约占79.8%，
      并指出较大厂商在存储器采购上具有小厂商难以匹配的供应保障能力。
      与此同时，三星已经提供不同产品层级的实体SIM卡5G平板，说明新进入者面对的并非空白供给，而是已有品牌、产品线和渠道的同功能竞争
    推理: |
      一，通用型插卡平板会直接接受消费者对价格、屏幕、性能、频段、系统维护、品牌与售后的综合比较。
          “有卡槽”很容易被列为配置项，却不能抵消头部厂商在采购、系统生态、渠道和维修网络上的既有优势；
      二，IDC的份额是整个平板市场口径，不是蜂窝平板细分份额，不能据此编造实体SIM平板的精确竞争格局。
          它足以支持通用平板市场的集中与规模门槛，不足以预言每个垂直场景都会被头部厂商覆盖；
      三，较可防守的路线应回答头部标准品没有解决什么，例如特定行业的设备管理、耐用性、维修时限、地区运营商适配或实体卡与eSIM并行需求。
          这些差异化必须有采购方或持续使用者证据，不能只把功能列表加长；
      四，若产品只是通用ODM整机增加蜂窝配置，其他品牌也容易取得相近硬件。
          此时真正竞争的是供应、合规、渠道和服务，而不是卡槽创意本身。
    案例: 头部厂商已经提供实体SIM蜂窝平板并掌握整体市场与采购规模，通用卡槽配置难以单独构成进入壁垒
    证据链接:
      - https://www.idc.com/resource-center/blog/the-tablet-market-hits-a-wall/
      - https://www.samsung.com.cn/tablets/galaxy-tab-s/galaxy-tab-s11-gray-256gb-sm-x736czaxchc/
      - https://www.samsung.com.cn/tablets/galaxy-tab-a/galaxy-tab-a11-plus-gray-128gb-sm-x236czaochc/
    置信度: 高

  - 类型: 钱算不平
    证据: |
      IDC记录2026年第二季度存储器成本压力已经传导至多品牌平板涨价和消费者出货下降，
      并指出大厂商在供应保障上的规模优势；这属于当前周期证据，不应外推为永久成本曲线。
      工信部《无线电发射设备管理规定》要求相关设备申请型号核准，并提交生产能力、技术力量、质量保证、技术手册和关键射频元器件等材料，
      说明蜂窝平板量产成本不能只按增加一个卡槽估算。Apple个人热点指南还提示运营商可能收取额外费用，用户侧比较也包含持续通信成本
    推理: |
      一，完整硬件成本应包括蜂窝模组、射频与天线设计、SIM／eSIM实现、测试认证、良率、库存、退换维修和系统维护，
          而不是只比较卡槽零件费。销量越不确定，库存与售后分摊越容易吞掉单机毛利；
      二，用户会比较“蜂窝平板整机价差＋套餐＋更换设备成本”与“现有WiFi平板＋手机热点”的总成本。
          即使有人需要独立联网，也不代表其支付意愿足以覆盖新品牌的低规模生产和售后成本；
      三，当前存储器涨价说明成本与需求会同时变化，但本项目没有物料清单、报价、返修率、销量或套餐数据，
          因而不能编造单机成本、毛利率和回本销量，只能把全成本核算设为投产门槛；
      四，ODM小批量试产可以减少自研投入，却不会自动消除型号核准、区域适配、库存和售后责任。
          更稳妥的顺序是先用可核验的真实在线使用和采购意向验证细分场景，再决定是否扩大生产。
    案例: 头部厂商尚受存储器成本和价格需求压力影响，新品牌若只计算卡槽与模组成本，会低估库存、合规和售后的完整负担
    证据链接:
      - https://www.idc.com/resource-center/blog/the-tablet-market-hits-a-wall/
      - https://www.gov.cn/gongbao/content/2023/content_5745288.htm
      - https://support.apple.com/zh-cn/111785
    置信度: 中

  - 类型: 执行人限制
    证据: |
      工信部规定相关无线电发射设备申请型号核准须具备相应生产能力、技术力量和质量保证体系，
      提交射频相关技术材料并接受技术检测，获证后还要保持生产能力和技术参数一致，销售相关设备还须办理备案。
      三星产品页明确5G服务取决于国家、地区、运营商和使用环境，Apple eSIM指南也把开通能力限定于支持机型、地区和运营商，
      说明插卡或写入eSIM只是联网交付链的一部分
    推理: |
      一，普通实施者面对的关键工作包括蜂窝模组与射频天线集成、功耗和散热、系统拨号与数据连接、地区和运营商频段适配、
          样机测试、质量一致性、认证备案及维修，不是设计一个卡托就完成产品；
      二，在中国大陆，型号核准与销售备案是明确的合规工作；是否还需其他许可或认证应按具体设备分类、销售地区和功能核定，
          不能把旧手机规则不加区分地套到所有蜂窝平板上；
      三，实体SIM可以减少对特定eSIM开通流程的依赖，却不能消除频段、网络覆盖、运营商服务和区域SKU差异。
          若支持eSIM，还要额外处理运营商激活、套餐转移、失败恢复和用户指导；
      四，对普通团队，较可执行的缩围是采用合规文件完整的成熟ODM方案，先限定销售地区、运营商与数据功能，
          完成弱网、切换、长时间在线、发热和售后回归后再扩SKU；自研射频和多地区同步发售会显著提高门槛；
      五，本条不宣称现有团队一定无法完成，公开材料也未提供本项目开发周期和失败率，
          因此中置信度指向完整交付链与维护负担，而不是对具体团队能力下结论。
    案例: 蜂窝平板需要把硬件、运营商适配、合规和持续质量交付同时完成，成熟ODM与限定区域试产比单纯自制卡槽更接近可执行路线
    证据链接:
      - https://www.gov.cn/gongbao/content/2023/content_5745288.htm
      - https://www.samsung.com.cn/tablets/galaxy-tab-s/galaxy-tab-s11-gray-256gb-sm-x736czaxchc/
      - https://support.apple.com/zh-cn/119592
    置信度: 中

需求证据:
  类型: 官方量产产品、蜂窝开通指南与替代联网方案
  说明: |
    三星中国的Galaxy Tab S11和Galaxy Tab A11+ 5G页面证明实体SIM卡蜂窝平板已有公开产品，
    Apple官方指南证明多代iPad具有蜂窝网络机型，并展示eSIM开通路线；这些是当前供给与技术可行性的直接证据。
    Apple个人热点指南证明手机或蜂窝平板可以向其他设备共享网络，说明WiFi平板存在替代联网方案。
    现有材料支持“部分场景可能需要平板独立在线”，但官方产品页和指南不能替代独立销量、激活率、持续在线使用或付费意愿研究。
    本次未取得可核验的WiFi机型与蜂窝机型出货比例，因此不把“现在大多数平板没有电话卡”写成已证实统计；
    也没有取得用户访谈、采购订单、蜂窝套餐激活或分场景留存数据，实体SIM相对eSIM和热点的独立需求仍是主要证据缺口。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在受益者是需要平板在没有可用WiFi时持续在线、手机不总在身边或不愿依赖手机热点的用户和组织，
            例如移动办公、现场作业、多人共用设备及需要独立管理的行业终端；这些只是待验证场景，不是已取得的客户结果。
            通用消费市场已有头部蜂窝平板，单纯增加实体卡槽的差异化与议价空间有限。
            较可验证的商业方向是围绕特定地区运营商适配、设备管理、耐用与维修服务形成完整方案，并用小批量真实采购检验。
            核算应按每台持续有效在线设备或每个被替代的热点使用场景计算全成本，包含硬件、射频与认证、套餐补贴、库存、退换维修和系统维护；
            出货量、插卡数和单次联网演示都不能替代持续使用、回款与利润。当前没有本项目商业闭环证据。
  社会价值：独立蜂窝连接可以减少平板对固定WiFi和另一台手机的依赖，为移动场景、临时场所和共享设备提供更直接的联网选择；
            实体SIM与eSIM并存也能给不同运营商条件和换卡习惯的用户保留选择。
            但蜂窝连接不能消除地区覆盖、套餐费用和运营商限制，额外硬件与短生命周期库存还会带来资源消耗和电子废弃物。
            社会净收益较高的形态是面向明确独立在线需求提供可靠、可维修、可长期更新的设备，而不是制造低频使用、很快被闲置的同质化硬件。

可拆零件:
  - 蜂窝基带与模组、射频前端、天线、SIM卡托和可选eSIM组成的独立联网硬件链
  - 按销售地区、运营商、频段和数据功能划分的适配矩阵，以及弱网、切换和长时间在线测试
  - 型号核准、销售备案及其他适用许可的分类核验清单，技术资料、样机与量产一致性记录
  - 实体SIM与eSIM的配置选择、运营商激活、套餐转移、失败恢复和用户指导流程
  - WiFi、手机热点、实体SIM和eSIM四种路线的使用频率、独立性与全成本比较表
  - 蜂窝联网引入的功耗、发热、续航与天线性能回归测试
  - 面向组织用户的设备激活、远程管理、流量策略、丢失处置与权限分离组件
  - 成熟ODM供应商的合规文件、物料追溯、良率、维修备件和系统更新责任清单
  - 以持续在线、实际使用天数、热点替代率和真实采购意向为指标的小批量验证方案
  - 限定地区与运营商的售后、退换、备件和系统维护流程，避免先铺开通用SKU再补交付能力

死因保质期: 2027-11-14
起草AI: 澄樾（Kimi-K3.1）
审核人: ResistanceYX
审核日期: 2026-11-14
备注: |
  本节点为AI起草、人类审核的预审档案，不是已有具体项目实施后失败、停止或转向的验尸记录。
  清单第20项只登记“可插卡使用蜂窝数据的平板设备”，没有提供特定失败项目；即使原始直觉是验尸，也不能据此编造验尸对象。
  已复活仅指实体SIM或eSIM平板独立使用蜂窝数据的产品与技术条件已经存在，不表示大众需求、特定新品牌销量、商业闭环或社会净收益已经证明。
  本节点把“电话卡”理解为用于蜂窝数据的实体SIM卡，不额外承诺传统语音电话或短信功能；若实际需求包括电话功能，应另作产品与合规界定。
  重启预算“高”针对自研或深度定制蜂窝平板、完成适用测试认证并建立量产、库存、渠道和售后的完整路线；
  采用成熟ODM进行限定地区小批量验证属于另一预算口径，不能用该缩围路线反推完整自研量产预算较低。
  当前成本与市场材料含2026年周期信息，复核时应更新存储器供应、头部产品价格、实体SIM与eSIM产品变化及运营商支持范围。
