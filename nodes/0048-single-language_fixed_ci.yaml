备注: |
  本节点为AI起草、人类审核的预审档案，不是Port、action-docs或actionlint已经失败的验尸记录。
  本批五个明确层级依次使用0044—0048候选编号；0049由主编补充指定为0047固定策略版本的类比修改与合并节点，不是本节点下游；正式上传前须由主编复核云端与编号顺序。
  本稿把主编所称“专业CI注释Agent”解释为继承下层的不可选块与固定注释程度，并收窄到CI工作流配置本身；
  首版只建议GitHub Actions。若未来改成可调密度、多CI平台或只生成PR评论，产品范围与直接派生关系都须重审。
  “CI注释”是给工作流YAML添加注释，“CI说明文档”是独立Markdown；二者都不等于CI运行时产生的PR行内评论、检查注解或构建日志摘要。
  中档预算只对应GitHub Actions、专用测试仓库、只读差异、静态检查和人工验收的原型，不包含生产工作流自动执行、秘密读取或多平台维护。
  Port指南是厂商公开实现与操作示例，其成功截图和说明文本不构成独立效果审计；action-docs与actionlint只证明各自公开功能。
  actionlint的静态规则、假设和误报边界不能外推为所有CI行为；GitHub官方语法用于说明具体语义，不证明AI生成内容准确。
  默认只读最小权限，秘密值、真实token、私有地址和专有配置不得写入节点、日志、证据附件或公开站；
  不绕过仓库授权、访问控制或平台限制，不把注释生成扩展成真实部署或高影响自动操作。
  因GitHub Actions语义、外部Action生态、安全规则、平台集成和AI文档能力变化较快，死因保质期设为六个月；
  复核时应检查Port等平台是否新增YAML注释回写、actionlint规则与假设、跨平台供给、真实修改对照、权限事故、人工复核总成本和商业证据。
