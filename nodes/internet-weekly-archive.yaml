id: internet-weekly-archive
标题: 周历史简报及档案网站
一句话: 用AI馆员采集、编写并存档互联网各文化圈层每周重要事项，形成简报、可检索档案与B站编年史视频
复活状态: 死透
重启预算: 低
创新类型: [渐进式, 技术应用]
领域: 内容与媒体
子领域: 网络文化档案
死法:
  - 类型: 伪需求
    证据: 内部推演＋Reuters Institute 2026年跨市场新闻消费调查
    推理: |
      一，信息茧房不只由信息匮乏造成，也由注意力偏好造成；用户不知道其他圈层发生了什么，不等于用户愿意每周阅读其他圈层的简报；
      二，圈内人通常比跨圈层编辑更快获得本圈大事，圈外人又未必关心未出圈事件，原方案的价值容易落在两头之间的真空带；
      三，Reuters Institute 2026年报告覆盖48个市场，整体新闻回避比例为42％，只能说明广泛新闻简报面临注意力约束，不能直接证明中国互联网亚文化档案没有需求。
    案例: 跨市场新闻回避调查，仅作需求侧间接旁证
    证据链接:
      - https://ora.ox.ac.uk/objects/uuid:bdec3e82-9aee-4301-9556-9d908881c74a
    置信度: 中

  - 类型: 巨头碾压
    证据: AnyKnew已聚合数十家站点热榜，支持定制站点并按日、周、月查看热点归档；今日热榜覆盖微信、今日头条、百度、知乎、微博、贴吧、豆瓣、虎扑、GitHub、抖音等平台，并提供官方API
    推理: |
      一，AnyKnew已经覆盖“跨站热点简报＋历史归档”的基础功能，今日热榜则压低了采集和展示多平台热榜的门槛，原方案难以仅凭聚合与存档建立差异化；
      二，现成产品可公网直接浏览，先把用户对基础简报与归档服务的价格锚点压在低位；剩下可供区分的跨圈层策展、史料核对和编年史叙事，又恰好是成本最高的部分；
      三，此条目按“既有替代品打死价格锚点”归类，不主张上述竞品本身均为巨头。
    案例: 全网热点聚合与历史归档产品
    证据链接:
      - https://www.anyknew.com/faq
      - https://github.com/ieliwb/tophub-api
    置信度: 高

  - 类型: 钱算不平
    证据: 创始人此前的低成本机器方案测算，辅以AnyKnew现存归档功能与Reuters Institute 2026年在线新闻付费调查
    推理: |
      一，此前测算表明机器账单可以较低，但采集、去重和生成便宜，不等于判断“什么值得入档”便宜；每增加一个圈层，都会增加黑话理解、来源核对、争议处理和视频制作等持续劳动；
      二，Reuters Institute 2026年报告中，持续跟踪的20个市场在线新闻付费比例为17％；该数字不是中国亚文化用户的付费率，只能作为新闻内容付费困难的旁证；
      三，在基础热点与归档已有现成替代品、直接订阅需求又未获验证的情况下，低收入预期难以覆盖随圈层数量扩张的策展劳动；本条目判断的是全圈层平台形态，不否定单一圈层内容账号的低成本试验。
    案例: 国际在线新闻付费调查与现存归档产品，均为间接证据
    证据链接:
      - https://www.anyknew.com/faq
      - https://ora.ox.ac.uk/objects/uuid:bdec3e82-9aee-4301-9556-9d908881c74a
    置信度: 中

  - 类型: 执行人限制
    证据: 创始人自我分析
    分析: |
      一，创始人以学生身份自费推进，原设想主要依赖AI馆员完成搜寻、编写和存档，尚未配置覆盖各圈层的稳定编辑力量；
      二，AI可以辅助检索、去重和摘要，但选择圈层、判断事件重要性、核对史料与承担争议责任仍需要人持续投入；
      三，每周简报叠加档案维护和B站视频会形成固定截稿节奏，覆盖范围越广，越容易与学业和可投入时间冲突。
    置信度: 中

需求证据:
  类型: 竞品生态观察
  说明: |
    AnyKnew与今日热榜说明跨站热榜聚合、快速浏览和历史回看已有现成供给，可间接支持“摘要与归档存在使用场景”；但尚未观察到用户为“覆盖所有文化圈层的每周策展简报”付费或持续使用的直接证据。本记录不等于判定垂直编年史没有需求。
  附件: 无

可拆零件:
  - 单一圈层周报模板与选题清单
  - 档案条目结构（时间、圈层、事件、来源、影响、后续）
  - AI馆员检索、去重、摘要与来源核对工作流
  - “十年前的这一周”编年史视频栏目
  - 圈层标签与跨年度时间轴索引

