id: uav-ugv-relayed-signal-transmission
标题: 基于大中型无人机及无人地面载具中转实现的信号传输
档案类型: 预审
一句话: 设想由大中型无人机与无人地面载具携带、投放或充当通信中继节点，在地面设施受限的环境中延展信号传输；本档案区分已有现实先例的限定场景空地协同中继，与尚未得到证明的任意环境持续完整覆盖。
设想来源: 主编提供的第28项原始技术设想；原文只给出“基于大中型无人机及无人地面载具中转实现的信号传输”，未指定客户、产品、收费方式、部署区域、通信体制或任务时长，本档案不补写这些未提供条件。
记录日期: 2026-11-13
当前结论: AI初稿建议归入非创业技术设想储备区，并判为预审／已复活。已复活范围仅是合法授权、限定区域和任务时段内，由空中或地面无人平台承担临时、任务型通信中继；公开部署、竞赛系统和直接相关研究已经证明这一弱版本具有现实基础。该判断不证明任意环境、持续在线、完整覆盖、全部数据无损回传或脱离固定／卫星／地面回传也能成立的强版本，更不证明独立商业闭环。
复活状态: 已复活
创新类型:
  - 渐进式
  - 技术应用
领域: 信息通信与无人系统
子领域: 空地协同通信中继
死法:
  - 类型: 理论证伪
    证据: NASA/JPL关于DARPA地下挑战赛的资料显示，地面机器人可以投放无线中继节点扩展联系范围，但脱离联系后仍须自主决定继续探索或返回更新信息。MARBLE竞赛系统包含地面、空中机器人及可投放通信中继，地面机器人能够自主或按监督者命令投放中继，其数据协作也按通信可用情况工作。2026年一篇直接研究UAV为移动UGV群提供中继的论文只评估单个中继UAV，采用简化运动和信道模型，未考虑电池或飞行时长限制，并明确说明结果基于仿真、不构成实地验证。
    证据链接:
      - https://www.nasa.gov/centers-and-facilities/jpl/robots-autonomously-navigate-underground-in-darpa-challenge/
      - https://dl.acm.org/doi/full/10.1145/3588325
      - https://www.mdpi.com/2079-9292/15/18/4204
    推理: 这些材料足以否定“中转只能停留在设想、没有现实技术基础”的判断，却同时说明中继扩大的是特定条件下的可通信范围，而不是自动创造端到端持续连接。接入链路、平台间链路、最终回传、能源与节点存活任一环节中断，都可能使后续中转失去意义；断联后返回更新或允许延迟传输，本身就不是持续在线。仿真中的中继效果也不能替代复杂地形、长期能源和真实信道下的实地验证。因此，被证伪的是“只要增加大中型无人机和UGV中转，就能在任意环境获得持续、完整、可靠信号”的强版本，不是所有空地中继路线。
    置信度: 高
    备注: 高置信度针对“已有弱版本先例，但强版本不能由这些先例推出”这一边界。NASA与ACM材料来自特定竞赛系统，MDPI论文是直接相关但仅限仿真的研究，三者不相互替代，也不用于推算具体覆盖距离、链路参数或部署方案。
  - 类型: 钱算不平
    证据: AT&T在飓风Milton应对页面中自述使用Flying COW为应急响应者和受灾地区提供连接，这能证明专业组织部署无人机临时覆盖的现实先例，但页面没有给出本设想所需的完整成本或独立效果审计。MARBLE系统除空中和地面机器人外，还包括静态中继、基站、人类监督及现场保障。直接相关UAV-UGV中继论文未考虑电池或飞行时长限制，意味着其仿真结果不能直接回答持续任务需要多少轮换、补给与维护投入。
    证据链接:
      - https://about.att.com/pages/disaster-recovery/2024/storm-milton
      - https://dl.acm.org/doi/full/10.1145/3588325
      - https://www.mdpi.com/2079-9292/15/18/4204
    推理: 平台能够携带中继设备，不等于整条服务路线算得平。全成本还包括通信载荷、接入与回传设施、机队轮换、能源补给、地面运输、投放节点损耗、维修备件、专业人员、现场协调、合规与保险，以及故障后的回收和补测。若任务只需短时低速率数据，复杂空地中继可能相对于固定设施、卫星或临时地面通信方案失去成本优势；若任务确实要求高机动、局部和临时覆盖，则缩围路线仍可能合理。缺少有效在线时长、成功回传数据量和替代方案对照时，不能用单次部署或仿真结果证明经济成立。
    置信度: 中
    备注: 本条只列出全成本核算项和可能失效机制，不虚构平台单价、机队数量、覆盖报价或成本交换比，也不对所有应急通信无人平台作普遍不经济判断。AT&T材料属于厂商自述，仅作为部署先例使用。
  - 类型: 政策风险
    证据: 中国《无人驾驶航空器飞行管理暂行条例》自2024年1月1日起施行，要求中型、大型民用无人驾驶航空器系统相关设计、生产、进口、飞行和维修活动依法取得适航许可，并对运营合格证、操控人员、责任保险、空域和飞行活动管理作出规定。条例同时要求遵守无线电管理法律法规，并对使用国家确定的特定频率且设备取得型号核准的情形规定许可和执照例外。《无线电管理条例》对频率使用、台站设置、明确用途、可行技术方案、专业技术人员及避免有害干扰设有要求，也规定特定紧急情况下可临时设置使用台站但须及时报告、事后关闭。
    证据链接:
      - https://www.gov.cn/zhengce/content/202306/content_6888799.htm
      - https://www.gov.cn/zhengce/content/2016-11/25/content_5137687.htm
    推理: “大中型”不是单纯的载荷和续航优势，也会把方案带入更高的适航、人员、运营、保险与飞行协调门槛；通信中继还同时受到频率、台站和干扰管理约束。具体义务取决于平台类别、运营主体、空域、频率和设备条件，不能简化成所有飞行都适用同一套审批；但同样不能把法定例外扩张为一般豁免。紧急通信例外也不等于可以常态经营或在紧急状态结束后继续运行，因此技术上能够起飞和转发信号，仍可能在合法部署前被授权条件阻断。
    置信度: 高
    备注: 本条只作中国公开规范层面的风险识别，不构成具体项目法律意见。实施时须按当时有效的法律、法规、规章、空域信息和无线电管理要求逐项核对；境外规则不得直接替代中国部署依据。
  - 类型: 信任成本
    证据: NASA/JPL资料明确记录机器人会在任务中脱离联系，并需要决定继续前进或返回更新信息。IET关于多机器人系统的综述汇总了地下挑战赛中的中继可靠性问题，包括投放节点功能异常、节点姿态不当造成弱连接、机器人碾压损坏节点，以及部分机器人需要返回入口附近交换数据。2026年UAV通信综述则将平台移动、能源与续航、动态空地／空空信道和干扰管理等列为持续研究问题。
    证据链接:
      - https://www.nasa.gov/centers-and-facilities/jpl/robots-autonomously-navigate-underground-in-darpa-challenge/
      - https://ietresearch.onlinelibrary.wiley.com/doi/10.1049/csy2.12103
      - https://arxiv.org/html/2604.17844v3
    推理: 增加中继节点也增加了需要同时正常工作的设备、链路和状态估计，不能把“节点更多”直接换算为“系统更可信”。灾害救援、工业巡检等任务若只展示信号存在或地图已经回传，却不标明数据时间、断联区间、丢包、补传和节点失效，使用者可能把过期或不完整信息当作实时完整态势。离线缓存、延迟容忍、人工确认、失效告警和允许弃判可以降低误导，但这些机制是在诚实表达降级服务，而不是把断联包装成持续可靠覆盖。
    置信度: 高
    备注: 高置信度指断联、节点失效、动态信道与信息不完整具有公开先例和研究依据，不等于每次部署都会失败。竞赛经验用于揭示失效机制，不能机械换算为其他环境的故障率。
  - 类型: 执行人限制
    证据: NASA/JPL报道中的CoSTAR系统由12台机器人和60人团队参与，并需要处理机器人脱离联系后的任务决策。MARBLE论文显示，竞赛系统依赖通信基础设施、机器人自治、人机界面、人类监督及现场保障，操作者还需要理解何时信任自治、何时人工介入。中国无人机条例对运营单位的管理机构、管理人员、操控人员、设施设备、管理制度和持续安全运营能力提出条件，使用无线电频率的许可条件也包括相应专业技术人员。
    证据链接:
      - https://www.nasa.gov/centers-and-facilities/jpl/robots-autonomously-navigate-underground-in-darpa-challenge/
      - https://dl.acm.org/doi/full/10.1145/3588325
      - https://www.gov.cn/zhengce/content/202306/content_6888799.htm
      - https://www.gov.cn/zhengce/content/2016-11/25/content_5137687.htm
    推理: 对缺少航空运行、无线电、机器人现场保障和任务协调能力的普通个人或小团队，关键工作不是简单购买大中型平台，而是维持飞行与通信两套专业系统，并在断联、节点损坏、平台故障和天气变化时执行人工接管、降级、回收与责任处置。“无人”减少的是特定位置上的人员暴露，不等于无人值守或无需地面组织。若缩为有授权主体、现成回传、明确任务边界和现场团队的临时中继，执行限制会下降，但那是依托组织能力的限定路线，不能反证一般实施者可以独立复制完整设想。
    置信度: 高
    备注: 本条引用团队规模是为了说明公开先例的组织保障背景，不把60人写成所有项目的固定人员门槛，也不把竞赛配置直接当作实际部署配置。
可拆零件:
  - 无人机临时通信覆盖、地面机器人投放中继及空地协同系统的公开案例与证据分层资料库
  - 接入链路、平台间链路、最终回传、能源补给和持续值守的分层验证清单
  - 断联、延迟、丢包、数据补传、节点失效和人工接管状态的统一标注与报告模板
  - 允许离线缓存、降级服务、人工复核和弃判的任务型数据回传研究框架
  - 中国部署所需空域、适航、运营、操控人员、责任保险、频率和台站条件的合规核查表
  - 平台、载荷、轮换、维护、回收、人员与合规成本及替代通信方案的全成本比较框架
  - 竞赛、仿真、实地测试和实际部署之间的证据等级及不可外推边界说明
死因保质期: 2029-11-13
起草AI: 澄樾（Kimi-K3.1）
记录边界: 本档案仅记录公开通信中继先例、概念、法律政策、全成本、系统级可靠性和执行限制，不提供军事部署位置、链路参数、频率选择、干扰对抗、覆盖优化、控制算法、目标匹配或效能提升步骤；不处理清单第29项无人武器可用范围拓展，也不向武器化用途提供可执行扩展方法。
备注: 本文件是AI起草的非创业技术储备，尚未经过主编人工审核；不接入nodes/、G01、G02、INDEX、REVIEW、科技树、正式节点编号或静态站公开节点数据。当前归入储备区的本质是原始设想仍是系统架构，而非已经界定客户、采购者、交付物和收费方式的独立创业项目；技术已复活不等于创业项目自动成立。AT&T资料只作厂商自述的部署先例，NASA与ACM资料只证明特定竞赛系统及其实际限制，MDPI论文只证明直接相关仿真研究存在，均不越级证明普遍部署效果。本档案未独立复现论文实验、搭建空地链路或核实所有现场条件，也没有证据支持“任意环境持续完整覆盖”或“完全无需其他回传设施”的结论。未来若要转为正式独立节点，须先收敛具体应用场景、客户与采购主体、交付边界、替代方案和全成本，并另行按正式节点格式审核，不能只移动目录。死因保质期暂按本次记录日起三年设置，人工定案时应根据实际审核日期、最新法规和研究证据重算；工具访问受限不等于链接失效，异常链接须转人工复核。
