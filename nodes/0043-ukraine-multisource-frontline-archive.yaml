编号: "0043"
id: ukraine-multisource-frontline-archive
标题: 俄乌多源战线与战报溯源档案库
一句话: |
  按日期并列归档DeepState地理快照、ISW每日评估、SuriyakMaps独立制图和Military Summary视频战报，
  用来源、时间、许可与修订记录支持中文检索；重点审查全量搬运和自动合并为何失败，以及元数据优先的小样本路线
档案类型: 预审
复活状态: 复活候选
结论边界: |
  复活候选仅指在许可与平台条款允许的前提下，先以元数据、原始链接、自制方法说明和连续七天样本建立可修订档案；
  DeepState快照可从2024年7月8日起验证，SuriyakMaps与Military Summary按实际发布节奏登记而非补齐成每日数据；
  不复活未经授权的全文、地图、视频或字幕镜像，不自动合成唯一真实战线，
  也不表示已完成2022年以来高精度逐日重建、独立事实核验、持续运营或商业闭环
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 信息服务
子领域: 开源情报、地理数据与数字档案
死法:
  - 类型: 条件已死
    证据: |
      cyterat/deepstate-map-data已提供DeepState俄占区每日GeoJSON及自2024年7月8日起的历史压缩集；
      lXQ-2008/ukraine-frontline-map已提供中文日期选择和每日战线展示；
      longlinecode/russo-ukrainian-front-daily已组合DeepStateMap与ISW，提供时间轴、GeoJSON接口和多语言页面，
      并明确早期历史仅为关键日期示意性重建；simonhuwiler的数据源仓库则已汇总多类俄乌战争公开数据入口
    推理: |
      一，若原始前提是“没有人保存每日战线、没有中文日期地图、地图与ISW从未组合或数据源没有目录”，这些条件已被现有项目部分推翻；
          再做同样的一张实时地图或DeepState下载器，增量价值很低；
      二，现有覆盖并不等于本点子完整实现：每日GeoJSON不含完整文字战报，中文地图以地图为主，
          数据源目录不是统一日期档案，longlinecode的早期数据也不是连续高精度逐日记录；
      三，仍可工作的空间是把不同来源按统一日期、证据层级和修订历史并列保存，
          尤其是补入SuriyakMaps与Military Summary后来源冲突、发布时间和内容形态的登记，而非再画一张无出处地图；
      四，本轮检索没有发现并不等于证明“一站式项目绝不存在”，因此只判若干基础条件已死，不以未证实的市场空白支撑整个项目。
    案例: 战线快照、中文日期地图、DeepState＋ISW组合和数据源导航已经存在，新增项目必须提供可验证的档案与溯源增量
    证据链接:
      - https://github.com/cyterat/deepstate-map-data
      - https://github.com/longlinecode/russo-ukrainian-front-daily
      - https://github.com/lXQ-2008/ukraine-frontline-map
      - https://github.com/simonhuwiler/russo-ukrainian-data-ressources
    置信度: 高

  - 类型: 伪需求
    证据: |
      现有仓库和数据源目录证明有人持续制作、保存和查找战线资料，其中cyterat仓库已有少量星标与复刻，
      但longlinecode和lXQ-2008仓库公开关注度仍很低；SuriyakMaps和Military Summary拥有公开内容入口，
      能支持读者消费地图或视频的需求信号。上述材料均不是中文多源历史档案的访谈、留存、使用频次或付费证据
    推理: |
      一，“很多人看战线地图和每日视频”不等于“同一批人需要按日期检索四种来源、下载结构化元数据并查看修订历史”；
          后者包含研究者、内容核对者和开发者的更窄工作流，不能用频道受众规模替代；
      二，现有仓库的星标、复刻和持续提交只构成弱至中等兴趣信号，且可能来自开发者复用地理数据，
          不自动转化为中文档案的活跃读者，更不能证明机构付费；
      三，真正需要验证的是用户是否会回访旧日期、利用来源冲突和修订记录完成研究或核对任务，
          而不是首页是否展示一张吸引人的最新地图；
      四，本条不是判定无人需要，而是要求先以七天样本和少量真实任务验证回访与检索价值，
          未通过时不应扩建全历史、多语言和多来源流水线。
    案例: 地图与视频受众不能直接折算为档案用户，需用回溯查询、来源对照和修订使用等真实任务验证
    证据链接:
      - https://github.com/cyterat/deepstate-map-data
      - https://github.com/lXQ-2008/ukraine-frontline-map
      - https://github.com/simonhuwiler/russo-ukrainian-data-ressources
      - https://ko-fi.com/suriyakmaps
      - https://www.youtube.com/@militarysummary
    置信度: 中

  - 类型: 政策风险
    证据: |
      ISW于2026年1月修订的使用与署名政策允许在条件下查看、分享原发布形态及适当引用，
      但要求修改、商业利用、再分发或并入其他数据集、地图平台、分析产品或系统须事先书面许可，
      并禁止未经同意复制数据集以及批量、API或自动化再分发。
      Military Summary服务条款禁止未经书面许可系统检索内容以建立集合、汇编、数据库或目录，并限制自动化数据提取。
      YouTube条款另限制未经授权的下载、复制和自动化访问。
      cyterat仓库的GPL标识不能单独证明上游DeepState数据的全部再发布权，中文现有项目也声明数据版权归DeepStateMap；
      SuriyakMaps的Ko-fi自述和公开入口没有因此自动授予批量镜像许可
    推理: |
      一，本点子的核心动作恰是长期汇集、结构化、展示和导出多源内容，不能把“网页公开可看”当作“可批量复制并永久再发布”；
          代码许可、数据许可、地图图片、报告文字、视频、字幕和平台访问规则必须分别核对；
      二，ISW和Military Summary条款已经直接覆盖部分计划用途，未经许可的全量抓取、重建数据集或公开镜像不是可通过技术手段规避的障碍；
      三，SuriyakMaps使用公开频道和互动地图也不表示其图片、文字或底层数据可自由存档；
          未找到明确许可时只能把可保存范围收缩到必要的书目信息、原始链接和项目自制说明，并继续请求授权；
      四，合规路线是M0先完成来源—内容—动作—许可矩阵和七天本地样本，公开版默认只发布自有元数据、链接、方法与修订记录；
          任何全文、媒体、字幕或几何数据的保存与再发布都须逐项确认许可，不能以绕过登录、反自动化或下载限制实现。
    案例: 档案库越想完整复制来源，越容易同时触碰版权、数据库汇编与平台条款；元数据优先是产品边界而非附加免责声明
    证据链接:
      - https://understandingwar.org/fair-use-and-attribution-policy/
      - https://cdn.militarysummary.com/docs/terms.html
      - https://www.youtube.com/t/terms
      - https://github.com/cyterat/deepstate-map-data
      - https://github.com/lXQ-2008/ukraine-frontline-map
      - https://ko-fi.com/suriyakmaps
      - https://militarysummary.com/
      - https://www.youtube.com/@militarysummary
    置信度: 高

  - 类型: 信任成本
    证据: |
      ISW说明其每日产品是基于公开资料、社交媒体、商业卫星影像和其他地理空间数据形成的综合情报评估，
      并在尾注列出来源；这证明有方法说明，不等于每项评估都是原始事实。
      longlinecode项目明确提示不同制图口径、发布延迟、示意性重建、渗透不等于控制以及连续前线本身的简化。
      SuriyakMaps自述制作多地区互动地图，Military Summary提供视频频道和互动地图；
      两者都应作为制作方内容登记，频道自称客观或拥有地理定位画面均不能替代项目独立核验
    推理: |
      一，DeepState控制区、ISW评估、SuriyakMaps制图和Military Summary视频评论处于不同证据层级，
          把它们叠加后只显示一条“确定战线”会掩盖口径、延迟、地理精度和编辑判断；
      二，同一天发布的内容可能描述不同事件窗口，SuriyakMaps还可能用一次发布覆盖多个日期；
          若只保留抓取日期，会把后续修订和成批补发误写成当日事实；
      三，中文翻译和AI摘要会增加遗漏、立场软化、数字误写和来源混淆，不能自动把单方宣称升级为已证实事件；
          每条摘要必须保留原始链接、生成方式、复核状态和后续修订；
      四，可信产品应并列显示来源结论和冲突，不自动裁决居民点控制归属，不为每日连续补造数据；
          但保留不确定性会增加阅读与维护成本，信任来自可检查过程而非“多源聚合”标签。
    案例: 多源并列若没有时间、口径和修订分层，只会把四种不确定性包装成更醒目的确定答案
    证据链接:
      - https://github.com/longlinecode/russo-ukrainian-front-daily
      - https://understandingwar.org/analysis/russia-ukraine/russian-offensive-campaign-assessment/
      - https://ko-fi.com/suriyakmaps
      - https://t.me/Suriyak_maps
      - https://militarysummary.com/
      - https://www.youtube.com/@militarysummary
    置信度: 高

  - 类型: 钱算不平
    证据: |
      DeepState镜像每日更新并维护持续增大的历史压缩集，ISW每日评估自2022年全面冲突以来持续发布，
      说明最小档案也会面对长期新增、历史存储和来源变化。现有公开材料没有提供本点子的订单、捐赠预算、
      单条档案复核工时、许可成本、持续运维成本或付费转化数据
    推理: |
      一，完整成本不是一次写爬虫和网页，而是四来源适配、许可沟通、数据校验、多语摘要、人工复核、
          失效链接处理、地图与索引存储、修订发布、故障告警和长期备份；
      二，每日新增只是显性工作量，来源改字段、停更、删帖、追溯修订和早期补档会产生难以按日预估的维护账；
          若每条记录都需要人工观看视频或核对地图，自动化节省的时间可能被复核重新消耗；
      三，有效产出应按可成功回溯的日期、可点击原始来源、字段完整率、冲突标注准确性和研究任务节省时间计算，
          不能按抓取文件数或摘要字数计算；
      四，公开免费档案可能具有社会价值，却不自然形成收入。机构定制、研究辅助、可视化组件或捐赠都只是待测试路径，
          本轮没有证据支持持续运营收支平衡，因此先做元数据优先的小样本而非承诺全历史免费服务。
    案例: 长期档案的主要成本是持续治理和纠错，抓取规模增长不等于有效研究产出或可用收入
    证据链接:
      - https://github.com/cyterat/deepstate-map-data
      - https://understandingwar.org/analysis/russia-ukraine/russian-offensive-campaign-assessment/
    置信度: 中

  - 类型: 执行人限制
    证据: |
      现有项目分别涉及GeoJSON处理、地图渲染、定时更新、历史重建和多语言界面；ISW提供持续文字与地图产品，
      SuriyakMaps以互动地图和分地区情况报告为主要形态，Military Summary同时涉及网站地图与视频频道。
      这些公开形态说明实施者面对的不是一种统一API，而是几何数据、网页、社交帖子与视频元数据等不同对象
    推理: |
      一，普通实施者的限制链是“缺少地理数据与平台工程能力→无法稳定归档和展示；
          缺少多语来源批判与人工复核→容易混淆宣称、评估和事实；缺少许可与长期治理能力→公开后难以纠错和持续负责”；
      二，四种来源不能用一次脚本开发视为完成：各自发布节奏、时间口径、字段稳定性、许可和失效模式不同，
          还需要地理数据校验、前端检索、翻译编辑、版权记录和备份恢复等复合能力；
      三，个人开发可以缓解的办法是把M0限制为连续七天、每天固定字段和少量来源条目，
          先人工建立金标准样本，再逐项自动化；SuriyakMaps和Military Summary先登记链接与实际发布日期，
          不要求它们每天产生一条记录，也不让AI独立判断战况；
      四，缩围能验证工程与编辑流程，但不能消除长期维护者缺席的风险；若没有明确责任人、复核节奏和停止更新机制，
          项目会在来源首次变化后迅速变成表面连续、实际失修的档案。
    案例: 关键缺口是跨地理数据、多语编辑、许可和长期维护的复合执行，而非会写采集脚本就足够
    证据链接:
      - https://github.com/longlinecode/russo-ukrainian-front-daily
      - https://understandingwar.org/analysis/russia-ukraine/russian-offensive-campaign-assessment/
      - https://ko-fi.com/suriyakmaps
      - https://t.me/Suriyak_maps
      - https://militarysummary.com/
      - https://www.youtube.com/@militarysummary
    置信度: 中

需求证据:
  类型: 现有开源项目、持续内容生产与公开受众信号；中文多源档案的真实使用、留存和付费需求待验证
  说明: |
    每日DeepState快照、中文日期地图、DeepState＋ISW组合项目及数据源目录，证明战线保存、历史查看、
    数据复用和来源导航已有实际需求与开发实践。ISW持续发布每日评估，SuriyakMaps与Military Summary持续提供公开内容入口，
    也说明读者会消费不同形态的战局材料；但这些证据分别支持地图、报告、视频或开发数据需求，不能自动合并成对本档案库的需求。
    现有一体化项目的部分空白——四来源并列、中文结构化元数据、来源冲突和修订历史——提供可测试的差异化方向，
    却不证明用户愿意长期回访或为维护付费。当前没有目标研究者访谈、旧日期检索日志、七天样本任务完成率、
    机构试用、捐赠承诺、订单或收入材料。最小验证应邀请少量目标用户完成“找回某日来源、比较两种制图、追踪一次修订”任务，
    记录是否比直接访问原站节省时间，而不是只统计首页访问量。
  附件: 无

商业及社会价值评估: |
  商业价值：本项目更适合作为公共研究基础设施或窄工具验证，而非预设为大众高付费产品。
            可测试的价值包括面向研究、媒体和教育机构的来源对照工作流、中文检索、定制化历史可视化和档案质量审计；
            捐赠、机构委托或组件服务只能作为假设，当前没有采购、回款、续费或稳定捐赠证据。
            完整成本须包括许可沟通、四来源适配、地理与元数据校验、多语摘要、人工复核、存储与带宽、
            失效链接、修订、安全、备份和长期运营；有效产出应按可回溯记录、原始链接可达性、字段完整率、
            冲突与修订标注质量及研究任务节省计算。未经授权的内容镜像即使带来流量，也不构成可持续商业优势。
  社会价值：按日期保存来源、发布时间、数据窗口和修订过程，可能帮助中文读者与研究者区分控制区判断、
            机构评估、视频评论和项目摘要，减少旧资料难找、转载脱离出处和历史被静默覆盖的问题。
            多源冲突可见比强制合并更有助于理解信息不确定性，也能为信息传播研究留下可审计材料。
            但错误摘要、伪造影像、单方宣传、过期战线或精确化呈现都可能误导读者；本项目只用于历史档案与来源对照，
            不提供现实军事目标选择、部署参数、行动建议或效能优化，不把AI输出当作独立事实核验。

可拆零件:
  - 来源登记册：分别记录DeepState、ISW、SuriyakMaps和Military Summary的官方入口、内容形态、方法、许可状态与责任人
  - 来源—内容—动作—许可矩阵：区分查看、链接、摘要、保存、转换、公开再发布和批量导出，未授权动作默认关闭
  - 连续七天金标准样本：人工核对字段、时间窗口、链接与修订，不以自动补齐缺失日期制造连续性
  - 多时间字段模型：分别保存事件发生时间、数据对应日期、来源发布时间、项目抓取时间和后续修订时间
  - 来源分层记录卡：区分地理定位事件、制作方地图、单方战报、研究机构评估、视频评论和整理者摘要
  - DeepState快照适配器：在许可确认后读取既有每日GeoJSON，保留上游来源、更新日期、校验和与失败状态
  - ISW书目与原始链接登记：默认不复制全文、地图或底层数据集，超出链接与适当引用范围先取得书面许可
  - SuriyakMaps发布登记：保存帖子或地图入口、实际覆盖日期和摘要复核状态，不默认复制图片或重建完整数据集
  - Military Summary视频登记：保存视频ID、标题、链接、发布时间、数据日期和复核状态，不默认下载视频或完整字幕
  - 同日多来源对照页：并列呈现不同来源结论、时间窗口和冲突，不自动合并成唯一控制归属
  - 中文摘要与翻译复核队列：标记生成方式、复核人、不确定性与修改原因，未复核内容不得升级为事实结论
  - 修订与撤回日志：保留原记录、替换记录、原因、时间和操作者，来源删除时显示失效而非静默抹除
  - 采集失败与停更告警：区分未发布、抓取失败、许可停用和数据缺失，不用旧数据冒充当日更新
  - 自有元数据导出与来源署名：只导出有权发布的数据，并保留原始入口、许可和生成方法
  - 停止更新与只读封存机制：维护者退出时明确最后更新日期和覆盖缺口，保留可用档案而不假装仍在持续运营

