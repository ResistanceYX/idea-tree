备注: |
  本节点为AI起草、人类审核的预审档案，不是某个已经实施、失败或停止的全库扫描项目的验尸记录；当前没有具体验尸对象，不能编造。
  本稿对应Issue #10清单第09项“开源知网慢速全量扫描低级学术不端检测和反馈Agent”，不是正式节点0009。
  清单序号、Issue编号和正式节点编号属于三个不同体系。
  标题保留“知网论文全量扫描”以记录原始强设想，但复活候选范围已经收缩为合法授权论文集上的分项质量与科研诚信线索检查。
  “低级学术不端”不是严谨分类：排版错误、错别字和多数形式问题不当然属于学术不端；伦理审议也不是论文文本扫描即可完成的检测器。
  复活候选不表示已有一个开源Agent贯通全部八类检查并获知网授权，也不表示扫描结果能认定抄袭、PS、数据伪造、科研失信或伦理违规。
  所有输出原则上只是线索和反馈草稿；正式认定、伦理决定、公开披露和不利处置必须由有权人员或机构依程序完成。
  暂停键按任务控制语义验收，而非只验收一个前端按钮：暂停后不得继续领取新论文，进行中任务须进入可见的等待或安全取消状态，
  检查点、恢复去重和反馈幂等必须有测试；若后台仍持续扫描或恢复后重复发送反馈，即不满足本节点要求。
  “预想项目平台”目前只是09所需的队列、检查点、授权记录、受控交换和复核状态底座，尚无脱离09的独立用户、需求证据与验收对象。
  本稿将其写入non-startup-tech/envisioned-project-collaboration-platform.yaml作为非正式储备，不分配正式编号，
  不与其建立正式科技树关系，也不把储备文件存在写成平台已经开发、部署或可用。
  与0019的论文阅读、0029的裁判文书形式异常检查虽共享部分文本处理和人工反馈思想，
  当前没有直接派生、具体代码复用或同一项目工作流证据，故相关节点为空；不因“论文”“检查”“反馈”或“Agent”等关键词机械挂接。
  重启预算“中”仅对应少量明确授权论文、限定学科与检测层的本地优先原型、专项检查集成、真实暂停恢复测试和人工复核；
  不包含知网全库许可与采集、全学科覆盖、长期多机构运营、大规模专家调查或公共举报平台。
  来源按证明力分层：知网协议与产品页证明现行条款和公开功能，不证明外部授权或实际检测效果；
  政府规则证明辅助检测、调查、申辩与伦理审查边界；statcheck、Crossref和Scite分别证明限定统计复算、元数据与引文上下文能力；
  独立数据异常综述证明适用假设和人工专家必要性；ASM论文证明特定期刊图像试点及人工复核，不把商业工具能力外推至任意图像。
  本稿没有独立复现所有商业或研究工具，也没有把厂商功能声明、单项研究结果或有限试点换算成中文全学科检测准确率。
  工具访问受限不等于链接失效；本轮未继续使用直接读取已返回404的旧知网会员协议链接，而采用可读取的2026年6月版现行使用协议。
  项目不得上传或交换未经授权的论文全文、原始数据、审稿材料、举报材料或作者私人信息，不保存知网账号、Cookie、token和浏览器登录态。
  若编号变化，文件名与顶层“编号”须同步修改，id和公开详情页主键不变。
  因知网协议、授权接口、检测组件和科研诚信规则可能变化，死因保质期设为一年。
  复核时应重新核对知网现行条款与是否存在明确合作授权，更新各检测层的适用条件、独立基准、人工工时、有效反馈、
  纠错申诉与全成本证据；若授权范围、真实需求或分项检出能力没有新增证据，不应仅凭模型升级把复活候选提升为已复活。
