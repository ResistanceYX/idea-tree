编号: "0042"
id: tertiary-hospital-clinical-record-interoperability
标题: 三甲医院诊疗档案区域统一系统
一句话: |
  面向全国、全省或全市三级甲等医院的电子病历、检查检验、影像与病案资料做统一和共享；
  重点审查另建替换式总库是否成立，以及在现有国家—省—市—县平台上做授权接入、标准映射和数据质量工具的缩围路线
档案类型: 预审
复活状态: 复活候选
结论边界: |
  复活候选仅指在医疗机构和区域平台合法授权下，接入既有全民健康信息体系，
  提供标准映射、病案归档、数据质量、只读调阅或审计等窄工具的可验证路线；
  不复活独立创业团队另建全国三甲医院统一总库、绕开既有平台批量汇集病历的方案，
  也不表示全国病历已完整统一、授权互联必然改善诊疗结局或形成商业闭环
重启预算: 高
创新类型: [渐进式, 技术应用]
领域: 医疗健康
子领域: 电子病历、病案与区域全民健康信息平台
死法:
  - 类型: 条件已死
    证据: |
      国家卫生健康委2026年答复确认，2023—2025年已开展全国医疗卫生机构信息互通共享三年攻坚行动；
      截至2025年底，24个省份基于省统筹区域全民健康信息平台，实现省域内电子病历、慢性病管理、
      老年健康等重点系统与电子健康档案的条块融合和信息共享。
      2025年答复另确认已初步形成国家级全民健康信息平台、建成32个省级平台，
      6874家（75.9％）二级及以上公立医院开展检查检验结果跨机构调阅，
      8077家（89.2％）二级及以上公立医院接入区域平台，并已有6大类252项行业信息化标准
    推理: |
      一，若原始判断是“全国没有统一规划、区域平台、数据标准或跨院调阅基础，需要创业者从零建一套”，该前提已经失效。
          国家与省级平台、主索引、共享标准和医院接入都是既有基础设施，另建全国总库会直接进入重复建设与替代公共工程的问题；
      二，但官方数字也证明“接入平台”“开展部分检查检验调阅”“重点业务条块融合”不等于所有三甲医院全部病历、
          影像和病案已完整统一。75.9％和89.2％的分母均为二级及以上公立医院，不能改写成三甲医院专属覆盖率；
      三，真正仍可工作的条件不是“再建一个全国数据库”，而是既有体系仍有标准映射、接口适配、数据质量、
          病案归档、权限审计和跨院使用体验等具体工作；这些工具必须依附合法授权与现有平台，而非另起数据孤岛；
      四，因此本节点把“空白市场式全国替换系统”判为旧条件已死，同时只复活窄工具路线。
          这不是声称已有某个独立产品完成商业验证，所以不判已复活。
    案例: 国家和省级平台已经存在且覆盖仍在推进，创业机会若存在，应位于授权互联和质量改进层，而非假装从零统一
    证据链接:
      - https://www.nhc.gov.cn/wjw/jiany/202609/623ace798c6442749018d51a2e5f2050.shtml
      - https://www.nhc.gov.cn/wjw/tia/202508/bc7be2279ad649af845a9a6938b60bff.shtml
      - https://www.nhc.gov.cn/wjw/jiany/202409/702adc6e7a464d3cb824cfe8f82e00f3.shtml
    置信度: 高

  - 类型: 冷启动死锁
    证据: |
      国家卫生健康委披露的接入与调阅规模说明，新系统需要进入已经运行的医院—区域平台网络，而非从公开互联网抓取病历即可启动。
      2025年电子病历管理通知要求医疗机构承担主体责任，外部服务商必须签订保密和授权协议，
      明确访问范围、目的与期限并接受监督；共享病历还需要严格授权审批与全流程留痕
    推理: |
      一，没有医院、区域平台和既有系统供应商授权，创业团队无法合法取得真实接口、完整病历与临床工作流，
          因而做不出可验证的跨院统一；没有真实验证又难以通过医院采购、信息科和临床部门评估，形成准入冷启动；
      二，每接入一家医院都不是简单复制安装：既有厂商、数据结构、术语字典、患者主索引、网络环境和审批流程不同，
          新团队可能在首个接口与授权阶段长期停滞，无法靠公开样例数据积累网络效应；
      三，病历越集中，潜在价值越高，但安全、责任与采购门槛也越高。以“先汇集全国数据再补授权”为启动路径不可接受，
          以患者自行上传零散报告替代医院完整档案也无法证明系统具有医院级统一能力；
      四，缓解边界是由已获授权的医疗机构、区域平台或既有供应商发起一个小范围项目，先使用合成或依法可脱敏的测试数据，
          完成单一接口和只读场景验收，再逐步扩大。合作能缓解冷启动，但不能省略每个主体所需的权限与责任安排。
    案例: 数据、接口、授权与临床验收相互依赖，普通创业团队不能用公开数据先做出全国网络再要求医院接入
    证据链接:
      - https://www.nhc.gov.cn/wjw/tia/202508/bc7be2279ad649af845a9a6938b60bff.shtml
      - https://www.nhc.gov.cn/yzygj/c100068/202506/c68abee7c54b4651a774cd533761780b.shtml
    置信度: 中

  - 类型: 政策风险
    证据: |
      2025年电子病历管理通知要求分级分类访问控制、最小可用、岗位和时限权限、专有身份标识、
      外部服务商保密与授权协议、操作追溯、共享审批以及接收外部病历时验证来源合法性、完整性与安全性。
      国家卫生健康委2024年答复还确认医疗卫生机构网络安全管理、数据全生命周期管理、分类分级和授权访问等要求，
      并明确未经授权的数据不得用于其他目的
    推理: |
      一，跨院统一不仅是技术接口问题，还涉及患者隐私、病历管理、网络安全、数据安全、处理目的、访问权限、
          留存、共享、外部服务商责任与事件处置。地域范围越大，主体和审批关系越复杂；
      二，“三甲医院内部资料”不能成为无限收集理由。本节点已收窄为诊疗档案与病案，仍须按岗位、用途和最小必要控制，
          不能因为全国或省级统一就把全量病历默认开放给所有接入者或用于模型训练；
      三，本地部署、脱敏和只读接口可降低部分风险，但不会自动解决患者匹配、原始数据合法性、跨机构共享审批、
          错误更正、日志保存和外部服务商监督；是否需要单独同意或其他处理依据应按具体场景判断，不能一刀切；
      四，本条不对某个具体平台作合法性结论，只确认合规是架构与交付的前置约束。
          绕过授权、访问控制或平台审批不是复活能力。
    案例: 统一系统必须同时证明数据为什么能处理、谁能看、为何看、看了什么和如何纠错，而非只证明数据库能连通
    证据链接:
      - https://www.nhc.gov.cn/yzygj/c100068/202506/c68abee7c54b4651a774cd533761780b.shtml
      - https://www.nhc.gov.cn/wjw/jiany/202409/702adc6e7a464d3cb824cfe8f82e00f3.shtml
    置信度: 高

  - 类型: 信任成本
    证据: |
      2025年电子病历管理通知要求接收外部病历时验证来源合法性、完整性和安全性，并记录接收、存储与使用流向；
      同时要求历次操作可追溯、异常访问预警。2024年答复记录病案首页、疾病分类与代码、手术操作分类与代码、
      医学名词术语“四统一”和250多项卫生健康信息化标准，说明统一不仅是文件格式转换，还包括语义与质量治理
    推理: |
      一，临床使用者需要相信“这是同一名患者、同一次诊疗、同一版本的完整记录”，并知道来源、时间、缺项和修改历史。
          姓名或号码相似就自动合并、不同术语强行映射、重复报告无提示，都可能制造新的医疗风险；
      二，系统显示“已统一”容易掩盖底层缺失、延迟、错误匹配和接口中断。若医生不知道某份记录为何缺失或是否最新，
          统一视图可能比明确的分散记录更容易制造虚假确定感；
      三，可信工具应保留原始来源、版本、映射规则、异常项、人工复核和纠正记录，对不确定匹配不自动合并；
          只读调阅也不应直接生成诊断、处方或其他高影响自动决定；
      四，效果需分为接口连通、数据完整与准确、授权调阅成功、临床工作流采用、重复检查变化和最终诊疗结果。
          接入医院数或汇总记录数只证明规模，不能证明临床可信或最终效果。
    案例: 身份匹配、术语语义、来源完整性和版本追溯决定临床信任，统一界面不能掩盖底层错误
    证据链接:
      - https://www.nhc.gov.cn/yzygj/c100068/202506/c68abee7c54b4651a774cd533761780b.shtml
      - https://www.nhc.gov.cn/wjw/jiany/202409/702adc6e7a464d3cb824cfe8f82e00f3.shtml
    置信度: 中

  - 类型: 钱算不平
    证据: |
      国家卫生健康委已公布多层级平台、数千家二级及以上公立医院和数十万家基层机构接入，以及252项行业标准，
      意味着新方案面对的不是一次通用软件安装，而是大量既有机构、标准和接口的持续适配。
      2024年答复同时把医学信息技术、数据分析、网络安全人员配备与持续标准化建设列为工作；
      当前没有本点子的采购订单、合同金额、单院交付成本、运维成本或续费数据
    推理: |
      一，全国或省市级替换路线的全成本包括调研采购、接口和数据映射、历史数据治理与迁移、测试认证、
          网络安全与隐私评估、本地部署、培训、临床流程改造、全天候运维、故障应急和后续标准升级；
      二，每家医院新增或更换系统都可能需要重新验收，项目收入却可能仍按一次性集成合同结算。
          如果定制与驻场成本随医院数近似线性增长，“接入越多越赚钱”的平台想象就不能成立；
      三，有效产出不能按汇聚病历条数计算，应按经医院验收的标准映射通过率、错误匹配减少、授权调阅成功、
          病案归档节省工时、重复检查变化和故障恢复等计算，并扣除人工复核与长期维护；
      四，缩围为现有平台的单一适配器、数据质量或审计工具，可能以明确交付边界获得机构付费；
          但本轮没有真实采购、回款、续费或毛利证据，不能把政府建设投入直接当成独立创业公司的可获得收入。
    案例: 多机构接入带来持续定制与运维账，政策投入和平台规模不等于新供应商利润
    证据链接:
      - https://www.nhc.gov.cn/wjw/tia/202508/bc7be2279ad649af845a9a6938b60bff.shtml
      - https://www.nhc.gov.cn/wjw/jiany/202409/702adc6e7a464d3cb824cfe8f82e00f3.shtml
    置信度: 中

  - 类型: 执行人限制
    证据: |
      电子病历管理通知把主体责任、权限、保密、授权、追溯、安全评估和外部服务商监督分配给医疗机构及相关部门；
      全国接入规模又意味着真实项目需要跨医院、区域平台和既有供应商协作。公开规范没有给普通个人提供绕过这些主体、
      直接取得全国三甲病历和接口的合法通道
    推理: |
      一，普通实施者的限制链是“缺少医院与平台授权→拿不到真实接口和临床工作流→无法完成标准映射与安全验收→
          不能进入采购和生产运维→出错后缺少责任与善后能力”。只会开发数据库或前端页面不足以跨越这条链；
      二，可执行团队需要临床与病案、卫生信息标准、接口集成、网络与数据安全、隐私合规、机构采购、
          项目交付和持续运维能力；全国、省、市任一多层级路线都不是普通小团队独立承包的轻量软件项目；
      三，小团队的缓解边界是与一家有权机构或既有供应商合作，只做一个明确接口、只读视图、数据质量或归档模块，
          使用合成或依法可脱敏测试数据，由医院信息、医务、病案和安全人员共同验收，并保留人工异常处理；
      四，该缩围只支持窄工具复活，不把团队变成全国平台运营方。
          若坚持自建全国总库，所需主体资格、公共协调、基础设施和预算都进入另一层级，高预算也只是必要条件而非成功保证。
    案例: 关键缺口是合法机构协作和医疗交付责任，而非数据库编程；合作缩围能降低但不能消除门槛
    证据链接:
      - https://www.nhc.gov.cn/yzygj/c100068/202506/c68abee7c54b4651a774cd533761780b.shtml
      - https://www.nhc.gov.cn/wjw/tia/202508/bc7be2279ad649af845a9a6938b60bff.shtml
    置信度: 中

需求证据:
  类型: 国家卫生健康委政策、平台覆盖与行业管理材料；独立创业产品的采购和持续付费需求待验证
  说明: |
    三年攻坚行动、国家与省级平台、跨机构检查检验调阅和电子病历管理规则，证明医疗机构之间存在真实且持续的互联互通、
    标准治理和安全管理需求。2025年官方材料中75.9％的二级及以上公立医院开展检查检验结果跨机构调阅、
    89.2％接入区域平台，2026年材料中24个省份实现省域重点业务与电子健康档案条块融合，
    同时说明已有广泛建设和仍未覆盖完全的空间；这些比例的分母和业务范围不得改写为“三甲医院全部病历统一率”。
    “四统一”、252项标准和电子病历全流程追溯要求也反向证明，数据语义、质量和权限问题不是只靠一个共享页面就能解决。
    但上述证据首先支持公共平台与医疗机构的建设需求，不等于医院会采购一个独立团队另建的全国替换系统。
    本轮没有取得目标医院对本点子的访谈、授权意向、采购订单、单院交付预算、真实接口试用、续费或临床效果材料。
    最需验证的是：某个明确机构是否愿意为一个边界清晰的授权接入、数据质量、病案归档或审计工具付费，
    而不是笼统询问医院是否希望资料更统一。
  附件: 无

商业及社会价值评估: |
  商业价值：潜在付费主体是获得合法授权的医疗机构、卫生健康行政部门、医联体或既有平台供应商，
            但实际采购者、数据责任主体、交付方和运维责任必须在项目中分别确定。可测试路径包括现有平台接口适配、
            标准映射、病案归档、数据质量、权限审计和只读临床视图等模块，不包括未经授权的全国病历汇集。
            全成本须包括采购与调研、接口和语义映射、历史数据治理、测试、安全与隐私、部署培训、临床协作、驻场、
            运维、故障应急和标准升级；有效产出应按医院验收的完整准确记录、授权调阅、错误减少、节省工时和服务可用性计算。
            政策投入和医院接入规模不自动构成独立公司的收入，当前没有订单、回款、毛利、续费或单院成本证据，商业闭环未验证。
            若只能提供通用数据库或统一界面，既有平台和医院供应商很容易替代；若能在特定接口、质量指标和审计责任上形成可验收增量，
            才可能出现窄而可持续的交付价值。
  社会价值：合法、准确、最小必要的跨院信息共享可能改善诊疗连续性，减少患者重复携带资料和一部分重复检查，
            并帮助病案与公共卫生业务协同；标准化和质量工具也可能让现有平台更可用，而非只追求新增平台数量。
            但错误患者匹配、缺失或过期记录、越权调阅、数据泄露和自动临床决策都可能造成伤害，统一集中还会扩大单点事故影响。
            社会价值应按授权使用、数据质量、临床工作流、重复检查、故障与隐私事件和患者纠错分层评估，
            不把接入数或病历总量直接写成健康结局改善。本节点是信息系统预审，不构成医疗建议或自动诊疗方案。

可拆零件:
  - 面向既有区域平台的单一标准接口适配器，记录版本、映射规则、测试证据和失败回退
  - 疾病、手术、检验、检查与医学术语的字典映射及冲突清单，不强行把不确定项自动合一
  - 保留机构、记录、时间、版本、来源合法性和完整性校验结果的诊疗档案溯源卡
  - 在合法授权下工作的患者主索引候选匹配与人工复核队列，不确定时拒绝自动合并
  - 缺项、重复、异常值、时序冲突和接口延迟的数据质量报告，保留原始记录与纠正履历
  - 默认只读的跨院诊疗摘要视图，清楚标注覆盖范围、缺失、更新时间和不得直接用于自动诊疗的边界
  - 按岗位、用途和时限控制的分级访问、共享审批、操作留痕、异常预警与外部服务商到期收权
  - 使用合成或依法可脱敏数据的本地测试环境，不把真实病历默认发送到云模型或公共第三方服务
  - 病案归档、格式校验和人工抽检工具，不自动修改原始医疗记录或替代责任人员签署
  - 区分接口连通、数据准确、授权调阅、临床采用、重复检查和最终结果的分层验收指标
  - 记录单院接口、治理、培训、运维和升级成本，并对照既有平台方案评估增量价值的交付账本

