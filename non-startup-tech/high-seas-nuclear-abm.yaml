备注: 本文件仍是非创业技术储备，不接入nodes/、G01、G02、INDEX或科技树；字段兼容只为减少未来启用时的格式迁移，不表示已经通过主编审核。AI初稿建议将“公海＋小当量核载荷＋高超音速拦截弹”的当前完整路线判为预审／死透，依据是体系可靠性、成本、法律政策、信任和执行主体限制的组合，而非否认核反导的历史存在或一切核爆物理效果。核战斗部反导已有Nike及苏联A-35等历史先例，本设想不能把“核反导”本身声称为原创。成本资料仅作体系级类比，不是本设想的具体造价；法律分析区分试验、部署和使用，不作一刀切结论。记录边界仅限概念、历史、政策、系统风险与战略稳定分析，不记录核载荷设计、当量与爆高选择、拦截窗口、部署参数、目标匹配或效能优化方法。死因保质期按三年设置，复核时应更新技术、条约与国际安全环境证据；部分官方网页可能限制自动访问，链接保留供人工复核，不以自动访问失败直接判为失效。
