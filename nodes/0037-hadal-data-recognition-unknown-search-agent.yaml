备注: |
  本节点为AI起草、人类审核的预审档案，不是FathomNet、VIAME、Deepdive、NOAA Deployable AI或其他项目已经失败、停止或转向的验尸记录；当前没有具体验尸对象，不能编造。
  本稿对应Issue #10清单第32项“独立节点：基于现有数据的超深海数据识别和未知情况搜索反馈Agent”，不是已经入库的正式节点0032；清单序号、Issue编号和正式节点编号属于三个不同体系。
  清单第30项“基于多模态结合的超深海环境记录和总结离线Agent”不在本次处理范围内，本稿没有完成、替代或合并该项。
  已复活仅指合法既有海洋视觉及已对齐元数据上的已知类别识别、分布外／低置信度／未标注目标候选、证据回链、专家反馈和检索建议草稿；
  不涵盖统一全模态模型、自动确认新物种或科学未知、无人工复航搜索、通用全海深可靠识别或真实科研商业闭环。
  本节点中的“未知情况”只指相对当前数据、类别体系或模型而言的异常、分布外、低置信度、未标注目标和候选新类线索，不等于科学上从未发现的对象。
  FathomNet论文中的NGS部署、视频时长和28—10641米深度范围是论文当时对特定系统的报告，只证明超深海既有视觉数据存在；
  不表示全部数据已进入FathomNet、全部开放、全部完成专家标注或可直接用于本节点，也不作为2026年实时库规模。
  FathomNet 2023竞赛的0—800米训练与0—1300米评估深度不属于超深海，只直接证明已知识别与分布外评分任务；
  Deepdive约600—1800米数据、3994张图像、33类和65%最佳分类准确率也只适用于特定数据集，均不得外推为万米级效果。
  FathomNet论文中的一个81%人工标注工作量减少用例属于特定作者报告，不作普遍节时、本项目成本或独立审计结论。
  NOAA Deployable AI直接证明已训练类别的发现、跟踪和有限控制配合；仿真、10米水池和蒙特雷湾测试不证明未知发现、全海深部署或本节点自动复航权限。
  FathomNet的VARS等实践只证明特定系统可同步视觉与辅助元数据，不证明任意图像、声学、eDNA、CTD和其他模态已经统一对齐。
  与节点0036拟建立的关系仅为可选回传数据供给与下游分析衔接：本节点可以直接处理公开或机构既有数据，不依赖清单第31项；
  节点0036只负责数据传输与交付，不内置本节点的识别、未知候选或搜索反馈能力。两项不是直接派生，当前没有实际端到端集成证据。
  本节点以证据化识别与人工复核清单独立验收，节点0036以端到端数据完整交付独立验收；本节点已复活不提升清单第31项状态，另一项也不改变本节点边界。
  重启预算“中”对应复用公开或机构既有视觉数据、现成开源工具和限定类群，完成软件集成、跨潜次评测、专家复核与反馈验收；
  不包含新购潜器、支持船、复航搜索、全模态采集、大规模基础模型训练或长期多机构运营。
  本节点只处理公开许可、用户自有或机构明确授权的数据；不保存平台账号、Cookie、token或浏览器登录态，
  不把绕过登录、验证码、付费墙、访问控制、反爬或平台限制写成能力，不上传或交换未经授权的原始影像、视频、内部标注和任务资料。
  所有识别、异常候选和后续检索建议均为带原始证据和不确定性的辅助草稿，不自动发布新物种或科学发现宣称，不直接控制真实潜器或执行高成本、可能影响环境的任务。
  因海洋视觉模型、开放数据许可、分布外方法、类别体系和科研工具变化较快，死因保质期设为一年。
  复核时应更新既有超深海数据的合法可用性、直接识别与分布外实现、跨潜次和跨设备测试、专家工时、候选采纳、误报撤回及真实后续研究证据；
  若只有模型参数、候选数量、竞赛规模、单次跟踪演示或异常分数提高，不应据此扩大已复活边界。
