id: universal-dsh-cross-platform-autonomous-pet-whale-plugin
标题: 通用DSH跨平台自主宠物鲸插件
一句话: |
  用一个宠物鲸角色和任务入口接收跨平台内容发现指令，通过统一任务与结果协议调度已安装的平台专用插件或子代理，
  汇总为可追溯的私人日报；缺少适配器时可请求插件生成Agent开发候选包、可选调用汇总审阅Agent，但自动扩权限和公共互动不属默认能力
档案类型: 预审
复活状态: 已复活
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 人工智能
子领域: 跨平台角色化Agent与子代理编排
死法:
  - 类型: 条件已死
    证据: |
      DSH官方subagent包已支持通过命名provider委派工作、持续本地子代理、结果回收、深度与活跃数量限制、消息、取消和成员发现；
      NanmiCoder/dsh-agent-teams进一步把当前会话变成队长，提供角色成员、任务依赖、持久状态、直接消息、实时面板、人工批准运行和统一报告；
      dsh-bili-scroll已提供单平台内容发现、角色化私人日报与可选互动，TrendRadar则证明多平台信息入口和统一聚合报告可以运行
    推理: |
      一，若旧判断是“缺少让一个DSH角色接收任务、调度多个子代理并汇总结果的宿主与插件条件”，这一条件已经翻案。
          官方委派接口与真实团队插件已经覆盖队长、持续成员、任务状态、消息和结果整合，不要求重新发明多智能体运行时；
      二，复活的是“统一角色与会话入口＋平台能力注册表＋任务路由＋子代理或专用插件执行＋标准结果卡＋私人汇总”的有限编排链。
          宠物鲸是稳定的交互与人格层，平台专用插件仍处理各平台解析、账号和规则，通用层不内置所有网站实现；
      三，通用性首先来自协议而非无限代码：每个平台适配器声明支持的内容、访问方式、所需权限、预算、输出Schema和失败状态，
          总入口按用户指令选择已安装且获授权的能力，无法处理的平台明确返回未支持，而不是假装浏览成功；
      四，缺少适配器时可以调用插件生成Agent，也可以由人工或Agent另行开发；但生成、审核、安装、授权和启用仍是后续独立环节。
          现有证据不证明一个现成宠物鲸已经覆盖所有平台，更不证明它能安全地无限自我扩插件，因此只判统一编排核心有限复活。
    案例: DSH官方子代理、AgentTeams真实队长插件、B站专用宠物鲸与TrendRadar多平台入口共同支持统一编排链复活
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/subagent/subagent/README.md
      - https://github.com/NanmiCoder/dsh-agent-teams
      - https://github.com/c1overzz/dsh-bili-scroll
      - https://github.com/sansan0/TrendRadar
    置信度: 高

  - 类型: 伪需求
    证据: |
      TrendRadar已经提供多平台聚合和统一报告，说明部分跨平台信息需求可以不经过角色化多智能体团队解决；
      dsh-bili-scroll同时提供私人筛选日报与可选公共互动，而大肥鱼消除计划证明部分用户需要减少而非增加AI公共内容；
      DSH官方subagent只把子代理最终文本、可用结构化结果和安全诊断交付父代理，父代理不会自动获得其完整转录、工具输出或推理
    推理: |
      一，用户需要的是可靠内容结果，不一定是“很多子代理一起工作”的视觉效果。若RSS、聚合器或单个通用浏览器Agent已能完成任务，
          角色化队长和多个持续成员可能只是增加等待、状态页面和排障对象；
      二，统一角色有陪伴、记忆和降低指令切换成本的价值，但角色热度不能替代日报持续阅读。鲸鱼娘头像、团队DAG、子代理数量和消息数
          都衡量活动量，不衡量用户是否发现更有用内容；
      三，子代理只返回最终报告时，总入口可能失去关键过程证据。若用户不能从汇总回到平台、原始条目和失败任务，
          “一个入口”反而变成新的黑箱；因此必须保存任务清单、实际调用能力、来源、失败与未覆盖平台；
      四，公共互动不是统一入口的自然延伸。宠物主人希望它跨平台找内容，不代表各平台接收者希望看到同一只AI鲸到处评论；
          私人日报和角色养成都应先在关闭公共发言的情况下验证；
      五，可缩围为用户主动发起的一次跨平台任务，与分别打开专用插件及普通聚合器对照，测量总耗时、有效条目、误漏和持续使用；
          只有统一入口确实减少操作且不损害可追溯性时，通用宠物鲸才有独立增量。
    案例: 多平台聚合器已能满足部分统一阅读需求，角色化多代理与公共互动必须分别证明增量而非借用大肥鱼热度
    证据链接:
      - https://github.com/sansan0/TrendRadar
      - https://github.com/c1overzz/dsh-bili-scroll
      - https://github.com/liyupi/dafeiyu-cleaner
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/subagent/subagent/README.md
    置信度: 中

  - 类型: 钱算不平
    证据: |
      AgentTeams公开支持多角色成员、任务依赖、持续状态、实时面板、质量门禁和版本兼容矩阵，默认成员不能继续嵌套子代理；
      TrendRadar通过已分析新闻避免重复token、兴趣变化增量分类和每组显示数量限制控制AI成本；
      dsh-bili-scroll列出模型、可选本地Whisper、存储、定时运行和故障排查成本；DSH官方仍处于快速迭代的开发者预览阶段
    推理: |
      一，全成本是“总入口推理＋任务拆解＋各平台子代理调用＋重复上下文与角色记忆＋平台插件运行＋结果回收与二次汇总＋
          失败重试＋持久状态与界面＋权限审核＋兼容维护＋用户纠错”，不能用最后一次汇总回答的价格代替；
      二，多代理并行不必然节省时间或金钱。简单任务被拆成多个成员后会增加模型调用和协调消息；成员失败、状态未更新、
          重复浏览和队长等待都可能消耗预算而没有新内容，任务越复杂还需越多的结果核验；
      三，有效成本的分母应是“用户实际阅读并确认有用的跨平台独立事项数”，不是子代理数、扫描平台数、团队消息数或生成报告数。
          未支持平台、重复结果、无人阅读和需要人工重做的汇总都应计入无效成本；
      四，个人自用可限制平台与成员数、禁止嵌套、复用同一任务会话、缓存内容指纹、只在用户主动请求时运行并关闭公共互动来控制成本。
          但统一编排、适配器注册表、权限与版本矩阵和测试的工程投入高于单个平台插件，因此重启预算为“中”；
      五，公开资料没有统一跨平台任务价格、完整维护工时、毛利或续费数据。预算“中”不表示每次任务至少消费一万元，
          也不覆盖无限平台、全天多代理运行、多用户托管和长期账号运营。
    案例: 多代理协调、角色记忆、平台执行和二次汇总共同增加成本，缓存与成员上限只能控制其中一部分
    证据链接:
      - https://github.com/NanmiCoder/dsh-agent-teams
      - https://github.com/sansan0/TrendRadar
      - https://github.com/c1overzz/dsh-bili-scroll
      - https://github.com/deepseek-ai/deepseek-harness
    置信度: 中

  - 类型: 政策风险
    证据: |
      哔哩哔哩社区规范要求社区功能用于正常交流互动并禁止骚扰、批量灌水和扰乱秩序；
      《人工智能生成合成内容标识办法》将AI生成文本纳入生成合成内容，并要求发布用户按实际场景主动声明、使用平台标识功能；
      arXiv官方API条款对全局限速、凭证与全文再分发分别设限；
      DSH官方插件文档则明确构建授权会允许包代码在Agent沙箱外执行，并建议只信任源码和锁定commit
    推理: |
      一，统一入口不会统一各平台规则。每个适配器仍须声明官方API、RSS、公开页面、授权会话或其他合法来源的边界、
          请求频率、内容权利和账号条件；宠物鲸能调度某插件，不表示平台已经授权这种自动化方式；
      二，跨平台任务不得把绕过登录、验证码、付费墙、访问控制、反爬或风控当成通用能力。遇到限制时应返回未支持或降级路线，
          不能由总入口命令子代理寻找规避方式，也不能通过一个平台的登录状态推定另一个平台已获授权；
      三，生成新插件与启用新插件是不同合规事实。插件生成Agent给出的候选包可能含依赖、安装脚本、网络与文件访问，
          必须经过代码审核、隔离测试、人工批准和明确授权；通用宠物鲸不能因“任务需要”自行安装、构建、启用或提升权限；
      四，公共评论、私信、动态与跨平台转发应按平台、内容、接收者和AI标识要求分别审核。默认私人只读和本地日报，
          公共互动逐平台显式开启、发布前人工确认、明确AI身份并允许接收者拒绝；统一人格不能掩盖机器来源或规避平台规则；
      五，代码、角色美术、第三方内容与账号数据也需分别授权。高置信度指向“跨平台编排不消除访问、安装、内容和公共传播边界”，
          不认定本点子或某个现有插件当然违法，具体行为仍需逐平台与法域审查。
    案例: 平台社区规则、AI生成内容声明、API边界与插件构建执行警告共同说明总入口不能成为统一免责层
    证据链接:
      - https://member.bilibili.com/studio/convention/?lang=zh-Hans
      - https://www.gov.cn/zhengce/zhengceku/202503/content_7014286.htm
      - https://info.arxiv.org/help/api/tou.html
      - https://deepseek-harness.github.io/deepseek-harness/develop/basic/publish
    置信度: 高

  - 类型: 信任成本
    证据: |
      DSH官方安全说明明确其尚未接受安全审计，模型命令、第三方插件和开放的网络、进程、凭据与文件访问均可能造成非预期影响；
      官方subagent说明进程内子代理的权限范围在启动时固定，不能从会话内部扩大，需审批操作会被自动拒绝；
      AgentTeams允许为成员配置工具可见与调用策略，但明确这不是OS沙箱或授权边界，且模型可能未按预期更新任务状态；
      Playwright MCP说明持久profile保存登录信息，origin允许与阻止列表不是完整安全边界，重定向仍需另行处理
    推理: |
      一，通用宠物鲸集中了角色记忆、任务路由、多个平台工具和各插件产出，一旦权限过宽，单个网页中的恶意指令就可能通过总入口影响其他平台、
          本地文件或账号。子代理固定权限是重要边界，但不能替代宿主、操作系统、插件来源和网络安全；
      二，总入口必须让用户看到“谁将访问哪个平台、使用什么账号与工具、读哪些目录、产生什么外部请求、结果回到哪里”。
          队伍面板和可爱人格只展示活动，不证明活动安全；未实际执行的浏览不得写成已完成，子代理最终摘要也不能替代原始证据；
      三，平台能力注册表应把只读浏览、私人文件写入、外部投递、插件安装和公共发布分成不同权限。
          新插件候选默认未启用，公共互动默认关闭，持久浏览器会话与凭证不得进入角色记忆、任务日志、汇总报告或公开仓库；
      四，汇总结果要保留子代理、平台插件、原始条目、证据范围、失败任务、未支持平台和人工确认。
          可选调用汇总审阅Agent时，其优先级也只是建议，不能反向授予自己执行行动或过滤全部反证的权力；
      五，信任建立需要可停止、可撤销、可卸载、可回滚和可审计。高置信度指向集中权限与跨源提示词注入风险，
          不声称AgentTeams、官方subagent或Playwright已经发生特定安全事故。
    案例: 子代理固定权限与团队工具策略提供降险零件，但集中账号、网页不可信输入和总汇总仍要求显式边界与证据
    证据链接:
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/SAFETY.zh.md
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/subagent/subagent/README.md
      - https://github.com/NanmiCoder/dsh-agent-teams
      - https://github.com/microsoft/playwright-mcp
    置信度: 高

  - 类型: 执行人限制
    证据: |
      AgentTeams公开列出宿主与插件版本矩阵、文件持久状态、单DSH进程内串行化、跨进程不协调及模型可能未更新任务状态等边界；
      DSH官方subagent列出外部子代理只执行一次、消息限同一树、进程本地驻留、跨进程存储需要额外租约协议及崩溃时未落盘消息不重放等限制；
      DSH仍处于兼容性破坏变化频繁的预览阶段，Playwright浏览器并行客户端还需隔离profile或不同用户目录
    推理: |
      一，通用入口的难点从单个平台解析转为长期编排工程：能力注册、任务生命周期、成员命名、取消与恢复、超时、结果Schema、
          跨平台去重、凭证路由、状态迁移、界面和版本兼容任一环节异常，都可能造成重复任务、沉默漏报或错误完成状态；
      二，维护者需要同时理解DSH子代理和各平台插件。宿主升级可能改变委派与权限契约，平台升级可能改变页面或接口，
          模型更换可能改变任务拆解和汇总质量；固定提示词不能替代真实组合、故障注入与跨版本回归；
      三，可缩围为单用户、单进程、少量已安装只读插件、手动触发和统一Markdown结果卡，先不实现动态生成、定时常驻、公共互动或跨进程团队。
          每个新平台先由独立子代理跑通，再注册进总入口；每个新权限单独验收，避免一次承诺全部平台与全部动作；
      四，对普通用户，角色化界面可以隐藏部分复杂度，却不能消除账号授权、失败排查和安全决定。
          对个人或小团队，长期适配器维护、任务恢复、凭证撤销和结果抽查才是主要工作，外包或另一个AI代操作不能替代责任人；
      五，公开资料没有通用宠物鲸的系统性故障率、维护工时或长期留存，故本条保持中置信度。它说明具体执行约束，不把工程复杂写成无条件死局。
    案例: 真实团队插件与官方子代理已列出持久、跨进程、恢复和版本限制，统一角色入口不会自动消除这些运维工作
    证据链接:
      - https://github.com/NanmiCoder/dsh-agent-teams
      - https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/subagent/subagent/README.md
      - https://github.com/deepseek-ai/deepseek-harness
      - https://github.com/microsoft/playwright-mcp
    置信度: 中

需求证据:
  类型: DSH官方子代理、真实多智能体团队插件、单平台宠物鲸与多平台聚合产品
  说明: |
    DSH官方subagent与AgentTeams证明用户已经可以用自然语言让队长组织持续子代理、分配任务、查看状态并获得统一报告，
    这为“一个总入口调度多个专业Agent”提供了直接产品形态证据。
    dsh-bili-scroll及大肥鱼社区现象证明角色化个人信息筛选与私人日报存在实际使用，TrendRadar则证明多平台内容汇入统一报告的需求已有独立供给。
    主编进一步提出让通用宠物鲸调用平台子代理，并在缺少插件时请求生成或自行开发新适配器，本稿把前者纳入有限复活范围，
    把后者保留为带人工闸门的可选扩展流程。
    这些材料支持统一指令、角色陪伴、平台分工和集中结果是已出现多种实际供给的场景，但不等于独立审计后的需求强度。
    当前没有足以确认通用宠物鲸长期留存、比直接使用各插件或聚合器更节省时间、跨平台结果更可靠、付费或续费的公开数据；
    子代理数、团队消息数、角色热度、平台数和报告长度均不作为长期价值证据。
  附件: 无

商业及社会价值评估: |
  商业价值：直接受益者是同时使用多个内容平台与DSH插件的重度信息用户、研究人员、开发者、内容策划者、小型团队和Agent爱好者；
            统一角色、记忆和任务入口可能降低重复下达指令、切换插件和整理结果的劳动，平台适配器也为长尾需求保留扩展空间。
            潜在付费者首先是希望获得私有角色与平台编排、内部插件接入、部署托管、权限审计和持续维护的用户或组织，
            可测试私有适配器、角色与工作流定制、兼容维护和安全审查，而不是按子代理数量或公共评论量收费。
            DSH官方委派、开源团队插件、平台插件和聚合器会压低基础编排与汇总的收费空间；
            真正可能形成差异的是稳定的跨平台协议、最小权限、可追溯结果、角色记忆治理和持续适配，而这些均未证明能形成商业闭环。
            商业验证应按“每个经用户确认有用的跨平台独立事项全成本”与节省的操作和阅读时间、持续使用及支付意愿比较，
            把多代理调用、失败重试、状态存储、权限审核、平台维护、人工复核和公共互动处置计入成本。若只在个人低频自用成立，可以是有效工具，但不自动构成可扩张公司。
  社会价值：统一角色和可审计子代理协议可能降低普通用户使用多种专业Agent的门槛，让不同平台能力在明确授权下协作；
            公开任务、来源、权限与失败记录，也能帮助用户理解多智能体系统并非一个无所不知的单一实体。
            相反，集中账号与记忆会扩大隐私和提示词注入影响，角色化可能掩盖自动化来源，多平台公共发言还可能把成本转嫁给不同社区。
            自动扩插件若缺乏人工闸门，则会把内容工具变成不可控的软件供应链。较有社会价值的形态是统一入口但不统一扩权，
            默认私人只读、平台能力逐项注册、子代理最小权限、结果回链原文、未支持平台显式呈现、公共发布逐次确认、AI身份透明、
            新插件先隔离审核并由人决定安装启用，而不是以“一个插件解决所有”为理由无限自我扩张。

可拆零件:
  - 与任务和平台工具解耦的宠物鲸人格、原创角色包、AI身份说明及可关闭的角色记忆
  - 声明平台、内容类型、访问路线、所需账号、工具权限、预算、输出Schema和失败状态的能力注册表
  - 将用户自然语言拆成平台任务、公共约束、时间窗和结果目标并保留原始指令的任务路由器
  - 基于DSH官方subagent的持续子代理创建、命名、消息、取消、结果回收和深度／活跃数量限制层
  - 复用AgentTeams的队长、角色成员、任务依赖、人工批准运行、实时状态和统一报告工作流
  - 每个平台使用独立最小权限工具、浏览器profile和凭证路由且不共享登录状态的适配器运行舱
  - 保留实际调用插件、子代理、平台、原始条目、证据范围、失败和未支持状态的标准结果卡
  - 平台专用插件优先、通用浏览器仅作受控补充且无法访问时明确降级的执行选择器
  - 缺少适配器时调用插件生成Agent并只接收未启用候选包的开发请求队列
  - 代码生成、静态检查、隔离测试、人工审核、正式安装、权限启用和公共互动分离的扩展状态机
  - 可选调用汇总审阅Agent进行跨源去重、分维审核与私人优先级排序的下游接口
  - 默认私人Markdown日报、固定路径只读、公共发布逐平台显式开启并逐次人工确认的投递路由器
  - 对网页不可信输入、跨插件依赖、凭证、角色记忆和外部请求分别记录的权限与数据流向面板
  - 支持暂停、恢复、超时、重试上限、取消整棵子代理树、卸载和版本回滚的任务生命周期管理器
  - 以有效独立事项、总耗时、误漏、人工纠错、持续阅读和每有效事项全成本为指标的对照评估包
  - 宿主—编排插件—平台插件—模型—浏览器版本矩阵及故障注入、权限和恢复回归测试包

