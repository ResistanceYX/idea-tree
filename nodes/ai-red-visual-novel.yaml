id: ai-red-visual-novel
标题: AI生成红色题材中小体量视觉小说
一句话: 由创作者与AI持续对话迭代剧本、立绘、配音和分支，制作中小体量红色历史题材视觉小说，并由人类审核史实、价值导向与成品后发布
复活状态: 复活候选
重启预算: 中
创新类型: [渐进式, 技术应用]
领域: 游戏
子领域: 互动叙事与红色文化
死法:
  - 类型: 条件已死
    证据: 《潜伏之赤途》《隐形守护者》所证明的革命历史互动叙事场景；海南日报记录的AI修复、红色课堂、动画微短剧与红色微电影等公开实践
    推理: |
      一，革命历史题材与互动叙事并非不能结合。《隐形守护者》及其原作以选择和分支让玩家参与地下工作者的处境，公开报道还记录了玩家游玩后主动查找历史原型的行为，因此不能把本点子的题材直接判为伪需求；
      二，过去同类高品质互动影像依赖长期剧本打磨、影视拍摄和大量资产投入。生成式AI现在能够辅助文本、图像与音频生产，公开实践也已覆盖红色经典修复、沉浸式课堂、动画微短剧和微电影，说明部分表达与资产生产条件已经变化；
      三，但“条件已死”只指技术和大规模资产投入不再构成原来的绝对门槛，不等于已经证明AI视觉小说能够稳定量产或盈利。现有正面案例多数不是中小体量视觉小说，不能直接外推其销量与成本；
      四，本点子的成立方式应是创作者与AI多轮互动，由人类持续纠正设定、史实、价值表达和分支逻辑，再把审核后的固定内容做成作品，而不是一键生成后直接使用。
    案例: 革命历史互动叙事作品与多种AI红色文化创作实践，共同支持有限翻案而非商业成功结论
    证据链接:
      - https://m.bjnews.com.cn/detail/155186892714653.html
      - http://news.hndaily.cn/html/2026-11/04/content_58469_19994729.htm
    置信度: 中

  - 类型: 钱算不平
    证据: 触乐对《隐形守护者》两年制作周期、千万级真人影视投入、剧本改编和历史研究参与的采访；36氪对互动影像剧本、分支、制作成本与回收难度的分析
    推理: |
      一，AI能够压低剧本初稿、立绘草案和配音样稿的成本，却不会自动消除史料查找、剧本重构、分支验收、素材一致性、版权核对、测试、发行与售后劳动；红色题材还需要更严格的史实和价值审核，省下的生成费用可能转成人工校订费用；
      二，分支不是免费的内容数量。每增加一条有实质差异的路线，都可能增加文本、场景、立绘、配音、状态衔接与测试组合；若只用伪分支和换皮结局压低成本，又会损害互动叙事最核心的选择价值；
      三，中小体量可以限制总成本，却也限制内容时长、定价和可覆盖的受众。买断制之外若依赖学校、场馆或机构定制，又需另行验证采购周期、交付要求与回款，不能把公共价值直接当成可持续收入；
      四，《隐形守护者》的千万级成本属于真人影视大制作，只能用来观察剧本、历史核对和分支制作的劳动结构，不能作为本点子的预算数字。尚无同类AI视觉小说的完整成本、销量与复购数据，因此保持中置信度。
    案例: 真人互动影像的制作与回收记录，仅作成本结构和质量门槛的对照
    证据链接:
      - https://www.chuapp.com/mobile/286069.html
      - https://m.36kr.com/p/664595509047171
    置信度: 中

  - 类型: 政策风险
    证据: 《网络出版服务管理规定》《人工智能生成合成内容标识办法》《生成式人工智能服务管理暂行办法》、广电总局“AI魔改”视频治理通报及《中华人民共和国英雄烈士保护法》
    推理: |
      一，红色题材本身不是禁止对象。网络出版规定明确支持、鼓励具有爱国主义等教育意义的优秀网络出版物；真正的风险来自未经许可或未经审批的上网出版、内容失真失当、未履行相应标识义务，以及涉及真实英烈时的歪曲、丑化、亵渎或否定；
      二，网络游戏上网出版前有审批要求，网络出版服务还涉及许可、编辑责任、内容审核与重大选题备案等制度。团队完成一个本地可运行成品，不等于已经取得公开发售和传播所需的全部条件，发行路径与合作方必须在制作前确认；
      三，生成内容标识规则覆盖文本、图片、音频、视频和虚拟场景，并区分生成服务提供者、传播平台与发布用户等角色。仅内部使用第三方AI工具制作固定成品的团队，不应被无条件套用全部服务提供者义务；但其发布、传播或提供服务时，仍需按实际角色核对声明、标识和平台要求；
      四，广电总局治理对象是违规“AI魔改”视频，通报不能直接推导出原创视觉小说被禁止；它只能说明革命历史与英模人物的违规改编已有现实治理背景。若作品涉及真实英烈，还须单独遵守英雄烈士保护法的边界；
      五，因此本条否定的是“生成后即可绕开出版、标识和内容责任直接商业发行”的路径，不否定与合规出版发行方合作、完成审核后推出的作品。
    案例: 网络出版审批与编辑责任、生成内容标识和违规“AI魔改”治理构成的组合合规约束
    证据链接:
      - https://www.ahwx.gov.cn/zcfg/bmgz/201912/t20191216_2515694.html ##自动访问可通过，使用VPN后可能无法正常打开
      - https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm
      - https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm
      - https://www.nrta.gov.cn/art/2026/4/8/art_114_73035.html
      - https://www.gov.cn/xinwen/2018-04/28/content_5286529.htm
    置信度: 高

  - 类型: 信任成本
    证据: 海南日报对红色题材AI创作中军装、地名、时间线失真及专家前置审核的讨论；中国青年报对“AI魔改”造成认知混淆及重大历史、英烈内容保留人工审核的报道
    推理: |
      一，普通虚构作品中的细节错误可能只是体验问题，红色历史作品中的错误还可能被理解为篡改历史、消费英烈或借技术猎奇，单次失误就可能损害作者、发行方与合作机构的信誉；
      二，AI能够生成看似完整而权威的画面和叙述，反而使错误更难被非专业用户识别。创作者不能只检查主线，还须覆盖失败结局、隐藏文本、角色语音和所有可达分支，否则未充分审核的边角内容仍可能破坏整部作品的信任；
      三，人类审核在这里不是免责口号，而是需要留下证据的生产机制：权威史料来源、史实与虚构边界、AI使用记录、版本变更、专业复核和成品验收都应可追溯；这些工作增加成本，却也是取得用户和机构信任的必要投入；
      四，现有证据能直接支持史实失真、认知混淆与人工审核必要性，但尚不能量化玩家是否会因“AI参与”而拒绝购买，因此不对市场信任损失作高置信度判断。
    案例: 红色题材AI创作的史实把关要求与“AI魔改”认知混淆风险
    证据链接:
      - http://news.hndaily.cn/html/2026-11/04/content_58469_19994729.htm
      - https://zqb.cyol.com/pc/content/202602/25/content_422618.html
    置信度: 中

需求证据:
  类型: 公开作品与AI红色文化创作案例
  说明: |
    《潜伏之赤途》《隐形守护者》说明革命历史与互动叙事可以形成有吸引力的作品，公开报道亦记录了玩家由游戏进一步查找历史原型的行为；海南日报列举的AI修复、红色课堂、动画微短剧和红色微电影，则支持AI能够参与红色文化表达。尚未观察到“AI辅助生成红色题材中小体量视觉小说”的直接销量、完成率或持续付费数据，因此需求存活不等于商业模式已经验证。本点子的核心机制是创作者与AI持续对话迭代，由人类审核史实、价值导向、分支逻辑与成品，不是一键生成后直接使用，也不是全自动批量生成平台。
  附件: 无

可拆零件:
  - 红色历史事实卡与权威史料索引（人物、时间、地点、事件、服饰、来源）
  - 创作者与AI多轮迭代的剧本工作流（大纲、场景、对白、分支、审校、定稿）
  - 史实与虚构边界标注、AI使用记录及素材来源回溯表
  - 分支图一致性检查、全路线测试清单与人工验收记录
  - 角色立绘、配音和时代道具的一致性约束及授权核对表
  - 面向党史、军史或地方史研究者的前置复核与分歧处理流程
  - 单章、少角色、有限结局的最小可行作品与试玩反馈模板
  - 面向纪念馆、学校或红色文化活动的定制互动叙事模块

死因保质期: 2028-11-05
