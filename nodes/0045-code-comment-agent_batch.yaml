备注: |
  本节点为AI起草、人类审核的预审档案，不声称某个现有批量注释产品已经失败。
  本批五个明确层级依次使用0044—0048候选编号；0049由主编补充指定为0047固定策略版本的类比修改与合并节点；正式上传前须由主编按当时云端和本批顺序复核。
  “不可选块”操作化为单次运行不能在文件内部挑选代码块，最小处理单位为完整文件；目录、文件类型和生成代码排除规则仍然必要，
  否则会把不可选块误解为不得做任何范围限制。“通用”仍指明确支持清单中的多种语言，不是任意语言无条件可用。
  中档预算只对应两种语言、小型仓库、只读补丁、人工接受和增量同步的缩围原型，不承诺全语言或无人值守全量改写。
  AIDocStringGenerator的`wipe_docstrings: true`是该工具自身默认配置，仅用于证明批量保护既有文本的风险，不能推广成所有工具行为；
  RepoAgent、Aspose、Copilot和Swimm材料分别限于其公开功能，不证明本产品效果或商业结果。
  处理私有仓库须明确模型与平台的数据去向，默认最小文件范围、只读输出和访问权限，不保存凭据，不绕过私有仓库授权。
  死因保质期设为九个月：批量注释与代码—文档漂移问题较稳定，但多语言解析、仓库索引和通用IDE批处理能力仍可能快速改变竞争与可行性判断；
  复核时应检查第二次运行冲突、人工注释保护、真实全仓库审查成本、双产出同步和修改任务对照，而不是仅重新确认工具能生成文本。
